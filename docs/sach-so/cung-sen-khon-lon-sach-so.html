ết cửa sổ",1,"Máy dùng chung thì người sau có thể vào tài khoản của mình. Đăng xuất giống như khóa cửa khi rời đi."],["Bấm “nhớ mật khẩu” cho lần sau nhanh hơn",0,"Tiện cho mình nhưng cũng tiện cho người lạ. Chỉ lưu mật khẩu trên máy của gia đình."]]}],"qq":"Mật khẩu có thể chia sẻ với…","qo":["Ba mẹ hoặc người giám hộ","Bạn thân nhất","Ai hứa giữ bí mật"],"qa":0,"mi":{"t":"Kiểm tra độ an toàn mật khẩu cùng ba mẹ","s":"Con cùng ba mẹ xem lại mật khẩu các tài khoản học tập: có đủ mạnh không, có ai khác biết không; nếu cần thì đổi ngay, và tập một câu từ chối khi bạn xin mật khẩu.","lv":["Ba mẹ cùng con kiểm tra và đổi mật khẩu, ba mẹ nói mẫu câu từ chối.","Ba mẹ nhắc một lần, con tự kiểm tra và nói câu từ chối bằng lời của mình.","Con tự kiểm tra, giải thích cho ba mẹ một mật khẩu mạnh cần có gì, và kể con sẽ giúp bạn xem bài mà không đưa mật khẩu ra sao."],"rw":"Con được chọn món tráng miệng trái cây cho cả nhà"}},{"t":"Làm chủ giờ dùng điện thoại","sk":7,"m":"11 phút","cx":[{"k":0,"s":"Khoa định xem điện thoại 15 phút sau bữa tối rồi học bài. Ngẩng lên đã gần 21h, bài Hóa vẫn chưa động tới.","q":"Từ mai Khoa nên làm gì?","o":[["Tự nhủ sẽ cố gắng tự giác hơn",0,"Quyết tâm suông thường thua những đoạn phim nối nhau. Cần một cách làm cụ thể hơn."],["Xóa hết ứng dụng giải trí",0,"Cắt sạch thường khó giữ lâu. Giới hạn hợp lý bền hơn cấm hẳn."],["Học xong mới dùng điện thoại, hẹn giờ 20 phút, và để máy ngoài phòng khi học",1,"Đổi thứ tự và đặt giới hạn rõ ràng giúp mình làm chủ thời gian. Máy để xa thì bớt bị kéo đi."]]},{"k":1,"s":"Giờ ra chơi nào Khoa cũng cúi vào điện thoại. Hôm nay Nam rủ đá cầu, Khoa bảo “chờ tí” rồi hết giờ luôn.","q":"Khoa nên làm gì?","o":[["Đặt quy tắc riêng: giờ ra chơi để điện thoại trong cặp, và chủ động rủ lại Nam",1,"Quy tắc đơn giản giúp mình không phải giằng co mỗi lần. Thời gian với bạn bè là thời gian đáng giá."],["Rủ Nam xem điện thoại cùng",0,"Hai người cùng nhìn màn hình vẫn là bỏ lỡ giờ chơi thật. Thử để máy trong cặp một hôm."],["Mai nói với Nam là hôm qua bận",0,"Lý do này không thật và Nam có thể buồn. Thử đặt một quy tắc cho giờ ra chơi."]]},{"k":2,"s":"Cả nhà đi dã ngoại ở công viên cuối tuần. Khoa mải lướt điện thoại, em Bảo rủ ba lần đi thả diều mà Khoa không để ý.","q":"Khoa nên làm gì?","o":[["Cho em mượn điện thoại chơi",0,"Như vậy cả hai cùng bỏ lỡ buổi dã ngoại. Chiếc diều đang chờ cả hai đó."],["Cất điện thoại, chỉ mở khi cần chụp ảnh hoặc liên lạc, và đi thả diều với em",1,"Dùng điện thoại có mục đích giúp mình có mặt trọn vẹn với gia đình."],["Hứa với em “lát nữa” rồi lướt tiếp",0,"“Lát nữa” không có giờ hẹn dễ thành không bao giờ. Em sẽ thấy mình không quan trọng."]]}],"qq":"Cách giữ giới hạn giờ màn hình hiệu quả nhất?","qo":["Tự nhắc trong đầu","Hẹn giờ và để máy xa khi làm việc","Chỉ dùng khi buồn chán"],"qa":1,"mi":{"t":"Một buổi tối học bài, điện thoại ở phòng khác","s":"Tối nay con hẹn giờ xem điện thoại đúng 15 phút, hết giờ thì để máy ở phòng khác đến khi học xong; ba mẹ xác nhận con đã giữ đúng.","lv":["Ba mẹ cùng con đặt hẹn giờ và giữ điện thoại giúp con.","Ba mẹ nhắc một lần, con tự đặt hẹn giờ và tự cất máy.","Con tự làm ba tối trong tuần và kể ba mẹ nghe con học xong sớm hơn bao nhiêu."],"rw":"Cả nhà chơi một trò chơi bàn cờ tối cuối tuần"}},{"t":"Ghi chép chi tiêu một tuần","sk":8,"m":"12 phút","cx":[{"k":0,"s":"Cuối tuần, Khoa cộng sổ chi tiêu và thấy riêng trà sữa đã hết 120.000đ, gần một nửa tiền tiêu vặt.","q":"Khoa nên làm gì với thông tin này?","o":[["Thấy buồn rồi bỏ sổ",0,"Con số không để trách mình, mà để chọn lại. Tiếp tục ghi sẽ thấy mình tiến bộ."],["Đặt mức mới: mỗi tuần một cốc, phần còn lại bỏ ống tiết kiệm, và ghi tiếp để kiểm tra",1,"Ghi chép chỉ có ích khi mình đổi một việc cụ thể. Đặt mức rõ ràng và theo dõi tiếp."],["Không sao, tiền của mình mà",0,"Đúng là tiền của mình, nên mình được chọn. Thử nhìn lại xem có điều gì mình muốn hơn không."]]},{"k":1,"s":"Khoa được ba mẹ cho tiền tiêu vặt mỗi tuần. Hôm nay mới thứ Năm mà ví đã gần hết, Khoa không nhớ tiền đã đi đâu: vài cây bút, nước uống ở căng tin, một quyển truyện…","q":"Khoa nên làm gì để biết tiền đi đâu?","o":[["Ghi mọi khoản chi vào sổ nhỏ hoặc điện thoại trong một tuần, cuối tuần cộng theo từng nhóm",1,"Nhìn con số theo nhóm, mình sẽ thấy khoản nhỏ cộng lại lớn thế nào. Hiểu rồi mới điều chỉnh được."],["Tuần sau xin thêm tiền",0,"Thêm tiền mà không biết tiền đi đâu thì cũng sẽ hết như cũ. Ghi lại trước đã."],["Tuần sau không tiêu gì cả",0,"Nhịn hết khó giữ và không giúp mình hiểu thói quen. Ghi chép mới chỉ ra chỗ cần đổi."]]},{"k":2,"s":"Đi chợ cùng bà, Khoa được bà nhờ cầm tiền và ghi lại các món đã mua. Về nhà bà hỏi: “Hôm nay hết bao nhiêu cháu?”","q":"Ở chợ, Khoa nên làm gì?","o":[["Nhớ trong đầu là được",0,"Nhiều món nhỏ thì rất dễ quên. Ghi ra giấy luôn chính xác hơn."],["Chỉ ghi các món đắt",0,"Món nhỏ cộng lại có khi bằng món lớn. Ghi đủ mới biết tổng thật."],["Ghi ngay từng món và giá sau khi trả tiền, về nhà cộng lại và đối chiếu với tiền còn lại",1,"Ghi ngay và đối chiếu giúp số liệu khớp. Lần sau bà sẽ yên tâm giao việc cho mình."]]}],"qq":"Ghi chép chi tiêu giúp mình…","qo":["Được cho thêm tiền","Không bao giờ phải tiêu","Thấy khoản nhỏ cộng lại thành bao nhiêu"],"qa":2,"mi":{"t":"Ghi chép chi tiêu trong một tuần","s":"Trong bảy ngày, con ghi mọi khoản con tiêu (dù nhỏ) vào sổ; cuối tuần cùng ba mẹ cộng lại và chỉ ra khoản nhỏ nào cộng lên nhiều nhất.","lv":["Mỗi tối ba mẹ hỏi và cùng con ghi lại.","Ba mẹ nhắc một lần đầu tuần, con tự ghi mỗi ngày.","Con tự ghi đủ bảy ngày, tự tổng kết và đề ra một thay đổi cho tuần sau."],"rw":"Ba mẹ đưa con đi thư viện chọn sách"}},{"t":"Dừng lại trước khi trả lời lúc đang giận","sk":1,"m":"13 phút","cx":[{"k":0,"s":"Em Bảo làm đổ nước lên mô hình Khoa làm cả tuần cho môn Công nghệ. Khoa thấy cơn giận dâng lên.","q":"Khoa nên làm gì?","o":[["Quát em thật to",0,"Quát làm em sợ mà mô hình vẫn ướt. Dừng lại vài giây giúp mình chọn việc có ích hơn."],["Mặc kệ và không nói chuyện với em cả tối",0,"Giận lặng lẽ cũng làm em buồn mà mình vẫn bực. Bình tĩnh rồi nói ra sẽ nhẹ cho cả hai."],["Ra chỗ khác vài phút cho dịu, rồi quay lại cùng em lau khô và xem có sửa được không",1,"Rời đi một chút là cách hạ cơn giận an toàn. Quay lại cùng em khắc phục giúp em học được trách nhiệm."]]},{"k":1,"s":"Trong nhóm chat lớp, Tí đăng ảnh bài vẽ của Khoa kèm câu đùa “tranh của bé mẫu giáo”. Vài bạn thả biểu tượng cười. Khoa nóng mặt, đang gõ một câu thật gay gắt.","q":"Khoa nên làm gì?","o":[["Gửi luôn câu gay gắt để Tí biết mình không dễ bị trêu",0,"Lời viết lúc giận khó rút lại và có thể làm chuyện căng hơn. Hãy cho mình vài phút."],["Đặt điện thoại xuống, thở chậm vài lần, bình tĩnh rồi nhắn riêng: “Tớ thấy không vui với câu đó, cậu gỡ giúp tớ nhé.”",1,"Dừng lại giúp cơn giận hạ xuống để mình nói rõ điều mình cần. Nếu bạn vẫn tiếp tục, hãy báo thầy cô."],["Rời nhóm chat và không nói với ai",0,"Im lặng giữ hết nỗi buồn trong lòng. Nói với bạn hoặc người lớn tin cậy sẽ nhẹ hơn."]]},{"k":2,"s":"Trên xe buýt, một người chen lấn làm Khoa rơi hộp cơm. Người đó đi thẳng, không xin lỗi.","q":"Khoa nên làm gì?","o":[["Thở sâu, nhặt hộp cơm, tự nhủ “bực thật, nhưng không đáng để mình mất cả buổi”",1,"Gọi tên cảm xúc và tự nói lời bình tĩnh giúp cơn giận qua nhanh. Không cần tranh cãi với người lạ."],["Đuổi theo đòi người đó xin lỗi",0,"Tranh cãi với người lạ trên xe có thể không an toàn. Nếu cần, hãy nhờ bác tài hoặc người lớn giúp."],["Bực bội cả ngày và kể cho mọi người",0,"Ôm cơn giận cả ngày làm mình mệt hơn người kia. Kể một lần với người thân cho nhẹ lòng là đủ."]]}],"qq":"Khi đang rất giận, việc nên làm đầu tiên là…","qo":["Trả lời ngay cho hả","Dừng lại và để cơn giận hạ xuống","Giả vờ không sao"],"qa":1,"mi":{"t":"Tập “dừng 10 giây” trước khi trả lời","s":"Con và ba mẹ đóng vai một tin nhắn trêu chọc khiến con bực; con dừng lại, thở chậm 10 giây, rồi viết ra hai câu trả lời và chọn câu bình tĩnh hơn.","lv":["Ba mẹ cùng con đếm và thở, rồi gợi ý một câu trả lời bình tĩnh.","Ba mẹ nhắc một lần, con tự dừng và tự viết câu trả lời.","Con tự áp dụng khi có chuyện bực thật trong tuần và kể lại con đã dừng thế nào."],"rw":"Một cái ôm thật chặt và lời khen trước cả nhà"}},{"t":"Khi thấy ghen tị với bạn","sk":1,"m":"12 phút","cx":[{"k":0,"s":"Họ hàng đến chơi, ai cũng khen chị họ Linh vừa đỗ vào trường chuyên. Khoa ngồi một góc, thấy mình như bị quên.","q":"Khoa nên làm gì?","o":[["Bỏ vào phòng đóng cửa",0,"Rút đi một mình làm cảm giác bị quên to hơn. Ở lại và tham gia theo cách của mình sẽ dễ chịu hơn."],["Kể ngay thành tích của mình cho mọi người nghe",0,"Tranh phần khen làm không khí kém vui. Thành tích của mình vẫn ở đó, không cần chen vào lúc này."],["Chúc mừng chị, hỏi chị đã ôn thế nào, và tối đó kể với mẹ cảm giác của mình",1,"Học hỏi từ người khác và chia sẻ cảm xúc với ba mẹ giúp mình nhẹ lòng. Mỗi người có con đường riêng."]]},{"k":1,"s":"Bài thuyết trình của Vy được cô khen trước lớp và được chọn đi thi cấp trường. Khoa cũng chuẩn bị rất kỹ nhưng không được chọn, trong lòng thấy khó chịu và hơi ghen tị.","q":"Khoa nên làm gì với cảm giác này?","o":[["Thừa nhận với mình “mình đang ghen tị”, chúc mừng Vy, rồi hỏi cô mình cần cải thiện điều gì",1,"Gọi tên cảm xúc giúp nó nhỏ lại. Biến ghen tị thành câu hỏi “mình học được gì” là cách trưởng thành."],["Nói với bạn khác là Vy được chọn chỉ vì may",0,"Hạ bạn xuống không làm mình nhẹ lòng hơn. Ghen tị là cảm xúc bình thường, quan trọng là mình làm gì với nó."],["Giả vờ không quan tâm",0,"Giấu cảm xúc không làm nó biến mất. Nhẹ nhàng thừa nhận với chính mình sẽ dễ chịu hơn."]]},{"k":2,"s":"Ở câu lạc bộ bơi của phường, Nam đã bơi được 400 mét, còn Khoa mới bơi được 200 mét dù hai bạn tập cùng lúc.","q":"Khoa nên nghĩ thế nào?","o":[["“Mình không có năng khiếu, bỏ thôi.”",0,"So với người khác dễ làm mình nản. So với chính mình tuần trước mới thấy mình đã tiến bộ."],["Ghi lại thành tích của mình mỗi tuần, hỏi Nam một mẹo, và đặt mục tiêu 250 mét",1,"Mục tiêu nhỏ, đo được giúp mình tập trung vào bản thân. Bạn giỏi là người để học hỏi, không phải để ghét."],["“Chắc Nam tập lén thêm.”",0,"Đoán ý xấu làm mình khó chịu thêm. Hỏi Nam bí quyết có khi lại học được điều hay."]]}],"qq":"Khi thấy ghen tị, cách tốt nhất là…","qo":["Giấu đi","Tìm lỗi của người kia","Thừa nhận và biến nó thành mục tiêu cho mình"],"qa":2,"mi":{"t":"Biến ghen tị thành một mục tiêu nhỏ","s":"Con kể ba mẹ nghe một lần con thấy ghen tị với ai đó, gọi tên cảm xúc, nói điều con ngưỡng mộ ở bạn ấy và viết ra một mục tiêu nhỏ cho mình trong tuần này.","lv":["Ba mẹ kể trước một lần ba mẹ ghen tị, rồi cùng con viết mục tiêu.","Ba mẹ nhắc một lần, con tự nói “Con thấy ghen tị vì…” và tự viết mục tiêu.","Con tự làm, thực hiện bước đầu của mục tiêu và kể lại kết quả cuối tuần."],"rw":"Ba mẹ kể một ước mơ hồi nhỏ của ba mẹ"}},{"t":"Khi có bạn không làm phần việc","sk":2,"m":"13 phút","cx":[{"k":0,"s":"Cả nhà làm album ảnh kỷ niệm tặng ông bà. Ba giao em Vy dán ảnh, nhưng đã ba ngày Vy vẫn chưa bắt đầu vì mải chơi.","q":"Khoa nên làm gì?","o":[["Hỏi em vướng ở đâu, gợi ý làm cùng 15 phút đầu rồi để em làm tiếp",1,"Đôi khi người ta chậm vì chưa biết bắt đầu từ đâu. Giúp một bước đầu, rồi trao lại việc cho em."],["Mắng em lười",0,"Gắn nhãn “lười” làm em tự ái. Giúp em bắt đầu sẽ có ích hơn."],["Mách ba để ba nhắc",0,"Ba có thể nhắc, nhưng em sẽ thấy bị mách. Thử nói với em trước."]]},{"k":1,"s":"Còn ba ngày nữa nộp dự án Địa lý, Huy vẫn chưa gửi phần của mình và không trả lời tin nhắn nhóm. Cả nhóm bắt đầu bực, có bạn muốn báo cô gạch tên Huy.","q":"Khoa nên làm gì trước?","o":[["Cả nhóm chê Huy trong nhóm chat",0,"Bị chê trước đông người, bạn sẽ xấu hổ và càng né tránh. Nói riêng hiệu quả hơn."],["Làm luôn phần của Huy và không nói gì",0,"Cứu được nhóm lần này nhưng vấn đề vẫn còn. Huy cần biết phần của mình quan trọng."],["Nói chuyện riêng với Huy: hỏi có chuyện gì, nhắc hạn và cùng tìm phần Huy làm kịp",1,"Có thể bạn đang gặp khó khăn mà mình chưa biết. Hỏi trước, nhắc rõ, rồi mới tính bước tiếp theo."]]},{"k":2,"s":"Nhóm Khoa tham gia buổi dọn vệ sinh công viên do phường tổ chức, có cô tổ trưởng dân phố hướng dẫn. Bảo cứ đứng nghịch điện thoại, các bạn khác phải nhặt rác thay.","q":"Khoa nên làm gì?","o":[["Nói to để mọi người cùng nhìn Bảo",0,"Bị chỉ trích trước đông người làm bạn ngượng và khó hợp tác. Nói riêng nhẹ nhàng hơn."],["Nói nhỏ với Bảo: “Cậu cầm túi giúp tớ đoạn này nhé, mình làm nhanh rồi cùng nghỉ.”",1,"Lời mời cụ thể và thân thiện thường hiệu quả hơn trách móc. Ai cũng dễ tham gia khi có một việc rõ ràng."],["Kệ, mình làm phần mình là được",0,"Cả nhóm sẽ mệt và bực dần. Một lời mời đúng lúc có thể đổi được không khí."]]}],"qq":"Khi một thành viên chậm việc, bước đầu nên là…","qo":["Báo thầy cô ngay","Hỏi riêng và nhắc rõ hạn","Làm thay"],"qa":1,"mi":{"t":"Tập nhắc việc riêng tư, rõ hạn","s":"Con cùng ba mẹ đóng vai: một bạn trong nhóm chưa làm phần việc. Con nhắn hoặc nói riêng, hỏi thăm trước, rồi nhắc rõ việc và hạn chót.","lv":["Ba mẹ nói mẫu một tin nhắn nhắc việc, con viết lại theo cách của mình.","Ba mẹ nhắc một lần, con tự soạn tin nhắn đủ: hỏi thăm, việc, hạn, đề nghị giúp.","Con tự soạn, đọc cho ba mẹ nghe và kể nếu đã dùng cách này với nhóm thật thì bạn phản hồi ra sao."],"rw":"Con được chọn phim cả nhà xem tối cuối tuần"}},{"t":"Tự làm bữa sáng đơn giản","sk":3,"m":"12 phút","cx":[{"k":0,"s":"Cuối tuần này Khoa muốn tự làm bữa sáng cho cả nhà: trứng ốp, bánh mì và sữa. Khoa chưa từng tự dùng bếp lần nào.","q":"Khoa nên bắt đầu thế nào?","o":[["Nhờ ba đứng cạnh hướng dẫn lần đầu: để lửa nhỏ, quay cán chảo vào trong, xong việc tắt bếp và kiểm tra lại",1,"Học từ người lớn và giữ các quy tắc an toàn là tự lập đúng cách. Lần sau mình sẽ tự tin hơn."],["Tự làm luôn, xem video là đủ",0,"Video giúp hiểu cách làm, nhưng lần đầu dùng bếp nên có người lớn bên cạnh."],["Thôi để ba mẹ làm như mọi khi",0,"Ai cũng phải có lần đầu tiên. Một món đơn giản là bước tự lập rất tốt."]]},{"k":1,"s":"Lớp Khoa đi trải nghiệm ở một nông trại giáo dục. Mỗi tổ tự chuẩn bị bữa trưa nguội từ nguyên liệu được phát, có cô giáo trông.","q":"Khoa nên làm gì?","o":[["Chờ bạn khéo tay làm hết",0,"Đây là dịp để mình tập. Nhận một việc nhỏ mình làm được."],["Rửa tay, chia việc: rửa rau, cắt bánh, xếp hộp, và hỏi cô trước khi dùng dao",1,"Giữ vệ sinh, chia việc và hỏi người lớn khi dùng dụng cụ sắc giúp cả tổ an toàn."],["Bỏ qua bước rửa tay cho nhanh",0,"Rửa tay là bước đầu tiên của nấu ăn sạch. Chỉ mất một phút thôi."]]},{"k":2,"s":"Khoa theo mẹ đi chợ mua đồ cho bữa tối Chủ nhật do Khoa tự nấu: canh rau và trứng chiên.","q":"Ở chợ, Khoa nên làm gì?","o":[["Mẹ chọn hết, mình chỉ xách đồ",0,"Tự chọn đồ cũng là một phần của nấu ăn. Hỏi mẹ cách chọn để lần sau tự làm."],["Mua thật nhiều cho chắc",0,"Mua thừa dễ bỏ phí. Tính theo số người ăn là vừa."],["Mang danh sách món, nhờ mẹ chỉ cách chọn rau tươi, tự hỏi giá và trả tiền",1,"Có danh sách và học từ mẹ giúp mình tự tin hơn. Mỗi lần tự làm một bước là lớn thêm một chút."]]}],"qq":"Lần đầu tự nấu ăn, điều quan trọng nhất là…","qo":["Có người lớn hướng dẫn và giữ an toàn","Làm thật nhanh","Nấu món thật cầu kỳ"],"qa":0,"mi":{"t":"Làm bữa sáng đơn giản cùng ba mẹ đứng bếp","s":"Cuối tuần, con làm bữa sáng cho cả nhà (bánh mì, trứng, sữa) với ba hoặc mẹ đứng cạnh suốt lúc dùng bếp; con tự chuẩn bị, bày bàn và dọn dẹp sau đó.","lv":["Ba mẹ làm mẫu từng bước, con làm theo; ba mẹ trực tiếp bật và tắt bếp.","Ba mẹ đứng cạnh, nhắc một lần các bước an toàn, con tự làm.","Con tự lên thực đơn, nói lại các quy tắc an toàn trước khi làm và nấu dưới sự giám sát của ba mẹ."],"rw":"Cả nhà khen món ăn và con được nghỉ rửa bát một tối"}},{"t":"Máy tính hỏng sát hạn nộp bài","sk":4,"m":"13 phút","cx":[{"k":0,"s":"Tối thứ Tư, máy tính ở nhà bỗng không bật được. Bài trình chiếu Tiếng Anh nộp sáng mai vẫn đang nằm trong máy.","q":"Khoa nên làm gì?","o":[["Khóc rồi đi ngủ",0,"Buồn là bình thường, nhưng tối nay vẫn còn việc làm được. Thử liệt kê các phương án."],["Bình tĩnh liệt kê phương án: nhờ ba mẹ kiểm tra máy, tìm bản lưu trên mạng hoặc trong thư; nếu không được thì soạn bản ngắn và báo cô ngay sáng mai",1,"Có phương án dự phòng và báo sớm cho thầy cô là cách giải quyết có trách nhiệm."],["Mai nói dối cô là quên ở nhà",0,"Nói dối làm mất lòng tin, trong khi sự cố thật thì thầy cô thường thông cảm. Hãy nói thật và đưa phương án."]]},{"k":1,"s":"Đến giờ thuyết trình thì máy chiếu của lớp bị hỏng. Nhóm Khoa là nhóm đầu tiên lên trình bày.","q":"Nhóm nên làm gì?","o":[["Xin cô cho lùi sang tuần sau",0,"Có thể được, nhưng hãy thử phương án tại chỗ trước. Nội dung vẫn nằm trong đầu các bạn."],["Đứng im chờ máy chạy lại",0,"Chờ mà không làm gì thì mất giờ của cả lớp. Có thể vừa chờ vừa thử cách khác."],["Đề nghị cô cho trình bày trên bảng: vẽ nhanh sơ đồ chính và nói theo dàn ý",1,"Linh hoạt chuyển sang công cụ khác cho thấy mình nắm bài. Sự cố ai cũng gặp, cách xử lý mới là điều mọi người nhớ."]]},{"k":2,"s":"Đi đạp xe dã ngoại cùng câu lạc bộ thiếu niên của phường, xe của Khoa bị tuột xích giữa đường trong khi cả đoàn đang đi trước.","q":"Khoa nên làm gì?","o":[["Gọi to hoặc gọi điện ngay cho anh chị phụ trách, dắt xe vào lề an toàn và chờ",1,"Báo người phụ trách trước tiên để không bị tách đoàn. An toàn quan trọng hơn sửa xe."],["Tự sửa một mình rồi đạp thật nhanh đuổi theo",0,"Đạp nhanh một mình trên đường dễ gặp nguy hiểm và lạc đoàn. Báo người phụ trách trước."],["Đi đường tắt về nhà luôn",0,"Tự ý rời đoàn làm mọi người lo và không an toàn. Luôn báo người lớn phụ trách."]]}],"qq":"Bài học từ sự cố mất dữ liệu là…","qo":["Không dùng máy tính nữa","Làm bài sát giờ","Luôn có bản lưu dự phòng"],"qa":2,"mi":{"t":"Sao lưu bài vở quan trọng","s":"Con cùng ba mẹ chọn các tệp bài tập quan trọng, lưu thêm một bản dự phòng ở nơi thứ hai (ổ nhớ, thư mục khác), rồi thử mở bản dự phòng để chắc chắn dùng được.","lv":["Ba mẹ làm mẫu cách sao lưu, con làm lại với một tệp.","Ba mẹ nhắc một lần, con tự sao lưu tất cả bài đang làm.","Con tự đặt lịch sao lưu hằng tuần, làm lần đầu và giải thích cho ba mẹ vì sao cần hai nơi lưu."],"rw":"Ba mẹ cùng con chơi một trò chơi ngoài trời"}},{"t":"Sự thật hay ý kiến?","sk":5,"m":"12 phút","cx":[{"k":0,"s":"Bà xem một chương trình trên ti vi và nói: “Cái nồi này tốt nhất thế giới, người dẫn nói vậy.” Bà định gọi điện đặt mua.","q":"Khoa nên làm gì?","o":[["“Bà ơi, ti vi lừa đấy!”",0,"Nói quá có thể làm bà buồn. Giải thích nhẹ nhàng và cùng kiểm tra sẽ tốt hơn."],["Nhẹ nhàng nói với bà “tốt nhất” là lời quảng cáo, rồi cùng bà xem thông số và hỏi ý ba mẹ trước khi đặt",1,"Lời khen trong quảng cáo là ý kiến của người bán. Xem thông tin cụ thể giúp bà chọn đúng."],["Để bà tự quyết, không phải việc của mình",0,"Giúp bà phân biệt quảng cáo và thông tin cũng là một cách quan tâm. Chỉ cần nói nhẹ nhàng."]]},{"k":1,"s":"Trong giờ thảo luận, Bảo nói: “Đọc sách giấy tốt hơn đọc trên máy, ai cũng biết thế.” Vài bạn gật gù, có bạn phản đối, cả lớp bắt đầu ồn.","q":"Khoa nên góp ý thế nào?","o":[["“Bảo nói sai rồi!”",0,"Phủ nhận thẳng làm cuộc thảo luận thành cãi nhau. Hãy tách câu nói ra xem phần nào là ý kiến."],["Đồng ý cho xong vì nhiều bạn gật",0,"Nhiều người gật chưa phải bằng chứng. “Ai cũng biết” thường là dấu hiệu của ý kiến."],["“‘Tốt hơn’ là ý kiến. Mình thử tìm xem có nghiên cứu nào so sánh việc nhớ bài khi đọc theo hai cách không?”",1,"Tách ý kiến khỏi sự thật và hỏi bằng chứng giúp cuộc thảo luận đi đúng hướng."]]},{"k":2,"s":"Ở hiệu sách, bìa một cuốn truyện ghi “Cuốn sách hay nhất năm”, còn mặt sau ghi “Đã bán 100.000 bản”.","q":"Khoa nên hiểu thế nào?","o":[["“Đã bán 100.000 bản” là thông tin kiểm chứng được, “hay nhất năm” là ý kiến; đọc thử vài trang để tự đánh giá",1,"Biết đâu là ý kiến, đâu là số liệu giúp mình tự quyết. Đọc thử là cách đánh giá của riêng mình."],["Cả hai câu đều là sự thật",0,"“Hay nhất” phụ thuộc vào người đánh giá. Chỉ con số bán hàng là thứ kiểm chứng được."],["Cả hai đều là quảng cáo nên bỏ qua",0,"Không phải mọi thông tin trên bìa đều vô ích. Tách được phần kiểm chứng được là có ích."]]}],"qq":"Câu nào là sự thật, không phải ý kiến?","qo":["Môn Toán là môn khó nhất","Lớp mình có 38 học sinh","Mùa hè là mùa đẹp nhất"],"qa":1,"mi":{"t":"Trò chơi “Sự thật hay ý kiến?” trong bữa tối","s":"Trong bữa tối, con chuẩn bị 6 câu (lấy từ sách, báo, lời nói hằng ngày), đọc lên cho cả nhà đoán là sự thật hay ý kiến, rồi giải thích cách phân biệt.","lv":["Ba mẹ cùng con chọn câu và phân loại trước.","Ba mẹ nhắc một lần, con tự chuẩn bị câu và dẫn trò chơi.","Con tự chuẩn bị, thêm câu khó nửa thật nửa ý kiến và chỉ ra làm sao kiểm chứng được phần sự thật."],"rw":"Con được chọn hoạt động cho chiều Chủ nhật"}},{"t":"Người lạ làm quen trên mạng","sk":6,"m":"13 phút","cx":[{"k":0,"s":"Một tài khoản lạ nhắn tin khen bức tranh Khoa đăng trên mạng. Sau đó người này xin kết bạn, hỏi số điện thoại và hẹn cuối tuần gặp ở quán gần trường “để tặng quà”.","q":"Khoa nên làm gì?","o":[["Đi gặp nhưng rủ thêm một bạn",0,"Đi cùng bạn vẫn không an toàn khi gặp người lạ quen trên mạng. Hãy để ba mẹ biết chuyện."],["Nói chuyện tiếp nhưng không cho số điện thoại",0,"Người lạ có thể dần dần xin thêm thông tin khác. Dừng lại và báo người lớn là an toàn nhất."],["Không trả lời, không gửi thông tin, chụp màn hình và kể ngay với ba mẹ",1,"Người lạ xin thông tin và hẹn gặp riêng là dấu hiệu nguy hiểm. Kể với ba mẹ để ba mẹ cùng chặn và báo cáo."]]},{"k":1,"s":"Một bạn cùng lớp kể đang nói chuyện với một người tự nhận là học sinh trường khác, quen trên mạng, được người đó rủ đi chơi và dặn Khoa giữ bí mật.","q":"Khoa nên làm gì?","o":[["Khuyên bạn đừng đi, và nói với cô chủ nhiệm hoặc ba mẹ để người lớn giúp",1,"Bạn có thể giận lúc đầu, nhưng an toàn của bạn quan trọng hơn. Người lớn biết cách xử lý nhẹ nhàng."],["Giữ bí mật vì đã hứa",0,"Có những bí mật không nên giữ, nhất là khi bạn có thể gặp nguy hiểm. Báo người lớn là bảo vệ bạn."],["Bảo bạn nhớ chia sẻ vị trí khi đi",0,"Chia sẻ vị trí không làm cuộc gặp an toàn hơn. Điều cần làm là không đi và báo người lớn."]]},{"k":2,"s":"Đang chờ mẹ ở cổng nhà sách, Khoa gặp một người lạ nói đã từng nhắn tin với Khoa trên mạng và rủ đi uống nước ở quán bên cạnh.","q":"Khoa nên làm gì?","o":[["Đi một lát rồi về, quán ở ngay bên cạnh",0,"Dù gần, đi với người lạ vẫn không an toàn. Ở chỗ đông người và gọi mẹ ngay."],["Nói “Không” rõ ràng, vào trong nhà sách nhờ nhân viên và gọi mẹ ngay",1,"Từ chối dứt khoát, đến chỗ có người lớn tin cậy và gọi ba mẹ là ba bước an toàn."],["Hỏi tên tài khoản của họ để kiểm tra",0,"Không cần kiểm tra hay nói chuyện thêm. Từ chối và tìm người lớn là đủ."]]}],"qq":"Khi người quen trên mạng hẹn gặp riêng, bạn nên…","qo":["Đi nếu thấy họ tử tế","Giữ bí mật cho vui","Không đi và kể với ba mẹ"],"qa":2,"mi":{"t":"Rà cài đặt riêng tư và lập “quy tắc gặp người lạ”","s":"Con cùng ba mẹ xem lại cài đặt riêng tư trên các tài khoản con dùng (ai thấy được thông tin, ai nhắn được), rồi cùng viết quy tắc: người lạ hỏi số điện thoại hay hẹn gặp thì không trả lời, chụp lại và báo ba mẹ.","lv":["Ba mẹ cùng con mở và chỉnh cài đặt, ba mẹ đọc quy tắc, con nhắc lại.","Ba mẹ nhắc một lần, con tự kiểm tra cài đặt và tự viết quy tắc.","Con tự rà soát, chỉ cho ba mẹ những dấu hiệu một người lạ đáng ngờ và nói con sẽ làm gì."],"rw":"Ba mẹ viết một lá thư nhỏ nói ba mẹ tin con"}},{"t":"Ước lượng thời gian cho sát","sk":7,"m":"11 phút","cx":[{"k":0,"s":"Khoa nghĩ dọn phòng chỉ mất 15 phút nên 18h45 mới bắt đầu, trong khi 19h cả nhà đi ăn mừng sinh nhật bà. Đến giờ đi, phòng vẫn bừa và Khoa chưa thay đồ.","q":"Lần sau Khoa nên làm gì?","o":[["Bấm giờ xem thật sự dọn phòng mất bao lâu, rồi cộng thêm thời gian dự phòng",1,"Ước lượng theo số đo thực tế luôn chính xác hơn cảm giác. Thời gian dự phòng giúp mình đỡ vội."],["Lần sau làm nhanh hơn",0,"Vội thì dễ sót và mệt. Vấn đề nằm ở chỗ ước lượng ban đầu."],["Thôi không dọn nữa",0,"Né việc thì việc chỉ dồn lên. Biết việc mất bao lâu sẽ giúp xếp lịch dễ hơn."]]},{"k":1,"s":"Cô giao bài đọc 40 trang trước thứ Sáu. Khoa đoán đọc một tối là xong nên để đến tối thứ Năm.","q":"Khoa nên làm gì?","o":[["Cứ để thứ Năm, chắc kịp",0,"“Chắc kịp” là cảm giác, chưa phải ước lượng. Thử đo trước một đoạn."],["Đọc thử 5 trang, bấm giờ, rồi nhân lên để biết cần mấy buổi",1,"Đo một phần nhỏ giúp mình ước lượng cả phần lớn. Có số liệu rồi mới xếp lịch được."],["Đọc lướt cho nhanh",0,"Đọc lướt có thể bỏ sót ý chính cô cần. Biết trước mất bao lâu thì không phải lướt."]]},{"k":2,"s":"Khoa hẹn bạn ở thư viện lúc 15h. Đi xe buýt mất 20 phút nên Khoa định 14h40 mới ra khỏi nhà.","q":"Khoa đã quên tính điều gì?","o":[["Không quên gì, 20 phút là đủ",0,"Thời gian di chuyển không chỉ là lúc ngồi trên xe. Đi bộ và chờ xe cũng tốn thời gian."],["Nếu muộn thì nhắn bạn chờ",0,"Báo muộn là lịch sự, nhưng tính đúng từ đầu thì không cần phải báo."],["Thời gian đi bộ ra bến, chờ xe và đi từ bến vào thư viện, nên cần ra khỏi nhà sớm hơn 15–20 phút",1,"Chia hành trình thành từng đoạn giúp ước lượng sát hơn. Đến sớm vài phút tốt hơn để bạn phải chờ."]]}],"qq":"Người ta thường ước lượng thời gian…","qo":["Dài hơn thực tế","Ngắn hơn thực tế","Rất chính xác"],"qa":1,"mi":{"t":"Đoán trước và bấm giờ một việc nhà","s":"Con chọn hai việc (dọn phòng, chuẩn bị cặp…), ghi ra con đoán mất bao lâu, rồi bấm giờ khi làm thật và so sánh với ba mẹ.","lv":["Ba mẹ cùng con đoán và bấm giờ.","Ba mẹ nhắc một lần, con tự đoán, tự bấm giờ và ghi lại.","Con tự làm, tính chênh lệch và nói lần sau con sẽ cộng thêm bao nhiêu phút dự phòng."],"rw":"Ba mẹ cùng con làm một món ăn vặt lành mạnh"}},{"t":"So sánh giá theo đơn vị","sk":8,"m":"13 phút","cx":[{"k":0,"s":"Mẹ nhờ Khoa xem nên đặt bao gạo 5kg giá 110.000đ hay bao 10kg giá 205.000đ. Nhà Khoa ăn hết khoảng 8kg mỗi tháng.","q":"Khoa nên góp ý gì?","o":[["Bao 5kg vì trả ít tiền hơn",0,"Trả ít một lần nhưng mua nhiều lần thì tốn hơn. Tính theo ký để so."],["Bao nào cũng như nhau",0,"Chênh 1.500đ mỗi ký, cả năm cộng lại cũng đáng kể. Một phép chia nhỏ giúp thấy điều đó."],["Bao 10kg rẻ hơn mỗi ký (20.500đ so với 22.000đ) và nhà dùng hết trong khoảng năm tuần, nên chọn bao 10kg nếu có chỗ cất khô ráo",1,"Giá đơn vị thấp mà dùng hết kịp mới là tiết kiệm thật. Nhớ tính cả chỗ cất."]]},{"k":1,"s":"Lớp Khoa mua giấy màu để trang trí lớp. Cửa hàng thứ nhất bán 10 tờ giá 15.000đ, cửa hàng thứ hai bán 25 tờ giá 35.000đ.","q":"Khoa nên đề xuất gì?","o":[["Tính giá mỗi tờ (1.500đ và 1.400đ), ước lượng lớp cần khoảng bao nhiêu tờ, rồi chọn",1,"Giá đơn vị kết hợp với số lượng thật sự cần là cách dùng quỹ lớp có trách nhiệm."],["Mua ở cửa hàng thứ nhất vì tổng tiền ít hơn",0,"Tổng tiền ít vì được ít giấy hơn. So sánh theo giá mỗi tờ mới công bằng."],["Mua ở cửa hàng thứ hai, không cần tính lớp cần bao nhiêu",0,"Rẻ mỗi tờ nhưng mua thừa vẫn là phí. Đếm số tờ cần trước."]]},{"k":2,"s":"Đi siêu thị cùng mẹ, Khoa được giao chọn nước rửa tay. Chai nhỏ 250ml giá 30.000đ, chai lớn 500ml giá 52.000đ, còn túi thay thế 1 lít giá 90.000đ.","q":"Khoa nên chọn thế nào?","o":[["Chọn chai nhỏ vì rẻ nhất",0,"Rẻ nhất trên nhãn chưa chắc rẻ nhất tính theo ml. Thử chia giá cho dung tích."],["Tính giá mỗi 100ml (12.000đ, 10.400đ, 9.000đ), rồi hỏi mẹ nhà còn chai cũ để đổ túi thay thế không",1,"Giá theo đơn vị cho biết món nào thật sự rẻ. Kết hợp với nhu cầu thực tế là quyết định khéo."],["Chọn túi to nhất vì to là lợi",0,"Túi to thường rẻ hơn mỗi ml, nhưng chỉ lợi khi dùng hết và nhà còn chai để đổ vào."]]}],"qq":"Để so sánh hai gói khác dung tích, cần tính…","qo":["Giá trên mỗi đơn vị","Gói nào đẹp hơn","Gói nào nặng hơn"],"qa":0,"mi":{"t":"So sánh giá theo đơn vị khi đi chợ cùng ba mẹ","s":"Lần tới đi siêu thị hoặc chợ cùng ba mẹ, con chọn một mặt hàng có nhiều cỡ, tính giá trên mỗi 100ml hoặc 100g và nói với ba mẹ cỡ nào lợi nhất; ba mẹ là người quyết định mua.","lv":["Ba mẹ cùng con đọc giá và bấm máy tính.","Ba mẹ nhắc một lần, con tự tính cho một mặt hàng.","Con tự tính cho hai mặt hàng và nói thêm khi nào cỡ to chưa chắc đã lợi (dùng không hết, hết hạn)."],"rw":"Ba mẹ khen con là “chuyên gia đi chợ” trước cả nhà"}},{"t":"Góp ý cho bạn mà không làm bạn buồn","sk":0,"m":"12 phút","cx":[{"k":0,"s":"Ba mới tập nấu canh chua và hỏi Khoa: “Ngon không con?” Canh hơi mặn.","q":"Khoa nên trả lời thế nào?","o":[["“Ngon ạ” rồi lén thêm nước",0,"Ba sẽ không biết để điều chỉnh. Nói thật nhẹ nhàng sẽ giúp ba hơn."],["“Con thích vị chua thơm lắm ạ. Lần sau ba bớt chút muối là con thấy vừa hơn.”",1,"Ghi nhận công sức trước, góp ý nhẹ nhàng sau. Ba sẽ vui và nấu ngon hơn lần sau."],["“Mặn quá ba ơi!”",0,"Nói thẳng mà quên công sức của ba dễ làm ba cụt hứng. Thêm một lời ghi nhận trước."]]},{"k":1,"s":"Linh nhờ Khoa đọc bài phát biểu Linh sẽ nói trước toàn trường. Bài có ý hay nhưng quá dài và phần mở đầu khó hiểu.","q":"Khoa nên góp ý thế nào?","o":[["“Hay lắm, không cần sửa gì.”",0,"Khen cho bạn vui nhưng bạn mất cơ hội làm bài tốt hơn. Góp ý thật lòng mới là giúp."],["“Dài quá, chán lắm.”",0,"Nhận xét chung chung và nặng lời làm bạn buồn mà không biết sửa chỗ nào."],["“Tớ thích ý trồng cây ở sân trường. Phần mở đầu tớ hơi khó theo — nếu cắt ngắn và vào ý chính sớm hơn thì sao?”",1,"Nói điểm tốt cụ thể, chỉ đúng chỗ cần sửa và gợi ý cách làm. Bạn dễ nhận góp ý khi thấy mình được tôn trọng."]]},{"k":2,"s":"Ở câu lạc bộ bóng rổ thiếu niên, Tí luôn giữ bóng quá lâu nên cả đội mất nhiều cơ hội. Huấn luyện viên bảo các bạn góp ý cho nhau sau buổi tập.","q":"Khoa nên nói gì với Tí?","o":[["“Cậu dẫn bóng giỏi thật. Nếu chuyền sớm hơn khi bị hai người kèm, đội mình sẽ ghi được nhiều điểm hơn đấy.”",1,"Ghi nhận điểm mạnh và nói đúng một hành động cần đổi giúp bạn dễ làm theo."],["Không nói gì để giữ hòa khí",0,"Im lặng thì Tí không biết để thay đổi. Góp ý tử tế cũng là giữ hòa khí."],["“Cậu ích kỷ quá.”",0,"Gắn nhãn cho con người làm bạn tổn thương. Hãy nói về hành động, đừng nói về tính cách."]]}],"qq":"Góp ý hiệu quả nên…","qo":["Thật nhiều lời khen","Cụ thể và kèm gợi ý sửa","Thẳng thừng, càng gay gắt càng tốt"],"qa":1,"mi":{"t":"Góp ý “khen – gợi ý – khích lệ” cho người thân","s":"Con nhờ một người trong nhà cho xem một việc họ làm (bức vẽ, món ăn, bài viết), rồi góp ý bằng ba phần: một điều cụ thể con thích, một gợi ý sửa, một câu khích lệ.","lv":["Ba mẹ nói mẫu một lần góp ý đủ ba phần, con làm theo.","Ba mẹ nhắc một lần, con tự góp ý cho một người.","Con tự góp ý và hỏi lại người đó cảm thấy thế nào khi nghe con nói."],"rw":"Con được chọn nơi cả nhà đi dạo cuối tuần"}},{"t":"Cả nhóm bất đồng: quyết định thế nào?","sk":2,"m":"13 phút","cx":[{"k":0,"s":"Cả nhà chọn phim xem tối thứ Bảy: ba muốn xem phim tài liệu, em Vy muốn phim hoạt hình, Khoa muốn phim phiêu lưu.","q":"Khoa nên góp ý gì?","o":[["Giành điều khiển trước",0,"Nhanh tay không phải là công bằng. Cả nhà sẽ xem không vui."],["Mỗi người xem phim riêng trên máy riêng",0,"Như vậy mất buổi tối cả nhà bên nhau. Một cách chọn công bằng giữ được cả hai."],["Đề nghị tiêu chí: phim hợp tuổi em Vy, xong trước 21h; chọn phim đạt tiêu chí, lần sau đổi lượt người chọn",1,"Tiêu chí hợp với cả nhà giúp loại bớt lựa chọn. Luân phiên người chọn giữ công bằng lâu dài."]]},{"k":1,"s":"Lớp Khoa chọn chủ đề cho báo tường: môi trường, khoa học hay thể thao. Mỗi tổ ủng hộ một chủ đề khác nhau.","q":"Khoa nên đề xuất gì?","o":[["Để lớp trưởng tự quyết",0,"Lớp trưởng có thể quyết, nhưng các tổ sẽ thấy không được lắng nghe. Thử cách có tiêu chí."],["Mỗi tổ trình bày một phút, rồi cả lớp bỏ phiếu kín theo tiêu chí “dễ tìm tư liệu, nhiều bạn góp sức được”",1,"Ai cũng được trình bày và bỏ phiếu theo tiêu chí chung, nên kết quả dễ được chấp nhận."],["Gộp cả ba chủ đề vào một tờ",0,"Gộp hết thường làm báo rối và thiếu chiều sâu. Chọn một hướng rõ ràng sẽ đẹp hơn."]]},{"k":2,"s":"Nhóm bạn của Khoa được ba mẹ cho đi chơi chiều Chủ nhật, có mẹ Huy đi cùng. Ba bạn muốn đến bảo tàng khoa học, hai bạn muốn đi công viên nước, bàn mãi chưa xong.","q":"Khoa nên đề xuất cách nào?","o":[["Cùng đặt tiêu chí (giờ về, chi phí, ý kiến mẹ Huy), so sánh hai nơi rồi biểu quyết; bên còn lại được chọn chỗ đi lần sau",1,"Tiêu chí chung biến tranh cãi thành so sánh. Hứa lượt sau cho bên còn lại giúp ai cũng vui vẻ."],["Ai nói to nhất thì theo người đó",0,"Nói to không phải là lý do. Cả nhóm cần cách quyết định mà ai cũng thấy công bằng."],["Thôi không đi đâu nữa",0,"Hủy thì không ai vui. Một cách quyết định rõ ràng sẽ cứu buổi đi chơi."]]}],"qq":"Khi nhóm bất đồng, cách quyết định công bằng là…","qo":["Để bạn thân của nhóm trưởng chọn","Chọn ý được nêu đầu tiên","Thống nhất tiêu chí rồi so sánh, biểu quyết"],"qa":2,"mi":{"t":"Dẫn cả nhà quyết định bằng tiêu chí và biểu quyết","s":"Con chọn một việc cả nhà cần quyết (món ăn cuối tuần, hoạt động ngày nghỉ), mời mọi người nêu hai tiêu chí, so sánh các lựa chọn theo tiêu chí rồi biểu quyết.","lv":["Ba mẹ cùng con viết tiêu chí và lựa chọn lên giấy.","Ba mẹ nhắc một lần, con tự dẫn buổi bàn bạc.","Con tự tổ chức, đảm bảo ai cũng được nói và kể lại cách cả nhà chấp nhận kết quả."],"rw":"Cả nhà thực hiện đúng lựa chọn đã biểu quyết"}},{"t":"Lần đầu làm nhóm trưởng","sk":2,"m":"13 phút","cx":[{"k":0,"s":"Ba mẹ đi công tác hai ngày, ông bà sang ở cùng. Ba nhờ Khoa giúp em Vy và em Bảo làm đủ việc buổi sáng.","q":"Khoa nên làm gì?","o":[["Ra lệnh cho hai em thật to",0,"Ra lệnh to dễ làm các em chống đối. Một bảng việc rõ ràng nhẹ nhàng hơn."],["Cùng hai em vẽ bảng việc buổi sáng có ô đánh dấu, xong sớm thì được nghe ông kể chuyện",1,"Cùng nhau đặt việc giúp các em thấy đó là việc của mình. Phần thưởng nhỏ làm buổi sáng vui hơn."],["Làm hết giúp các em cho nhanh",0,"Nhanh nhưng các em không tự làm được. Dẫn dắt là giúp người khác tự làm."]]},{"k":1,"s":"Khoa được bầu làm nhóm trưởng dự án Khoa học. Buổi họp đầu, các bạn nói chuyện riêng, bàn lan man, hết giờ vẫn chưa quyết được gì.","q":"Buổi họp sau Khoa nên làm gì?","o":[["Chuẩn bị ba nội dung cần chốt, đặt giờ cho từng phần, mời từng bạn nói, cuối buổi đọc lại ai làm gì, hạn nào",1,"Nhóm trưởng giỏi giữ cho cuộc họp có mục tiêu và ai cũng có tiếng nói. Chốt lại cuối buổi giúp không ai quên."],["Tự quyết hết cho đỡ mất thời gian",0,"Nhanh, nhưng các bạn sẽ thấy không được tham gia và làm thiếu nhiệt tình."],["Nhắc nhở các bạn thật nghiêm",0,"Nghiêm khắc chưa giải quyết được chuyện họp lan man. Một chương trình họp rõ ràng hiệu quả hơn."]]},{"k":2,"s":"Nhóm Khoa phụ trách một gian trò chơi dân gian cho các em nhỏ ở sân nhà văn hóa, có các cô chú tổ dân phố trông coi. Đến giờ mở cửa, các bạn vẫn chưa biết ai đứng trò nào.","q":"Khoa nên làm gì?","o":[["Chờ các bạn tự nhận",0,"Lúc gấp, chờ đợi sẽ làm các em nhỏ phải đứng đợi. Cần một người chủ động phân việc."],["Khoa đứng hết các trò một mình",0,"Một người không thể ở mọi nơi. Nhóm trưởng giỏi là người giúp cả nhóm cùng làm."],["Nhanh chóng phân mỗi bạn một trò, báo cô chú phụ trách, rồi đi một vòng hỏi ai cần giúp",1,"Quyết nhanh việc cần quyết và báo người lớn phụ trách giúp sự kiện suôn sẻ. Đi một vòng hỗ trợ là việc của người dẫn dắt."]]}],"qq":"Một cuộc họp nhóm hiệu quả cần…","qo":["Mục tiêu rõ và chốt việc cuối buổi","Nhóm trưởng nói nhiều nhất","Càng dài càng kỹ"],"qa":0,"mi":{"t":"Chủ trì một buổi họp gia đình 15 phút","s":"Con chuẩn bị một buổi họp gia đình ngắn về một chủ đề (kế hoạch cuối tuần, chia việc nhà): nêu mục tiêu, giữ đúng giờ và chốt ai làm gì cuối buổi.","lv":["Ba mẹ cùng con viết chương trình họp ba mục.","Ba mẹ nhắc một lần, con tự chủ trì và ghi lại kết luận.","Con tự chuẩn bị, chủ trì, viết biên bản ngắn và nhắc mọi người làm đúng việc đã chốt."],"rw":"Ba mẹ gọi con là “trưởng nhóm của tuần” và kể chuyện hồi ba mẹ làm trưởng nhóm"}},{"t":"Tự lo quần áo của mình","sk":3,"m":"11 phút","cx":[{"k":0,"s":"Sáng thứ Hai, Khoa mới phát hiện áo đồng phục vẫn nằm trong giỏ đồ bẩn. Mẹ bảo từ tuần này Khoa tự lo quần áo của mình.","q":"Khoa nên làm gì từ tuần này?","o":[["Nhờ mẹ giặt thêm tuần này nữa",0,"Hoãn lại thì thói quen mới không bắt đầu được. Tuần này là lúc tốt nhất để tập."],["Nhờ mẹ hướng dẫn dùng máy giặt một lần, đặt lịch giặt cố định thứ Tư và Chủ nhật, khô rồi gấp cất ngay",1,"Học cách làm, đặt lịch cố định và làm trọn từng bước là cách tự lập bền vững."],["Xin mua thêm áo cho đỡ phải giặt",0,"Thêm áo chỉ làm đống đồ bẩn to hơn. Một lịch giặt cố định mới giải quyết được."]]},{"k":1,"s":"Sau giờ thể dục, áo của Khoa ướt mồ hôi và lấm bẩn, trong khi còn ba tiết học nữa.","q":"Lần sau Khoa nên làm gì?","o":[["Gọi mẹ mang áo đến trường",0,"Mẹ có thể phải bỏ dở việc. Mình tự chuẩn bị được từ tối hôm trước."],["Mặc tạm, về nhà ném vào giỏ",0,"Ngồi học khó chịu cả buổi. Một chiếc áo dự phòng giải quyết dễ dàng."],["Chuẩn bị sẵn một áo sạch và túi đựng đồ bẩn trong cặp vào những ngày có giờ thể dục",1,"Tự chuẩn bị trước cho mình là tự lập. Không cần ai nhắc mà vẫn thoải mái cả ngày."]]},{"k":2,"s":"Khoa đi trại hè ba ngày của câu lạc bộ thiếu niên, có các anh chị phụ trách. Đến ngày thứ hai, ba lô của Khoa lẫn lộn đồ sạch và đồ bẩn.","q":"Khoa nên làm gì?","o":[["Cho đồ bẩn vào túi riêng, xếp đồ sạch theo từng ngày, giặt tay tất nếu trại cho phép",1,"Tự quản lý đồ dùng khi xa nhà là một bước lớn. Có cách sắp xếp thì việc nhỏ không thành rắc rối."],["Mặc lại đồ hôm qua cho nhanh",0,"Tiện nhưng không vệ sinh. Sắp xếp lại một chút là có đồ sạch."],["Đổ hết ra xem rồi nhét lại",0,"Nhét lại thì mai vẫn rối. Tách riêng hai loại sẽ dễ hơn."]]}],"qq":"Tự lập với việc nhà nghĩa là…","qo":["Làm khi có người nhắc","Có lịch riêng và làm trọn việc","Làm thật nhanh cho xong"],"qa":1,"mi":{"t":"Một tuần tự lo quần áo của mình","s":"Con lập lịch giặt và gấp quần áo của mình trong tuần, tự cho đồ vào máy giặt (ba mẹ chỉ cách lần đầu), phơi, gấp và chuẩn bị đồng phục cho hôm sau.","lv":["Ba mẹ làm cùng con từng bước giặt, phơi, gấp.","Ba mẹ nhắc một lần, con tự làm theo lịch.","Con tự nhớ làm trọn tuần, không thiếu đồng phục buổi nào và kể lại khó nhất là gì."],"rw":"Ba mẹ kể chuyện hồi nhỏ ba mẹ tự giặt đồ lần đầu"}},{"t":"Tìm nguyên nhân gốc của vấn đề","sk":4,"m":"13 phút","cx":[{"k":0,"s":"Tuần này Khoa đi học muộn ba lần. Khoa nghĩ chỉ tại xe buýt hay đến trễ.","q":"Khoa nên làm gì?","o":[["Trách xe buýt rồi thôi",0,"Đổ cho một lý do có sẵn thì không sửa được gì. Kiểm tra trước đã."],["Ghi lại mỗi sáng mấy giờ dậy, mấy giờ ra khỏi nhà, xe đến lúc nào, để xem chậm ở khâu nào",1,"Số liệu cụ thể cho biết nguyên nhân thật. Có khi xe không trễ mà mình ra bến muộn."],["Xin ba chở đi mỗi ngày",0,"Có thể đỡ tạm, nhưng nếu nguyên nhân là dậy muộn thì vẫn trễ. Tìm gốc rồi mới chọn cách."]]},{"k":1,"s":"Bồn rau của lớp Khoa ở góc sân cứ héo dần dù tổ nào cũng tưới hằng ngày. Có bạn đề nghị mua cây mới về trồng lại.","q":"Khoa nên đề xuất gì?","o":[["Mua cây mới trồng lại",0,"Nếu chưa biết vì sao cây héo, cây mới cũng sẽ héo. Tìm nguyên nhân trước."],["Tưới nhiều gấp đôi",0,"Có thể cây đang bị thừa nước chứ không phải thiếu. Đoán sai sẽ làm tệ hơn."],["Hỏi “vì sao” nhiều lần: đất có úng không, có đủ nắng không, mỗi tổ tưới bao nhiêu; ghi lại rồi hỏi thầy dạy Sinh",1,"Hỏi “vì sao” nhiều lần giúp tìm đúng gốc vấn đề. Năm tổ cùng tưới có khi chính là nguyên nhân."]]},{"k":2,"s":"Xe đạp của Khoa cứ kêu lạch cạch mỗi khi lên dốc. Tiệm sửa xe gần nhà bảo phải thay cả bộ líp.","q":"Khoa nên làm gì?","o":[["Cùng ba quan sát xe kêu lúc nào, kiểm tra xích có khô dầu hay bị lỏng không, hỏi thêm một tiệm khác trước khi thay",1,"Quan sát kỹ và hỏi thêm ý kiến giúp tìm đúng chỗ hỏng. Có khi chỉ cần tra dầu."],["Thay ngay theo lời tiệm",0,"Có thể đúng, nhưng thay cả bộ thì tốn. Cùng ba tìm hiểu nguyên nhân trước."],["Kệ, vẫn đạp được",0,"Tiếng kêu là dấu hiệu có gì đó chưa ổn. Để lâu có thể hỏng nặng hơn."]]}],"qq":"Trước khi sửa một vấn đề, nên…","qo":["Thử cách nhanh nhất","Đổ lỗi cho ai đó","Tìm nguyên nhân gốc"],"qa":2,"mi":{"t":"Hỏi “Tại sao?” năm lần cho một vấn đề trong nhà","s":"Con chọn một vấn đề nhỏ lặp lại trong nhà (cây héo, hay quên đồ, sáng nào cũng vội), cùng ba mẹ hỏi “Tại sao?” liên tiếp để tìm nguyên nhân gốc và thử một cách sửa.","lv":["Ba mẹ cùng con hỏi và ghi từng câu trả lời.","Ba mẹ nhắc một lần, con tự hỏi và tìm nguyên nhân gốc.","Con tự làm, thử cách sửa trong ba ngày và báo lại ba mẹ có hiệu quả không."],"rw":"Cả nhà cùng chăm một chậu cây con chọn"}},{"t":"Nghe cả hai phía trước khi phán xét","sk":5,"m":"12 phút","cx":[{"k":0,"s":"Em Vy khóc, nói em Bảo xé tranh của em. Bảo cãi là Vy giật trước nên tranh mới rách.","q":"Khoa nên làm gì?","o":[["Mắng Bảo vì Vy đang khóc",0,"Ai khóc chưa chắc là người đúng. Nghe đủ hai bên đã."],["Bảo cả hai im lặng",0,"Im lặng thì chuyện vẫn chưa xong. Các em cần được nói và được nghe."],["Cho từng em kể lần lượt, không ngắt lời, rồi cùng nghĩ cách dán lại tranh",1,"Nghe đủ hai phía giúp các em thấy được tôn trọng. Hướng đến cách sửa thay vì tìm người để phạt."]]},{"k":1,"s":"Cả lớp đồn Nam lấy bút của Mai vì thấy Nam cầm một cây bút giống hệt. Nhiều bạn đã bắt đầu tránh mặt Nam.","q":"Khoa nên làm gì?","o":[["Hỏi Nam bằng giọng bình thường, hỏi Mai mất bút lúc nào, và nhắc mọi người đừng kết luận khi chưa rõ",1,"Nghe cả hai phía và tìm thông tin trước khi kết luận là công bằng. Bút giống nhau là chuyện rất thường."],["Tránh Nam giống mọi người",0,"Theo số đông khi chưa có bằng chứng có thể làm tổn thương một người vô tội."],["Bảo Nam trả bút cho Mai",0,"Như vậy là đã coi Nam có lỗi. Hỏi trước, kết luận sau."]]},{"k":2,"s":"Ở khu phố, có người kể cửa hàng tạp hóa đầu ngõ bán hàng hết hạn. Mẹ Khoa vẫn hay mua ở đó.","q":"Khoa nên làm gì?","o":[["Bảo mẹ đừng mua nữa và kể cho mọi người",0,"Kể lại khi chưa kiểm tra có thể làm hại người khác. Kiểm tra trước đã."],["Kể với mẹ điều mình nghe, lần sau đi cùng mẹ để ý hạn dùng trên bao bì, không lan truyền khi chưa rõ",1,"Tự xem bằng chứng là công bằng với cả cửa hàng và gia đình mình."],["Không tin vì mẹ vẫn mua ở đó",0,"Không nên tin vội, nhưng cũng không nên gạt bỏ vội. Tự kiểm tra là cách cân bằng."]]}],"qq":"Trước khi tin một lời đồn về ai đó, nên…","qo":["Nghe người trong cuộc nói","Xem bao nhiêu người tin","Kể cho bạn khác"],"qa":0,"mi":{"t":"Nghe cả hai phía trong một câu chuyện","s":"Khi trong nhà có hai người khác ý (hoặc ba mẹ kể một tình huống), con hỏi từng người kể phía mình, nhắc lại ý cả hai rồi mới nêu nhận xét.","lv":["Ba mẹ đóng vai hai phía, con nghe và nhắc lại với sự giúp đỡ.","Ba mẹ nhắc một lần, con tự hỏi cả hai phía.","Con tự nhớ làm khi gặp một lời đồn hay mâu thuẫn thật và kể lại con đã tránh kết luận vội thế nào."],"rw":"Ba mẹ kể một lần ba mẹ đã hiểu lầm ai đó"}},{"t":"Ảnh của mình, mình được quyết","sk":6,"m":"12 phút","cx":[{"k":0,"s":"Mẹ muốn đăng ảnh Khoa đang nhăn mặt tập đàn lên trang cá nhân để khoe với họ hàng. Khoa thấy ngượng.","q":"Khoa nên làm gì?","o":[["Nói với mẹ: “Con ngại ảnh này, mẹ chọn ảnh khác hoặc chỉ gửi riêng cho bà được không ạ?”",1,"Ranh giới về hình ảnh áp dụng cả trong gia đình. Đề xuất cách khác giúp mẹ vẫn được chia sẻ niềm vui."],["Im lặng vì mẹ là người lớn",0,"Ba mẹ thường muốn biết con nghĩ gì. Nói nhẹ nhàng, mẹ sẽ hiểu."],["Giận dỗi và giành điện thoại",0,"Giành điện thoại làm mẹ buồn mà vẫn chưa nói được điều mình muốn. Nói ra bằng lời sẽ tốt hơn."]]},{"k":1,"s":"Trong buổi ngoại khóa, Bảo chụp được ảnh Khoa đang ngáp và nói sẽ đăng lên nhóm chat lớp cho vui. Khoa thấy ngại và không muốn ảnh bị đăng.","q":"Khoa nên làm gì?","o":[["Cười cho qua để không bị coi là khó tính",0,"Không thoải mái thì mình có quyền nói ra. Đặt ranh giới không làm mình thành người khó tính."],["Chụp lại một ảnh xấu của Bảo để đăng trả đũa",0,"Trả đũa làm cả hai cùng bị tổn thương. Hãy bảo vệ quyền của mình mà không xâm phạm quyền của người khác."],["Nói rõ: “Tớ không đồng ý đăng ảnh đó, cậu xóa giúp tớ nhé.” Nếu Bảo vẫn đăng thì báo thầy cô",1,"Ảnh của mình thì mình có quyền đồng ý hay không. Nói rõ ràng, bình tĩnh và nhờ người lớn khi cần."]]},{"k":2,"s":"Ở công viên, Khoa và bạn quay video tập nhảy, có mẹ của bạn ngồi gần đó. Một em nhỏ đang chơi gần đó lọt vào khung hình.","q":"Khoa nên làm gì?","o":[["Đăng luôn, em nhỏ chỉ ở góc thôi",0,"Dù chỉ ở góc, đó vẫn là hình ảnh của người khác. Cắt đi là tôn trọng em và gia đình em."],["Cắt bỏ đoạn có em nhỏ hoặc quay lại ở góc khác trước khi chia sẻ",1,"Không đăng hình người khác khi chưa được phép, nhất là trẻ nhỏ. Quay lại một chút là xong."],["Hỏi em nhỏ xem có cho đăng không",0,"Trẻ nhỏ chưa tự quyết được việc này. Cách đơn giản và tôn trọng nhất là cắt bỏ đoạn đó."]]}],"qq":"Trước khi đăng ảnh có người khác, cần…","qo":["Ảnh thật đẹp","Hỏi và được họ đồng ý","Nhiều người thích"],"qa":1,"mi":{"t":"Thỏa thuận về ảnh trong gia đình","s":"Con cùng ba mẹ viết thỏa thuận: trước khi chụp hoặc gửi ảnh có người khác thì phải hỏi; tập nói câu “Mình không muốn ảnh này bị gửi đi, bạn xóa giúp mình nhé.”","lv":["Ba mẹ đọc mẫu câu nói, con nói lại.","Ba mẹ nhắc một lần, con tự viết thỏa thuận và tự nói câu từ chối.","Con tự nhớ hỏi ý người trong ảnh suốt tuần và kể lại một lần con đã hỏi hoặc từ chối."],"rw":"Cả nhà cùng xem lại album ảnh cũ của gia đình"}},{"t":"Việc gấp và việc quan trọng","sk":7,"m":"13 phút","cx":[{"k":0,"s":"Tối nay Khoa phải ôn bài kiểm tra Toán sáng mai, trả lời tin nhắn nhóm chat lớp, xem tập mới của bộ phim yêu thích và giúp mẹ phơi quần áo. Việc nào cũng như đang gọi Khoa cùng lúc.","q":"Khoa nên sắp xếp thế nào?","o":[["Trả lời tin nhắn trước vì máy báo liên tục",0,"Việc gây chú ý nhất chưa chắc là việc quan trọng nhất. Tin nhắn có thể chờ."],["Giúp mẹ 10 phút trước, rồi ôn Toán, trả lời tin nhắn một lần sau khi học, còn giờ thì xem phim",1,"Việc vừa quan trọng vừa gấp làm trước; việc nhanh giúp gia đình làm luôn; việc chỉ gây chú ý để sau."],["Xem phim cho thư giãn rồi tính",0,"Thư giãn là cần thiết, nhưng nên đặt sau việc quan trọng có hạn gấp."]]},{"k":1,"s":"Giờ ra chơi, Khoa định làm nốt bài tập nộp tiết sau thì bạn rủ ra sân xem đội lớp tập bóng, còn cô Lan nhờ mang sổ lên văn phòng.","q":"Khoa nên làm gì?","o":[["Đi xem bóng vì chỉ giờ ra chơi mới xem được",0,"Bài tập nộp tiết sau là việc gấp. Xem tập bóng có thể hẹn lại."],["Từ chối cô để làm bài",0,"Việc cô nhờ chỉ mất hai phút. Làm ngay rồi quay lại vẫn kịp."],["Mang sổ lên văn phòng trước vì nhanh và cô cần, quay lại làm xong bài tập, hẹn bạn xem tập bóng hôm khác",1,"Việc nhỏ, gấp làm ngay; việc quan trọng có hạn làm tiếp; việc vui có thể hẹn lại."]]},{"k":2,"s":"Chiều thứ Bảy, Khoa cần trả sách thư viện hết hạn hôm nay, mua quà sinh nhật cho Mai vào thứ Ba, và đã hứa đi dạo cùng ông.","q":"Khoa nên sắp xếp thế nào?","o":[["Rủ ông đi dạo về phía thư viện để trả sách, việc mua quà để sang Chủ nhật",1,"Gộp việc gấp với thời gian bên gia đình là cách dùng thời gian khéo. Việc còn hạn thì xếp sau."],["Đi mua quà trước vì thích nhất",0,"Sinh nhật Mai còn ba ngày, sách thì hết hạn hôm nay. Xếp theo hạn sẽ không bị lỡ."],["Làm vội cả ba việc trong một giờ",0,"Vội thì việc nào cũng dở. Xếp thứ tự rõ ràng sẽ thong thả hơn."]]}],"qq":"Việc nên làm trước tiên là việc…","qo":["Vừa quan trọng vừa gấp","Vui nhất","Có nhiều thông báo nhất"],"qa":0,"mi":{"t":"Xếp việc tối nay vào bốn ô","s":"Trước khi học bài, con viết hết việc tối nay ra giấy, xếp vào bốn ô (gấp/không gấp, quan trọng/không quan trọng), làm việc ở ô “gấp và quan trọng” trước và cho ba mẹ xem.","lv":["Ba mẹ cùng con vẽ bảng và xếp việc.","Ba mẹ nhắc một lần, con tự xếp và làm theo thứ tự.","Con tự làm ba buổi tối và kể ba mẹ việc nào con đã quyết định để lại hoặc bỏ."],"rw":"Ba mẹ dành riêng cho con một buổi trò chuyện tối"}},{"t":"Tiết kiệm cho một mục tiêu","sk":8,"m":"12 phút","cx":[{"k":0,"s":"Khoa muốn mua một bộ màu vẽ giá 600.000đ. Mỗi tuần Khoa được 100.000đ tiền tiêu vặt nhưng thường tiêu hết trước Chủ nhật.","q":"Khoa nên làm thế nào?","o":[["Xin ba mẹ mua luôn",0,"Ba mẹ có thể đồng ý, nhưng tự để dành giúp mình biết quý món đồ hơn."],["Cuối tuần còn bao nhiêu thì để dành bấy nhiêu",0,"Thường thì cuối tuần chẳng còn gì. Để riêng ngay từ đầu chắc chắn hơn."],["Mỗi tuần để riêng 40.000đ vào ống trước khi tiêu, ghi tiến độ lên tờ giấy dán ở bàn học, khoảng 15 tuần là đủ",1,"Để dành trước khi tiêu và nhìn thấy tiến độ giúp mình kiên trì. Mục tiêu rõ thì dễ nói không với những khoản nhỏ."]]},{"k":1,"s":"Tổ của Khoa muốn mua một bộ cờ vua giá 150.000đ cho góc chơi của lớp. Các bạn đồng ý góp tự nguyện trong một tháng.","q":"Khoa nên đề xuất gì?","o":[["Mỗi bạn góp bằng nhau ngay hôm nay",0,"Không phải ai cũng có sẵn tiền cùng lúc. Góp dần, tự nguyện thì nhẹ nhàng hơn."],["Ai muốn góp thì bỏ vào hộp mỗi tuần, một bạn ghi sổ, thứ Sáu đọc tổng cho cả tổ nghe; cô chủ nhiệm giữ hộp",1,"Mục tiêu chung cần ghi chép rõ và người lớn giữ tiền để minh bạch. Góp tự nguyện thì không ai bị áp lực."],["Khoa giữ tiền trong cặp",0,"Tiền chung dễ thất lạc và khó minh bạch. Nhờ cô chủ nhiệm giữ là an toàn."]]},{"k":2,"s":"Đi hiệu sách cùng ba, Khoa thấy một cuốn truyện tranh mới giá 45.000đ. Khoa đang tiết kiệm cho bộ màu vẽ và đã được một nửa.","q":"Khoa nên làm gì?","o":[["Ghi tên truyện lại, chờ một tuần; nếu vẫn muốn thì thử mượn ở thư viện trước",1,"Chờ một thời gian giúp tách cái muốn nhất thời khỏi cái muốn thật. Mượn sách là cách đọc mà không phá mục tiêu."],["Mua luôn, chỉ lùi mục tiêu một chút",0,"Nhiều lần “một chút” cộng lại sẽ đẩy mục tiêu ra rất xa. Thử hỏi mình muốn điều gì hơn."],["Xin ba trả hộ",0,"Ba có thể chiều, nhưng mục tiêu tiết kiệm là của mình. Tự quyết mới rèn được kỹ năng."]]}],"qq":"Cách tiết kiệm hiệu quả là…","qo":["Để dành phần còn thừa","Để riêng một khoản ngay khi nhận tiền","Chờ có nhiều tiền mới tiết kiệm"],"qa":1,"mi":{"t":"Lập kế hoạch tiết kiệm cho một mục tiêu","s":"Con chọn một món đồ có ích con muốn có, cùng ba mẹ tính cần để riêng bao nhiêu mỗi tuần từ tiền tiêu vặt và trong mấy tuần, rồi để riêng phần đầu tiên ngay hôm nay.","lv":["Ba mẹ cùng con tính toán và chọn hũ hoặc phong bì để tiết kiệm.","Ba mẹ nhắc một lần, con tự để riêng tiền ngay khi nhận.","Con tự giữ kế hoạch ba tuần, vẽ thanh tiến độ và báo cáo với ba mẹ mỗi Chủ nhật."],"rw":"Ba mẹ cùng con vẽ và trang trí bảng mục tiêu"}},{"t":"Thuyết trình khi đang hồi hộp","sk":0,"m":"14 phút","cx":[{"k":0,"s":"Tối nay họp gia đình, Khoa muốn đề xuất cả nhà nuôi một chú mèo. Khoa sợ mình nói lộn xộn và ba mẹ không đồng ý.","q":"Khoa nên làm gì?","o":[["Nói một câu “Con muốn nuôi mèo” rồi chờ",0,"Một câu ngắn chưa đủ để ba mẹ thấy mình đã nghĩ kỹ. Thêm vài ý cụ thể sẽ thuyết phục hơn."],["Năn nỉ đến khi ba mẹ đồng ý",0,"Năn nỉ dễ làm ba mẹ mệt hơn là thấy thuyết phục. Lý lẽ rõ ràng sẽ tốt hơn."],["Chuẩn bị ba ý: ai chăm mèo, chi phí mỗi tháng, mình sẽ làm gì mỗi ngày; nói rõ rồi mời ba mẹ đặt câu hỏi",1,"Bài trình bày có cấu trúc và lường trước câu hỏi cho thấy mình nghiêm túc. Ba mẹ có thể vẫn cân nhắc, nhưng sẽ lắng nghe kỹ hơn."]]},{"k":1,"s":"Ngày mai Khoa thuyết trình 5 phút trước lớp về bảo vệ nguồn nước. Nghĩ đến cảnh cả lớp nhìn mình, tim Khoa đập nhanh và Khoa muốn xin đổi cho bạn khác.","q":"Khoa nên chuẩn bị thế nào?","o":[["Viết ba ý chính lên thẻ nhỏ, tập nói to trước gương và trước ba mẹ hai lần, trước khi lên thì thở chậm vài hơi",1,"Luyện tập thành tiếng và có thẻ gợi ý giúp giảm hồi hộp. Ai cũng run, khác nhau ở chỗ đã chuẩn bị."],["Học thuộc từng chữ để không quên",0,"Học thuộc từng chữ dễ bị “đứng hình” khi quên một câu. Nhớ ý chính thì linh hoạt hơn."],["Xin cô cho bạn khác làm thay",0,"Né lần này thì lần sau còn khó hơn. Hồi hộp là bình thường và luyện tập sẽ giúp."]]},{"k":2,"s":"Ở buổi sinh hoạt hè của phường, Khoa được nhờ giới thiệu ngắn về câu lạc bộ đọc sách trước khoảng 30 bạn và vài cô chú.","q":"Khoa nên làm gì?","o":[["Cúi đầu đọc nhanh từ giấy",0,"Cúi đầu đọc làm người nghe khó theo. Nhìn lên vài lần sẽ kết nối hơn."],["Mở đầu bằng một câu hỏi cho người nghe, nói ba ý ngắn, nhìn vào vài gương mặt thân thiện",1,"Câu hỏi mở đầu kéo người nghe vào. Nhìn những gương mặt thân thiện giúp mình bình tĩnh hơn."],["Nói đùa thật nhiều cho đỡ run",0,"Một câu vui có thể giúp, nhưng đùa nhiều dễ lạc ý. Giữ ý chính là trọng tâm."]]}],"qq":"Cách giảm hồi hộp khi thuyết trình hiệu quả nhất là…","qo":["Né thuyết trình","Nói thật nhanh cho xong","Luyện nói thành tiếng nhiều lần"],"qa":2,"mi":{"t":"Luyện thuyết trình ba lần trước khán giả gia đình","s":"Con chọn một bài nói 2–3 phút (bài ở lớp hoặc chủ đề con thích), luyện nói thành tiếng ba lần trước ba mẹ, mỗi lần nhận một góp ý và sửa.","lv":["Ba mẹ cùng con chuẩn bị dàn ý và tập thở chậm trước khi nói.","Ba mẹ nhắc một lần, con tự luyện và nói trước ba mẹ.","Con tự luyện, nói không cần nhìn giấy và kể ba mẹ cảm giác hồi hộp thay đổi thế nào qua ba lần."],"rw":"Cả nhà vỗ tay và ba mẹ kể lần đầu ba mẹ nói trước đám đông"}},{"t":"Khi cảm thấy bị bỏ rơi","sk":1,"m":"12 phút","cx":[{"k":0,"s":"Họ hàng về chơi, các anh chị lớn ngồi nói chuyện riêng, các em nhỏ chơi với nhau. Khoa ở giữa, không biết nhập vào nhóm nào.","q":"Khoa nên làm gì?","o":[["Chủ động hỏi các anh chị về chuyện họ đang nói, hoặc bày một trò chơi cho các em",1,"Chủ động kết nối giúp mình tìm được chỗ của mình. Mình còn có thể là cầu nối giữa hai nhóm."],["Ngồi một mình xem điện thoại cả buổi",0,"Màn hình che đi cảm giác lạc lõng nhưng không làm nó hết. Thử một bước nhỏ để tham gia."],["Than với mẹ là chán",0,"Kể với mẹ cảm giác của mình là tốt, nhưng hãy thử thêm một cách tham gia nữa."]]},{"k":1,"s":"Khoa thấy ảnh nhóm bạn thân đi ăn kem cuối tuần mà không rủ mình. Cả buổi tối Khoa buồn và nghĩ “chắc mọi người không thích mình nữa”.","q":"Khoa nên làm gì?","o":[["Nhắn vào nhóm: “Đi chơi không rủ thì thôi nhé!”",0,"Lời trách công khai dễ làm mọi người phòng thủ. Hỏi riêng một bạn sẽ nhẹ nhàng hơn."],["Im lặng và tự rút khỏi nhóm",0,"Rút đi chỉ vì một lần có thể làm mất những người bạn tốt. Hỏi trước rồi hãy quyết."],["Gọi tên cảm xúc “mình đang buồn và thấy bị bỏ rơi”, hôm sau nhẹ nhàng hỏi riêng một bạn thân",1,"Có thể chỉ là hiểu lầm, chẳng hạn nhóm quyết định đi vội. Hỏi nhẹ nhàng giúp mình biết sự thật thay vì đoán."]]},{"k":2,"s":"Ở câu lạc bộ cờ vua của nhà văn hóa, các bạn đã quen nhau từ trước và chơi theo cặp. Khoa mới đến, đứng nhìn.","q":"Khoa nên làm gì?","o":[["Về sớm vì không ai để ý",0,"Buổi đầu ai cũng bỡ ngỡ. Ở lại thêm và thử bắt chuyện nhé."],["Nhờ chú phụ trách giới thiệu, hoặc hỏi một bạn “Ván sau mình chơi cùng được không?”",1,"Người mới thấy lạc lõng là bình thường. Một lời hỏi ngắn là đủ để bắt đầu."],["Đứng chờ đến khi có người rủ",0,"Các bạn có thể không biết mình muốn chơi. Mình chủ động trước sẽ nhanh hơn."]]}],"qq":"Khi thấy bị bỏ rơi, điều nên tránh là…","qo":["Gọi tên cảm xúc","Kết luận ngay là mọi người ghét mình","Nhẹ nhàng hỏi bạn"],"qa":1,"mi":{"t":"Kiểm tra suy nghĩ “mọi người bỏ rơi mình”","s":"Con kể ba mẹ nghe một lần con thấy bị bỏ rơi, viết ra suy nghĩ lúc đó, tìm hai cách giải thích khác, và nghĩ một cách hỏi thăm bạn nhẹ nhàng.","lv":["Ba mẹ cùng con tìm các cách giải thích khác.","Ba mẹ nhắc một lần, con tự viết suy nghĩ và hai cách giải thích.","Con tự làm, chủ động rủ một bạn cùng làm việc gì đó tuần này và kể lại kết quả."],"rw":"Ba mẹ cùng con làm một việc con chọn trong một giờ"}},{"t":"Tự đi xe buýt đến trường","sk":3,"m":"13 phút","cx":[{"k":0,"s":"Trước tuần đầu tự đi xe buýt, ba mẹ muốn cùng Khoa lập kế hoạch. Khoa thấy hơi phiền vì nghĩ mình đã đủ lớn.","q":"Khoa nên làm gì?","o":[["Nói “con biết rồi” để khỏi bàn",0,"Kế hoạch kỹ không có nghĩa là ba mẹ không tin mình. Cùng bàn giúp cả nhà an tâm."],["Cùng ba mẹ thống nhất tuyến xe, giờ về trước 18h, cách xử lý nếu lỡ xe hay bị người lạ làm phiền, và số điện thoại cần gọi",1,"Có phương án cho tình huống bất ngờ giúp mình xử lý bình tĩnh. Tự lập đi cùng sự chuẩn bị."],["Để ba mẹ tự lo hết",0,"Đây là hành trình của mình, nên mình cần hiểu rõ kế hoạch. Cùng bàn bạc giúp mình nhớ lâu."]]},{"k":1,"s":"Tan học, Khoa đang chờ thì được báo chuyến xe buýt quen bị hỏng, chưa biết bao giờ có chuyến sau. Trời đã về chiều.","q":"Khoa nên làm gì?","o":[["Đi bộ về một mình theo đường tắt",0,"Đường tắt vắng người có thể không an toàn. Báo ba mẹ và chờ ở chỗ có người lớn quen."],["Nhận lời đi nhờ xe một người lạ",0,"Không bao giờ đi nhờ xe người lạ, dù họ có vẻ tử tế. Gọi ba mẹ là cách an toàn."],["Gọi hoặc nhắn ba mẹ ngay, quay lại cổng trường chờ ở chỗ có bác bảo vệ và thầy cô",1,"Khi kế hoạch thay đổi, báo ba mẹ và ở gần người lớn tin cậy là hai việc đầu tiên."]]},{"k":2,"s":"Năm nay ba mẹ đồng ý cho Khoa tự đi xe buýt đến trường. Ngày đầu tiên, Khoa mải xem điện thoại và suýt lỡ bến xuống.","q":"Khoa nên làm gì để tự đi an toàn?","o":[["Nhớ hai bến trước bến xuống, cất điện thoại khi gần đến, nhắn ba mẹ khi lên xe và khi đến trường",1,"Biết mốc đường và báo tin cho ba mẹ giúp mình tự lập mà gia đình vẫn yên tâm."],["Nhờ bác tài báo bến mỗi lần",0,"Bác tài có thể giúp lúc đầu, nhưng tự theo dõi đường đi mới là tự lập."],["Xin ba chở như cũ vì sợ",0,"Lo lắng là bình thường. Một vài quy tắc đơn giản sẽ giúp mình tự tin hơn."]]}],"qq":"Tự đi lại an toàn cần có…","qo":["Thỏa thuận báo tin với ba mẹ","Điện thoại đầy pin để giải trí","Đi nhanh nhất có thể"],"qa":0,"mi":{"t":"Lập kế hoạch đi lại an toàn và thỏa thuận báo tin","s":"Con cùng ba mẹ vẽ lộ trình quen thuộc (đến trường, nhà bà), ghi bến lên xuống, giờ đi, việc làm nếu lỡ bến, và thống nhất cách báo tin khi đến nơi; rồi đi thử cùng ba mẹ một lần.","lv":["Ba mẹ cùng con vẽ lộ trình và đi cùng con, ba mẹ chỉ các điểm cần chú ý.","Ba mẹ nhắc một lần, con tự lập kế hoạch và dẫn đường khi đi cùng ba mẹ.","Con tự lập kế hoạch, nói lại phương án dự phòng và chỉ đi một mình khi ba mẹ đã đồng ý, luôn báo tin đúng thỏa thuận."],"rw":"Con được chọn điểm đến cho chuyến đi chơi cả nhà"}},{"t":"Tự lo bài vở sau khi nghỉ ốm","sk":3,"m":"12 phút","cx":[{"k":0,"s":"Ba mẹ đi làm, Khoa nghỉ ốm ở nhà với bà. Đến chiều Khoa thấy đỡ hơn và có thời gian rảnh.","q":"Khoa nên làm gì?","o":[["Xem phim cả chiều vì đang được nghỉ",0,"Nghỉ ngơi là cần, nhưng nếu đã khỏe hơn thì đọc nhẹ một chút sẽ đỡ dồn bài về sau."],["Nhắn bạn hỏi bài hôm nay, đọc nhẹ 30 phút nếu thấy khỏe, vẫn nghỉ ngơi và uống thuốc đúng giờ bà nhắc",1,"Cân bằng giữa nghỉ ngơi và theo kịp bài là biết tự lo cho mình. Sức khỏe vẫn là ưu tiên."],["Cố học bù hết trong một chiều",0,"Đang ốm mà học quá sức dễ mệt thêm. Từng chút một là đủ."]]},{"k":1,"s":"Khoa nghỉ ốm ba ngày. Quay lại lớp, Khoa không biết các môn đã học đến đâu, trong khi tuần sau có bài kiểm tra.","q":"Khoa nên làm gì?","o":[["Mượn vở bạn chép lại từng chữ",0,"Chép thì có chữ nhưng chưa chắc hiểu. Hỏi thầy cô phần trọng tâm sẽ hiệu quả hơn."],["Chờ thầy cô nhắc mới làm",0,"Thầy cô có nhiều học sinh nên có thể không kịp nhắc. Mình hỏi trước sẽ chủ động hơn."],["Lập danh sách các môn bị lỡ, mượn vở một bạn ghi chép kỹ, gặp từng thầy cô hỏi phần trọng tâm và bài cần nộp",1,"Chủ động hỏi thầy cô là tự chịu trách nhiệm với việc học của mình. Danh sách giúp không sót môn nào."]]},{"k":2,"s":"Khoa vắng buổi sinh hoạt câu lạc bộ tiếng Anh ở nhà văn hóa vì ốm, đúng buổi các bạn chia vai cho vở kịch ngắn.","q":"Khoa nên làm gì?","o":[["Nhắn chị phụ trách câu lạc bộ hỏi vai còn trống, xin kịch bản và hẹn tập bù",1,"Chủ động liên lạc với người phụ trách là cách tự lo phần của mình khi vắng mặt."],["Thôi không tham gia vở kịch nữa",0,"Lỡ một buổi chưa phải là hết cơ hội. Hỏi lại người phụ trách trước đã."],["Đến buổi sau rồi tính",0,"Đến buổi sau có thể các bạn đã tập xong cảnh đầu. Hỏi trước giúp mình theo kịp."]]}],"qq":"Tự lập trong học tập nghĩa là…","qo":["Chủ động hỏi khi mình bị thiếu","Không bao giờ nhờ ai","Chờ người khác nhắc"],"qa":0,"mi":{"t":"Lập danh sách việc cần bù sau khi nghỉ học","s":"Con chọn một môn đang thấy hổng kiến thức (hoặc lần gần nhất con nghỉ), lập danh sách bài cần bù, nghĩ sẵn câu hỏi thầy cô hoặc bạn cùng lớp, và cho ba mẹ xem kế hoạch.","lv":["Ba mẹ cùng con xem vở và viết danh sách.","Ba mẹ nhắc một lần, con tự lập danh sách và soạn câu hỏi.","Con tự lập kế hoạch, tự hỏi thầy cô ở trường và báo lại ba mẹ đã bù được những gì."],"rw":"Ba mẹ đưa con đi ăn sáng ở quán con thích"}},{"t":"Cân nhắc khi có nhiều lựa chọn","sk":4,"m":"13 phút","cx":[{"k":0,"s":"Khoa được mời vào cả câu lạc bộ bóng chuyền lẫn câu lạc bộ khoa học của trường, cả hai đều sinh hoạt chiều thứ Ba và thứ Năm. Khoa thích cả hai và không biết chọn bên nào.","q":"Khoa nên quyết định thế nào?","o":[["Kẻ bảng hai cột theo các tiêu chí: học được gì, thời gian, bạn bè, sức khỏe; chấm điểm từng mục rồi bàn với ba mẹ",1,"Viết ra và chấm điểm giúp nhìn rõ điều mình coi trọng. Bàn với ba mẹ giúp thấy thêm góc nhìn."],["Chọn câu lạc bộ có bạn thân",0,"Bạn bè quan trọng nhưng chỉ là một tiêu chí. Hãy xem cả điều mình muốn học."],["Đăng ký cả hai rồi buổi nào đi bên nấy",0,"Mỗi bên đi một nửa thì không theo kịp bên nào. Chọn một và theo trọn sẽ tốt hơn."]]},{"k":1,"s":"Nhóm Khoa làm dự án tái chế với ba ý tưởng: làm chậu cây từ chai nhựa, làm đồ chơi từ bìa các-tông, hoặc làm thùng phân loại rác cho lớp. Chỉ còn hai tuần.","q":"Nhóm nên chọn thế nào?","o":[["Chọn ý tưởng nghe hay nhất",0,"Hay nhưng có làm kịp không? Cần xem cả thời gian và vật liệu."],["Làm cả ba cho chắc",0,"Ba việc trong hai tuần dễ thành cả ba đều dở dang. Chọn một và làm tốt sẽ hơn."],["Chấm mỗi ý theo: làm kịp trong hai tuần không, vật liệu có sẵn không, lớp dùng được lâu không; chọn ý điểm cao nhất",1,"Tiêu chí rõ ràng giúp nhóm chọn được ý vừa hay vừa làm được."]]},{"k":2,"s":"Khoa và hai bạn được ba mẹ cho đi thư viện quận chiều thứ Bảy. Xe buýt số 12 đi thẳng mất 40 phút, xe số 8 nhanh hơn 10 phút nhưng phải đổi tuyến.","q":"Nhóm nên chọn thế nào?","o":[["Chọn xe số 8 vì nhanh hơn",0,"Nhanh hơn 10 phút nhưng đổi tuyến thì dễ nhầm và phải chờ thêm. Xem thêm các tiêu chí khác."],["So sánh thời gian, độ dễ đi, khả năng lỡ chuyến; chọn xe số 12 đi thẳng cho chắc và báo ba mẹ tuyến đã chọn",1,"Nhanh nhất chưa chắc là tốt nhất. Lựa chọn đơn giản, an toàn thường đáng giá hơn vài phút."],["Để bạn nào biết đường quyết",0,"Hỏi bạn biết đường là tốt, nhưng cả nhóm nên hiểu vì sao chọn. Thử cùng nhau so sánh."]]}],"qq":"Khi phải chọn giữa hai lựa chọn tốt, nên…","qo":["Chọn theo bạn bè","So sánh theo tiêu chí mình coi trọng","Chọn cái đầu tiên"],"qa":1,"mi":{"t":"Chọn lựa bằng bảng tiêu chí","s":"Con chọn một quyết định thật con đang phân vân (môn năng khiếu, cách dùng chiều Chủ nhật), viết ba tiêu chí quan trọng với con, chấm điểm từng lựa chọn và trình bày kết quả với ba mẹ.","lv":["Ba mẹ cùng con chọn tiêu chí và kẻ bảng.","Ba mẹ nhắc một lần, con tự kẻ bảng và chấm điểm.","Con tự làm, giải thích vì sao tiêu chí này quan trọng hơn và hỏi ý ba mẹ trước khi quyết."],"rw":"Ba mẹ cùng con đi xe đạp hoặc đi bộ đường dài cuối tuần"}},{"t":"Khi số liệu đánh lừa mình","sk":5,"m":"13 phút","cx":[{"k":0,"s":"Ba đọc một bài báo: “Số người mua máy lọc không khí tăng 300%!” rồi định mua ngay.","q":"Khoa nên góp ý gì?","o":[["“Tăng 300% từ bao nhiêu hả ba? Mình xem nhà có cần thật không đã.”",1,"Phần trăm lớn có thể đến từ con số ban đầu rất nhỏ. Quyết định nên dựa trên nhu cầu của nhà mình."],["“Ai cũng mua thì mình cũng nên mua.”",0,"Nhiều người mua chưa chắc hợp với nhà mình. Kiểm tra nhu cầu thật trước."],["“Báo nói thì đúng rồi.”",0,"Con số có thể đúng nhưng cách hiểu có thể sai. Hãy hỏi thêm “so với cái gì”."]]},{"k":1,"s":"Bảo đưa cả lớp xem biểu đồ: “Học sinh mang chai nước riêng có điểm cao hơn, vậy mang chai nước giúp học giỏi hơn!” Cả lớp cười, nhưng vài bạn bắt đầu tin.","q":"Khoa nên đặt câu hỏi gì?","o":[["“Biểu đồ đẹp vậy chắc đúng.”",0,"Biểu đồ đẹp không đảm bảo kết luận đúng. Cần xem cách đọc số liệu."],["“Vậy mai tớ mang hai chai.”",0,"Câu đùa vui, và cũng cho thấy kết luận kia có vấn đề. Hỏi thêm sẽ rõ vì sao."],["“Hai thứ cùng xuất hiện chưa chắc cái này gây ra cái kia. Có khi bạn nào chuẩn bị kỹ thì vừa mang nước vừa học kỹ?”",1,"Đi cùng nhau chưa phải là nguyên nhân. Hỏi xem có yếu tố thứ ba nào không là tư duy phản biện."]]},{"k":2,"s":"Đi siêu thị cùng ba, em Vy thấy hộp bánh ghi “Ít đường hơn 30%” và reo lên: “Vậy ăn bao nhiêu cũng được!”","q":"Khoa nên giải thích thế nào?","o":[["“Đúng rồi, ít đường là tốt.”",0,"Ít hơn 30% so với loại cũ vẫn có thể nhiều đường. Cần xem con số thật trên bao bì."],["“Ít hơn so với cái gì? Mình cùng xem bảng thành phần, rồi hỏi ba nên ăn bao nhiêu nhé.”",1,"So sánh phải có mốc. Đọc nhãn và hỏi người lớn giúp em chọn đúng."],["“Đừng tin chữ trên hộp bánh.”",0,"Thông tin trên bao bì có ích nếu đọc đúng cách. Dạy em đọc nhãn sẽ tốt hơn."]]}],"qq":"Hai việc thường đi cùng nhau thì…","qo":["Chắc chắn cái này gây ra cái kia","Không liên quan gì đến nhau","Chưa chắc có quan hệ nguyên nhân"],"qa":2,"mi":{"t":"Tìm một ví dụ “đi cùng nhau nhưng không gây ra nhau”","s":"Con nghĩ ra hoặc tìm trên báo một ví dụ hai việc hay đi cùng nhau, giải thích cho ba mẹ vì sao chưa chắc việc này gây ra việc kia và yếu tố thứ ba có thể là gì.","lv":["Ba mẹ đưa ví dụ mẫu, con giải thích cùng ba mẹ.","Ba mẹ nhắc một lần, con tự tìm và giải thích một ví dụ.","Con tự tìm hai ví dụ, đố ba mẹ và kể cách kiểm tra xem có quan hệ nguyên nhân thật không."],"rw":"Con được làm “giáo sư” giảng bài cho cả nhà một buổi tối"}},{"t":"Khi thấy bạn bị bắt nạt trên mạng","sk":6,"m":"14 phút","cx":[{"k":0,"s":"Em Vy kể với Khoa rằng một bạn cùng lớp em hay nhắn tin chế giễu và dọa nghỉ chơi với Vy, còn dặn Vy đừng kể với ai.","q":"Khoa nên làm gì?","o":[["Bảo em mặc kệ, rồi sẽ qua",0,"Mặc kệ có khi làm em thấy một mình. Người lớn có thể giúp chấm dứt chuyện này."],["Khen em đã kể, nói rằng chuyện này không nên giữ bí mật, rồi cùng em kể với ba mẹ",1,"Kể ra là việc dũng cảm. Những bí mật làm mình buồn hay sợ luôn nên kể với người lớn tin cậy."],["Nhắn tin mắng bạn kia",0,"Trả đũa có thể làm chuyện căng thêm. Để ba mẹ và cô giáo của em xử lý."]]},{"k":1,"s":"Trong nhóm chat lớp, vài bạn liên tục chế ảnh và gọi Huy bằng biệt danh xấu. Huy không nói gì, nhưng mấy hôm nay toàn ngồi một mình.","q":"Khoa nên làm gì?","o":[["Chụp màn hình làm bằng chứng, báo cô chủ nhiệm và ba mẹ, nhắn riêng hỏi thăm Huy",1,"Bắt nạt qua mạng cần người lớn can thiệp. Một lời hỏi thăm riêng giúp Huy biết mình không một mình."],["Không tham gia, nhưng cũng im lặng vì sợ bị trêu theo",0,"Không tham gia là tốt, nhưng Huy vẫn một mình. Có những cách giúp an toàn mà không cần đối đầu."],["Thả biểu tượng cười để không bị lạc lõng",0,"Một biểu tượng cười cũng làm Huy thấy cả lớp đứng về phía kia. Hãy chọn không ủng hộ."]]},{"k":2,"s":"Ở câu lạc bộ cầu lông, Khoa nghe hai bạn bàn nhau lập nhóm chat riêng để chế giễu một bạn mới vì bạn ấy đánh còn vụng.","q":"Khoa nên làm gì?","o":[["Xin vào nhóm chat để biết họ nói gì",0,"Vào nhóm dễ bị cuốn theo. Báo người lớn phụ trách mới là cách giúp đúng."],["Coi như không nghe thấy",0,"Ngăn sớm dễ hơn xử lý sau. Một lời nhẹ nhàng và báo huấn luyện viên có thể thay đổi được chuyện này."],["Nói nhẹ nhàng: “Thôi đừng, bạn ấy mới tập mà”, kể với huấn luyện viên, và rủ bạn mới tập cùng",1,"Ngăn từ đầu, báo người lớn phụ trách và đứng cạnh người bị nhắm đến là ba việc một người tốt làm được."]]}],"qq":"Khi thấy bắt nạt trên mạng, điều quan trọng nhất là…","qo":["Báo người lớn tin cậy","Trả đũa thay bạn","Rời nhóm cho xong"],"qa":0,"mi":{"t":"Lập kế hoạch khi thấy bạn bị bắt nạt trên mạng","s":"Con cùng ba mẹ viết kế hoạch ba bước: không hùa theo, chụp lại bằng chứng, báo ba mẹ hoặc thầy cô; rồi soạn một tin nhắn riêng hỏi thăm bạn bị bắt nạt.","lv":["Ba mẹ cùng con viết các bước và tin nhắn hỏi thăm.","Ba mẹ nhắc một lần, con tự viết kế hoạch và đọc cho ba mẹ nghe.","Con tự viết kế hoạch, kể nếu đã từng thấy chuyện tương tự và cùng ba mẹ quyết định có cần báo thầy cô không."],"rw":"Ba mẹ nói với con điều ba mẹ tự hào nhất về con"}},{"t":"Dự án dài: chia thành từng mốc","sk":7,"m":"14 phút","cx":[{"k":0,"s":"Khoa đặt mục tiêu đọc xong một cuốn sách 300 trang trong tháng này. Đã giữa tháng mà Khoa mới đọc được 50 trang.","q":"Khoa nên làm gì?","o":[["Bỏ mục tiêu vì không kịp",0,"Còn nửa tháng vẫn đủ nếu chia lại. Thử tính số trang mỗi ngày."],["Đọc dồn vào cuối tháng",0,"Đọc dồn thì nhanh mệt và khó nhớ. Chia đều mỗi ngày nhẹ nhàng hơn."],["Tính lại: 250 trang chia 15 ngày là khoảng 17 trang mỗi ngày, đọc 20 phút trước khi ngủ và đánh dấu tiến độ",1,"Chia mục tiêu lớn thành phần nhỏ mỗi ngày giúp thấy nó làm được. Tính lại giữa chừng là bình thường."]]},{"k":1,"s":"Cô giao dự án Khoa học trong bốn tuần: chọn đề tài, làm thí nghiệm trồng đậu, ghi chép và viết báo cáo. Hai tuần đầu Khoa chưa làm gì vì nghĩ còn nhiều thời gian.","q":"Bây giờ Khoa nên làm gì?","o":[["Đổi sang đề tài làm một tối là xong",0,"Đổi đề tài vội có thể làm bài sơ sài. Thử chia mốc với thời gian còn lại trước."],["Gieo đậu ngay hôm nay, chia hai tuần còn lại thành mốc: ghi chép mỗi ngày, cuối tuần thứ nhất viết nháp, tuần thứ hai hoàn thiện; báo cô tiến độ",1,"Việc cần thời gian chờ thì làm trước. Mốc nhỏ có hạn rõ giúp dự án dài không bị dồn về cuối."],["Viết báo cáo trước, kết quả đoán sau",0,"Đoán kết quả là không trung thực với khoa học. Làm thật, ghi thật mới có giá trị."]]},{"k":2,"s":"Câu lạc bộ thiếu niên của phường giao nhóm Khoa chuẩn bị một tiết mục cho buổi văn nghệ sau sáu tuần, tập vào chiều Chủ nhật.","q":"Nhóm nên làm gì?","o":[["Đặt mốc: tuần 1–2 chọn bài và chia phần, tuần 3–4 tập từng phần, tuần 5 ghép lại, tuần 6 tổng duyệt; báo anh chị phụ trách tiến độ",1,"Mỗi mốc có mục tiêu rõ giúp cả nhóm biết mình đang ở đâu. Báo người phụ trách giúp được hỗ trợ kịp thời."],["Tập nhiều vào tuần cuối là được",0,"Một tuần không đủ để thuộc và nhuần nhuyễn. Chia mốc từ đầu sẽ đỡ áp lực."],["Mỗi buổi tập gì tùy hứng",0,"Không có mốc thì dễ tập đi tập lại phần đã thuộc và bỏ sót phần khó."]]}],"qq":"Với dự án dài, cách tránh dồn việc về cuối là…","qo":["Làm khi có hứng","Chia thành mốc nhỏ có hạn riêng","Bắt đầu ở tuần cuối"],"qa":1,"mi":{"t":"Chia một dự án thành các mốc nhỏ","s":"Con chọn một bài tập lớn hoặc mục tiêu dài (dự án, ôn thi, đọc một cuốn sách), chia thành 4–5 mốc có hạn riêng, viết lên lịch và cho ba mẹ xem.","lv":["Ba mẹ cùng con chia mốc và ghi lên lịch.","Ba mẹ nhắc một lần, con tự chia mốc và đặt hạn.","Con tự lập kế hoạch, hoàn thành mốc đầu tiên đúng hạn và báo cáo ba mẹ."],"rw":"Cả nhà đi picnic nhỏ ở công viên"}},{"t":"Những khoản chi nhỏ âm thầm trong ứng dụng","sk":8,"m":"13 phút","cx":[{"k":0,"s":"Khoa chơi một trò chơi miễn phí trên điện thoại của ba. Trò chơi liên tục mời mua “gói vật phẩm chỉ 20.000đ”, mà tài khoản của ba đã lưu sẵn thẻ thanh toán.","q":"Khoa nên làm gì?","o":[["Không bấm mua, nói với ba để ba cài mật khẩu cho mọi giao dịch",1,"Tiền trong ứng dụng là tiền thật. Nhờ ba cài khóa giúp cả nhà tránh mua nhầm."],["Mua một gói thôi, chỉ 20.000đ",0,"Mua bằng tài khoản của ba khi chưa hỏi là không đúng, dù số tiền nhỏ. Khoản nhỏ lặp lại cũng thành lớn."],["Mua rồi kể sau",0,"Kể sau thì vẫn là đã tiêu tiền khi chưa được phép. Hỏi trước luôn là cách đúng."]]},{"k":1,"s":"Một bạn cùng lớp khoe vừa đăng ký ứng dụng học từ vựng “miễn phí 7 ngày”, sau đó tự trừ tiền hằng tháng. Bạn rủ Khoa đăng ký theo.","q":"Khoa nên làm gì?","o":[["Đăng ký luôn, hết 7 ngày thì hủy",0,"Rất dễ quên hủy, và tài khoản đó thường là của ba mẹ. Hỏi ý ba mẹ trước."],["Mượn tài khoản của bạn dùng chung",0,"Dùng chung tài khoản có thể trái điều khoản và lộ thông tin. Có nhiều cách học từ vựng miễn phí khác."],["Hỏi ba mẹ trước, cùng đọc kỹ điều khoản tự gia hạn, và tìm xem có ứng dụng miễn phí hoàn toàn không",1,"“Miễn phí” có điều kiện thường kèm khoản trừ tiền tự động. Đọc kỹ và hỏi người lớn giúp tránh chi tiêu ngoài ý muốn."]]},{"k":2,"s":"Đi siêu thị cùng mẹ, Khoa thấy quầy thanh toán bày đầy kẹo và đồ chơi nhỏ giá 10.000–15.000đ. Khoa đã cầm lên ba món.","q":"Khoa nên làm gì?","o":[["Mua cả ba, rẻ mà",0,"Ba món rẻ cộng lại bằng một món mình thật sự thích. Cân nhắc lại một chút."],["Tự hỏi “mình có định mua món này khi vào siêu thị không?”, rồi để lại những món không định mua",1,"Quầy thanh toán được bày để mình mua theo cảm hứng. Một câu hỏi nhỏ giúp giữ tiền cho điều mình thật sự muốn."],["Xin mẹ trả hộ",0,"Mẹ có thể đồng ý, nhưng câu hỏi vẫn là mình có cần không. Thử tự quyết trước."]]}],"qq":"Tiền nạp trong trò chơi hay ứng dụng là…","qo":["Không phải tiền thật nên không sao","Tiền thật, cần hỏi ba mẹ","Miễn phí nếu ít"],"qa":1,"mi":{"t":"Kiểm tra mua hàng trong ứng dụng cùng ba mẹ","s":"Con cùng ba mẹ xem trên điện thoại hoặc máy tính bảng con dùng: có lưu thẻ thanh toán không, đã bật yêu cầu mật khẩu khi mua chưa; và con nói lại quy tắc: mọi khoản nạp tiền đều phải hỏi ba mẹ trước.","lv":["Ba mẹ cùng con kiểm tra và bật cài đặt, ba mẹ giải thích tiền ảo là tiền thật.","Ba mẹ nhắc một lần, con tự tìm cài đặt và chỉ cho ba mẹ.","Con tự tìm, giải thích cách trò chơi khiến người chơi nạp tiền và đề xuất quy tắc cho cả nhà."],"rw":"Cả nhà chơi một trò chơi dân gian con chọn"}},{"t":"Bất đồng một cách tôn trọng","sk":0,"m":"14 phút","cx":[{"k":0,"s":"Ba mẹ định cho Khoa học thêm Toán vào tối thứ Bảy. Khoa muốn giữ tối thứ Bảy để nghỉ ngơi và tập đàn.","q":"Khoa nên nói thế nào?","o":[["“Con hiểu ba mẹ muốn con tiến bộ môn Toán. Con xin giữ tối thứ Bảy để nghỉ, và con sẽ tự học thêm Toán 30 phút mỗi tối thứ Ba, thứ Năm. Ba mẹ thấy sao ạ?”",1,"Ghi nhận mong muốn của ba mẹ, nêu nhu cầu của mình và đưa phương án cụ thể. Hỏi ý kiến ở cuối mở ra cuộc trao đổi."],["“Con không học đâu!”",0,"Từ chối thẳng làm ba mẹ khó lắng nghe lý do của mình. Hãy đưa lý lẽ và đề xuất."],["Đồng ý cho xong rồi đi học uể oải",0,"Đồng ý mà không nói thật thì cả mình và ba mẹ đều thiệt. Trao đổi thật lòng sẽ tốt hơn."]]},{"k":1,"s":"Thầy Minh chấm bài luận của Khoa 6 điểm, nhận xét “chưa đủ dẫn chứng”. Khoa nghĩ mình đã có dẫn chứng ở đoạn ba và thấy điểm chưa công bằng.","q":"Khoa nên làm gì?","o":[["Nói to ngay trong lớp: “Thầy chấm sai rồi!”",0,"Nói trước lớp dễ làm thầy thấy bị chất vấn và câu chuyện trở nên căng thẳng."],["Im lặng nhưng trong lòng khó chịu mãi",0,"Không hỏi thì không biết thầy nghĩ gì. Hỏi một cách tôn trọng giúp mình hiểu và học được."],["Cuối giờ xin gặp thầy: “Em muốn hiểu rõ hơn. Ở đoạn ba em dùng ví dụ này, thầy thấy em cần bổ sung gì ạ?”",1,"Chọn đúng lúc, đưa dẫn chứng cụ thể và hỏi để hiểu. Dù điểm có đổi hay không, mình vẫn học được điều mới."]]},{"k":2,"s":"Ở buổi họp câu lạc bộ môi trường của phường, một cô chú đề xuất in tờ rơi phát cho từng nhà. Khoa nghĩ dùng bảng tin chung và nhóm tin nhắn khu phố sẽ đỡ tốn giấy hơn.","q":"Khoa nên làm gì?","o":[["Không nói vì mình nhỏ tuổi nhất",0,"Nhỏ tuổi không làm ý kiến kém giá trị. Nói lễ phép và có lý do là được."],["Giơ tay khi đến lượt: “Cháu có một ý khác ạ: mình dùng bảng tin và nhóm tin nhắn khu phố cho đỡ tốn giấy, còn tờ rơi chỉ in cho các nhà có ông bà lớn tuổi.”",1,"Chờ đến lượt, xưng hô lễ phép, đưa lý do và cách kết hợp. Người lớn thường trân trọng ý kiến có suy nghĩ."],["Ngắt lời: “Tờ rơi phí giấy lắm ạ!”",0,"Ngắt lời dễ làm người khác khó chịu dù ý mình đúng. Chờ đến lượt và đưa phương án thay thế."]]}],"qq":"Bất đồng một cách tôn trọng là…","qo":["Nêu quan điểm có lý do, đúng lúc, và lắng nghe","Nói to để được chú ý","Luôn nhường cho êm chuyện"],"qa":0,"mi":{"t":"Tập bất đồng tôn trọng với ba mẹ","s":"Con chọn một chuyện con thấy chưa hợp lý (một nhận xét, một quy định), chọn lúc mọi người bình tĩnh, nói quan điểm kèm lý do và lắng nghe ý ba mẹ trọn vẹn.","lv":["Ba mẹ cùng con viết ra quan điểm và lý do, rồi con nói.","Ba mẹ nhắc một lần, con tự nói “Con nghĩ khác vì…” và lắng nghe.","Con tự mở lời đúng lúc, nêu dẫn chứng, nhắc lại ý ba mẹ và cùng tìm cách giải quyết."],"rw":"Ba mẹ kể một lần ba mẹ không đồng ý với thầy cô hoặc sếp"}},{"t":"Khi quá tải và muốn bỏ cuộc","sk":1,"m":"13 phút","cx":[{"k":0,"s":"Tuần này Khoa có hai bài kiểm tra, buổi tập văn nghệ và bài thuyết trình nhóm. Tối thứ Ba, nhìn đống việc, Khoa thấy ngực nặng trĩu, muốn khóc và nghĩ “mình không làm nổi”.","q":"Khoa nên làm gì?","o":[["Dừng lại, uống nước, kể với ba mẹ cảm giác của mình, rồi cùng chọn một việc nhỏ làm trước",1,"Gọi tên cảm xúc và chia sẻ với người lớn giúp nhẹ lòng. Một việc nhỏ đầu tiên giúp mình lấy lại cảm giác làm chủ."],["Thức đến 2h sáng làm cho hết",0,"Thiếu ngủ làm mình mệt và căng thẳng hơn vào ngày mai. Ngủ đủ cũng là một phần của kế hoạch."],["Bỏ hết, mai tính",0,"Bỏ hết làm việc dồn sang ngày mai và càng nặng hơn. Chọn một việc nhỏ làm trước đã."]]},{"k":1,"s":"Giờ ra chơi, Linh ngồi một góc và nói với Khoa: “Tớ có ba bài phải nộp mà không biết bắt đầu từ đâu, tớ chán quá.”","q":"Khoa nên làm gì?","o":[["“Cố lên, ai cũng thế mà.”",0,"Lời động viên có ý tốt nhưng có thể làm bạn thấy không được hiểu. Nghe bạn trước đã."],["Ngồi nghe Linh kể, giúp bạn viết ba việc ra giấy và chọn việc có hạn sớm nhất; nếu Linh buồn nhiều ngày, gợi ý bạn nói với cô",1,"Lắng nghe và giúp bạn nhìn rõ công việc giúp bớt quá tải. Khi nỗi buồn kéo dài, người lớn tin cậy cần được biết."],["Làm hộ Linh một bài",0,"Làm hộ giải quyết hôm nay, nhưng bạn vẫn chưa biết cách xoay xở. Giúp bạn sắp xếp sẽ tốt hơn."]]},{"k":2,"s":"Ở buổi tập bơi, huấn luyện viên tăng bài tập lên gấp đôi. Giữa buổi, Khoa thấy mệt rã rời, bực bội và muốn bỏ về.","q":"Khoa nên làm gì?","o":[["Cố bơi tiếp dù rất mệt",0,"Khi quá mệt dưới nước, cố gắng có thể không an toàn. Báo huấn luyện viên luôn là đúng."],["Bỏ về không nói gì",0,"Bỏ đi không báo làm huấn luyện viên lo. Nói ra để được điều chỉnh bài tập."],["Lên bờ nghỉ, nói với huấn luyện viên mình đang quá sức, và hỏi có thể chia bài tập nhỏ hơn không",1,"Biết giới hạn của mình và nói ra là mạnh mẽ, không phải yếu đuối. Huấn luyện viên có thể giúp điều chỉnh."]]}],"qq":"Khi thấy quá tải, bước đầu tiên nên là…","qo":["Làm tất cả cùng lúc","Giấu cảm xúc","Dừng lại, chia sẻ, và chọn một việc nhỏ"],"qa":2,"mi":{"t":"Dỡ bớt gánh nặng: chia sẻ và chọn một việc nhỏ","s":"Khi thấy nhiều việc dồn lại, con ngồi với ba mẹ 10 phút, viết hết những việc đang lo ra giấy, nói con cảm thấy thế nào, rồi chọn một việc nhỏ làm ngay.","lv":["Ba mẹ cùng con viết danh sách và chọn việc nhỏ đầu tiên.","Ba mẹ nhắc một lần, con tự viết, tự nói cảm xúc và chọn việc.","Con tự nhận ra lúc quá tải, chủ động tìm ba mẹ chia sẻ và kể lại sau khi làm xong việc nhỏ con thấy thế nào."],"rw":"Ba mẹ mát xa vai cho con và cả nhà nghỉ ngơi một buổi tối"}},{"t":"Hòa giải khi hai bạn trong nhóm cãi nhau","sk":2,"m":"14 phút","cx":[{"k":0,"s":"Em Vy và em Bảo giành nhau chiếc máy tính bảng duy nhất trong nhà, em nào cũng nói đến lượt mình.","q":"Khoa nên làm gì?","o":[["Cất máy đi, không ai được dùng",0,"Cách này dừng được trận cãi, nhưng lần sau vẫn thế. Một quy tắc chung sẽ bền hơn."],["Cho em nhỏ hơn dùng trước",0,"Em lớn hơn sẽ thấy không công bằng. Quy tắc rõ ràng cho cả hai thì dễ chấp nhận."],["Cùng hai em đặt lịch: mỗi em 30 phút theo đồng hồ hẹn giờ, hôm nay em này trước thì mai em kia trước, rồi dán lịch lên tường",1,"Khi cả hai cùng đặt quy tắc, các em sẽ dễ giữ hơn. Đồng hồ hẹn giờ giúp không ai phải tranh cãi."]]},{"k":1,"s":"Trong buổi làm báo tường, Mai và Tí cãi nhau to vì Mai muốn vẽ tay, còn Tí muốn in ảnh. Cả nhóm im lặng, công việc dừng hẳn.","q":"Khoa nên làm gì?","o":[["Đứng về phía bạn thân của mình",0,"Chọn phe làm bạn kia thấy bị dồn ép và nhóm bị chia rẽ. Người hòa giải cần công bằng."],["Đề nghị nghỉ 5 phút, rồi mời từng bạn nói lý do mà không bị ngắt lời, tìm điểm chung (cả hai muốn báo đẹp) và gợi ý kết hợp: tiêu đề vẽ tay, ảnh in cho phần tin",1,"Hạ nhiệt trước, nghe đủ hai phía, tìm mục tiêu chung rồi mới tìm giải pháp. Khi bế tắc, có thể nhờ cô chủ nhiệm."],["Bảo cả hai im lặng để làm tiếp",0,"Im lặng không giải quyết được bất đồng, chỉ để dành nó đến lần sau."]]},{"k":2,"s":"Ở sân bóng khu phố, hai đội tranh cãi một quả bóng có vào hay không. Không có trọng tài, các bạn bắt đầu to tiếng.","q":"Khoa nên làm gì?","o":[["Đề nghị hai đội dừng lại, mỗi đội cử một bạn kể lại, không thống nhất được thì đá lại quả đó; nếu căng thẳng thì nhờ bác trông sân",1,"Một quy tắc đơn giản như “đá lại” giúp không bên nào mất mặt. Nhờ người lớn khi tình hình căng thẳng."],["Bỏ về cho đỡ phiền",0,"Rời đi thì trận đấu và tình bạn đều dang dở. Một đề nghị công bằng có thể cứu cả hai."],["Cãi to hơn cho đội mình",0,"To tiếng làm mọi chuyện căng thêm. Một người bình tĩnh có thể giúp cả sân hạ nhiệt."]]}],"qq":"Người hòa giải giỏi sẽ…","qo":["Chọn bên đúng","Giúp hai bên nghe
