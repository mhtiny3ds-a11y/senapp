gì?","o":[["Dậm chân, kêu: “Lâu quá!”",0,"Phải chờ thì thấy cáu là bình thường, nhưng dậm chân làm người khác khó chịu. Thử một trò chơi nhỏ nhé."],["Rủ mẹ chơi tìm đồ vật màu xanh trong phòng",1,"Tìm một việc nhỏ để làm giúp thời gian chờ trôi nhanh hơn và bớt cáu."],["Chạy chơi quanh phòng chờ",0,"Phòng chờ có nhiều người, chạy dễ va vào ai đó. Ngồi chơi trò nhẹ nhàng nhé."]]}],"qq":"Khi phải chờ lâu, con có thể…","qo":["Kêu ca liên tục","Chạy nhảy lung tung","Tìm một trò chơi nhỏ, nhẹ nhàng"],"qa":2,"mi":{"t":"Chơi một trò nhỏ khi phải chờ","s":"Lần tới phải chờ (chờ khám bệnh, chờ cơm, chờ xe) cùng ba mẹ, con chọn một trò nhẹ nhàng: đố màu sắc, đếm đồ vật màu đỏ, “Tôi thấy một thứ…”, và chờ không cáu kỉnh.","lv":["Ba mẹ gợi ý trò chơi và chơi cùng con.","Ba mẹ nhắc một lần, con tự chọn trò và chơi.","Con tự nghĩ ra trò chơi khi chờ và kể lại con đã giữ bình tĩnh thế nào."],"rw":"Dựng lều bằng chăn trong phòng khách"}},{"t":"Tự thử trước khi nhờ","sk":3,"m":"6 phút","cx":[{"k":0,"s":"Bin muốn ăn sữa chua nhưng nắp hơi chặt. Bin gọi ngay: “Mẹ ơi, mở giúp con!”","q":"Bin nên làm gì?","o":[["Chờ mẹ rảnh mới ăn",0,"Mẹ đang bận, con có thể tự thử trước. Không được thì mới nhờ."],["Bỏ đó không ăn nữa",0,"Bỏ cuộc thì không được ăn món mình thích. Thử thêm một lần nhé."],["Tìm mép nắp, bóc từ từ, chưa được mới nhờ mẹ",1,"Thử một cách khéo léo thường là được. Tự làm được, con sẽ thấy vui lắm."]]},{"k":1,"s":"Cô phát bài ghép hình. Bin mới nhìn đã giơ tay: “Cô ơi, khó quá, em không làm được.”","q":"Bin nên làm gì trước?","o":[["Nhìn bài của bạn để làm theo",0,"Làm theo bạn thì con không học được gì mới. Tự thử, con sẽ giỏi lên."],["Ngồi chờ cô đến làm hộ",0,"Cô làm hộ thì con mất niềm vui tự ghép xong. Thử trước đã nhé."],["Thử ghép các mảnh góc trước, chưa được thì mới hỏi cô",1,"Thử trước giúp con biết mình vướng ở đâu, khi hỏi cô sẽ giúp đúng chỗ."]]},{"k":2,"s":"Đi chơi cùng ba, Bin muốn vào khu vui chơi nhưng ngại nói với cô bán vé, định nhờ ba nói hộ.","q":"Bin nên làm gì?","o":[["Thôi không vào chơi nữa",0,"Ngại thì bỏ lỡ cuộc vui. Chỉ một câu thôi, con làm được."],["Ba đứng cạnh, Bin tự nói: “Cô ơi, cho con một vé ạ”",1,"Tự làm khi có người lớn ở cạnh giúp con tự tin hơn mỗi lần."],["Để ba nói hộ cho nhanh",0,"Ba làm hộ thì nhanh, nhưng con bỏ lỡ một lần tập. Thử nhé, ba ở ngay cạnh."]]}],"qq":"Khi gặp việc khó, con nên…","qo":["Bỏ cuộc ngay","Thử trước, vướng thì hỏi","Nhờ người khác làm hộ"],"qa":1,"mi":{"t":"Tự thử trước khi nhờ giúp","s":"Ba mẹ đưa con một câu đố hoặc bộ ghép hình hơi khó. Con tự thử ít nhất 5 phút (hoặc 3 cách) trước, vướng thì mới hỏi “Con đã thử…, giờ con kẹt ở…”.","lv":["Ba mẹ hẹn giờ 5 phút, ngồi cạnh động viên, con tự thử.","Ba mẹ nhắc một lần “Thử trước nhé”, con tự làm.","Con tự thử trước, tự nói được mình đã thử gì và kẹt ở đâu khi cần hỏi."],"rw":"Cùng ba mẹ gấp máy bay giấy và thi bay"}},{"t":"Chăm cây nhỏ của mình","sk":3,"m":"6 phút","cx":[{"k":0,"s":"Ba tặng Bin một chậu cây nhỏ, Bin hứa tự tưới mỗi sáng. Đến ngày thứ ba, Bin quên mất.","q":"Bin nên làm gì?","o":[["Tưới thật nhiều nước để bù",0,"Nhiều nước quá cây có thể bị úng. Tưới vừa đủ mỗi ngày là tốt nhất."],["Nhờ ba tưới luôn từ giờ",0,"Cây là việc con đã nhận. Một tờ giấy nhắc có thể giúp con nhớ."],["Tưới ngay, rồi dán tờ giấy nhắc cạnh chỗ đánh răng",1,"Quên thì sửa ngay và tìm cách nhắc mình. Tự nhớ việc của mình là tự lập."]]},{"k":1,"s":"Tuần này Bin trực nhật lau bảng. Giờ ra chơi Bin mải chơi nên bảng vẫn còn đầy chữ.","q":"Bin nên làm gì?","o":[["Lau bảng ngay khi nhớ ra, và hẹn mình lần sau lau trước khi ra chơi",1,"Sửa ngay và tự hẹn với chính mình giúp lần sau không quên."],["Nhờ bạn lau giúp",0,"Bạn cũng có việc của bạn. Con tự làm, cả lớp sẽ tin con."],["Đợi cô nhắc mới lau",0,"Việc của mình thì mình tự nhớ, không cần chờ nhắc. Lau ngay nhé."]]},{"k":2,"s":"Ở vườn rau chung của khu phố, mỗi bạn nhỏ nhận một luống để tưới, có người lớn trông. Hôm nay Bin mải chơi với các bạn.","q":"Bin nên làm gì?","o":[["Xin các bạn chờ một chút, tưới luống của mình rồi chơi tiếp",1,"Làm xong việc của mình rồi chơi thì ai cũng tin con."],["Để mai tưới bù",0,"Hôm nay cây khát rồi. Tưới ngay rồi chơi tiếp cũng được mà."],["Nhờ bạn bên cạnh tưới hộ",0,"Bạn đã có luống của bạn. Việc mình nhận thì mình làm nhé."]]}],"qq":"Khi đã nhận một việc, con nên…","qo":["Làm khi nào nhớ","Đưa cho người khác làm","Tìm cách tự nhớ và làm đều đặn"],"qa":2,"mi":{"t":"Tự tưới cây nhỏ mỗi sáng","s":"Con nhận chăm một chậu cây nhỏ trong nhà. Con dán một tranh nhắc nhở cạnh bàn chải, mỗi sáng dùng cốc nhỏ tưới cây và đánh dấu vào lịch trong 3 ngày.","lv":["Ba mẹ cùng con tưới và đánh dấu lịch mỗi sáng.","Ba mẹ nhắc một lần mỗi sáng, con tự tưới và đánh dấu.","Con tự nhớ nhờ tranh nhắc nhở, tưới đủ 3 ngày và cho ba mẹ xem lịch."],"rw":"Cả nhà cùng đi dạo công viên"}},{"t":"Thử cách khác khi chưa được","sk":4,"m":"6 phút","cx":[{"k":0,"s":"Bin gấp thuyền giấy thả vào chậu nước, nhưng thuyền cứ bị chìm. Bin đã gấp ba chiếc rồi.","q":"Bin nên làm gì?","o":[["Gấp lại y như cũ lần nữa",0,"Làm y như cũ thì dễ ra kết quả cũ. Thử đổi một điều xem sao."],["Bỏ cuộc, thuyền giấy chán lắm",0,"Chưa được không có nghĩa là không làm được. Thử một cách khác nhé."],["Đổi cách: thử giấy dày hơn hoặc gấp đáy thuyền rộng hơn",1,"Khi chưa được, đổi một điều rồi thử lại. Đó là cách giải quyết vấn đề."]]},{"k":1,"s":"Bin làm bài toán đếm hình, đếm ba lần ra ba số khác nhau.","q":"Bin nên làm gì?","o":[["Đổi cách đếm: đánh dấu từng hình đã đếm",1,"Đổi cách làm giúp con không đếm sót hay đếm trùng nữa."],["Chọn đại một số",0,"Đoán thì dễ sai. Thử cách đếm mới xem sao nhé."],["Đếm nhanh hơn",0,"Nhanh hơn thường dễ sót hơn. Chậm lại và đánh dấu từng hình nhé."]]},{"k":2,"s":"Ở sân chơi cùng ba, Bin tập sút bóng vào khung thành nhỏ mà toàn sút trượt.","q":"Bin nên làm gì?","o":[["Sút mạnh hơn nữa",0,"Sút mạnh chưa chắc đã trúng. Thử đổi cách sút xem sao."],["Hỏi ba mẹo, thử đứng gần hơn và sút bằng má trong bàn chân",1,"Đổi vị trí, đổi cách sút và hỏi người biết giúp con tiến bộ dần."],["Nói: “Khung thành này hỏng rồi”",0,"Đổ lỗi cho khung thành thì con không tiến bộ được. Thử cách khác nhé."]]}],"qq":"Khi thử nhiều lần chưa được, con nên…","qo":["Làm y hệt lần trước","Đổi một điều rồi thử lại","Bỏ cuộc"],"qa":1,"mi":{"t":"Đổi một điều rồi thử lại","s":"Cùng ba mẹ gấp một chiếc thuyền hoặc máy bay giấy và thử (thả vào chậu nước nông có ba mẹ ở cạnh, hoặc phóng bay). Nếu chưa được, con đổi một điều (giấy dày hơn, gấp chặt hơn) rồi thử lại.","lv":["Ba mẹ gợi ý một điều để đổi, con thử lại.","Ba mẹ nhắc một lần “Đổi một điều thử xem”, con tự chọn điều để đổi.","Con tự thử ít nhất hai cách khác nhau và kể cách nào hiệu quả hơn, vì sao."],"rw":"Một buổi dã ngoại nhỏ ngay trong nhà"}},{"t":"Nhiều bạn làm thì có đúng không?","sk":5,"m":"6 phút","cx":[{"k":0,"s":"Anh họ và em gái đều nói: “Ăn tối xong không cần đánh răng đâu.”","q":"Bin nên làm gì?","o":[["Vẫn đánh răng, vì biết đánh răng giúp răng khoẻ",1,"Hai người nói vậy không làm điều đó thành đúng. Con làm theo điều con biết là tốt."],["Bỏ đánh răng vì hai người cùng nói",0,"Nhiều người nói chưa chắc đã đúng. Răng khoẻ cần được đánh mỗi tối."],["Cãi nhau cho đến khi thắng",0,"Cãi nhau làm mọi người buồn. Con có thể nhẹ nhàng nói lý do của mình."]]},{"k":1,"s":"Giờ làm bài, vài bạn quanh Bin bắt đầu nói chuyện riêng. Một bạn rủ: “Cả bàn đều nói mà!”","q":"Bin nên làm gì?","o":[["Hét to: “Im hết đi!”",0,"La to cũng làm lớp ồn thêm. Nói nhỏ nhẹ sẽ tốt hơn."],["Nói nhỏ: “Mình làm bài xong rồi nói nhé”, và tiếp tục làm",1,"Không làm theo số đông khi chưa đúng lúc, và nhẹ nhàng rủ bạn cùng làm."],["Nói chuyện theo cho vui",0,"Cả bàn cùng nói thì bài vẫn chưa xong. Con chọn việc đúng nhé."]]},{"k":2,"s":"Ở công viên, ba mẹ ngồi gần đó. Mấy bạn nhỏ đang hái hoa trong bồn hoa và rủ Bin hái cùng.","q":"Bin nên làm gì?","o":[["La thật to cho cả công viên nghe",0,"Muốn bạn dừng thì nói nhẹ nhàng hoặc nhờ người lớn, không cần la to."],["Nói: “Hoa này để mọi người cùng ngắm”, rồi rủ các bạn chơi trò khác",1,"Tự nghĩ xem việc đó đúng hay sai, không chỉ làm theo số đông."],["Hái theo vì các bạn đều hái",0,"Nhiều người làm chưa chắc là đúng. Hoa ở công viên là để mọi người cùng ngắm."]]}],"qq":"Nhiều người cùng làm một việc thì…","qo":["Mình vẫn cần tự nghĩ xem đúng hay sai","Chắc chắn là đúng","Mình phải làm theo"],"qa":0,"mi":{"t":"Tự nghĩ đúng sai dù nhiều người làm","s":"Ba mẹ kể ba tình huống “nhiều bạn cùng làm” (hái hoa ở công viên, vứt rác xuống đất, xếp hàng ngay ngắn). Con tự nói việc đó đúng hay sai và mình sẽ làm gì.","lv":["Ba mẹ hỏi gợi ý từng tình huống, con trả lời đúng hay sai.","Ba mẹ nhắc một lần, con tự trả lời và nói mình sẽ làm gì.","Con tự trả lời, tập một câu từ chối lịch sự với bạn (“Tớ không hái đâu, hoa để mọi người ngắm”)."],"rw":"Cùng làm thiệp tặng ông bà"}},{"t":"Người lạ nhắn tin trên mạng","sk":6,"m":"7 phút","cx":[{"k":0,"s":"Bin đang dùng máy tính bảng của mẹ để học. Một người lạ nhắn: “Gửi cho chú ảnh và tên trường của con nhé.”","q":"Bin nên làm gì?","o":[["Không trả lời, đưa máy cho mẹ xem ngay",1,"Ảnh, tên, trường học là thông tin riêng. Báo ngay cho ba mẹ để ba mẹ giúp con."],["Gửi ảnh vì người đó nói chuyện rất dễ thương",0,"Người lạ trên mạng dù nói ngọt vẫn là người lạ. Không gửi gì, báo ba mẹ nhé."],["Trả lời “Con không gửi đâu”, rồi nói chuyện tiếp",0,"Không cần trả lời người lạ. Dừng lại và gọi ba mẹ là an toàn nhất."]]},{"k":1,"s":"Ở lớp, bạn Huy kể có người trên mạng hẹn gặp Huy ở cổng trường để tặng đồ chơi, và dặn đừng nói với ai.","q":"Bin nên làm gì?","o":[["Xin đi cùng để được quà",0,"Không bao giờ đi gặp người chỉ quen trên mạng. Báo cô ngay nhé."],["Giữ bí mật giúp Huy",0,"Bí mật làm bạn không an toàn thì phải nói với người lớn. Đó mới là giúp bạn."],["Nói với Huy: “Mình báo cô ngay nhé”, rồi cùng bạn đi gặp cô",1,"Người tốt không bắt trẻ giấu ba mẹ, thầy cô. Báo người lớn giúp bạn an toàn."]]},{"k":2,"s":"Ở quán ăn, ba mẹ ngồi cùng bàn. Trên máy tính bảng hiện lên dòng chữ: “Bạn được tặng quà! Nhập địa chỉ nhà để nhận.”","q":"Bin nên làm gì?","o":[["Bấm thử xem quà là gì",0,"Bấm vào điều lạ có thể không an toàn. Hỏi ba mẹ trước nhé."],["Không bấm gì, đưa máy cho ba mẹ xem",1,"Gặp thông báo lạ trên mạng, con dừng tay và hỏi ba mẹ trước."],["Nhập địa chỉ thật nhanh",0,"Địa chỉ nhà là thông tin riêng. Thông báo lạ có thể là lừa đấy."]]}],"qq":"Khi người lạ trên mạng xin ảnh hoặc thông tin, con nên…","qo":["Gửi nếu họ hứa tặng quà","Giữ bí mật","Không trả lời và báo ba mẹ"],"qa":2,"mi":{"t":"Người lạ trên mạng hỏi: không trả lời, báo ba mẹ","s":"Ba mẹ đóng vai “người lạ nhắn tin” bằng lời nói hoặc mẩu giấy (không dùng máy thật) xin ảnh, tên trường. Con tập: không trả lời, đặt máy xuống và gọi ngay “Ba/mẹ ơi, có người lạ nhắn tin!”.","lv":["Ba mẹ làm mẫu cách xử lý, con làm theo.","Ba mẹ nhắc một lần, con tự xử lý đúng ba việc: không trả lời, đặt máy, báo ba mẹ.","Con tự xử lý và kể ba thông tin con không bao giờ gửi cho người lạ (ảnh, tên trường, địa chỉ)."],"rw":"Một cái ôm thật chặt và lời khen trước cả nhà"}},{"t":"Việc lớn chia thành việc nhỏ","sk":7,"m":"7 phút","cx":[{"k":0,"s":"Bin muốn tự làm thiệp tặng ông nội: cắt, vẽ, tô màu và viết lời chúc. Bin thấy nhiều việc quá.","q":"Bin nên làm gì?","o":[["Làm tất cả cùng lúc",0,"Làm cùng lúc dễ rối và lem màu. Từng bước một sẽ đẹp hơn."],["Thôi, nhờ mẹ làm hộ",0,"Thiệp con tự làm có ý nghĩa nhất với ông. Chia nhỏ ra con sẽ làm được."],["Hôm nay cắt và vẽ, mai tô màu và viết lời chúc",1,"Chia thành các bước nhỏ, mỗi ngày một ít, tấm thiệp sẽ xong mà con không mệt."]]},{"k":1,"s":"Cô giao cả lớp đọc một quyển truyện 30 trang trong một tuần. Bin thấy dài quá nên chưa mở ra.","q":"Bin nên làm gì?","o":[["Để đến tối cuối cùng đọc một lần",0,"Dồn vào một tối thì mệt và dễ không kịp. Chia ra mỗi tối một ít nhé."],["Mỗi tối đọc 5 trang, kẹp thẻ đánh dấu chỗ đọc đến",1,"Chia việc lớn thành phần nhỏ mỗi ngày, việc khó cũng trở nên dễ."],["Chỉ đọc trang đầu và trang cuối",0,"Bỏ qua phần giữa thì con không hiểu câu chuyện. Đọc từng phần nhỏ sẽ dễ hơn."]]},{"k":2,"s":"Ở công viên, ba và Bin cùng các cô chú trong khu phố nhặt rác trên lối đi. Lối đi dài quá, Bin thấy nản.","q":"Bin nên làm gì?","o":[["Đòi về vì nhiều quá",0,"Nhìn cả đoạn dài thì ai cũng nản. Thử chia nhỏ ra nhé."],["Nhặt vội vài cái rồi đi chơi",0,"Nhặt vội thì nhanh nản. Đặt một đoạn ngắn cho mình sẽ dễ hơn."],["Cùng ba chọn một đoạn đến gốc cây, nhặt xong rồi chọn đoạn tiếp",1,"Chia đoạn đường dài thành từng phần ngắn, con sẽ thấy mình làm được nhiều."]]}],"qq":"Gặp việc lớn, con nên…","qo":["Làm hết một lần","Chia thành nhiều phần nhỏ","Để sau"],"qa":1,"mi":{"t":"Chia một quyển truyện thành nhiều phần nhỏ","s":"Cùng ba mẹ chọn một quyển truyện, chia thành các phần nhỏ (mỗi ngày vài trang) và đánh dấu bằng thẻ đánh dấu sách. Hôm nay con đọc xong phần đầu tiên và kể lại cho ba mẹ.","lv":["Ba mẹ cùng con chia phần và đọc cùng con phần đầu.","Ba mẹ nhắc một lần, con tự đọc phần của hôm nay.","Con tự chia phần, tự đọc đều mỗi ngày và kể lại sau mỗi phần."],"rw":"Ba mẹ đọc truyện bằng giọng các nhân vật"}},{"t":"Khi tiền không đủ mua hết","sk":8,"m":"7 phút","cx":[{"k":0,"s":"Bin còn 15 nghìn tiền tiêu vặt. Bin muốn mua bánh cho mình và một bông hoa nhỏ tặng mẹ, mỗi thứ 10 nghìn.","q":"Bin nên làm gì?","o":[["Chọn một thứ bây giờ, thứ kia để dành đến tuần sau",1,"Tiền chưa đủ thì chọn một thứ trước. Để dành thêm, tuần sau con mua được thứ còn lại."],["Mua bánh trước, hoa thì thôi",0,"Con vẫn có thể tặng hoa cho mẹ, chỉ cần để dành thêm một tuần."],["Lấy tiền trong ống heo của em",0,"Tiền của em là của em. Mình chọn trong tiền của mình nhé."]]},{"k":1,"s":"Ở hội chợ đồ dùng học tập của trường, Bin có 10 nghìn. Bin muốn ba thứ: bút chì, nhãn vở, móc khoá, mỗi thứ 5 nghìn.","q":"Bin nên làm gì?","o":[["Chọn hai thứ cần dùng nhất, món còn lại để lần sau",1,"Tiền chỉ đủ hai món thì chọn hai món cần nhất. Con đã biết cân nhắc rồi."],["Mua móc khoá đầu tiên vì đẹp nhất",0,"Đẹp thì vui, nhưng con nên nghĩ xem thứ nào cần dùng trước."],["Xin bạn 5 nghìn",0,"Xin tiền bạn không phải là cách hay. Chọn trong số tiền mình có nhé."]]},{"k":2,"s":"Ở hội sách cùng mẹ, Bin có 30 nghìn để dành. Bin thích một quyển truyện 25 nghìn và một hộp bút màu 20 nghìn.","q":"Bin nên làm gì?","o":[["Không mua gì vì buồn",0,"Buồn là bình thường, nhưng con vẫn có thể chọn một món. Món kia để lần sau nhé."],["Nghĩ xem mình cần cái nào hơn, chọn một, cái kia để dành mua sau",1,"Tiền có hạn thì phải chọn. Chọn thứ quan trọng hơn và để dành cho thứ còn lại."],["Xin mẹ thêm tiền để mua cả hai",0,"Mẹ có thể giúp, nhưng tập chọn trong số tiền mình có là kỹ năng quan trọng."]]}],"qq":"Khi tiền không đủ mua hết, con nên…","qo":["Chọn thứ quan trọng hơn, để dành cho thứ kia","Xin tiền của bạn","Khóc cho đến khi được mua"],"qa":0,"mi":{"t":"Chơi “chọn món quan trọng hơn” với tiền giả","s":"Ở nhà, ba mẹ đưa con một ít tiền giả bằng giấy và bày ba món đồ có giá trên nhãn, tổng giá nhiều hơn số tiền. Con chọn món quan trọng hơn, nói món còn lại sẽ để dành mua sau.","lv":["Ba mẹ cùng con đếm tiền và hỏi gợi ý “Món nào con cần hơn?”.","Ba mẹ nhắc một lần, con tự tính đủ hay không và tự chọn.","Con tự chọn, giải thích vì sao món đó quan trọng hơn và kế hoạch để dành cho món kia."],"rw":"Cùng ba mẹ gieo một hạt đậu vào cốc đất"}},{"t":"Xin lỗi cho thật lòng","sk":0,"m":"6 phút","cx":[{"k":0,"s":"Bin lỡ làm gãy cây bút sáp mà anh trai thích nhất. Anh rất buồn.","q":"Bin nên làm gì?","o":[["“Em xin lỗi anh vì làm gãy bút. Anh dùng tạm bút của em nhé?”",1,"Nói rõ mình làm sai gì và tìm cách bù lại giúp anh thấy con thật lòng."],["“Có cái bút thôi mà”",0,"Với anh, cây bút đó rất quý. Hiểu điều đó rồi xin lỗi nhé."],["Giấu bút gãy đi",0,"Giấu đi thì anh sẽ buồn hơn khi biết. Nói thật và xin lỗi là tốt nhất."]]},{"k":1,"s":"Bin chạy trong lớp và va vào bạn Mai, làm rơi hộp bút của bạn. Bút văng khắp nơi.","q":"Bin nên làm gì?","o":[["Nói: “Tại cậu đứng giữa đường”",0,"Đổ lỗi làm bạn buồn thêm. Mình nhận phần lỗi của mình nhé."],["Nói vội “Xin lỗi” rồi chạy tiếp",0,"Nói vội rồi đi thì bạn chưa thấy con thật lòng. Dừng lại giúp bạn nhé."],["Dừng lại, nhìn bạn: “Tớ xin lỗi vì chạy va vào cậu”, rồi nhặt bút giúp bạn",1,"Xin lỗi thật lòng là nói rõ mình sai gì và làm một việc để sửa."]]},{"k":2,"s":"Ở siêu thị cùng ba, Bin đẩy xe hàng va vào chân một bác.","q":"Bin nên làm gì?","o":[["Dừng lại: “Cháu xin lỗi bác, bác có đau không ạ?”, rồi đẩy xe chậm hơn",1,"Xin lỗi, hỏi thăm và sửa cách làm cho lần sau là lời xin lỗi trọn vẹn."],["Để ba xin lỗi hộ",0,"Ba có thể đứng cạnh, nhưng lời xin lỗi từ chính con sẽ thật lòng hơn."],["Quay đi như không biết",0,"Bác có thể bị đau. Dừng lại hỏi thăm mới là lịch sự."]]}],"qq":"Một lời xin lỗi thật lòng có…","qo":["Nói vội cho xong","Nói rõ mình sai gì và cách sửa","Lý do để đổ lỗi"],"qa":1,"mi":{"t":"Xin lỗi thật lòng: nói rõ lỗi và cách sửa","s":"Lần tới con lỡ làm phiền ai đó trong nhà (va vào em, làm rơi đồ), con nói đủ: “Con xin lỗi vì đã…, con sẽ…” và làm luôn việc sửa (nhặt đồ, hỏi thăm). Nếu chưa có, cả nhà đóng vai tập.","lv":["Ba mẹ nói mẫu lời xin lỗi, con nói theo và cùng sửa.","Ba mẹ nhắc một lần, con tự nói đủ ba phần: xin lỗi, lỗi gì, sửa thế nào.","Con tự xin lỗi đúng cách, tự sửa lỗi và kể lại người kia cảm thấy thế nào."],"rw":"Ba mẹ viết giấy khen dán lên tủ lạnh"}},{"t":"Hiểu cảm xúc của người khác","sk":1,"m":"6 phút","cx":[{"k":0,"s":"Ba đi làm về, ngồi im lặng, trông rất mệt. Bin đang muốn ba chơi đá bóng cùng.","q":"Bin nên làm gì?","o":[["Mang cho ba cốc nước và nói: “Ba nghỉ đi, lát mình chơi nhé”",1,"Nhận ra người khác đang mệt và quan tâm trước là biết hiểu cảm xúc của người khác."],["Giận vì ba không chơi",0,"Không phải ba không muốn chơi, chỉ là ba đang mệt. Con hiểu cho ba nhé."],["Kéo tay ba ra sân ngay",0,"Ba đang mệt, kéo ngay có thể làm ba khó chịu. Để ý cảm xúc của ba trước nhé."]]},{"k":1,"s":"Giờ ra chơi, bạn Nam ngồi một mình ở góc sân, mặt buồn thiu. Bình thường Nam rất hay cười.","q":"Bin nên làm gì?","o":[["Kệ bạn, chắc lát nữa bạn hết buồn",0,"Có khi bạn đang cần một người hỏi han. Một câu hỏi nhỏ cũng giúp được nhiều."],["Ngồi cạnh và hỏi nhẹ: “Cậu có ổn không? Tớ ngồi đây với cậu nhé”",1,"Để ý cảm xúc của bạn và hỏi thăm giúp bạn thấy mình không một mình."],["Trêu cho bạn cười: “Mặt cậu như quả táo héo!”",0,"Khi bạn buồn, bị trêu có thể buồn thêm. Hỏi thăm nhẹ nhàng sẽ tốt hơn."]]},{"k":2,"s":"Ở công viên, ba mẹ ngồi gần đó. Một bạn nhỏ hơn làm rơi que kem xuống đất và bắt đầu khóc.","q":"Bin nên làm gì?","o":[["Cười vì trông buồn cười",0,"Với bạn ấy, rơi kem là chuyện buồn. Cười sẽ làm bạn buồn hơn."],["Đi chỗ khác chơi",0,"Bạn đang buồn và có thể cần giúp. Một lời hỏi thăm cũng đủ ấm áp."],["Nói với bạn “Tiếc quá nhỉ”, rồi cùng ba mẹ mình giúp bạn tìm người lớn đi cùng",1,"Nói ra điều bạn đang cảm thấy và giúp bạn tìm người lớn là quan tâm đúng cách."]]}],"qq":"Khi thấy bạn buồn, con có thể…","qo":["Trêu cho bạn vui","Giả vờ không thấy","Hỏi thăm và ở bên bạn"],"qa":2,"mi":{"t":"Hỏi thăm khi thấy người nhà buồn","s":"Hôm nay con để ý nét mặt mọi người trong nhà. Khi thấy ai mệt hoặc buồn, con hỏi “Ba/mẹ có sao không ạ?”, ngồi cạnh và làm một việc nhỏ (rót cốc nước, ôm, vẽ tặng).","lv":["Ba mẹ giả vờ buồn, gợi ý câu hỏi, con hỏi và làm một việc nhỏ.","Ba mẹ nhắc một lần “Để ý xem ai đang buồn nhé”, con tự hỏi thăm.","Con tự nhận ra, tự hỏi thăm, ở bên người đó và kể lại người đó cảm thấy thế nào."],"rw":"Ba mẹ kể một chuyện hồi nhỏ của ba mẹ"}},{"t":"Cả nhóm cùng sửa sai","sk":2,"m":"7 phút","cx":[{"k":0,"s":"Bin và anh trai cùng gấp quần áo, rồi phát hiện đã cất nhầm áo của ba vào tủ của Bin.","q":"Bin nên làm gì?","o":[["“Tại anh đưa nhầm cho em”",0,"Đổ lỗi làm anh buồn mà áo vẫn chưa đúng chỗ. Cùng sửa nhé."],["Kệ, ba sẽ tự tìm",0,"Ba sẽ mất công tìm. Hai anh em sửa ngay chỉ mất một chút."],["“Mình cùng lấy ra, xếp lại đúng tủ nhé anh”",1,"Cùng nhau sửa lại thì nhanh và không ai bị trách."]]},{"k":1,"s":"Nhóm Bin làm xong mô hình ngôi nhà thì thấy cửa bị dán ngược. Các bạn bắt đầu đổ lỗi cho nhau.","q":"Bin nên nói gì?","o":[["“Tại Tí dán đấy!”",0,"Tìm người có lỗi không làm cửa đúng lại. Cả nhóm cùng sửa sẽ nhanh hơn."],["“Nhóm mình cùng làm mà. Mình cùng gỡ ra dán lại nhé!”",1,"Làm nhóm là cùng vui khi đúng và cùng sửa khi sai."],["Im lặng, để các bạn tự cãi nhau",0,"Im lặng thì cãi nhau vẫn tiếp tục. Một câu rủ cùng sửa có thể giúp cả nhóm."]]},{"k":2,"s":"Ở buổi dọn vệ sinh khu phố cùng ba mẹ, nhóm bạn nhỏ bỏ chai nhựa vào nhầm thùng rác.","q":"Bin nên làm gì?","o":[["Mặc kệ, chắc không sao",0,"Bỏ nhầm thùng thì chai khó được tái chế. Sửa lại chỉ mất một lát."],["Chỉ ra bạn nào bỏ nhầm",0,"Chỉ tay vào bạn làm bạn ngại. Cả nhóm cùng sửa sẽ vui hơn."],["Rủ cả nhóm: “Mình đeo găng, nhờ người lớn chỉ và cùng chuyển lại nhé!”",1,"Cả nhóm cùng nhận và cùng sửa thì việc chung lại hoàn thành tốt."]]}],"qq":"Khi nhóm làm sai, nên…","qo":["Cùng nhau sửa lại","Tìm người để trách","Bỏ dở"],"qa":0,"mi":{"t":"Cả nhà cùng sửa sai, không đổ lỗi","s":"Cả nhà cùng làm một mô hình nhỏ bằng giấy hoặc xếp hình. Khi có chỗ sai, con nói “Mình cùng sửa nhé!” thay vì hỏi “Ai làm sai?”, rồi cùng nhau sửa lại.","lv":["Ba mẹ cố ý làm sai một chỗ và nói mẫu câu, con nói theo và cùng sửa.","Ba mẹ nhắc một lần, con tự nói câu “Mình cùng sửa nhé!” khi thấy sai.","Con tự dẫn cả nhà sửa, chia việc sửa và kể lại cả nhà đã sửa ra sao."],"rw":"Dựng lều bằng chăn trong phòng khách"}},{"t":"Chia bánh cho đủ mọi người","sk":4,"m":"7 phút","cx":[{"k":0,"s":"Bà đưa Bin 6 cái bánh quy để chia cho Bin, em và hai bạn sang chơi.","q":"Bin nên chia thế nào?","o":[["Bin lấy ba cái, còn lại các bạn tự chia",0,"Mình lấy nhiều thì các bạn thấy không công bằng. Chia đều sẽ vui hơn."],["Mỗi người một cái, hai cái còn lại bẻ đôi để chia đều",1,"Đếm người, đếm bánh rồi tìm cách chia đều. Đó là giải quyết vấn đề!"],["Mỗi người hai cái, ai đến lượt sau thì không có",0,"Như vậy sẽ có bạn không có bánh. Thử tìm cách để ai cũng có phần nhé."]]},{"k":1,"s":"Nhóm Bin có 4 bạn và 10 tờ giấy màu để làm thủ công.","q":"Nhóm nên chia thế nào?","o":[["Đưa hết cho bạn khéo tay nhất",0,"Bạn nào cũng cần giấy để làm. Chia đều thì ai cũng được tham gia."],["Mỗi bạn 2 tờ, 2 tờ còn lại để chung cho ai cần thêm",1,"Chia đều phần chính, phần dư để chung là cách công bằng và linh hoạt."],["Bạn nào nhanh tay thì lấy nhiều",0,"Giành nhau thì sẽ có bạn không đủ giấy. Đếm rồi chia sẽ tốt hơn."]]},{"k":2,"s":"Đi dã ngoại cùng hai gia đình, có 9 quả quýt cho 6 bạn nhỏ.","q":"Nên chia thế nào cho công bằng?","o":[["Mỗi bạn một quả, 3 quả còn lại cho Bin vì Bin xách túi",0,"Xách túi là giúp đỡ, không phải để lấy thêm. Chia đều sẽ công bằng hơn."],["Để các bạn tự lấy",0,"Tự lấy thì có bạn được nhiều, bạn được ít. Đếm rồi chia giúp mọi người cùng vui."],["Mỗi bạn một quả, 3 quả còn lại bóc ra chia mỗi bạn nửa quả",1,"Chia phần dư thành phần nhỏ hơn giúp ai cũng có phần bằng nhau."]]}],"qq":"Muốn chia đều, việc đầu tiên là…","qo":["Lấy phần mình trước","Ai nhanh tay thì được","Đếm xem có bao nhiêu người và bao nhiêu phần"],"qa":2,"mi":{"t":"Chia đều đồ ăn cho cả nhà","s":"Trước bữa xế, ba mẹ đưa con một đĩa trái cây đã cắt sẵn hoặc bánh quy. Con đếm xem có bao nhiêu người và bao nhiêu phần, rồi chia đều cho mọi người.","lv":["Ba mẹ cùng con đếm người và đếm phần, con chia từng phần một.","Ba mẹ nhắc một lần “Đếm trước nhé”, con tự đếm và chia.","Con tự đếm, chia đều và nói cách xử lý nếu còn thừa phần (cắt đôi cùng ba mẹ, để dành)."],"rw":"Được chọn trò chơi cả nhà chơi cuối tuần"}}]},{"id":"9-12","label":"9–11 tuổi","hero":"An","lessons":[{"t":"Xin lỗi cho ra xin lỗi","sk":0,"m":"8 phút","cx":[{"k":0,"s":"An hứa trông em cho mẹ đi chợ nhưng mải xem điện thoại. Em ngã và khóc, mẹ về thấy vết xước trên trán em.","q":"An nên nói gì với mẹ?","o":[["“Tại em con hiếu động quá.”",0,"Đổ cho em là né phần việc mình đã nhận."],["“Con mải xem điện thoại nên không trông em. Con xin lỗi mẹ. Từ mai con để điện thoại ở phòng khi trông em.”",1,"Ở nhà, xin lỗi cũng cần ba phần: nhận đúng việc, xin lỗi, và nói cách để không lặp lại."],["“Con xin lỗi” rồi đi thẳng vào phòng",0,"Xin lỗi cụt lủn rồi bỏ đi làm mẹ không biết con đã hiểu chuyện gì xảy ra."]]},{"k":1,"s":"Giờ ra chơi, An lỡ làm gãy thước của bạn cùng bàn trước mặt nhiều người.","q":"An nên nói gì ngay lúc đó?","o":[["“Tại cái thước mỏng quá ấy chứ.”",0,"Đổ cho đồ vật là né trách nhiệm. Người bị hỏng đồ chỉ nghe thấy mình không có lỗi."],["“Mình làm gãy thước của cậu, xin lỗi cậu. Chiều nay mình đền cái mới.”",1,"Xin lỗi trực tiếp cần ba phần: nhận việc, nói lời xin lỗi, đề nghị cách sửa."],["Im lặng đặt thước xuống bàn rồi đi chỗ khác",0,"Bỏ đi giữa đám đông làm bạn kia vừa mất đồ vừa mất mặt."]]},{"k":2,"s":"An đá bóng ở sân chung cư làm vỡ chậu cây của một bác hàng xóm. Bác không có nhà, chỉ có mấy bạn nhỏ nhìn thấy.","q":"An nên làm gì?","o":[["Dọn mảnh vỡ rồi coi như không ai biết",0,"Dọn sạch chỉ xoá dấu vết, không xoá việc bác mất chậu cây. Người chịu thiệt vẫn là bác."],["Về kể với ba mẹ, rồi cùng ba mẹ sang xin lỗi và đề nghị đền chậu",1,"Ngoài đời, xin lỗi cần đến đúng người chịu thiệt — và ở tuổi này thì đi cùng ba mẹ."],["Nhờ các bạn đừng kể với ai",0,"Rủ người khác giữ bí mật là kéo thêm người vào việc của mình."]]}],"qq":"Một lời xin lỗi tốt cần có gì?","qo":["Nhận lỗi cụ thể và cách sửa","Giải thích thật dài","Một món quà"],"qa":0,"mi":{"t":"Một lời xin lỗi đủ ba phần","s":"Hôm nay con chọn một việc nhỏ con đã làm chưa đúng với ai đó trong nhà, rồi xin lỗi đủ ba phần: nhận lỗi cụ thể, nói người kia đã thấy thế nào, và cách con sửa. Ba mẹ nghe và xác nhận.","lv":["Ba mẹ nói mẫu một lời xin lỗi đủ ba phần, con nói theo với một việc của con.","Ba mẹ nhắc một lần, con tự xin lỗi một người trong nhà và làm luôn việc sửa sai.","Con tự nhận ra lỗi, tự xin lỗi đủ ba phần, sửa xong rồi kể lại cho ba mẹ nghe."],"rw":"Ba mẹ kể một lần hồi nhỏ ba mẹ phải xin lỗi"}},{"t":"Khi bị bạn trêu","sk":1,"m":"9 phút","cx":[{"k":0,"s":"Anh trai lấy biệt danh hồi bé của An ra trêu trước mặt cả nhà. Ai cũng cười, An thấy nghẹn ở cổ.","q":"An nên làm gì?","o":[["Bới một chuyện xấu hổ của anh ra kể lại",0,"Trả đũa biến bữa cơm thành cuộc so kè, và cả hai đều bị nhắc."],["Nói thẳng một câu: “Em không thích biệt danh đó, anh đừng gọi nữa.”",1,"Ở nhà thì nói thẳng được ngay, vì người trêu là người mình gặp mỗi ngày."],["Cười theo cho qua rồi giận âm ỉ",0,"Cười theo làm anh nghĩ An không sao, và lần sau vẫn gọi."]]},{"k":1,"s":"Giữa lớp, một nhóm bạn nhại giọng của An và cả lớp cười.","q":"An nên làm gì trong vài phút đầu?","o":[["Nhại lại giọng của một bạn trong nhóm đó",0,"Trả đũa làm trò đùa kéo dài, và cả lớp nghĩ đây là trò vui hai chiều."],["Giữ mặt bình thường, hết tiết nói riêng với một bạn trong nhóm",1,"Trước đám đông, phản ứng càng lớn thì trò đùa càng vui. Nói riêng thì khác hẳn."],["Báo cô ngay giữa tiết",0,"Cô sẽ xử lý, nhưng cả lớp thấy An báo cô — trò trêu thường quay lại mạnh hơn."]]},{"k":2,"s":"Ở sân bóng khu phố, mấy bạn lớn hơn trêu An là “chân gỗ” mỗi lần An sút hỏng. Hôm nào An đến cũng vậy.","q":"An nên làm gì?","o":[["Không ra sân nữa cho khỏi bị trêu",0,"Bỏ sân là An mất thứ mình thích vì hành vi của người khác."],["Nói một câu ngắn với bạn hay trêu nhất: “Trêu thế không vui, bỏ đi nhé” rồi vẫn ra sân",1,"Ngoài đời không có cô giáo ở cạnh, nên nói một câu rõ ràng rồi tiếp tục việc của mình là mạnh nhất."],["Trêu lại thật đau cho bạn ấy biết",0,"Trêu lại ở sân bóng dễ thành xô xát, và An trở thành một phần của chuyện đó."]]}],"qq":"Bước đầu khi cảm xúc đang dâng cao?","qo":["Tạm dừng rồi mới phản hồi","Đáp lại ngay cho nóng","Trêu lại bạn một câu"],"qa":0,"mi":{"t":"Tập “dừng – thở – chọn lời”","s":"Con và ba mẹ đóng vai: ba mẹ nói một câu trêu nhẹ, con dừng lại, hít thở chậm 3 lần rồi mới đáp bằng một câu bình tĩnh. Làm 3 lượt trong 10 phút.","lv":["Ba mẹ cùng hít thở với con, rồi gợi ý một câu đáp bình tĩnh để con nói theo.","Ba mẹ nhắc bước “dừng” một lần, con tự thở và tự nghĩ câu đáp.","Con tự làm đủ 3 lượt, rồi kể với ba mẹ một lần thật con đã dừng lại trước khi đáp."],"rw":"Cả nhà chơi một ván trò chơi con chọn"}},{"t":"Chia việc nhóm sao cho công bằng","sk":2,"m":"8 phút","cx":[{"k":0,"s":"Ba mẹ giao ba anh em dọn nhà đón khách. An làm gần hết, em út chạy quanh, anh hai xem điện thoại.","q":"An nên mở lời thế nào?","o":[["“Thôi để con làm hết cho nhanh.”",0,"Làm hết một lần thì lần sau mặc định là việc của An."],["“Còn ba việc: anh lau bàn, em nhặt đồ chơi, con rửa ly.”",1,"Chia việc thành phần cụ thể có tên người thì dễ nhận hơn kêu gọi chung chung."],["Mách ba mẹ ngay",0,"Mách trước khi thử chia việc thì lần sau anh em không muốn làm cùng An nữa."]]},{"k":1,"s":"Nhóm 4 bạn làm poster. Đến hôm nộp, An đã làm gần hết, một bạn chưa làm gì và cả nhóm cùng nhận điểm.","q":"An nên mở lời thế nào ở buổi họp nhóm?","o":[["“Tớ làm hết rồi, các cậu khỏi cần làm gì.”",0,"An giữ hoà khí nhưng dạy nhóm rằng không làm cũng không sao — lần sau lại vậy."],["Kẻ bảng: việc – ai làm – hạn nộp, rồi hỏi từng bạn nhận phần nào",1,"Việc rõ, tên rõ, hạn rõ. Công bằng đến từ bảng phân việc, không đến từ việc nhắc nhau."],["Nói với cô giáo là bạn đó không làm gì",0,"Có lúc cần báo cô, nhưng thử nói trong nhóm trước — nhóm mới học được cách làm việc."]]},{"k":2,"s":"Nhóm bạn trong khu rủ nhau dọn sân chơi cuối tuần. Đến hẹn chỉ có An và một bạn nữa xuất hiện.","q":"An nên làm gì?","o":[["Hai người làm hết cho xong",0,"Làm hết thì sân sạch hôm nay, nhưng lần sau vẫn chỉ hai người đến."],["Làm một phần vừa sức, chụp ảnh phần còn lại và hẹn lại cụ thể: “Chủ nhật 8h, ai làm góc nào”",1,"Ngoài đời không ai chấm điểm nhóm, nên việc giữ nhóm là hẹn lại thật cụ thể và chia rõ từng phần."],["Nhắc cả nhóm là mọi người thất hứa",0,"Trách cả nhóm làm mọi người tự ái, và lần sau càng ít người đến."]]}],"qq":"Điều gì giúp nhóm làm việc công bằng nhất?","qo":["Bảng việc có tên và hạn","Người giỏi nhất làm hết","Ai rảnh thì làm"],"qa":0,"mi":{"t":"Bảng việc nhà có tên và hạn","s":"Con cùng cả nhà lập bảng việc nhà cho cuối tuần: mỗi việc ghi tên người làm và hạn xong. Cuối tuần con cùng ba mẹ đánh dấu việc đã xong.","lv":["Ba mẹ kẻ bảng, con đọc tên việc và cùng chia sao cho công bằng.","Ba mẹ nhắc một lần, con tự kẻ bảng, hỏi từng người và ghi tên, hạn.","Con tự lập bảng, dán lên chỗ dễ thấy, tự theo dõi và báo cả nhà việc nào còn thiếu."],"rw":"Con được chọn món cả nhà nấu bữa tối Chủ nhật"}},{"t":"Lên kế hoạch tuần với bảng giờ","sk":7,"m":"10 phút","cx":[{"k":0,"s":"Tuần này An có bài kiểm tra Toán, buổi bơi, sinh nhật bạn và một video muốn dựng. Tối nào An cũng thức khuya mà vẫn chưa xong gì.","q":"An nên bắt đầu từ đâu?","o":[["Làm việc thích nhất trước: dựng video",0,"Việc thích ăn hết buổi tối, còn bài kiểm tra vẫn chờ ở đó."],["Ghi hết ra, đánh dấu việc có hạn cố định, rồi xếp việc còn lại vào ô trống",1,"Việc có hạn cố định xếp trước, việc linh hoạt xếp sau. Kế hoạch là bản đồ, không phải lời hứa."],["Cứ làm tới đâu tính tới đó",0,"Không có bản đồ thì việc gấp nhất luôn đến muộn nhất."]]},{"k":1,"s":"Cô giao ba bài tập lớn cùng hạn thứ Sáu. An còn hai buổi học thêm trong tuần.","q":"An nên bắt đầu từ đâu?","o":[["Làm bài dễ nhất trước cho có động lực",0,"Bài dễ làm mình thấy đã làm được việc, nhưng bài nặng nhất vẫn nằm nguyên đến tối thứ Năm."],["Ước lượng mỗi bài mất bao lâu, rồi đặt bài nặng nhất vào ngày trống nhất",1,"Xếp lịch bắt đầu bằng ước lượng thời gian, rồi mới ghép vào chỗ trống thật sự có."],["Để cả ba bài vào tối thứ Năm",0,"Dồn vào một tối thì chỉ cần một việc bất ngờ là mất cả ba bài."]]},{"k":2,"s":"An nhận lời sinh nhật bạn lúc 4h chiều Chủ nhật, rồi lại hứa đi tập bóng cũng 4h chiều hôm đó.","q":"An nên làm gì?","o":[["Im lặng rồi đến muộn cả hai chỗ",0,"Không báo trước làm cả hai bên phải chờ. Trùng lịch là chuyện thường, giấu mới là vấn đề."],["Gọi ngay cho bên nhận lời sau: xin lỗi, nói rõ mình trùng giờ và hẹn một dịp khác",1,"Báo sớm và đề nghị phương án thay thế thì lời từ chối vẫn giữ được quan hệ."],["Nhờ một bạn báo hộ",0,"Lời hẹn của mình thì mình báo. Nhờ người khác làm giảm mức tin cậy."]]}],"qq":"Xếp lịch nên bắt đầu bằng gì?","qo":["Những việc có hạn cố định","Việc mình thích nhất","Việc nhanh nhất"],"qa":0,"mi":{"t":"Lập bảng giờ cho tuần tới","s":"Con viết bảng giờ cho 7 ngày tới: ghi trước các việc có hạn cố định (kiểm tra, học thêm, lịch gia đình), rồi mới xếp việc khác. Cho ba mẹ xem bảng và giờ đi ngủ.","lv":["Ba mẹ ngồi cùng, con kể các việc trong tuần và ba mẹ giúp xếp việc có hạn trước.","Ba mẹ nhắc một lần, con tự lập bảng và nhờ ba mẹ xem lại.","Con tự lập bảng, tự theo trong 3 ngày và kể lại việc nào đúng giờ, việc nào cần đổi."],"rw":"Cả nhà cùng đi dạo công viên cuối tuần"}},{"t":"Tiền lì xì tiêu thế nào?","sk":8,"m":"10 phút","cx":[{"k":0,"s":"An được 600.000đ lì xì. Bạn cùng lớp vừa mua skin game mới, An cũng rất muốn. Nhưng An còn muốn mua bộ màu vẽ 300.000đ.","q":"An chia tiền thế nào là hợp lý?","o":[["Mua skin ngay cho kịp bạn bè",0,"Vui 10 phút, rồi tiền hết trước khi mua được món mình thật sự muốn."],["Chia ba phần: 300k tiết kiệm cho bộ màu, 200k tiêu, 100k cho việc tốt",1,"Tiêu – tiết kiệm – cho. Ba hộp giúp An mua được món lớn mà vẫn có tiền cho hôm nay."],["Gửi mẹ giữ hết, không tiêu gì",0,"An toàn nhưng An chưa luyện được việc tự quyết định. Tự chia là bài học."]]},{"k":1,"s":"Bạn thân rủ An góp tiền mua quà sinh nhật chung cho một bạn trong lớp. Số tiền lớn hơn An dự tính.","q":"An nên trả lời thế nào?","o":[["Góp đủ như bạn nói cho khỏi ngại",0,"Góp quá khả năng một lần thì tháng đó An hụt tiền cho việc khác đã hẹn."],["Nói thật số mình góp được và đề nghị làm thêm phần thiệp hoặc trang trí",1,"Nói rõ mức của mình rồi bù bằng công sức. Đó là giữ ngân sách mà không mất bạn."],["Nói mình hết tiền rồi lảng đi",0,"Nói tránh thì bạn không biết thật hay không, và lần sau vẫn hỏi con số cũ."]]},{"k":2,"s":"Ở hội sách, món An thích đang giảm giá, chỉ còn hôm nay. An mang theo đúng phần tiền tiêu của mình.","q":"An nên làm gì trước khi trả tiền?","o":[["Mua ngay kẻo mai hết giảm",0,"Biển “chỉ hôm nay” được đặt ra để mình không kịp suy nghĩ. Đó là cách bán hàng."],["Đếm lại phần tiền tiêu còn bao nhiêu, và tự hỏi tuần trước mình có muốn món này không",1,"Hai câu hỏi: mình còn bao nhiêu, và mình có muốn nó từ trước không. Trả lời được thì mua mới yên tâm."],["Mượn tiền bạn đi cùng rồi trả sau",0,"Mượn để mua món không có trong dự tính là bắt đầu một khoản nợ nhỏ mà khó nhớ."]]}],"qq":"Ba hộp tiền của con là gì?","qo":["Tiêu – Tiết kiệm – Cho","Tiêu – Tiêu – Tiêu","Tiết kiệm – Mua game – Mua kẹo"],"qa":0,"mi":{"t":"Làm ba hộp Tiêu – Tiết kiệm – Cho","s":"Con cùng ba mẹ dán nhãn ba hộp (hoặc phong bì) Tiêu – Tiết kiệm – Cho, chia tiền tiêu vặt hiện có vào ba hộp và nói lý do. Tiền vẫn để ở nhà, ba mẹ cùng giữ.","lv":["Ba mẹ gợi ý cách chia, con đếm và bỏ tiền vào từng hộp.","Ba mẹ nhắc một lần, con tự quyết cách chia và giải thích cho ba mẹ.","Con tự chia, tự viết lên mỗi hộp mình để dành cho việc gì và kể lại kế hoạch."],"rw":"Con được chọn truyện đọc tối nay"}},{"t":"Lắng nghe không ngắt lời","sk":0,"m":"8 phút","cx":[{"k":0,"s":"Bà đang kể chuyện hồi nhỏ đi bộ rất xa đến trường. An đã nghe chuyện này rồi nên cứ chen vào kể phần kết thay bà.","q":"An nên làm gì?","o":[["Nói “Bà kể chuyện này rồi mà!” để bà kể chuyện khác",0,"Câu này dễ làm bà hụt hẫng. Nghe lại chuyện cũ cũng là cách cho bà thấy con quý thời gian bên bà."],["Để bà kể hết, nhìn bà và hỏi thêm một chi tiết mới",1,"Lắng nghe là chờ người kia nói xong rồi hỏi thêm để hiểu sâu hơn. Biết đâu con lại nghe được điều chưa từng biết."],["Vừa nghe vừa xem điện thoại",0,"Người kể nhận ra ngay khi mình chỉ được nghe nửa vời. Cất điện thoại đi thì câu chuyện mới thành cuộc trò chuyện."]]},{"k":1,"s":"Trong giờ thảo luận nhóm, Mai đang trình bày ý tưởng làm mô hình. An nghĩ ra một ý khác và rất muốn nói ngay.","q":"An nên làm gì?","o":[["Ngắt lời Mai: “Khoan, nghe tớ này!”",0,"Ngắt lời làm Mai thấy ý mình không quan trọng. Ý của An vẫn còn nguyên sau vài giây chờ."],["Nói nhỏ ý của mình với bạn ngồi cạnh",0,"Thì thầm làm hai bạn cùng lỡ phần Mai đang nói. Chờ đến lượt rồi nói cho cả nhóm cùng nghe nhé."],["Ghi nhanh ý của mình ra giấy, chờ Mai nói xong rồi giơ tay",1,"Ghi lại thì không sợ quên, còn Mai được nói trọn ý. Ai cũng muốn được nghe đến hết."]]},{"k":2,"s":"Ở tiệm sửa xe gần nhà, chú thợ đang giải thích cho ba và An vì sao xe đạp của An hay tuột xích. An sốt ruột muốn về.","q":"An nên làm gì?","o":[["Nghe chú nói hết, rồi hỏi: “Con tự kiểm tra xích ở nhà thế nào ạ?”",1,"Nghe hết rồi hỏi đúng điều mình cần, con vừa lễ phép vừa học được một việc hữu ích."],["Đứng nghịch điện thoại, để ba nghe là đủ",0,"Xe là của con, nên nghe trực tiếp sẽ giúp con tự chăm xe lần sau. Chỉ vài phút thôi mà."],["Nói “Dạ con biết rồi” dù chưa hiểu",0,"Nói biết rồi để cắt ngang thì lần sau xích tuột con vẫn lúng túng. Hỏi lại không có gì xấu hổ."]]}],"qq":"Lắng nghe tốt nghĩa là…","qo":["Nghĩ sẵn câu đáp khi người kia đang nói","Gật đầu thật nhanh cho xong","Chờ người kia nói hết rồi hỏi thêm"],"qa":2,"mi":{"t":"Nghe ông bà hoặc ba mẹ kể hết một câu chuyện","s":"Trong bữa tối, con mời ông bà hoặc ba mẹ kể một chuyện ngày xưa. Con nghe đến hết, không chen ngang, rồi hỏi thêm ít nhất một câu.","lv":["Ba mẹ nhắc con nhìn người kể và gợi ý một câu hỏi để con hỏi.","Ba mẹ nhắc một lần trước bữa ăn, con tự nghe hết và tự nghĩ câu hỏi.","Con tự mời người kể, nghe không ngắt lời và kể lại cho ba mẹ một chi tiết mới con biết."],"rw":"Ông bà hoặc ba mẹ kể thêm một chuyện hồi nhỏ"}},{"t":"Tự gấp và cất quần áo của mình","sk":3,"m":"8 phút","cx":[{"k":0,"s":"Mẹ để rổ quần áo đã giặt khô trên giường An từ sáng. Đến tối, rổ đồ vẫn nằm đó và An bới tìm áo đồng phục cho ngày mai.","q":"An nên làm gì?","o":[["Rút áo đồng phục ra, đẩy rổ xuống sàn",0,"Lấy được áo thì xong việc tối nay, nhưng sáng mai lại phải bới tiếp. Rổ đồ không tự gọn được đâu."],["Nhờ mẹ gấp giúp vì con bận học",0,"Mẹ cũng có nhiều việc như con. Thử chia nhỏ: gấp đồ trong lúc nghỉ giữa hai bài học."],["Gấp từng loại, xếp vào ngăn của mình, để sẵn bộ đồng phục cho mai",1,"Mười phút gấp đồ đổi lấy cả tuần không phải tìm. Tự lo đồ của mình cũng là đỡ một việc cho mẹ."]]},{"k":1,"s":"Cuối giờ thể dục, áo khoác và khăn của cả lớp nằm lẫn trên ghế đá. An không nhớ mình để áo ở đâu.","q":"An nên làm gì?","o":[["Lấy đại một cái giống giống rồi về",0,"Cầm nhầm áo bạn sẽ làm hai người cùng mất đồ. Tìm kỹ một chút sẽ đỡ rắc rối hơn."],["Tìm lại, rồi từ lần sau gấp áo để chung một chỗ với cặp",1,"Có một chỗ cố định cho đồ của mình thì không phải nhớ, không phải tìm."],["Nhờ cô tìm hộ",0,"Cô có cả lớp phải lo. Con tự tìm trước, nếu thật sự không thấy hãy báo cô."]]},{"k":2,"s":"Cả nhà về quê chơi hai ngày. Sáng về, đồ của An vương vãi khắp phòng nhà bà, còn ba đang chờ ở xe.","q":"An nên làm gì?","o":[["Gấp nhanh từng món vào túi, kiểm tra gầm giường, rồi chào bà",1,"Gọn gàng và kiểm tra lại giúp con không để quên đồ, bà cũng không phải dọn hộ."],["Nhét hết vào túi thật nhanh",0,"Nhét vội dễ bỏ sót đồ và về nhà lại phải giặt lại cả túi. Gấp nhanh từng món cũng chỉ thêm vài phút."],["Để đó, bà dọn sau cũng được",0,"Bà đã chăm cả nhà hai ngày rồi. Tự dọn đồ của mình là cách cảm ơn bà dễ nhất."]]}],"qq":"Đồ dùng của mình nên do ai sắp xếp?","qo":["Người nào rảnh thì làm","Chính mình, theo cách mình dễ tìm","Mẹ, vì mẹ làm nhanh hơn"],"qa":1,"mi":{"t":"Tự gấp và cất rổ quần áo của mình","s":"Khi có quần áo đã giặt khô, con tự gấp và cất vào tủ theo cách con dễ tìm. Làm xong mời ba mẹ mở tủ xem.","lv":["Ba mẹ gấp mẫu từng loại áo, quần, con gấp theo bên cạnh.","Ba mẹ nhắc một lần, con tự gấp và cất hết trước giờ ăn tối.","Con tự thấy rổ đồ, tự gấp, xếp theo ngăn và chuẩn bị sẵn đồng phục cho ngày mai."],"rw":"Một cái ôm thật chặt và lời khen trước cả nhà"}},{"t":"Quên đồ ở nhà thì làm sao","sk":4,"m":"9 phút","cx":[{"k":0,"s":"Buổi sáng, An đã ra cửa thì nhớ ra quên chai nước và khăn cho giờ bơi chiều nay. Mẹ đang chờ chở đi học.","q":"An nên làm gì?","o":[["Thôi kệ, chiều không bơi cũng được",0,"Bỏ buổi bơi chỉ vì quên đồ thì tiếc lắm. Một phút quay lại là đủ."],["Trách mẹ sao không nhắc con",0,"Đồ của con thì con nhớ. Một tờ giấy nhắc sẽ giúp con hơn là trách mẹ."],["Xin mẹ chờ một phút, chạy vào lấy, rồi dán tờ giấy nhắc ở cửa",1,"Sửa ngay việc hôm nay và thêm một cách nhắc cho ngày mai. Đó là giải quyết vấn đề tận gốc."]]},{"k":1,"s":"Đến lớp, An mới phát hiện quên vở bài tập Toán ở nhà. Mười phút nữa cô sẽ kiểm tra bài.","q":"An nên làm gì?","o":[["Chủ động báo cô trước giờ kiểm tra và hứa mang vở vào ngày mai",1,"Báo trước cho thấy con có trách nhiệm. Rồi tối nay đặt vở vào cặp ngay khi làm xong."],["Mượn vở bạn chép lại thật nhanh",0,"Chép bài bạn thì không còn là bài của mình nữa. Nói thật với cô sẽ nhẹ lòng hơn."],["Im lặng, mong cô không gọi tên mình",0,"Trốn tránh làm con lo suốt buổi học. Bị phát hiện còn khó giải thích hơn tự nói ra."]]},{"k":2,"s":"An đi sinh nhật bạn ở nhà văn hoá khu phố, ba đưa đến cửa rồi về. Vào trong, An mới thấy quên món quà trên xe ba.","q":"An nên làm gì?","o":[["Giả vờ là không có quà",0,"Con đã chuẩn bị quà rồi, chỉ cần báo ba. Chuyện quên đồ ai cũng gặp."],["Nhờ cô chú chủ nhà gọi ba quay lại, hoặc hẹn mai mang quà sang",1,"Nhờ người lớn ở đó giúp liên lạc là cách an toàn và nhanh nhất. Món quà đến muộn vẫn là món quà."],["Bỏ về luôn vì ngại",0,"Rời khỏi bữa tiệc mà không báo người lớn là không an toàn. Quên quà không đáng để bỏ cả buổi vui."]]}],"qq":"Khi gặp sự cố nhỏ, việc đầu tiên nên làm là…","qo":["Bình tĩnh xem mình có thể làm gì ngay","Tìm người để đổ lỗi","Giấu đi cho xong"],"qa":0,"mi":{"t":"Kế hoạch “nếu quên đồ thì…”","s":"Con cùng ba mẹ nghĩ ra 3 việc con có thể làm ngay nếu quên đồ ở trường (ví dụ báo thật với cô, mượn bạn cùng bàn, ghi nhớ để lần sau). Con viết ra và đọc lại cho ba mẹ nghe.","lv":["Ba mẹ gợi ý, con chọn và viết ra 3 cách.","Ba mẹ nhắc một lần, con tự nghĩ 3 cách và tập nói câu báo với cô.","Con tự viết kế hoạch, thêm một cách để khỏi quên (như kiểm tra cặp buổi tối) và làm thử tối nay."],"rw":"Con được chọn bài hát trên đường đi học"}},{"t":"Quảng cáo nói vậy có đúng không?","sk":5,"m":"9 phút","cx":[{"k":0,"s":"An xem một quảng cáo nước uống nói: “Uống vào là cao vượt trội, học giỏi hơn!” An xin mẹ mua ngay một thùng.","q":"An nên nghĩ thế nào về quảng cáo này?","o":[["Quảng cáo trên tivi thì chắc chắn đúng",0,"Quảng cáo được làm để bán hàng, nên thường chỉ nói điều hay. Mình cần hỏi thêm trước khi tin."],["Tự hỏi: người nói muốn mình làm gì, có bằng chứng gì, rồi hỏi mẹ hoặc bác sĩ",1,"Ba câu hỏi nhỏ giúp con không bị lời hay ý đẹp dẫn đi. Cao lớn nhờ ăn đủ chất, ngủ đủ và vận động."],["Quảng cáo nào cũng nói dối, không tin cái nào",0,"Không phải quảng cáo nào cũng sai. Điều quan trọng là biết kiểm tra, chứ không phải tin hết hay chê hết."]]},{"k":1,"s":"Bạn Huy mang đến lớp một tờ rơi: “Khoá học thần tốc, 7 ngày nói tiếng Anh như người bản xứ!” Huy rủ An cùng xin ba mẹ đăng ký.","q":"An nên làm gì?","o":[["Đăng ký ngay kẻo hết chỗ",0,"“Kẻo hết chỗ” là cách thúc mình quyết vội. Quyết định tốt cần thời gian suy nghĩ."],["Cười chê Huy cả tin",0,"Chê bạn làm bạn ngại. Cùng bạn đặt câu hỏi thì cả hai đều học được."],["Nói với Huy: “Bảy ngày thì nghe hơi khó tin. Mình mang về hỏi ba mẹ và cô giáo trước nhé.”",1,"Lời hứa quá nhanh, quá dễ là dấu hiệu cần kiểm tra. Hỏi người lớn giúp mình quyết định sáng suốt."]]},{"k":2,"s":"Đi siêu thị với ba, An thấy tấm biển “Giảm giá 50%!” trên một hộp bánh to. An định lấy ngay.","q":"An nên làm gì?","o":[["Đọc kỹ biển giá, xem hạn dùng, rồi cùng ba so với giá thường",1,"Biển giảm giá chỉ là một phần thông tin. Xem kỹ hạn dùng và giá gốc mới biết có đáng mua không."],["Lấy hai hộp vì đang rẻ",0,"Rẻ mà không cần thì vẫn là tốn tiền. Hãy hỏi mình có thật sự cần không."],["Không bao giờ mua đồ giảm giá",0,"Giảm giá đôi khi rất có lợi. Điều cần là xem xét, chứ không phải tránh hết."]]}],"qq":"Câu hỏi nào nên tự hỏi khi xem quảng cáo?","qo":["Màu sắc có đẹp không?","Bạn mình có thích không?","Họ muốn mình làm gì, và có bằng chứng không?"],"qa":2,"mi":{"t":"Thám tử quảng cáo","s":"Con cùng ba mẹ xem một quảng cáo (trên TV, tờ rơi hoặc vỏ hộp). Con trả lời hai câu: “Họ muốn mình làm gì?” và “Họ có bằng chứng không?” rồi nói cho ba mẹ nghe.","lv":["Ba mẹ cùng xem và gợi ý chỗ nào là lời hứa quá mức, con nói lại.","Ba mẹ nhắc một lần, con tự chọn quảng cáo và tự trả lời hai câu hỏi.","Con tự xem hai quảng cáo, so sánh xem cái nào có bằng chứng tốt hơn và giải thích cho ba mẹ."],"rw":"Cả nhà chơi đố vui do con ra câu hỏi"}},{"t":"Cơ thể mình, mình có quyền nói “không”","sk":6,"m":"9 phút","cx":[{"k":0,"s":"Nhà có khách, một bác họ xa cứ véo má và đòi ôm An dù An đã lùi lại. An thấy không thoải mái.","q":"An nên làm gì?","o":[["Cố chịu cho bác vui",0,"Cảm giác khó chịu của con là quan trọng. Con có thể lễ phép mà vẫn giữ ranh giới của mình."],["Chạy vào phòng đóng cửa không ra nữa",0,"Con không làm gì sai nên không cần trốn. Nói với ba mẹ sẽ giúp con thoải mái quay lại."],["Lễ phép chào bằng lời hoặc đập tay, và nói với ba mẹ nếu bác vẫn tiếp tục",1,"Không ai được chạm vào con khi con không muốn, kể cả người quen. Ba mẹ sẽ giúp con nói chuyện với người lớn."]]},{"k":1,"s":"Giờ ra chơi, Tí hay đùa bằng cách quàng tay qua vai An rồi kéo đi thật mạnh, dù An đã nói “Đừng làm thế.”","q":"An nên làm gì?","o":[["Nhìn thẳng nói rõ “Tớ không thích, dừng lại”, nếu Tí vẫn làm thì báo cô",1,"Nói rõ ràng là quyền của con. Khi bạn không dừng, nhờ thầy cô giúp là đúng, không phải mách lẻo."],["Cười cho qua để không mất vui",0,"Cười cho qua làm bạn tưởng con thích. Nói rõ ràng thì bạn mới hiểu."],["Kéo lại Tí thật mạnh cho bạn biết cảm giác",0,"Đáp trả dễ khiến cả hai bị ngã và trò đùa thành cãi nhau. Có cách tốt hơn."]]},{"k":2,"s":"Ở hồ bơi khu phố, mẹ ngồi trên bờ. Một chú lạ đến gần, khen An bơi giỏi và đòi chỉnh tư thế giúp bằng cách nắm tay An.","q":"An nên làm gì?","o":[["Để chú chỉnh vì chú có vẻ tốt bụng",0,"Trông tốt bụng chưa chắc đã an toàn. Ai cần dạy con bơi thì sẽ hỏi ba mẹ trước."],["Lùi lại, nói “Cháu cảm ơn, không cần ạ” và bơi về phía mẹ ngay",1,"Với người lạ, con không cần giải thích nhiều. Đến gần người lớn tin cậy và kể lại là an toàn nhất."],["Im lặng bơi tiếp và không kể với mẹ",0,"Kể với mẹ giúp mẹ để ý và bảo vệ con. Những chuyện như thế này không phải giữ kín."]]}],"qq":"Khi ai đó chạm vào mình làm mình khó chịu, mình nên…","qo":["Giữ bí mật để không ai buồn","Nói “không” và kể với người lớn tin cậy","Chờ xem lần sau thế nào"],"qa":1,"mi":{"t":"Tập nói “không” và chọn cách chào","s":"Con và ba mẹ tập nói to, rõ: “Con không thích, xin đừng làm vậy” và chọn cách chào con thấy thoải mái (vẫy tay, khoanh tay chào, đập tay). Con kể tên 2 người lớn tin cậy con sẽ kể khi thấy khó chịu.","lv":["Ba mẹ nói mẫu, con nói theo và cùng chọn cách chào.","Ba mẹ nhắc một lần, con tự nói rõ ràng, nhìn thẳng và kể tên 2 người tin cậy.","Con tự nói, tự đóng vai một tình huống khó và kể lại cho ba mẹ con sẽ làm gì tiếp theo."],"rw":"Ba mẹ viết cho con một tấm thiệp nhỏ khen con dũng cảm"}},{"t":"Sự thật hay ý kiến?","sk":5,"m":"9 phút","cx":[{"k":0,"s":"Anh của An nói: “Phim hoạt hình mới chán lắm, đừng xem.” Còn bạn của An lại khen phim rất hay.","q":"An nên làm gì?","o":[["Tin anh vì anh lớn hơn",0,"Lớn hơn không biến ý kiến thành sự thật. Chán hay hay là cảm nhận riêng của mỗi người."],["Hiểu đó là hai ý kiến, xem phim có hợp lứa tuổi không, rồi xin ba mẹ xem thử",1,"Ý kiến của người khác để tham khảo, còn quyết định dựa trên thông tin như độ tuổi phù hợp."],["Không xem vì hai người nói khác nhau, rối quá",0,"Hai ý kiến khác nhau là chuyện bình thường. Con có thể tìm thông tin rồi tự đánh giá."]]},{"k":1,"s":"Làm bài thuyết trình về loài mèo, Vy viết: “Mèo là con vật đáng yêu nhất thế giới.” An băn khoăn câu này có nên để trong phần “Thông tin khoa học” không.","q":"An nên làm gì?","o":[["Gợi ý Vy chuyển câu đó sang phần “Cảm nghĩ của nhóm” và tìm thêm một sự thật kiểm chứng được",1,"Sự thật là điều kiểm chứng được, như “mèo ngủ khoảng 12 đến 16 giờ mỗi ngày”. Ý kiến là cảm nhận riêng — vẫn hay, chỉ cần để đúng chỗ."],["Để nguyên, vì ai chẳng thấy mèo đáng yêu",0,"Nhiều người đồng ý thì vẫn là ý kiến, vì có người thích chó hơn. Phần khoa học cần điều đo được, kiểm được."],["Xoá luôn câu đó và không nói gì với Vy",0,"Tự xoá bài của bạn dễ làm bạn buồn. Giải thích sự khác nhau thì cả nhóm cùng hiểu."]]},{"k":2,"s":"Ở hiệu sách, một người bán hàng nói với ba và An: “Cuốn này hay nhất, ai cũng mua.”","q":"An nên làm gì?","o":[["Mua ngay vì người bán nói vậy",0,"“Hay nhất” là ý kiến, “ai cũng mua” chưa chắc đúng. Mình nên tự xem nội dung."],["Nói với cô là cô quảng cáo sai",0,"Cô chỉ đang nêu ý kiến, không sai. Lễ phép cảm ơn rồi tự kiểm tra là đủ."],["Lật vài trang đọc thử, xem phần giới thiệu, rồi cùng ba quyết định",1,"Đọc thử là cách lấy sự thật về cuốn sách: chữ có vừa sức không, nội dung có hợp mình không."]]}],"qq":"Câu nào là sự thật?","qo":["Màu xanh là màu đẹp nhất","Mùa hè là mùa đẹp nhất","Nước sôi ở 100 độ C ở mực nước biển"],"qa":2,"mi":{"t":"Trò chơi “sự thật hay ý kiến”","s":"Con viết 5 câu về một chủ đề con thích, có cả sự thật và ý kiến. Đọc cho ba mẹ đoán từng câu là gì, rồi con giải thích cách con biết.","lv":["Ba mẹ cùng viết, con phân loại từng câu.","Ba mẹ nhắc một lần, con tự viết 5 câu và đố ba mẹ.","Con tự viết, với mỗi câu sự thật con nói được cách kiểm chứng (sách, đo, hỏi thầy cô)."],"rw":"Con được chọn trò chơi cả nhà chơi cuối tuần"}},{"t":"Giữ thông tin cá nhân trên mạng","sk":6,"m":"10 phút","cx":[{"k":0,"s":"An chơi một trò đố vui trên máy tính bảng của nhà. Một tài khoản lạ nhắn: “Bạn giỏi quá! Cho mình xin tên trường và địa chỉ để gửi quà nhé.”","q":"An nên làm gì?","o":[["Không trả lời, cho ba mẹ xem tin nhắn và cùng ba mẹ chặn tài khoản đó",1,"Quà tặng từ người lạ trên mạng thường là cái bẫy. Kể với ba mẹ là cách an toàn nhất, con không có lỗi gì cả."],["Gửi tên trường thôi, không gửi địa chỉ",0,"Tên trường cũng là thông tin giúp người lạ tìm ra con. Thông tin cá nhân thì không gửi phần nào cả."],["Hỏi lại người đó là ai trước",0,"Trên mạng ai cũng có thể giả làm bạn nhỏ. Không cần trò chuyện thêm, hãy báo ba mẹ."]]},{"k":1,"s":"Cô giáo lập nhóm chat lớp để gửi bài tập. Bạn Nam rủ mọi người đăng ảnh thẻ học sinh có cả họ tên, ngày sinh lên nhóm cho vui.","q":"An nên làm gì?","o":[["Đăng theo các bạn cho khỏi lạc lõng",0,"Ảnh trong nhóm có thể bị lưu và gửi đi nơi khác. Không theo bạn trong chuyện này là đúng."],["Đăng rồi xoá sau vài phút",0,"Chỉ vài giây là ảnh đã có thể bị lưu lại. Không đăng ngay từ đầu là chắc chắn nhất."],["Nhắn với Nam là mình không đăng, và kể với cô hoặc ba mẹ để mọi người cùng biết cách giữ an toàn",1,"Nhóm chat lớp để học, còn giấy tờ cá nhân thì giữ riêng. Báo người lớn giúp bảo vệ cả lớp."]]},{"k":2,"s":"Ở quán ăn cùng gia đình, An dùng mạng miễn phí. Một trang hiện lên: “Nhập số điện thoại của ba mẹ để nhận phiếu ăn miễn phí.”","q":"An nên làm gì?","o":[["Nhập vào để được phiếu ăn cho cả nhà",0,"Số điện thoại của ba mẹ là thông tin riêng. Đồ miễn phí đôi khi phải trả giá bằng thông tin."],["Tắt trang đó và nói với ba mẹ ngay",1,"Trang lạ xin số điện thoại thường không đáng tin. Để ba mẹ quyết định là an toàn nhất."],["Nhập số điện thoại của mình thay vì của ba mẹ",0,"Số của con cũng cần được giữ riêng như của ba mẹ. Hỏi ba mẹ trước khi nhập bất cứ thông tin nào."]]}],"qq":"Thông tin nào KHÔNG nên chia sẻ trên mạng?","qo":["Địa chỉ nhà, tên trường, số điện thoại","Màu sắc yêu thích","Món ăn mình thích"],"qa":0,"mi":{"t":"Danh sách “thông tin giữ kín”","s":"Con cùng ba mẹ viết danh sách thông tin không bao giờ chia sẻ trên mạng (địa chỉ, tên trường, số điện thoại, ảnh mặc đồng phục…) và tập câu trả lời khi có người lạ hỏi: “Mình không chia sẻ, mình sẽ hỏi ba mẹ.” Dán danh sách cạnh máy tính bảng của nhà.","lv":["Ba mẹ gợi ý từng mục, con viết và đọc to.","Ba mẹ nhắc một lần, con tự viết danh sách và tự nói câu từ chối.","Con tự viết, tự nói câu từ chối và kể cho ba mẹ con sẽ làm gì nếu có tin nhắn lạ (không trả lời, báo ba mẹ ngay)."],"rw":"Ba mẹ cùng con làm một món đồ thủ công"}},{"t":"Bắt tay vào việc, đừng chần chừ","sk":7,"m":"9 phút","cx":[{"k":0,"s":"An có bài văn tả cây phải nộp sau hai ngày. Tối nay An định “xem một chút rồi viết”, nhưng đã gần 9 giờ mà chưa viết chữ nào.","q":"An nên làm gì?","o":[["Đặt đồng hồ 15 phút, chỉ viết dàn ý, rồi đi ngủ đúng giờ",1,"Bắt đầu bằng một bước nhỏ giúp mình vượt qua cảm giác ngại. Có dàn ý rồi, mai viết sẽ trôi chảy."],["Hẹn mai viết một thể",0,"Để mai thì việc dồn lại và áp lực lớn hơn. Bắt đầu một chút hôm nay sẽ dễ hơn nhiều."],["Thức khuya viết cho xong cả bài",0,"Thức khuya làm sáng mai mệt và bài viết vội. Chia nhỏ ra sẽ tốt hơn."]]},{"k":1,"s":"Nhóm của An được giao làm áp phích về tiết kiệm nước, nộp vào thứ Sáu. Đến thứ Ba, An vẫn chưa bắt đầu phần vẽ của mình.","q":"An nên làm gì?","o":[["Chờ đến thứ Năm vẽ một lần cho đẹp",0,"Để sát hạn thì không còn thời gian sửa nếu có sai sót. Nhóm cũng lo lắng chờ."],["Vẽ phác thảo ngay giờ ra chơi hôm nay và gửi nhóm xem",1,"Một bản phác thảo nhanh giúp nhóm yên tâm và con có thời gian sửa."],["Nhờ bạn khác vẽ hộ",0,"Phần việc của mình mà nhờ bạn làm thì bạn bị quá tải. Bắt đầu từ một nét nhỏ thôi cũng được."]]},{"k":2,"s":"Mẹ nhờ An viết thiệp cảm ơn bác hàng xóm đã cho rau. An cứ để đó ba ngày, lần nào gặp bác cũng thấy ngại.","q":"An nên làm gì?","o":[["Thôi khỏi viết, bác chắc quên rồi",0,"Lời cảm ơn muộn vẫn tốt hơn không có. Bác sẽ vui khi nhận được."],["Chờ mua được thiệp thật đẹp rồi mới viết",0,"Chờ hoàn hảo là một kiểu chần chừ. Một tờ giấy tự trang trí cũng rất ý nghĩa."],["Viết ngay ba câu ngắn hôm nay, rồi cùng mẹ sang đưa bác",1,"Việc nhỏ để lâu thành nặng lòng. Làm ngay chỉ mất năm phút và con thấy nhẹ nhõm."]]}],"qq":"Cách tốt để bớt chần chừ là…","qo":["Chờ đến khi có hứng","Làm tất cả vào phút cuối","Bắt đầu bằng một bước thật nhỏ, có hẹn giờ"],"qa":2,"mi":{"t":"Bắt đầu bằng 10 phút hẹn giờ","s":"Chọn một bài tập con hay để dồn. Con đặt hẹn giờ 10 phút và chỉ làm bước đầu tiên thật nhỏ (ví dụ viết câu mở bài). Hết giờ cho ba mẹ xem phần đã làm.","lv":["Ba mẹ ngồi cạnh, cùng con chọn bước nhỏ và bấm giờ.","Ba mẹ nhắc một lần, con tự chọn bước nhỏ và tự bấm giờ.","Con tự bắt đầu trước giờ ăn tối, không cần nhắc, và kể lại cảm giác sau 10 phút đầu."],"rw":"Ba mẹ đọc cho con nghe một chương truyện"}},{"t":"Cần hay muốn?","sk":8,"m":"9 phút","cx":[{"k":0,"s":"Giày thể thao của An còn tốt nhưng An muốn đôi mới có đèn nhấp nháy. Mẹ hỏi An: “Con cần hay con muốn?”","q":"An nên làm gì?","o":[["Nói “Con cần, vì giày cũ xấu rồi”",0,"Chưa đẹp không có nghĩa là hỏng. Thành thật với mình giúp con chọn đúng."],["Giận dỗi vì mẹ không mua",0,"Giận dỗi không giúp có giày. Cùng mẹ lên kế hoạch để dành sẽ hiệu quả hơn."],["Thành thật nói là muốn, và đề nghị tự để dành một phần tiền",1,"Biết phân biệt cần và muốn là bước đầu của tiêu tiền khôn ngoan. Tự góp tiền giúp con quý món đồ hơn."]]},{"k":1,"s":"Lớp chuẩn bị đi tham quan. Danh sách cô đưa gồm nước, mũ, áo mưa. Bạn Bảo bảo An mang thêm thật nhiều bánh kẹo cho “sành điệu”.","q":"An nên làm gì?","o":[["Mang đủ đồ trong danh sách, thêm một món ăn vặt nhỏ ba mẹ đồng ý",1,"Đủ thứ cần rồi thêm chút thứ muốn hợp lý là cách cân bằng tốt."],["Mua thật nhiều bánh kẹo để bạn khen",0,"Mua để được khen dễ làm tốn tiền mà không cần thiết. Danh sách của cô là những thứ quan trọng."],["Bỏ áo mưa để có chỗ cho bánh kẹo",0,"Áo mưa là thứ cần nếu trời đổ mưa. Đừng đổi thứ cần lấy thứ muốn."]]},{"k":2,"s":"Đi nhà sách với mẹ, An có 50.000 đồng tiền tiêu vặt để mua bút mới vì bút cũ đã hỏng. An lại thấy một bộ nhãn dán lấp lánh giá 45.000 đồng.","q":"An nên làm gì?","o":[["Mua nhãn dán, bút thì mượn bạn",0,"Mượn bút mãi sẽ phiền bạn và con vẫn thiếu đồ học. Thứ cần nên được ưu tiên."],["Mua bút trước, ghi bộ sticker vào danh sách để dành",1,"Bút là thứ cần để học, nhãn dán là thứ muốn. Lo thứ cần trước, thứ muốn thì để dành dần."],["Xin mẹ thêm tiền để mua cả hai",0,"Xin thêm mỗi lần thích thì khó học cách chọn. Tự cân nhắc trong số tiền mình có mới là kỹ năng."]]}],"qq":"Thứ “cần” là…","qo":["Thứ bạn bè đều có","Thứ mình không thể thiếu để sống và học","Thứ mình thấy đẹp"],"qa":1,"mi":{"t":"Phân loại “cần” và “muốn” trong nhà","s":"Con viết hai cột “Cần” và “Muốn”, rồi đi quanh nhà tìm mỗi cột 5 thứ. Con giải thích cho ba mẹ vì sao mỗi thứ thuộc cột đó.","lv":["Ba mẹ đi cùng, gợi ý và con quyết định xếp vào cột nào.","Ba mẹ nhắc một lần, con tự tìm đủ 10 thứ và giải thích.","Con tự làm, rồi chọn một món “muốn” trong danh sách mong ước của con và nói con sẽ chờ hay bỏ qua, vì sao."],"rw":"Cả nhà xếp hình hoặc chơi cờ cùng nhau một buổi tối"}},{"t":"Khi tức giận: dừng lại trước khi nói","sk":1,"m":"9 phút","cx":[{"k":0,"s":"Em của An vẽ bậy lên trang vở An vừa trình bày rất đẹp. An tức đến mức muốn xé vở của em.","q":"An nên làm gì?","o":[["Xé vở của em cho công bằng",0,"Làm hỏng đồ của em không làm vở con đẹp lại, còn làm em buồn. Có cách tốt hơn."],["Mắng em một trận thật to",0,"Em nhỏ dễ sợ khi bị quát. Nói bình tĩnh thì em mới nhớ được điều con dặn."],["Đặt vở xuống, ra rót cốc nước, rồi nói với em: “Vở bị vẽ làm mình buồn lắm. Lần sau em hỏi trước nhé.”",1,"Rời đi một chút rồi nói rõ cảm xúc và điều mình mong muốn giúp em hiểu mà không sợ."]]},{"k":1,"s":"Đá bóng giờ ra chơi, Huy hét lên rằng tại An mà đội thua. An thấy mặt nóng bừng, tay nắm chặt.","q":"An nên làm gì?","o":[["Hét lại thật to: “Cậu mới là người chơi dở!”",0,"Hét lại làm cả hai càng giận và trận cãi kéo dài. Bình tĩnh trước rồi mới nói sẽ được lắng nghe hơn."],["Hít sâu ba hơi, đi ra chỗ khác một chút rồi mới nói chuyện với Huy",1,"Cơn giận giống sóng: lên cao rồi sẽ hạ. Dừng lại vài giây giúp con nói điều mình muốn, không phải điều mình hối hận."],["Bỏ về lớp và không chơi với Huy nữa",0,"Rời đi để bình tĩnh là tốt, nhưng cắt đứt tình bạn vì một trận bóng thì tiếc lắm. Lúc nguôi hãy nói chuyện lại."]]},{"k":2,"s":"Xếp hàng mua vé xem xiếc cùng mẹ, An bị một bạn lớn hơn chen lên trước. An bực mình muốn đẩy bạn ra.","q":"An nên làm gì?","o":[["Hít thở, rồi nói với mẹ để mẹ nhắc bạn hoặc báo nhân viên",1,"Bình tĩnh và nhờ người lớn là cách xử lý an toàn, công bằng ở nơi đông người."],["Đẩy bạn ra khỏi hàng",0,"Xô đẩy chỗ đông người dễ gây ngã và nguy hiểm. Hãy dùng lời nói hoặc nhờ người lớn."],["Lẩm bẩm khó chịu suốt buổi",0,"Giữ bực tức cả buổi làm con mất vui khi xem xiếc. Nói ra hoặc nhờ giúp rồi cho qua."]]}],"qq":"Khi rất tức giận, việc nên làm đầu tiên là…","qo":["Dừng lại, hít thở cho bình tĩnh","Nói ngay điều mình nghĩ","Giữ trong lòng mãi mãi"],"qa":0,"mi":{"t":"Góc bình tĩnh của con","s":"Con chọn một góc trong nhà làm “góc bình tĩnh” và viết 3 cách giúp con dịu lại (hít thở 4 nhịp, đếm ngược từ 10, uống nước). Tập một lần với ba mẹ và kể khi nào con sẽ dùng.","lv":["Ba mẹ cùng chọn góc và cùng tập hít thở với con.","Ba mẹ nhắc một lần, con tự chuẩn bị góc và tự tập.","Con tự dùng góc bình tĩnh khi thấy bực trong tuần, rồi kể lại con đã nói gì sau khi dịu."],"rw":"Cả nhà đi dạo buổi chiều quanh khu phố"}},{"t":"Hồi hộp trước khi biểu diễn","sk":1,"m":"9 phút","cx":[{"k":0,"s":"Tối mai An lần đầu được ngủ lại nhà ông bà mà không có ba mẹ. An thấy bồn chồn, không muốn ăn tối.","q":"An nên làm gì?","o":[["Im lặng chịu đựng vì sợ bị cười",0,"Nỗi lo không nói ra thường to dần. Ba mẹ luôn muốn nghe, không ai cười con đâu."],["Bỏ bữa tối cho đỡ lo",0,"Bỏ ăn làm cơ thể mệt và dễ lo hơn. Ăn một chút và nói chuyện với mẹ sẽ giúp con."],["Nói với mẹ điều mình lo, rồi cùng mẹ chuẩn bị đồ quen thuộc như gối và truyện",1,"Nói ra nỗi lo giúp nó nhẹ đi. Mang theo đồ quen làm chỗ mới bớt lạ."]]},{"k":1,"s":"Ngày mai An phải đọc thơ trước lớp. Tối nay An cứ nghĩ mãi đến cảnh cả lớp nhìn mình và quên hết bài.","q":"An nên làm gì?","o":[["Thức khuya học đi học lại thật nhiều lần",0,"Ngủ không đủ làm trí nhớ kém đi. Tập vừa đủ rồi ngủ ngon mới giúp con nhớ bài."],["Tập đọc trước gương hai lần, rồi đọc cho ba nghe một lần",1,"Tập trước người thân giúp việc đứng trước lớp bớt lạ. Mỗi lần tập là một lần bớt run."],["Xin nghỉ học ngày mai",0,"Nghỉ học chỉ hoãn nỗi sợ sang hôm khác. Chuẩn bị tốt sẽ giúp con vượt qua."]]},{"k":2,"s":"Chiều nay An đánh đàn ở buổi biểu diễn của lớp nhạc tại nhà văn hoá phường. Ngồi chờ đến lượt, tay An lạnh ngắt, tim đập thình thịch.","q":"An nên làm gì?","o":[["Thở chậm: hít vào đếm 4, thở ra đếm 6, và tự nhủ “Hồi hộp nghĩa là mình đang quan tâm”",1,"Thở ra dài giúp cơ thể dịu lại. Gọi tên cảm xúc một cách tử tế giúp con tập trung vào bài đàn."],["Xin ba mẹ cho về, không biểu diễn nữa",0,"Né tránh làm nỗi sợ lớn thêm cho lần sau. Hồi hộp là bình thường, con vẫn làm được khi có cách."],["Cố nghĩ là mình không hề sợ",0,"Phủ nhận cảm xúc thường làm nó mạnh hơn. Chấp nhận rồi thở đều sẽ hiệu quả hơn."]]}],"qq":"Hồi hộp trước một việc quan trọng là…","qo":["Dấu hiệu mình sẽ thất bại","Điều phải giấu đi","Bình thường, và có cách làm dịu"],"qa":2,"mi":{"t":"Diễn thử trước khán giả gia đình","s":"Con chọn một việc con hồi hộp (đọc bài, hát, thuyết trình) và diễn thử 3–5 phút trước cả nhà. Trước khi diễn con làm một cách làm dịu (thở chậm, nắm–thả tay).","lv":["Ba mẹ cùng thở với con trước khi diễn và ngồi ngay hàng đầu.","Ba mẹ nhắc một lần, con tự làm cách làm dịu rồi diễn.","Con tự chuẩn bị, tự diễn và kể lại lúc nào tim đập nhanh nhất, con đã làm gì."],"rw":"Cả nhà vỗ tay và ba mẹ kể lần đầu ba mẹ lên sân khấu"}},{"t":"Đón nhận ý tưởng của bạn","sk":2,"m":"9 phút","cx":[{"k":0,"s":"Cả nhà bàn chuyện cuối tuần đi đâu. An muốn đi công viên nước, còn em muốn đến thư viện thiếu nhi.","q":"An nên làm gì?","o":[["Hỏi em thích gì ở thư viện, rồi đề nghị sáng đi thư viện, chiều đi công viên nếu ba mẹ đồng ý",1,"Hiểu lý do của người khác giúp mình tìm ra phương án chung mà cả nhà đều vui."],["Khóc lóc để được đi công viên nước",0,"Làm ầm lên có thể thắng một lần, nhưng không ai thấy vui. Cùng tìm cách để ai cũng có phần."],["Nói “Thư viện chán lắm” cho em đổi ý",0,"Chê sở thích của em làm em buồn. Mỗi người thích một thứ là bình thường."]]},{"k":1,"s":"Nhóm An chọn chủ đề cho tiết mục kịch ngắn. An đã có ý muốn diễn chuyện cổ tích, nhưng Linh đề nghị diễn cảnh đi chợ vui nhộn.","q":"An nên làm gì?","o":[["Nói ngay: “Ý của Linh không hay bằng ý mình”",0,"Chê ý bạn trước khi nghe làm bạn ngại góp ý lần sau. Nhóm mạnh khi ai cũng dám nói."],["Im lặng làm theo dù không thích",0,"Ý của con cũng đáng được nghe. Hãy nói ra để nhóm có thêm lựa chọn."],["Hỏi Linh thêm về ý đó, nêu ý của mình, rồi cả nhóm cùng chọn hoặc kết hợp hai ý",1,"Nghe kỹ ý bạn rồi mới so sánh giúp nhóm chọn điều tốt nhất. Đôi khi hai ý ghép lại còn hay hơn."]]},{"k":2,"s":"Câu lạc bộ thiếu nhi khu phố cùng trang trí bảng tin. Một bạn đề nghị dán ảnh hoa lá, An lại muốn vẽ tranh. Cô phụ trách đứng gần đó.","q":"An nên làm gì?","o":[["Tự vẽ phần của mình, mặc kệ bạn",0,"Mỗi người một kiểu dễ làm bảng tin rối mắt. Thống nhất trước thì kết quả đẹp hơn."],["Gợi ý vẽ khung tranh rồi dán ảnh hoa vào bên trong, hỏi ý cả nhóm",1,"Kết hợp ý tưởng giúp mọi người đều thấy phần đóng góp của mình."],["Nhờ cô quyết định thay cả nhóm",0,"Cô có thể giúp khi nhóm bế tắc, nhưng hãy thử tự bàn trước. Đó là cơ hội tập làm việc nhóm."]]}],"qq":"Trong nhóm, khi bạn đưa ra ý khác mình, mình nên…","qo":["Hỏi thêm để hiểu ý bạn","Bác bỏ ngay","Giả vờ đồng ý"],"qa":0,"mi":{"t":"Hỏi để hiểu ý người khác","s":"Khi cả nhà bàn một việc (món ăn cuối tuần, chỗ đi chơi), con hỏi một người có ý khác con ít nhất 2 câu để hiểu vì sao họ chọn vậy, rồi nói lại ý họ trước khi nói ý con.","lv":["Ba mẹ gợi ý câu hỏi “Vì sao…?”, con hỏi và nói lại.","Ba mẹ nhắc một lần, con tự hỏi 2 câu và tóm lại ý người kia.","Con tự hỏi, tự tóm ý, rồi đề xuất một cách gộp cả hai ý và kể lại kết quả."],"rw":"Cả nhà làm theo ý tưởng con đề xuất cho buổi tối"}},{"t":"Tự chuẩn bị bữa sáng đơn giản","sk":3,"m":"9 phút","cx":[{"k":0,"s":"Sáng thứ Bảy, ba đi làm sớm, mẹ đang bận cho em bé ăn. Mẹ nhờ An tự chuẩn bị bữa sáng; trong bếp có bánh mì, trứng luộc sẵn, sữa và chuối.","q":"An nên làm gì?","o":[["Chờ mẹ cho em ăn xong rồi làm cho",0,"Mẹ tin con làm được nên mới nhờ. Những món có sẵn thế này con tự lo được."],["Tự bật bếp ga chiên trứng mà không hỏi mẹ",0,"Dùng bếp cần có người lớn hướng dẫn bên cạnh. Món cần nấu thì hỏi mẹ trước nhé."],["Rửa tay, bày bánh mì, trứng, chuối và sữa ra đĩa, ăn xong rửa đĩa",1,"Một bữa sáng không cần nấu vẫn đủ chất. Tự dọn sau khi ăn là một phần của tự lập."]]},{"k":1,"s":"Ở trường bán trú, cô giao mỗi bạn tự lấy khay, xếp hàng nhận cơm và dọn khay sau bữa trưa. Hôm nay An lỡ làm đổ canh ra bàn.","q":"An nên làm gì?","o":[["Lấy khăn lau sạch, rồi mới mang khay đi cất",1,"Tự xử lý việc mình gây ra là tự lập và cũng là tôn trọng người khác."],["Bỏ đi, để cô lao công lau",0,"Mình làm đổ thì mình lau. Như vậy cô lao công và các bạn ngồi sau đều đỡ vất vả."],["Lấy giấy che lên chỗ đổ",0,"Che đi thì bàn vẫn bẩn và người sau dễ bị dính. Lau sạch chỉ mất một phút."]]},{"k":2,"s":"Đi dã ngoại cùng gia đình bác, mỗi bạn nhỏ được giao tự chuẩn bị phần ăn trưa của mình từ đồ người lớn mang theo.","q":"An nên làm gì?","o":[["Chỉ lấy bánh kẹo ăn vặt vì thích",0,"Ăn toàn đồ vặt thì nhanh đói và mệt. Thử chọn có cơm hoặc bánh mì, rau và trái cây."],["Rửa tay, lấy đủ cơm hoặc bánh mì, rau và trái cây, gói phần dư lại cẩn thận",1,"Tự chọn bữa ăn đủ chất và gọn gàng là kỹ năng dùng cả đời."],["Chờ các bạn khác lấy hộ",0,"Người lớn giao việc này để con tập tự lo. Con chọn được món mình cần mà."]]}],"qq":"Khi tự chuẩn bị đồ ăn, mình nên…","qo":["Thử nấu món mới thật khó","Ăn bánh kẹo cho nhanh","Chọn món an toàn, hỏi người lớn trước khi dùng bếp hay dao sắc"],"qa":2,"mi":{"t":"Tự chuẩn bị bữa sáng không dùng bếp","s":"Một buổi sáng cuối tuần, con tự chuẩn bị bữa sáng không cần bếp hay dao sắc (bánh mì, sữa, chuối, trứng luộc sẵn), bày ra đĩa và dọn gọn sau khi ăn. Ba mẹ ở nhà và xem kết quả.","lv":["Ba mẹ đứng cạnh, con lấy đồ, bày đĩa và rửa tay trước khi làm.","Ba mẹ nhắc một lần, con tự làm và tự dọn, hỏi ba mẹ nếu cần dùng thứ gì khác.","Con tự lên kế hoạch món, tự làm cho mình và một người nữa, rồi tự dọn sạch."],"rw":"Ba mẹ nấu món con thích vào bữa tối"}},{"t":"Việc lớn thì chia thành bước nhỏ","sk":4,"m":"10 phút","cx":[{"k":0,"s":"Phòng của An bừa bộn sau cả tuần: sách trên sàn, quần áo trên ghế, đồ chơi khắp nơi. An nhìn mà không biết bắt đầu từ đâu nên cứ ngồi đó.","q":"An nên làm gì?","o":[["Dọn tất cả cùng lúc thật nhanh",0,"Làm mọi thứ cùng lúc dễ rối và bỏ dở giữa chừng. Đi từng bước sẽ chắc hơn."],["Đóng cửa phòng lại cho khỏi thấy",0,"Không nhìn thấy thì phòng vẫn bừa. Bắt đầu bằng một việc nhỏ nhất thôi cũng được."],["Chia ra từng bước: nhặt sách trước, rồi quần áo, rồi đồ chơi, mỗi bước 10 phút",1,"Việc lớn trông đáng sợ, nhưng từng bước nhỏ thì làm được. Xong một bước sẽ có động lực làm bước tiếp."]]},{"k":1,"s":"Cô giao làm mô hình hệ Mặt Trời trong hai tuần. An thấy việc này to quá, chưa biết bắt đầu thế nào.","q":"An nên làm gì?","o":[["Đợi tuần sau mới tính",0,"Để dồn thì việc lớn càng lớn thêm. Lên các bước từ hôm nay sẽ nhẹ hơn."],["Viết danh sách các bước: tìm hiểu, chuẩn bị vật liệu, làm từng hành tinh, ghép lại, rồi ghi ngày cho mỗi bước",1,"Có danh sách các bước, con biết hôm nay cần làm gì và không bị dồn vào cuối."],["Nhờ ba mẹ làm giúp hết",0,"Ba mẹ có thể giúp chuẩn bị vật liệu, nhưng tự làm mới là học. Chia nhỏ việc sẽ giúp con tự làm được."]]},{"k":2,"s":"Câu lạc bộ khu phố nhờ các bạn nhỏ nhặt rác quanh sân chơi, có các bác tổ dân phố cùng làm. Sân rộng, rác nhiều, nhóm An thấy nản.","q":"An nên làm gì?","o":[["Chia sân thành bốn góc, mỗi lần làm sạch một góc, đeo găng tay và để người lớn xử lý vật sắc nhọn",1,"Chia nhỏ giúp nhóm thấy rõ từng phần đã sạch. Đeo găng và nhờ người lớn với đồ sắc là an toàn."],["Nhặt vài cái rồi nghỉ",0,"Làm lẻ tẻ thì khó thấy kết quả và dễ nản. Chia khu vực sẽ thấy tiến bộ rõ ràng."],["Ai thích chỗ nào thì nhặt chỗ đó",0,"Không chia việc thì có chỗ nhiều người làm, có chỗ bị bỏ sót. Lên kế hoạch giúp làm hết."]]}],"qq":"Khi gặp một việc quá lớn, mình nên…","qo":["Bỏ cuộc","Chia thành các bước nhỏ và làm từng bước","Chờ người khác làm giúp"],"qa":1,"mi":{"t":"Dọn phòng theo từng bước nhỏ","s":"Con viết 4–5 bước nhỏ để dọn phòng (sách, quần áo, đồ chơi, bàn học…) và làm từng bước, đánh dấu khi xong. Làm xong mời ba mẹ vào xem.","lv":["Ba mẹ giúp chia bước, con làm và ba mẹ cùng làm bước đầu.","Ba mẹ nhắc một lần, con tự viết bước và tự dọn.","Con tự chia bước, tự hẹn giờ mỗi bước và kể lại bước nào lâu nhất."],"rw":"Con được chọn bữa trưa Chủ nhật"}},{"t":"Nghe cả hai phía trước khi phán xét","sk":5,"m":"10 phút","cx":[{"k":0,"s":"An đi học về thấy chiếc cốc yêu thích bị vỡ. Em của An nói là tại con mèo, còn bà nói thấy em chơi bóng trong nhà.","q":"An nên làm gì?","o":[["Mắng em ngay vì chắc chắn em nói dối",0,"Kết luận vội có thể oan cho em. Hỏi thêm sẽ giúp biết chuyện thật."],["Bình tĩnh hỏi em kể lại, rồi nhờ ba mẹ cùng nói chuyện",1,"Nghe đủ các bên và nhờ người lớn giúp làm rõ là cách công bằng nhất."],["Đổ lỗi cho con mèo cho nhanh",0,"Kết luận cho xong thì không ai học được gì. Tìm hiểu thêm một chút là đủ."]]},{"k":1,"s":"Vy kể với An rằng Mai đã lấy hộp bút của Vy mà không hỏi. Vy rủ An cùng không chơi với Mai nữa.","q":"An nên làm gì?","o":[["Đồng ý ngay vì Vy là bạn thân",0,"Mới nghe một phía thì chưa đủ để kết luận. Có thể còn điều mình chưa biết."],["Đi kể với cả lớp chuyện Mai lấy đồ",0,"Lan truyền khi chưa rõ thật giả có thể làm Mai bị oan và buồn."],["Nói với Vy: “Mình hỏi Mai xem chuyện thế nào đã nhé”, rồi nghe Mai kể",1,"Nghe cả hai phía giúp mình công bằng. Biết đâu Mai chỉ mượn tạm và định trả."]]},{"k":2,"s":"Ở sân chơi chung cư, hai bạn nhỏ cãi nhau vì cái xích đu. Bạn nào cũng nói mình đến trước. Bác bảo vệ đang ở gần đó.","q":"An nên làm gì?","o":[["Nghe mỗi em nói, gợi ý chia lượt mỗi em năm phút, nếu căng thẳng thì nhờ bác bảo vệ",1,"Nghe cả hai rồi tìm cách chung giúp mọi người thấy được tôn trọng. Nhờ người lớn khi cần là an toàn."],["Bênh bạn mình quen",0,"Quen hay không không quyết định ai đúng. Công bằng là nghe cả hai."],["Mặc kệ, việc của các em",0,"Không phải lúc nào cũng cần xen vào, nhưng nếu các em sắp xô đẩy thì nên nhờ người lớn."]]}],"qq":"Trước khi kết luận ai đúng ai sai, mình nên…","qo":["Nghe cả hai phía","Nghe người mình thân hơn","Nghe người nói to hơn"],"qa":0,"mi":{"t":"Nghe cả hai phía trong nhà","s":"Khi trong nhà có ai bất đồng nhỏ (hoặc ba mẹ dựng một tình huống), con hỏi lần lượt từng người kể lại, rồi nói lại ý của cả hai trước khi nêu ý kiến của con.","lv":["Ba mẹ đóng vai hai phía, con hỏi và nói lại từng phía.","Ba mẹ nhắc một lần, con tự hỏi và tóm ý hai phía.","Con tự dùng cách này với một chuyện thật ở lớp hoặc ở nhà và kể lại con đã hiểu thêm điều gì."],"rw":"Ba mẹ kể một chuyện ba mẹ từng hiểu lầm người khác"}},{"t":"Đi đường an toàn","sk":6,"m":"9 phút","cx":[{"k":0,"s":"Chiều nay An được ba cho đạp xe trong con hẻm trước nhà. Mũ bảo hiểm hơi chật nên An định không đội.","q":"An nên làm gì?","o":[["Không đội vì chỉ đạp gần nhà",0,"Va chạm có thể xảy ra ngay cả ở gần nhà. Đội mũ là thói quen bảo vệ đầu."],["Đội lỏng quai cho đỡ chật",0,"Quai lỏng thì mũ dễ tuột khi cần nhất. Hãy chỉnh cho vừa."],["Nhờ ba chỉnh lại quai cho vừa, đội rồi mới đạp",1,"Mũ vừa vặn vừa thoải mái vừa an toàn. Nhờ ba giúp chỉ mất một phút."]]},{"k":1,"s":"Tan học, cổng trường rất đông xe đón. Vài bạn rủ An chạy ra giữa đường cho nhanh tìm ba.","q":"An nên làm gì?","o":[["Chạy theo các bạn",0,"Giữa dòng xe đông, người lái khó nhìn thấy trẻ em. Đứng ở chỗ an toàn sẽ tốt hơn."],["Đứng chờ ở chỗ hẹn trên vỉa hè hoặc trong sân trường cho đến khi thấy ba",1,"Có chỗ hẹn cố định thì ba dễ tìm con và con luôn an toàn."],["Tự đi bộ về nhà cho nhanh",0,"Tự về khi chưa có thoả thuận làm ba mẹ lo và không an toàn. Hãy chờ đúng chỗ hẹn."]]},{"k":2,"s":"Bà đưa An đi bộ đến trường. Thấy bạn Nam ở bên kia đường, An muốn chạy ngay qua dù đèn dành cho người đi bộ đang đỏ.","q":"An nên làm gì?","o":[["Đứng cạnh bà, chờ đèn xanh, nhìn trái phải rồi cùng bà qua ở vạch kẻ đường",1,"Đèn tín hiệu, vạch kẻ và người lớn đi cùng là ba điều giữ con an toàn. Bạn vẫn sẽ chờ con ở đó."],["Chạy nhanh qua vì đường đang vắng",0,"Đường trông vắng nhưng xe có thể đến rất nhanh. Chờ đèn xanh mới là an toàn."],["Gọi Nam chạy sang bên này",0,"Rủ bạn chạy qua đường làm bạn gặp nguy hiểm. Vẫy tay chào rồi chờ gặp nhau ở cổng trường."]]}],"qq":"Khi qua đường, điều quan trọng nhất là…","qo":["Đi thật nhanh","Đi theo bạn bè","Đi theo đèn tín hiệu và vạch kẻ, nhìn kỹ hai bên"],"qa":2,"mi":{"t":"Con dẫn đường an toàn cùng ba mẹ","s":"Khi đi bộ cùng ba mẹ, con là người “dẫn đường”: chỉ vạch kẻ, đợi đèn xanh cho người đi bộ, nhìn trái – phải – trái trước khi qua. Ba mẹ luôn đi cạnh con.","lv":["Ba mẹ nắm tay, con nói to từng bước khi qua đường.","Ba mẹ nhắc một lần ở đầu đường, con tự làm đúng ở mọi chỗ qua đường.","Con tự dẫn cả đoạn đường, chỉ ra một chỗ nguy hiểm và kể cách đi an toàn hơn."],"rw":"Cả nhà đi dạo và ghé chỗ con thích"}},{"t":"Giờ dùng màn hình có giới hạn","sk":7,"m":"9 phút","cx":[{"k":0,"s":"Ba mẹ cho An xem phim hoạt hình 30 phút sau khi làm bài. Hết giờ, phim đang đến đoạn hay, An xin xem thêm “một tập nữa thôi”.","q":"An nên làm gì?","o":[["Tắt khi đồng hồ báo, và ghi tên tập để mai xem tiếp",1,"Giữ đúng thoả thuận giúp ba mẹ tin con hơn. Phim vẫn ở đó chờ con ngày mai."],["Xin thêm một tập, rồi lại thêm một tập",0,"Phim thường được làm để mình muốn xem tiếp mãi. Tự dừng đúng giờ là kỹ năng quan trọng."],["Lén xem tiếp khi ba mẹ không để ý",0,"Lén lút làm mất lòng tin và con cũng không thấy thoải mái. Thành thật thoả thuận lại sẽ tốt hơn."]]},{"k":1,"s":"Giờ ra chơi, các bạn chụm đầu xem video trên máy tính bảng mà một bạn mang đi dù trường không cho. Bạn rủ An xem cùng.","q":"An nên làm gì?","o":[["Ngồi xem cùng cho vui",0,"Nội quy có lý do: giờ ra chơi để vận động và trò chuyện. Rủ bạn chơi trò khác sẽ vui hơn."],["Rủ các bạn chơi nhảy dây và nhắc nhẹ về nội quy",1,"Đưa ra một trò khác hấp dẫn giúp các bạn rời màn hình dễ dàng hơn."],["Đi mách cô ngay mà không nói gì với bạn",0,"Nhắc bạn trước là cách tử tế. Nếu bạn vẫn tiếp tục, khi ấy hãy nhờ cô."]]},{"k":2,"s":"Cả nhà đi ăn tối ở nhà hàng mừng sinh nhật ông. An mang máy tính bảng theo và muốn xem phim trong lúc chờ món.","q":"An nên làm gì?","o":[["Đeo tai nghe xem suốt bữa ăn",0,"Hôm nay là ngày của ông. Ông sẽ vui khi được cháu trò chuyện cùng."],["Xem đến khi đồ ăn ra rồi mới cất",0,"Thời gian chờ món cũng là lúc trò chuyện vui nhất. Thử cất máy từ đầu xem sao."],["Cất máy, hỏi ông chuyện ngày xưa và rủ cả nhà chơi đố vui",1,"Bữa ăn chung là lúc kết nối với nhau. Màn hình có thể chờ."]]}],"qq":"Cách giúp dừng xem màn hình đúng giờ là…","qo":["Đặt hẹn giờ và có sẵn việc khác để làm tiếp","Xem cho đến khi chán","Để ba mẹ giật điều khiển"],"qa":0,"mi":{"t":"Tắt màn hình đúng giờ","s":"Trước khi xem, con đặt hẹn giờ và chọn sẵn một việc làm tiếp (đọc sách, vẽ, ra ban công tưới cây). Khi chuông reo, con tự tắt trong vòng 1 phút. Ba mẹ xác nhận.","lv":["Ba mẹ cùng đặt giờ và nhắc con khi còn 5 phút.","Ba mẹ nhắc một lần lúc bắt đầu, con tự tắt khi chuông reo.","Con tự đặt giờ, tự tắt đúng giờ 3 ngày liền và kể lại việc con đã làm tiếp."],"rw":"Cả nhà chơi trò chơi ngoài trời cuối tuần"}},{"t":"So sánh giá trước khi mua","sk":8,"m":"10 phút","cx":[{"k":0,"s":"Mẹ nhờ An chọn kem đánh răng trên trang mua sắm, mẹ ngồi cạnh. Có tuýp nhỏ 20.000 đồng và tuýp gấp đôi 32.000 đồng.","q":"An nên làm gì?","o":[["Chọn tuýp nhỏ vì số tiền ít hơn",0,"Số tiền ít hơn chưa chắc rẻ hơn. Hãy tính giá cho cùng một lượng."],["Tính ra hai tuýp nhỏ là 40.000 đồng, nên tuýp lớn lợi hơn, rồi hỏi mẹ có dùng hết trước hạn không",1,"So sánh theo cùng một lượng cho biết đâu là giá tốt. Kiểm tra hạn dùng để không phí."],["Chọn tuýp có hình đẹp hơn",0,"Vỏ đẹp không làm kem tốt hơn. Nhìn vào lượng và giá sẽ chính xác hơn."]]},{"k":1,"s":"Hội chợ sách của trường bán một cuốn truyện An thích với giá 60.000 đồng. An nhớ hiệu sách gần nhà bán 45.000 đồng, nhưng hội chợ có tặng kèm thẻ đánh dấu sách.","q":"An nên làm gì?","o":[["Mua ngay ở hội chợ vì có quà",0,"Quà tặng nhỏ không đáng chênh 15.000 đồng. Hãy so sánh tổng giá trị."],["Mua cả hai nơi cho chắc",0,"Mua hai cuốn giống nhau là phí tiền. Chọn một nơi có lợi nhất."],["Nghĩ xem chênh 15.000 đồng có đáng với chiếc thẻ đánh dấu sách không, rồi bàn với ba mẹ",1,"Đồ tặng kèm hay làm mình quên so sánh. Tính ra chênh lệch giúp quyết định khôn ngoan."]]},{"k":2,"s":"Đi chợ cùng mẹ, An được tự mua trái cây ăn vặt trong tuần bằng 40.000 đồng. Sạp đầu tiên bán cam 30.000 đồng một ký, An định mua luôn.","q":"An nên làm gì?","o":[["Hỏi giá thêm hai sạp nữa, xem cam có tươi không, rồi mới chọn",1,"So sánh cả giá lẫn chất lượng giúp mình mua được thứ tốt với giá hợp lý."],["Mua luôn cho đỡ mất thời gian",0,"Mua ngay ở chỗ đầu tiên có thể đắt hơn chỗ khác. Đi xem thêm vài phút có khi tiết kiệm được."],["Chọn chỗ rẻ nhất dù cam đã dập",0,"Rẻ nhất chưa chắc là tốt nhất. Cam dập nhanh hỏng thì phí tiền hơn."]]}],"qq":"So sánh khi mua sắm nghĩa là…","qo":["Chỉ nhìn giá thấp nhất","Mua chỗ đông người nhất","Xem cả giá và chất lượng ở vài nơi"],"qa":2,"mi":{"t":"Thám tử giá cả khi đi chợ cùng ba mẹ","s":"Khi đi chợ hoặc siêu thị cùng ba mẹ, con so sánh giá và chất lượng một món (ví dụ trái cây) ở ít nhất 2 chỗ, rồi nói cho ba mẹ chỗ nào hợp lý hơn và vì sao. Ba mẹ là người mua.","lv":["Ba mẹ chỉ chỗ xem giá, con đọc giá và nhận xét chất lượng.","Ba mẹ nhắc một lần, con tự so sánh 2 chỗ và đưa ra lựa chọn.","Con tự so sánh 3 chỗ, tính xem chênh lệch bao nhiêu và giải thích lựa chọn cho ba mẹ."],"rw":"Con được chọn một loại trái cây cho cả nhà tráng miệng"}},{"t":"Nhờ giúp đỡ cho rõ ràng","sk":0,"m":"8 phút","cx":[{"k":0,"s":"An làm bài Toán đố mãi không ra. An chạy đến chỗ ba đang nấu cơm và nói: “Ba ơi, bài này khó quá, con không làm được!”","q":"An nên nhờ ba thế nào cho rõ?","o":[["Đưa vở cho ba và chờ ba làm hộ",0,"Ba làm hộ thì con không hiểu bài. Nói rõ chỗ vướng để ba hướng dẫn con tự làm."],["Nói: “Con hiểu đề rồi, nhưng không biết bước tiếp theo. Lúc ba nấu xong, ba xem giúp con được không?”",1,"Nói rõ mình đã làm được gì, vướng ở đâu và hỏi lúc nào tiện giúp người khác dễ giúp mình."],["Ngồi khóc vì không ai giúp",0,"Buồn khi bí bài là bình thường. Nói rõ điều cần sẽ giúp người khác biết cách giúp con."]]},{"k":1,"s":"Cô vừa giảng cách chia số có hai chữ số. An chưa hiểu bước thứ hai, nhưng ngại giơ tay vì sợ các bạn cười.","q":"An nên làm gì?","o":[["Gật đầu như đã hiểu",0,"Giả vờ hiểu thì về nhà vẫn bí. Hỏi một câu bây giờ đỡ cả buổi tối loay hoay."],["Chép bài bạn cho xong",0,"Chép thì không hiểu, đến bài kiểm tra vẫn bí. Nhờ giảng lại sẽ giúp con thật sự biết."],["Cuối giờ đến bàn cô: “Thưa cô, em chưa hiểu bước thứ hai, cô giảng lại giúp em được không ạ?”",1,"Hỏi riêng cuối giờ vừa bớt ngại vừa rõ ràng. Thầy cô luôn vui khi học sinh muốn hiểu bài."]]},{"k":2,"s":"Ở thư viện thiếu nhi, mẹ đang đọc sách ở góc bên kia. An muốn tìm sách về khủng long nhưng không thấy ở kệ nào.","q":"An nên làm gì?","o":[["Đến bàn cô thủ thư: “Cháu chào cô, cô chỉ giúp cháu kệ sách về khủng long cho thiếu nhi được không ạ?”",1,"Chào hỏi, nói rõ mình cần gì và cảm ơn — người giúp sẽ biết ngay cách giúp con."],["Lục tung các kệ cho đến khi thấy",0,"Lục kệ làm sách lộn xộn và mất thời gian. Hỏi cô thủ thư nhanh hơn nhiều."],["Bỏ cuộc, đọc đại cuốn khác",0,"Con biết mình muốn gì, chỉ cần hỏi đúng người. Thử nhờ cô thủ thư xem."]]}],"qq":"Một lời nhờ giúp rõ ràng cần có…","qo":["Giọng thật to","Mình cần giúp việc gì và vướng ở đâu","Câu “Làm hộ con với”"],"qa":1,"mi":{"t":"Nhờ giúp đỡ đủ ba ý","s":"Khi gặp bài khó, con nhờ ba mẹ bằng câu đủ ba ý: con đang làm gì, vướng ở chỗ nào, con đã thử gì. Ba mẹ nghe và xác nhận con nói đủ.","lv":["Ba mẹ nói mẫu một lời nhờ đủ ba ý, con nói theo với bài của con.","Ba mẹ nhắc một lần, con tự nói đủ ba ý khi nhờ.","Con tự nhờ đúng lúc ba mẹ rảnh, nói đủ ba ý và kể lại sau đó con tự làm tiếp được phần nào
