<style>
/* Bố cục: một trang sách giấy ở giữa màn hình, thanh điều hướng cố định trên/dưới; mỗi bài học là một trang cuộn được */
:root {
  --paper: #FFFBF4; --desk: #F4E7D6; --ink: #2A1F18; --mut: #7A6655; --line: #EBDCC8;
  --lotus: #C8102E; --lotus-soft: #FBE3E7; --gold: #E8A33A; --gold-soft: #FFF1D6; --jade: #2E8F72; --jade-soft: #DDF0E6;
  --on-lotus: #FFFFFF;
  --display: 'Baloo 2', 'Be Vietnam Pro', system-ui, sans-serif;
  --body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow: 0 1px 0 #E3D2BC, 0 18px 40px rgba(110, 60, 20, .12);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #241C17; --desk: #17110D; --ink: #F3E8DC; --mut: #BBA898; --line: #3B2F27;
  --lotus: #FF6B81; --on-lotus: #2A0B12; --lotus-soft: #3D1E25; --gold: #F2B65A; --gold-soft: #3A2C17; --jade: #5CC9A4; --jade-soft: #173328;
  --shadow: 0 1px 0 #0D0907, 0 18px 40px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #241C17; --desk: #17110D; --ink: #F3E8DC; --mut: #BBA898; --line: #3B2F27;
  --lotus: #FF6B81; --on-lotus: #2A0B12; --lotus-soft: #3D1E25; --gold: #F2B65A; --gold-soft: #3A2C17; --jade: #5CC9A4; --jade-soft: #173328;
  --shadow: 0 1px 0 #0D0907, 0 18px 40px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 16px/1.7 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--desk); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--desk);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font: 800 19px/1 var(--display); color: var(--lotus); margin-right: auto; }
.brand img { width: 34px; height: 34px; }
.vols { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.vols button { border: 0; background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 700; color: var(--mut); cursor: pointer; }
.vols button[aria-pressed="true"] { background: var(--lotus); color: var(--on-lotus); }
.tbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 700; cursor: pointer; }

.stage { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); }
.page { max-width: 720px; margin: 0 auto; background: var(--paper); border-radius: 6px 22px 22px 6px; box-shadow: var(--shadow);
  padding: clamp(22px, 5vw, 48px); position: relative; min-height: 70vh; border-left: 6px solid var(--line); animation: turn .28s ease; }
@keyframes turn { from { opacity: .3; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page { animation: none; } }
.folio { position: absolute; bottom: 14px; right: 22px; font-size: 12px; color: var(--mut); font-variant-numeric: tabular-nums; }
.run { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); font-weight: 600; margin-bottom: 10px; }

h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; }
h2 { font-size: clamp(24px, 4.6vw, 32px); font-weight: 800; }
h3 { font-size: 19px; font-weight: 700; }
p { margin: 0; max-width: 65ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--mut); }

/* bìa */
.cover { text-align: center; align-items: center; padding-top: 10px; }
.cover .lotus { width: min(62%, 260px); filter: drop-shadow(0 12px 18px rgba(200,16,46,.18)); animation: bob 4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { .cover .lotus { animation: none; } }
.cover .tap { display: inline-block; background: var(--lotus); color: var(--on-lotus); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 14px; }
.cover h1 { color: var(--lotus); font-size: clamp(38px, 9vw, 60px); }
.verse { font-family: var(--display); font-weight: 700; color: var(--lotus); font-size: clamp(17px, 3.6vw, 21px); line-height: 1.55; }

/* lời ngỏ, kỹ năng */
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 10px; }
.skill { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.dot { width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center; font: 800 15px var(--display); color: #FFF; }
.steps { display: grid; gap: 10px; counter-reset: s; padding: 0; margin: 0; list-style: none; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--gold-soft); color: var(--ink); font: 800 14px/28px var(--display); text-align: center; }

/* mục lục */
.toc-week { border-top: 1px solid var(--line); padding-top: 12px; }
.toc-week h3 { color: var(--lotus); margin-bottom: 6px; }
.toc a { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; color: var(--ink); text-decoration: none; border-radius: 8px; }
.toc a:hover .tt { color: var(--lotus); }
.toc .tt { flex: 1; min-width: 0; }
.toc .sk { font-size: 12.5px; color: var(--mut); }
.toc .ok { color: var(--jade); font-weight: 800; width: 18px; flex: none; }

/* tuần */
.week-open { text-align: center; align-items: center; }
.big-n { font: 800 clamp(70px, 16vw, 110px)/1 var(--display); color: var(--gold); }
.slot { width: 150px; height: 150px; border-radius: 50%; border: 3px dashed var(--gold); display: grid; place-items: center; color: var(--mut); font-size: 13px; padding: 20px; text-align: center; line-height: 1.35; }
.wk-list { text-align: left; width: 100%; max-width: 440px; display: grid; gap: 6px; }

/* bài học */
.lhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--lotus-soft); color: var(--lotus); }
.chip.g { background: var(--gold-soft); color: var(--ink); }
.scene { border-top: 1px dashed var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.scene-tag { font: 700 13px var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--jade); display: flex; align-items: center; gap: 8px; }
.scene-tag b { width: 26px; height: 26px; border-radius: 9px; background: var(--jade); color: #FFF; display: grid; place-items: center; font-size: 14px; }
.story { font-size: 17px; line-height: 1.75; }
.listen { align-self: flex-start; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--mut); }
.q { font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: transparent; border-radius: 14px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.opt .l { width: 28px; height: 28px; border-radius: 9px; background: var(--gold-soft); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.opt .tip { grid-column: 2; font-size: 14px; color: var(--mut); display: none; }
.opt.show .tip { display: block; }
.opt.show.right { border-color: var(--jade); background: var(--jade-soft); }
.opt.show.right .l { background: var(--jade); color: #FFF; }
.opt.show.wrong { border-color: var(--gold); }
.hint { font-size: 13px; color: var(--mut); }
.quiz { background: var(--gold-soft); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.quiz .opt { background: var(--paper); }
.mission { border: 2px solid var(--lotus); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.mission .eyebrow { font: 800 13px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--lotus); }
.lv { display: grid; gap: 8px; }
.lv label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; cursor: pointer; }
.lv input { width: 20px; height: 20px; accent-color: var(--jade); margin-top: 3px; }
.lv .n { font-weight: 700; color: var(--lotus); }
.reward { border: 1.5px dashed var(--gold); background: var(--gold-soft); border-radius: 14px; padding: 10px 12px; font-size: 15px; }
.sign { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--mut); }
.sign span { flex: 1; min-width: 150px; border-bottom: 1px dotted var(--mut); padding-bottom: 18px; }
.done-btn { align-self: flex-start; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; background: var(--jade); color: #FFF; }
.done-btn[aria-pressed="true"] { background: var(--jade-soft); color: var(--jade); }

/* đáp án, giấy khen */
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 4px 18px; font-size: 14px; font-variant-numeric: tabular-nums; }
.cert { border: 3px double var(--gold); border-radius: 18px; padding: clamp(20px, 5vw, 40px); text-align: center; align-items: center; }
.cert .name { width: min(100%, 360px); border-bottom: 2px dotted var(--mut); height: 40px; }

/* điều hướng dưới */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--desk); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; }
.nav button.go { border: 0; background: var(--lotus); color: var(--on-lotus); border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
.nav button.go:disabled { opacity: .35; cursor: default; }
.nav .mid { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; background: var(--jade); }
.legal { font-size: 12px; color: var(--mut); }
</style>

<script id="book-data" type="application/json">{"skills":["Giao tiếp","Quản lý cảm xúc","Làm việc nhóm","Tự lập","Giải quyết vấn đề","Tư duy phản biện","An toàn & ranh giới","Quản lý thời gian","Tài chính cá nhân"],"bands":[{"id":"5-8","label":"6–8 tuổi","hero":"Bin","lessons":[{"t":"Nói ra cảm xúc của mình","sk":1,"m":"6 phút","cx":[{"k":0,"s":"Bin đang xếp tháp khối thì bạn Na chạy qua làm đổ hết. Bin thấy nóng trong người, mắt cay cay và muốn hét thật to.","q":"Nếu là Bin, con sẽ làm gì?","o":[["Hét lên và đẩy bạn Na",0,"Cơn giận nói thay con rồi. Đẩy bạn làm bạn đau mà tháp vẫn chưa xây lại được."],["Hít sâu rồi nói: “Tớ đang giận vì tháp bị đổ”",1,"Gọi tên cảm xúc giúp cơn giận nhỏ lại, và bạn Na hiểu vì sao con buồn."],["Im lặng bỏ đi, không chơi nữa",0,"Cảm xúc bị giữ lại bên trong sẽ càng nặng. Con có thể nói ra thật nhẹ nhàng."]]},{"k":1,"s":"Ở lớp, một bạn ngồi mất chỗ quen của Bin. Bin thấy nóng trong người nhưng cô đang giảng bài.","q":"Bin nên làm gì lúc này?","o":[["Giật lại chỗ và nói thật to",0,"Giành lại giữa giờ học làm cả lớp mất tập trung, mà cơn giận vẫn còn nguyên."],["Hít sâu ba lần, hết tiết mới nói: “Mình buồn vì đó là chỗ của mình”",1,"Chờ đúng lúc rồi gọi tên cảm xúc. Lớp vẫn yên mà bạn kia vẫn biết mình nghĩ gì."],["Ngồi im và khóc một mình",0,"Khóc là bình thường, nhưng không nói ra thì bạn kia không biết mình đang buồn."]]},{"k":2,"s":"Ở khu vui chơi, Bin xếp hàng rất lâu thì một bạn chen lên trước. Xung quanh ồn và mẹ đứng khá xa.","q":"Bin nên làm gì?","o":[["Chen lên trước lại",0,"Chen đáp trả thì hàng loạn thêm, và Bin cũng thành người chen."],["Nói rõ “Bạn ơi, mình đang xếp trước”, nếu bạn không nghe thì tìm mẹ",1,"Nói một câu rõ ràng trước đã. Ở chỗ đông người, nhờ người lớn không phải là mách."],["Bỏ sang chỗ khác chơi",0,"Bỏ đi thì không ai biết chuyện gì xảy ra, lần sau vẫn lặp lại."]]}],"qq":"Khi giận, việc đầu tiên nên làm là gì?","qo":["Hít sâu ba lần","Hét thật to","Giành lại đồ chơi"],"qa":0,"mi":{"t":"Nói cảm xúc bằng câu “Con cảm thấy… vì…”","s":"Trong bữa tối nay, con kể với ba mẹ một lúc con thấy vui, buồn hoặc giận hôm nay, nói đủ câu “Con cảm thấy… vì…”, rồi cả nhà cùng hít sâu ba lần.","lv":["Ba mẹ nói mẫu trước một câu, con nói theo và cùng ba mẹ hít sâu ba lần.","Ba mẹ nhắc một lần, con tự nói câu cảm xúc của mình trong bữa tối.","Con tự mở lời, nói đủ “Con cảm thấy… vì…”, tự hít sâu ba lần và nghe ba mẹ đáp lại."],"rw":"Một cái ôm thật chặt và lời khen trước cả nhà"}},{"t":"Chào hỏi người lớn","sk":0,"m":"5 phút","cx":[{"k":0,"s":"Ông bà sang nhà chơi. Bin đang xem hoạt hình rất hay, ông bà bước vào cửa và nhìn Bin.","q":"Bin nên làm gì trước tiên?","o":[["Cứ xem tiếp, lát nữa chào",0,"Ông bà sẽ thấy hơi tủi. Chỉ cần 5 giây để làm ông bà vui cả buổi."],["Tạm dừng phim, đứng lên chào “Con chào ông bà!”",1,"Dừng việc mình đang làm, đứng lên và nhìn vào mắt — đó là lời chào tử tế."],["Chào nhưng vẫn nhìn màn hình",0,"Có lời chào nhưng chưa có ánh mắt. Người lớn cảm nhận được điều đó."]]},{"k":1,"s":"Bin vào lớp muộn năm phút. Cô giáo đang viết bảng, cả lớp đã ngồi yên.","q":"Bin nên làm gì ở cửa lớp?","o":[["Lẻn vào chỗ ngồi cho nhanh",0,"Vào không xin phép làm cô không biết con đã đến, và con cũng bỏ qua lời chào."],["Đứng ở cửa, nói “Con chào cô, con xin phép vào lớp ạ”",1,"Ở lớp, lời chào đi kèm một câu xin phép. Nói rõ, không cần nói to."],["Chờ ngoài cửa đến hết tiết",0,"Chờ ngoài cửa thì con mất cả tiết học, mà chỉ cần một câu xin phép là vào được."]]},{"k":2,"s":"Bin theo mẹ vào thang máy chung cư. Ba bác hàng xóm đã đứng sẵn bên trong.","q":"Bin nên làm gì khi cửa đóng lại?","o":[["Nhìn xuống điện thoại của mẹ",0,"Không chào thì các bác nghĩ Bin không thấy mình. Một câu chào chung là đủ."],["Nói một câu chào chung: “Con chào các bác ạ”",1,"Đông người thì một câu chào chung là đủ lịch sự, không cần chào từng người."],["Chào từng bác một thật dài",0,"Thang máy chỉ đi vài giây. Chào dài làm mọi người lúng túng."]]}],"qq":"Lời chào tử tế cần gì?","qo":["Nhìn vào mắt và nói rõ","Nói thật to","Chào qua vai"],"qa":0,"mi":{"t":"Chào người lớn: nhìn mắt, nói rõ","s":"Hôm nay khi ba mẹ đi làm về hoặc có ông bà, họ hàng đến nhà, con dừng việc đang làm, nhìn vào mắt và chào thật rõ. Ba mẹ nghe và xác nhận.","lv":["Ba mẹ chào mẫu trước, con chào theo, đứng cạnh ba mẹ.","Ba mẹ nhắc một lần, con tự dừng xem ti vi và chào.","Con tự nhớ chào ít nhất hai người lớn trong ngày và kể lại cho ba mẹ."],"rw":"Ba mẹ kể một chuyện hồi nhỏ của ba mẹ"}},{"t":"Chia sẻ đồ chơi với bạn","sk":2,"m":"5 phút","cx":[{"k":0,"s":"Bin chỉ có một chiếc xe cứu hoả. Bạn Na đến chơi và cũng rất muốn chơi chiếc xe đó.","q":"Cách nào làm cả hai đều vui?","o":[["Giữ chặt xe, không cho ai",0,"Xe là của Bin, nhưng buổi chơi sẽ hết vui và Na sẽ không muốn quay lại."],["Đặt hẹn giờ: mỗi bạn chơi 5 phút",1,"Luật rõ ràng làm việc chia sẻ dễ hơn. Cả hai đều biết lượt mình đến khi nào."],["Cho Na hết rồi ngồi buồn một mình",0,"Nhường hết cũng không phải chia sẻ. Chia sẻ là cả hai đều được chơi."]]},{"k":1,"s":"Ở lớp chỉ còn một hộp bút màu. Bin và bạn cùng bàn đều cần dùng ngay để kịp nộp bài.","q":"Cách nào giúp cả hai kịp bài?","o":[["Ai lấy được trước thì dùng",0,"Giành trước thì một bạn không kịp bài, và lần sau bạn ấy cũng giành."],["Đặt hộp bút ở giữa, mỗi bạn lấy màu mình cần rồi trả lại",1,"Ở lớp, chia theo lượt từng cây bút nhanh hơn chia theo thời gian."],["Nhường hết cho bạn",0,"Nhường hết thì Bin không kịp bài. Chia sẻ là cả hai cùng được, không phải một bên mất."]]},{"k":2,"s":"Sân chơi công cộng chỉ có một cái xích đu. Ba bạn nhỏ chưa quen nhau cùng muốn chơi.","q":"Bin nên đề nghị điều gì?","o":[["Chơi trước vì Bin đến trước",0,"Đến trước là một lý do, nhưng không có luật thì hai bạn kia vẫn thấy không công bằng."],["Đề nghị đếm đến 20 rồi đổi lượt, ai cũng được chơi",1,"Với người chưa quen, một luật đơn giản nói ra trước sẽ tránh được cãi nhau."],["Đợi hai bạn kia chán rồi mới chơi",0,"Chờ mãi thì Bin không được chơi, mà hai bạn kia cũng không học được cách chia lượt."]]}],"qq":"Chia sẻ nghĩa là gì?","qo":["Cả hai đều được chơi","Mình nhường hết","Ai khoẻ hơn thì giữ"],"qa":0,"mi":{"t":"Chia sẻ một món đồ chơi theo lượt","s":"Con chọn một món đồ chơi con thích và chơi lần lượt với anh chị em, bạn hoặc ba mẹ, mỗi người vài phút, dùng đồng hồ hẹn giờ. Ba mẹ xem cả hai cùng được chơi.","lv":["Ba mẹ hẹn giờ và nhắc từng lượt, con đưa đồ chơi khi hết lượt.","Ba mẹ nhắc một lần, con tự nói “Đến lượt bạn nhé” khi hết giờ.","Con tự đề nghị chia lượt, tự hẹn giờ cùng người lớn và kể lại hai bạn đã chơi thế nào."],"rw":"Được chọn trò chơi cả nhà chơi cuối tuần"}},{"t":"Tự dọn góc học tập","sk":3,"m":"7 phút","cx":[{"k":0,"s":"Bàn học của Bin đầy bút, giấy và vụn gôm. Mẹ nói: “Đến giờ ăn cơm rồi.” Bin thấy bàn quá bừa nên không biết bắt đầu từ đâu.","q":"Bin bắt đầu thế nào cho dễ?","o":[["Đẩy hết vào ngăn kéo cho nhanh",0,"Bàn sạch nhưng mai tìm bút sẽ khổ. Dọn là để lần sau dễ hơn."],["Chia ba việc nhỏ: bút vào hộp, giấy xếp lại, vụn vào thùng",1,"Việc lớn chia thành ba việc nhỏ là làm được ngay. Đó là cách người tự lập làm."],["Nhờ mẹ dọn giúp hết",0,"Mẹ giúp được, nhưng góc học là của con — tự dọn thì con biết mọi thứ ở đâu."]]},{"k":1,"s":"Hết tiết Mỹ thuật, bàn của cả tổ đầy giấy vụn. Chuông ra chơi vừa reo.","q":"Bin nên bắt đầu thế nào?","o":[["Chạy ra chơi trước, dọn sau",0,"Để lại thì tổ khác vào học phải dọn hộ. Việc nhỏ làm ngay thì rất nhanh."],["Rủ cả tổ: mỗi bạn nhặt phần bàn trước mặt mình",1,"Việc lớn chia cho nhiều người thì thành việc nhỏ. Ở lớp, rủ được cả tổ là nhanh nhất."],["Tự dọn hết một mình cho nhanh",0,"Dọn hộ cả tổ thì Bin mất giờ ra chơi, và các bạn không học được phần trách nhiệm của mình."]]},{"k":2,"s":"Cả nhà đi ăn hàng. Bin làm rơi khăn giấy và ống hút xuống sàn quán, xung quanh rất đông.","q":"Bin nên làm gì?","o":[["Coi như không thấy, lát nữa nhân viên dọn",0,"Đồ mình làm rơi thì mình nhặt, kể cả khi có người dọn thuê."],["Nhặt lên, bỏ vào đĩa đựng rác trên bàn",1,"Ở nơi công cộng, dọn phần của mình là cách tôn trọng người làm việc ở đó."],["Lấy chân đẩy vào gầm bàn",0,"Giấu đi không phải là dọn. Người sau vẫn phải nhặt, chỉ là không thấy mình làm."]]}],"qq":"Việc lớn dễ làm hơn khi…","qo":["Chia thành vài việc nhỏ","Làm thật nhanh","Chờ người khác làm"],"qa":0,"mi":{"t":"Dọn góc học tập theo ba bước nhỏ","s":"Trước giờ ăn tối, con dọn bàn học theo ba bước: cất bút vào hộp, xếp giấy vở gọn, lau vụn gôm. Xong thì gọi ba mẹ đến xem.","lv":["Ba mẹ cùng con làm từng bước, ba mẹ đọc tên bước, con làm.","Ba mẹ nhắc một lần, con tự làm đủ ba bước.","Con tự nhớ dọn bàn sau khi học xong và kể lại con đã làm bước nào trước."],"rw":"Được dán một ngôi sao lên bảng khen của gia đình"}},{"t":"Người lạ và cái “không”","sk":6,"m":"6 phút","cx":[{"k":0,"s":"Bin ở nhà với bà. Có người bấm chuông nói là thợ sửa điện ba mẹ gọi, nhưng bà đang ở sau bếp.","q":"Bin nên làm gì?","o":[["Mở cửa vì chú ấy nói ba mẹ gọi",0,"Ai cũng có thể nói câu đó. Trẻ con không phải người mở cửa cho người lạ."],["Không mở cửa, chạy ra sau gọi bà",1,"Ở nhà cũng có quy tắc như ngoài đường: người lớn mới là người mở cửa."],["Nói qua cửa là ba mẹ đi vắng",0,"Đừng cho người lạ biết trong nhà có ai. Chỉ cần đi gọi người lớn."]]},{"k":1,"s":"Trong sân trường giờ ra chơi, một anh lớp lớn rủ Bin ra cổng sau xem đồ chơi mới.","q":"Bin nên làm gì?","o":[["Đi xem một chút rồi về ngay",0,"Rời khỏi chỗ có cô giáo là bước nguy hiểm nhất, dù người rủ là bạn cùng trường."],["Nói “Em không đi đâu” và đứng lại chỗ đông bạn",1,"Ở trường cũng có quy tắc như ngoài đường: không rời khỏi chỗ có người lớn trông."],["Không nói gì và đi theo",0,"Im lặng đi theo là cách người khác dễ dẫn mình đi nhất."]]},{"k":2,"s":"Bin đứng chờ mẹ trước cổng trường. Một người lạ nói: “Mẹ con nhờ chú chở về, lên xe đi.”","q":"Bin nên làm gì?","o":[["Lên xe vì người đó biết tên mẹ",0,"Biết tên chưa chắc là người mẹ nhờ. Người mẹ nhờ luôn biết mật khẩu gia đình."],["Nói to “Không!”, chạy vào cổng trường tìm cô giáo",1,"Nói không, rời xa, tìm người lớn tin cậy. Ba bước này con luôn được phép làm."],["Im lặng đứng đó chờ xem sao",0,"Im lặng làm con ở lại gần nguy hiểm. Rời xa trước, hỏi sau."]]}],"qq":"Ba bước khi thấy không an toàn?","qo":["Nói không – rời xa – tìm người tin cậy","Chờ – im lặng – đi theo","Hỏi người lạ thêm"],"qa":0,"mi":{"t":"Tập ba bước: nói không, rời xa, tìm người tin cậy","s":"Ở nhà, ba mẹ đóng vai người lạ rủ con đi theo. Con tập nói “Không!” thật to, bước ra xa và chạy đến người lớn tin cậy (ba hoặc mẹ còn lại, ông bà). Cả nhà thống nhất một “mật khẩu gia đình”.","lv":["Ba mẹ làm mẫu ba bước trước, con làm theo từng bước.","Ba mẹ nhắc một lần, con tự làm đủ ba bước và nói được mật khẩu gia đình.","Con tự kể lại ba bước, giải thích vì sao không đi theo người không nói đúng mật khẩu."],"rw":"Cả nhà chơi trốn tìm trong nhà"}},{"t":"Chờ đến lượt mình nói","sk":0,"m":"5 phút","cx":[{"k":0,"s":"Mẹ đang nói chuyện điện thoại với bà. Bin muốn khoe ngay bức tranh vừa vẽ xong.","q":"Bin nên làm gì?","o":[["Kéo áo mẹ và gọi “Mẹ ơi, mẹ ơi!” liên tục",0,"Gọi liên tục thì bà không nghe rõ mẹ nói. Con chờ một chút nhé, bức tranh vẫn đợi con mà."],["Bỏ đi chỗ khác và giận mẹ",0,"Chờ đợi hơi khó, nhưng mẹ không quên con đâu. Con thử đặt tay lên tay mẹ và đợi nhé."],["Đặt nhẹ tay lên tay mẹ và chờ mẹ nói xong",1,"Chạm nhẹ là cách nói “con đang chờ” mà không cắt lời. Mẹ nói xong sẽ quay sang xem ngay."]]},{"k":1,"s":"Cô giáo đang giảng bài. Bin chợt nhớ ra một chuyện rất vui muốn kể cho cả lớp.","q":"Bin nên làm gì?","o":[["Nói to luôn để khỏi quên",0,"Con sợ quên là đúng, nhưng nói chen làm cả lớp mất bài. Con giơ tay rồi chờ nhé."],["Thì thầm kể cho bạn bên cạnh",0,"Thì thầm làm bạn bỏ lỡ bài giảng. Giờ ra chơi con kể cho bạn nghe nhé."],["Giơ tay và chờ cô gọi tên",1,"Giơ tay giúp cả lớp được nói lần lượt. Cô sẽ dành lúc cho con kể."]]},{"k":2,"s":"Ở tiệm bánh, cô bán hàng đang trả lời bác đứng trước. Bin muốn hỏi ngay có bánh dâu không, mẹ đứng cạnh Bin.","q":"Bin nên làm gì?","o":[["Gọi to “Cô ơi!” nhiều lần",0,"Gọi liên tục làm cô bối rối. Cô sẽ quay sang khi xong việc với bác."],["Đứng chờ cạnh mẹ, khi cô quay sang thì hỏi",1,"Chờ đến lượt là tôn trọng người khác, và cô cũng nghe con rõ hơn."],["Chen lên hỏi trước bác ấy",0,"Bác ấy đến trước nên được hỏi trước. Chờ một chút là đến lượt con."]]}],"qq":"Khi người lớn đang nói, con nên…","qo":["Chờ người ta nói xong rồi mới nói","Chen vào nói ngay","Nói thật to cho người ta nghe"],"qa":0,"mi":{"t":"Chờ người lớn nói xong rồi mới nói","s":"Hôm nay khi ba mẹ đang nói chuyện hoặc gọi điện, con muốn nói gì thì đặt nhẹ tay lên vai ba mẹ và chờ. Khi ba mẹ nói xong và quay sang, con mới nói.","lv":["Ba mẹ cùng con tập trước một lần: ba mẹ giả vờ gọi điện, con đặt tay và chờ.","Ba mẹ nhắc một lần, con tự đặt tay và chờ trong lúc ba mẹ nói chuyện thật.","Con tự nhớ chờ đến lượt ít nhất hai lần trong ngày và kể lại con đã chờ thế nào."],"rw":"Ba mẹ đọc truyện bằng giọng các nhân vật"}},{"t":"Lỡ làm đổ nước","sk":4,"m":"6 phút","cx":[{"k":0,"s":"Bin rót nước thì cốc bị đổ, nước chảy lênh láng trên bàn ăn. Mẹ đang nấu cơm trong bếp.","q":"Bin nên làm gì đầu tiên?","o":[["Đứng im vì sợ bị mắng",0,"Sợ là bình thường, nhưng nước chảy xuống sàn sẽ trơn. Lau trước rồi nói với mẹ nhé."],["Lấy khăn lau, rồi nói với mẹ: “Con lỡ làm đổ nước”",1,"Lau ngay để nước không lan, nói thật để mẹ giúp nếu cần. Ai cũng có lúc lỡ tay."],["Đi chỗ khác như không có gì",0,"Nước vẫn còn đó và có thể làm ai trượt ngã. Con tự lau được, mẹ sẽ rất vui."]]},{"k":1,"s":"Giờ vẽ, Bin làm đổ cốc nước rửa bút lên bàn. Nước màu sắp chảy sang vở của bạn Mai.","q":"Bin nên làm gì?","o":[["Ngồi khóc",0,"Buồn thì được, nhưng nước vẫn đang chảy. Con nhấc vở bạn lên trước nhé."],["Nói “Không phải tớ!”",0,"Nói vậy thì vở bạn Mai vẫn bị ướt. Nhận là mình lỡ tay sẽ dễ sửa hơn."],["Nhấc vở bạn Mai lên, lấy giấy thấm và báo cô",1,"Cứu vở bạn trước, rồi lau và nhờ cô. Con đã sửa chuyện thật nhanh."]]},{"k":2,"s":"Ở quán ăn cùng ba, Bin làm đổ bát nước chấm nhỏ ra bàn.","q":"Bin nên làm gì?","o":[["Nói với ba, rồi cùng ba nhờ cô phục vụ lau giúp",1,"Ở ngoài, nói với ba và nhờ người làm ở quán là cách sửa nhanh và lịch sự."],["Lấy tay gạt xuống đất",0,"Nước chấm xuống đất làm người khác dễ trượt. Mình nhờ cô phục vụ lau giúp nhé."],["Lấy khăn giấy che lại cho ba khỏi thấy",0,"Che đi thì vết đổ vẫn còn đó. Nói với ba, ba sẽ cùng con dọn."]]}],"qq":"Khi lỡ làm đổ, việc đầu tiên là…","qo":["Giấu đi","Dọn ngay và nói với người lớn","Đổ lỗi cho người khác"],"qa":1,"mi":{"t":"Tập dọn khi lỡ làm đổ nước","s":"Cùng ba mẹ, con đổ một ít nước lên khay hoặc bàn (không gần ổ điện), rồi tập: lấy khăn lau ngay và nói với ba mẹ “Con lỡ làm đổ, con dọn rồi ạ”.","lv":["Ba mẹ chỉ chỗ để khăn, cùng con lau và nói câu mẫu.","Ba mẹ nhắc một lần, con tự lấy khăn, lau sạch và nói với ba mẹ.","Con tự lau và nói khi lỡ làm đổ thật trong tuần này, rồi kể lại."],"rw":"Được chọn loại trái cây tráng miệng"}},{"t":"Phim hoạt hình có thật không?","sk":5,"m":"6 phút","cx":[{"k":0,"s":"Trong phim hoạt hình, chú thỏ chỉ ăn kẹo mà vẫn khoẻ nhất rừng. Bin nói với ba: “Con cũng chỉ ăn kẹo thôi!”","q":"Con nghĩ sao?","o":[["Phim chiếu vậy thì chắc là đúng",0,"Phim hoạt hình được vẽ ra cho vui, nhiều chuyện không có thật. Con có thể hỏi ba mẹ."],["Hỏi ba: “Ngoài đời ăn kẹo có khoẻ không ạ?”",1,"Hỏi lại người lớn giúp con biết đâu là thật, đâu là tưởng tượng."],["Ăn thật nhiều kẹo để thử",0,"Thử như vậy dễ đau bụng, sâu răng. Hỏi trước bao giờ cũng an toàn hơn."]]},{"k":1,"s":"Bạn Tí nói chắc nịch: “Mèo nhà nào cũng biết nói, tớ thấy trên phim rồi!”","q":"Bin nên trả lời thế nào?","o":[["“Cậu nói dối!”",0,"Bạn không nói dối, bạn chỉ tin vào phim. Mình có thể nói nhẹ nhàng hơn."],["“Ừ, đúng rồi!”",0,"Gật đầu theo thì cả hai cùng hiểu sai. Thử cùng bạn suy nghĩ nhé."],["“Mèo nhà tớ chỉ kêu meo meo. Mình hỏi cô xem nhé!”",1,"Con so với điều mình thấy thật, rồi cùng bạn hỏi cô. Thế là suy nghĩ rất giỏi."]]},{"k":2,"s":"Ở công viên cùng mẹ, Bin nghe một bạn đội mũ siêu nhân nói: “Đội mũ này là bay được!”","q":"Bin nên làm gì?","o":[["Hỏi mẹ: “Mũ có làm người ta bay được không ạ?”",1,"Chuyện nghe lạ thì hỏi người lớn. Mũ chỉ là đồ chơi vui thôi."],["Đòi mẹ mua mũ giống vậy để bay",0,"Mũ đẹp thì vui, nhưng không làm ai bay được. Hỏi lại trước khi tin nhé."],["Tin luôn và về kể cho cả lớp",0,"Kể khi chưa chắc thì các bạn cũng hiểu sai. Mình hỏi người lớn trước đã."]]}],"qq":"Khi thấy chuyện lạ trên phim, con nên…","qo":["Hỏi người lớn xem có thật không","Làm theo ngay","Tin luôn"],"qa":0,"mi":{"t":"Tìm một điều “không có thật” trong phim hoạt hình","s":"Khi xem một tập phim hoạt hình cùng ba mẹ, con tìm một điều chỉ có trong phim (con vật biết nói, ăn kẹo mà vẫn khoẻ…) và hỏi ba mẹ “Ngoài đời có thật không ạ?”.","lv":["Ba mẹ chỉ một chi tiết, con trả lời có thật hay không thật.","Ba mẹ nhắc một lần, con tự tìm một chi tiết và hỏi ba mẹ.","Con tự tìm hai chi tiết, nói vì sao con nghĩ không có thật và nghe ba mẹ giải thích."],"rw":"Cùng ba mẹ vẽ một bức tranh"}},{"t":"Buổi sáng không vội vàng","sk":7,"m":"6 phút","cx":[{"k":0,"s":"Sáng nào Bin cũng vừa ăn vừa tìm giày, suýt muộn học. Mẹ đưa Bin một tờ giấy vẽ các việc buổi sáng.","q":"Bin nên dùng tờ giấy thế nào?","o":[["Dán cạnh giường, làm lần lượt từng việc và đánh dấu",1,"Làm lần lượt từng bước giúp buổi sáng gọn gàng, con thấy rõ mình đã xong gì."],["Làm việc thích trước, việc chán để sau",0,"Việc chán để sau thường bị quên, như đôi giày lại mất tích. Làm theo thứ tự sẽ nhẹ hơn."],["Cất tờ giấy vào ngăn kéo",0,"Cất đi thì sáng mai con không nhìn thấy. Dán chỗ dễ thấy sẽ giúp con nhớ."]]},{"k":1,"s":"Cô cho cả lớp 5 phút cất sách vở trước giờ ra chơi. Bàn Bin còn bút, thước, vở và hộp màu.","q":"Bin nên làm thế nào cho kịp?","o":[["Ngồi chơi tiếp, hết giờ mới cất",0,"Hết giờ mới cất thì con mất giờ ra chơi. Bắt đầu ngay sẽ có nhiều thời gian chơi hơn."],["Cất lần lượt: vở trước, rồi bút thước, cuối cùng là hộp màu",1,"Chia ra từng bước nhỏ thì 5 phút là đủ, không bỏ sót món nào."],["Gom hết vào cặp thật nhanh",0,"Nhanh thật nhưng màu dễ gãy, vở bị nhàu. Cất theo thứ tự cũng nhanh mà gọn hơn."]]},{"k":2,"s":"Ở bể bơi, ba nói còn 10 phút nữa là về. Bin cần lên bờ, tắm tráng và thay đồ.","q":"Bin nên làm gì?","o":[["Bơi thêm chút nữa rồi tính",0,"Bơi thêm thì ba phải chờ. Lên bờ ngay để có đủ thời gian nhé."],["Mặc đồ luôn khi người còn ướt",0,"Vội quá thì áo ướt, khó chịu. Lau khô một chút cũng chỉ mất ít thời gian thôi."],["Lên bờ ngay, làm lần lượt: tắm, lau khô, thay đồ",1,"Biết còn bao lâu và làm lần lượt từng việc giúp con kịp giờ mà không vội vàng."]]}],"qq":"Buổi sáng nhanh hơn khi con…","qo":["Làm nhiều việc cùng lúc","Làm lần lượt từng việc theo thứ tự","Chờ mẹ nhắc từng việc"],"qa":1,"mi":{"t":"Làm buổi sáng theo tranh các việc","s":"Cùng ba mẹ vẽ một tờ tranh 4–5 việc buổi sáng (đánh răng, thay đồ, ăn sáng, đi giày, đeo cặp). Sáng mai con làm lần lượt và đánh dấu từng việc.","lv":["Ba mẹ đọc từng việc trên tranh, con làm và đánh dấu.","Ba mẹ nhắc một lần “Xem tranh nhé”, con tự làm theo thứ tự.","Con tự xem tranh, làm xong cả buổi sáng không cần nhắc và cho ba mẹ xem các dấu tích."],"rw":"Được chọn bài hát trên đường đi học"}},{"t":"Cần hay muốn?","sk":8,"m":"6 phút","cx":[{"k":0,"s":"Bin có 10 nghìn đồng tiền tiêu vặt. Bút chì của Bin đã gãy hết, Bin cũng muốn mua hình dán.","q":"Bin nên mua gì trước?","o":[["Bút chì trước, còn tiền thì tính hình dán sau",1,"Bút là thứ cần cho việc học. Mua thứ cần trước là cách tiêu tiền khôn ngoan."],["Hình dán, vì đẹp hơn",0,"Hình dán vui, nhưng không có bút thì mai con khó làm bài. Thứ cần trước, thứ muốn sau."],["Mượn bút của em, lấy tiền mua hình dán",0,"Em cũng cần bút của em. Con tự mua thứ mình cần thì ai cũng vui."]]},{"k":1,"s":"Ở lớp, các bạn kể mình mới có hộp bút ba tầng. Hộp bút của Bin vẫn còn dùng tốt.","q":"Bin nghĩ sao?","o":[["Hộp bút của mình còn tốt, mình chưa cần mua mới",1,"Bạn có đồ mới không có nghĩa là mình cũng cần. Đồ còn tốt thì dùng tiếp."],["Về nhà đòi mẹ mua hộp bút mới ngay",0,"Hộp bút cũ vẫn dùng tốt nên hộp mới là thứ muốn. Thứ muốn thì mình có thể chờ."],["Giấu hộp bút cũ vì ngại",0,"Hộp bút của con vẫn làm tốt việc của nó, không có gì phải ngại cả."]]},{"k":2,"s":"Bin đi siêu thị cùng mẹ để mua sữa và bàn chải đánh răng. Ở quầy tính tiền, Bin thấy một chiếc xe đồ chơi rất đẹp.","q":"Bin nên nghĩ thế nào?","o":[["Bỏ bàn chải lại để lấy xe",0,"Bàn chải giúp răng khoẻ mỗi ngày, xe thì chờ được. Mua thứ cần trước nhé."],["Sữa và bàn chải là thứ cần, xe đồ chơi là thứ muốn, để dịp khác",1,"Thứ cần giúp mình sống khoẻ mỗi ngày, thứ muốn có thể chờ. Biết phân biệt là con lớn rồi."],["Khóc để mẹ mua bằng được",0,"Khóc làm cả hai buồn mà xe vẫn chưa phải thứ cần. Con có thể nói: “Con thích, mình để dành nhé.”"]]}],"qq":"Thứ nào là thứ “cần”?","qo":["Nước uống sạch","Đồ chơi mới","Kẹo nhiều màu"],"qa":0,"mi":{"t":"Chơi phân loại “cần” và “muốn”","s":"Ở nhà, con cùng ba mẹ chọn 6 món đồ hoặc tranh (nước uống, bàn chải, đồ chơi, kẹo, áo, sách…) và xếp thành hai nhóm “cần” và “muốn”, giải thích một món.","lv":["Ba mẹ hỏi từng món, con trả lời “cần” hay “muốn”.","Ba mẹ nhắc một lần, con tự xếp cả 6 món vào hai nhóm.","Con tự xếp và giải thích vì sao một món là “cần”, một món là “muốn”."],"rw":"Một buổi dã ngoại nhỏ ngay trong nhà"}},{"t":"Quảng cáo có nói thật hết không?","sk":5,"m":"6 phút","cx":[{"k":0,"s":"Trên ti vi, quảng cáo nói: “Ăn bánh này là cao lớn nhanh nhất!” Bin xin ba mua ngay.","q":"Bin nên nghĩ thế nào?","o":[["Hỏi ba: “Ăn gì thì mới cao lớn thật ạ?”",1,"Quảng cáo chỉ nói điều hay. Cao lớn nhờ ăn đủ chất, ngủ đủ và vận động, ba sẽ kể con nghe."],["Ăn thật nhiều bánh đó để cao nhanh",0,"Ăn nhiều một món không làm mình cao nhanh hơn. Hỏi người lớn trước nhé."],["Quảng cáo nói vậy thì chắc đúng",0,"Quảng cáo muốn mình mua nên hay nói rất hay. Mình cần hỏi lại trước khi tin."]]},{"k":1,"s":"Bạn Huy mang đến lớp tờ giấy in hình đôi giày, ghi: “Đi vào là chạy nhanh nhất!”","q":"Bin nên nghĩ sao?","o":[["“Chạy nhanh là nhờ tập luyện, giày chắc chỉ giúp êm chân thôi”",1,"Con đã tự suy nghĩ thay vì tin ngay. Tập luyện mới làm mình chạy nhanh hơn."],["“Tớ phải có đôi giày này!”",0,"Tờ giấy được làm ra để mời mua. Mình hỏi người lớn xem có đúng không đã."],["“Ai không có giày này sẽ chạy chậm”",0,"Mỗi bạn chạy nhanh chậm khác nhau nhờ tập luyện, không phải vì đôi giày."]]},{"k":2,"s":"Ở hội chợ cùng mẹ, một chú cầm loa nói: “Đồ chơi này bền mãi mãi, không bao giờ hỏng!”","q":"Bin nên làm gì?","o":[["Tin ngay và xin mẹ mua",0,"Lời mời mua thường nói rất hay. Thứ gì dùng lâu cũng có thể hỏng."],["Nghĩ chú ấy là người xấu",0,"Chú chỉ đang mời mua hàng thôi. Mình không cần nghĩ xấu, chỉ cần suy nghĩ kỹ."],["Hỏi mẹ: “Có đồ chơi nào không bao giờ hỏng không ạ?”",1,"Câu “mãi mãi, không bao giờ” nghe hơi quá. Hỏi lại người lớn là cách kiểm tra rất hay."]]}],"qq":"Quảng cáo được làm ra để…","qo":["Kể chuyện cổ tích","Mời mọi người mua hàng","Giúp con học bài"],"qa":1,"mi":{"t":"Tìm lời hứa “quá đà” trong quảng cáo","s":"Khi cùng ba mẹ xem một đoạn quảng cáo, con tìm một câu quảng cáo hứa quá mức (như “cao lớn nhanh nhất”) và nói với ba mẹ “Quảng cáo muốn mời mình mua”.","lv":["Ba mẹ chỉ câu quảng cáo, con nhắc lại “Quảng cáo muốn mời mình mua”.","Ba mẹ nhắc một lần, con tự tìm câu hứa quá mức.","Con tự tìm và nói điều gì mới thật sự giúp mình khoẻ, cao lớn (ăn đủ, ngủ đủ, vận động)."],"rw":"Cùng ba mẹ chơi bóng ở sân"}},{"t":"Cơ thể của con, con được nói “không”","sk":6,"m":"6 phút","cx":[{"k":0,"s":"Bác họ đến nhà chơi, cứ muốn bế và thơm má Bin. Bin không thích nhưng ngại không dám nói.","q":"Bin có thể làm gì?","o":[["Cố chịu cho bác vui",0,"Con không phải cố chịu điều làm con khó chịu. Con có thể nói lễ phép mà vẫn rõ ràng."],["Lễ phép nói: “Con chào bác, mình đập tay thôi ạ”, rồi kể với mẹ",1,"Cơ thể của con là của con. Từ chối lễ phép vẫn là ngoan, kể với mẹ để mẹ giúp con."],["Đẩy bác ra rồi chạy trốn",0,"Con được quyền từ chối, nhưng đẩy có thể làm bác đau. Thử nói bằng lời trước nhé."]]},{"k":1,"s":"Giờ ra chơi, bạn Nam cứ ôm chặt cổ Bin để đùa. Bin thấy chật và không thích.","q":"Bin nên làm gì?","o":[["Cười cho qua dù không thích",0,"Con cười thì bạn tưởng con thích. Nói rõ ra bạn mới biết mà dừng."],["Ôm lại thật chặt cho bạn biết",0,"Làm vậy thì cả hai dễ bị đau. Nói bằng lời sẽ tốt hơn."],["Nói rõ: “Dừng lại, tớ không thích bị ôm như vậy”. Bạn không dừng thì báo cô",1,"Nói “không” rõ ràng là quyền của con. Khi bạn không nghe, cô giáo sẽ giúp con."]]},{"k":2,"s":"Ở công viên, mẹ ngồi ở ghế gần đó. Một người lạ khen Bin dễ thương và muốn ôm Bin.","q":"Bin nên làm gì?","o":[["Cho ôm vì người đó khen mình",0,"Lời khen không làm người lạ thành người quen. Con về chỗ mẹ nhé."],["Nói “Không ạ”, rồi về ngay chỗ mẹ",1,"Với người lạ, con không cần ôm hay chạm. Về ngay chỗ mẹ là an toàn nhất."],["Đứng im không nói gì",0,"Đứng im thì người kia không biết con không muốn. Nói “không” và về với mẹ."]]}],"qq":"Khi ai đó chạm vào làm con khó chịu, con nên…","qo":["Giữ bí mật","Cố chịu đựng","Nói “không” và kể với ba mẹ"],"qa":2,"mi":{"t":"Tập nói “không” khi không muốn được chạm","s":"Cùng ba mẹ, con tập nói to, rõ “Con không thích, xin đừng làm vậy” và chọn cách chào thay thế (vẫy tay, đập tay). Con nhắc lại: chuyện gì làm con khó chịu thì luôn kể với ba mẹ.","lv":["Ba mẹ nói mẫu trước, con nói theo và chọn cách chào thay thế.","Ba mẹ nhắc một lần, con tự nói câu “không” và tự chào bằng cách mình chọn.","Con tự nói được câu “không”, kể tên ba người lớn tin cậy con sẽ kể khi khó chịu."],"rw":"Một cái ôm thật chặt và lời khen trước cả nhà"}},{"t":"Khi chuông báo hết giờ chơi","sk":7,"m":"5 phút","cx":[{"k":0,"s":"Ba hẹn Bin được chơi xếp hình 20 phút rồi đi tắm. Đồng hồ hẹn giờ reo khi Bin đang xếp dở ngôi nhà.","q":"Bin nên làm gì?","o":[["Đập đổ hết vì bực",0,"Bực là bình thường khi đang vui. Con có thể để nguyên ngôi nhà và quay lại sau."],["Nói “Con xong rồi ạ”, để ngôi nhà ở góc, mai xếp tiếp",1,"Giữ lời hẹn giúp ba tin con hơn. Ngôi nhà vẫn đợi con ngày mai."],["Giả vờ không nghe thấy chuông",0,"Chuông reo là lời hẹn đã đến. Giả vờ thì lần sau khó được chơi lâu hơn."]]},{"k":1,"s":"Chuông vào lớp reo. Bin và các bạn đang chơi nhảy dây rất vui.","q":"Bin nên làm gì?","o":[["Cuộn dây lại, rủ các bạn vào lớp",1,"Chuông reo là lúc chuyển việc. Vào lớp đúng giờ là tôn trọng cô và cả lớp."],["Nhảy thêm vài lượt nữa",0,"Nhảy thêm thì vào lớp muộn, cô và các bạn phải chờ. Mai mình chơi tiếp nhé."],["Vứt dây đó rồi chạy vào",0,"Dây bỏ lại có thể làm người khác vấp. Cuộn gọn chỉ mất một chút thôi."]]},{"k":2,"s":"Ở khu vui chơi, mẹ nói: “Còn 5 phút nữa mình về nhé.” Bin đang chơi cầu trượt.","q":"Bin nên làm gì?","o":[["Năn nỉ ở lại thêm một tiếng",0,"Mẹ đã báo trước để con chuẩn bị. Năn nỉ mãi làm cả hai mệt."],["Không trả lời, cứ chơi tiếp",0,"Mẹ sẽ phải gọi nhiều lần. Con có thể chọn lượt cuối cho thật vui."],["Chọn trượt thêm hai lượt cuối rồi đến chỗ mẹ",1,"Tự chọn lượt cuối giúp con dừng vui vẻ và đúng giờ."]]}],"qq":"Khi hết giờ đã hẹn, con nên…","qo":["Dừng lại như đã hẹn","Xin thêm mãi","Lén chơi tiếp"],"qa":0,"mi":{"t":"Dừng chơi khi đồng hồ hẹn giờ reo","s":"Ba mẹ hẹn giờ 15–20 phút chơi. Khi chuông reo, con dừng lại, cất đồ chơi và đi làm việc tiếp theo (tắm, ăn cơm) như đã hẹn.","lv":["Ba mẹ báo trước “còn 2 phút”, rồi cùng con cất đồ khi chuông reo.","Ba mẹ nhắc một lần khi chuông reo, con tự dừng và cất đồ.","Con tự dừng ngay khi chuông reo, không cần nhắc, và kể lại con đã làm gì với phần chơi dở."],"rw":"Ba mẹ cùng con xếp hình 15 phút"}},{"t":"Ống heo của Bin","sk":8,"m":"6 phút","cx":[{"k":0,"s":"Bin muốn mua một quả bóng giá 30 nghìn. Mỗi tuần ba mẹ cho Bin 10 nghìn tiền tiêu vặt.","q":"Bin nên làm gì?","o":[["Tiêu hết tiền vào kẹo mỗi tuần",0,"Tiêu hết thì quả bóng mãi không đến. Để dành một ít mỗi tuần nhé."],["Bỏ tiền vào ống heo, mỗi tuần đếm lại cho đến khi đủ 30 nghìn",1,"Để dành từng chút một, sau ba tuần con sẽ tự mua được quả bóng."],["Xin ba mẹ mua ngay",0,"Ba mẹ có thể giúp, nhưng tự để dành cho thứ mình thích sẽ làm con rất tự hào."]]},{"k":1,"s":"Cả lớp làm ống tiết kiệm bằng hộp giấy. Bạn Vy nói: “Ngày nào tớ cũng mở ra tiêu một ít.”","q":"Bin nên nói gì với bạn?","o":[["“Cậu làm thế là dở lắm!”",0,"Chê bạn làm bạn buồn. Mình có thể nhẹ nhàng kể cách mình làm."],["“Mình chỉ mở khi đủ tiền mua thứ mình muốn thôi”",1,"Ống tiết kiệm giữ tiền cho một mục tiêu. Mở thường xuyên thì khó mà đủ."],["“Ừ, tớ cũng thế”",0,"Mở ra mỗi ngày thì ống luôn trống. Mình thử chờ đến khi đủ nhé."]]},{"k":2,"s":"Đi chợ cùng bà, bà cho Bin 5 nghìn tiền lẻ còn thừa.","q":"Bin nên làm gì?","o":[["Cảm ơn bà, về nhà bỏ vào ống heo",1,"Thêm một ít là quả bóng gần hơn một chút. Con đang để dành rất giỏi."],["Cầm tiền trên tay, vừa đi vừa nghịch",0,"Nghịch tiền ở chợ đông dễ làm rơi. Con nhờ bà cất giúp hoặc để vào túi kín nhé."],["Mua ngay một gói bim bim",0,"Mua cũng được, nhưng con đang để dành cho quả bóng mà. Thử nghĩ một chút nhé."]]}],"qq":"Để dành tiền là…","qo":["Tiêu hết ngay hôm nay","Xin thêm tiền mỗi ngày","Cất một phần để mua thứ mình muốn sau này"],"qa":2,"mi":{"t":"Làm “ống heo” và vẽ mục tiêu để dành","s":"Cùng ba mẹ, con trang trí một hộp hoặc lọ làm ống heo, vẽ món con muốn để dành mua lên giấy dán ngoài, và đếm xem cần mấy tuần nếu mỗi tuần bỏ vào một ít.","lv":["Ba mẹ cùng con trang trí và cùng đếm số tuần bằng ngón tay.","Ba mẹ nhắc một lần, con tự vẽ mục tiêu và tự đếm số tuần.","Con tự làm, tự đếm và kể cho ba mẹ kế hoạch để dành của con."],"rw":"Ba mẹ kể một chuyện hồi nhỏ của ba mẹ"}},{"t":"Khi con thấy sợ","sk":1,"m":"6 phút","cx":[{"k":0,"s":"Tối nay mưa to, sấm kêu ầm ầm. Bin trùm chăn kín đầu, tim đập thình thịch.","q":"Bin có thể làm gì?","o":[["Khóc thật to và ném gối",0,"Sợ thì khóc cũng không sao, nhưng ném đồ không làm bớt sợ. Thử gọi mẹ nhé."],["Cố nín, không nói với ai",0,"Giữ nỗi sợ một mình làm nó to hơn. Nói ra để ba mẹ ở bên con."],["Gọi mẹ: “Con sợ tiếng sấm”, rồi cùng mẹ hít thở chậm",1,"Gọi tên nỗi sợ và có người lớn bên cạnh giúp con bình tĩnh. Sấm chỉ là tiếng động lớn thôi."]]},{"k":1,"s":"Hôm nay Bin phải đứng lên đọc thơ trước lớp. Chân Bin run run, giọng nhỏ xíu.","q":"Bin nên làm gì?","o":[["Đọc thật nhanh cho xong",0,"Đọc nhanh quá các bạn không nghe kịp. Chậm lại một chút, con làm được mà."],["Xin cô cho không đọc nữa",0,"Né lần này thì lần sau càng sợ hơn. Con có thể nói với cô là con hơi run."],["Hít thở chậm ba lần, nhìn cô và đọc từng câu",1,"Run là bình thường. Hít thở chậm giúp bớt run, và đọc từng câu sẽ dễ hơn."]]},{"k":2,"s":"Ở phòng khám, Bin sắp được tiêm phòng. Ba ngồi cạnh nhưng Bin vẫn thấy sợ.","q":"Bin nên làm gì?","o":[["Nói với ba “Con sợ”, nắm tay ba và đếm đến mười",1,"Nói ra nỗi sợ và nắm tay người thân giúp con thấy vững hơn. Đếm số cũng giúp con bình tĩnh."],["Nói “Con không sợ!” dù đang rất sợ",0,"Không cần giả vờ đâu. Nói thật thì ba biết cách giúp con."],["Vùng chạy ra ngoài",0,"Chạy đi thì nỗi sợ vẫn còn và dễ bị ngã. Nắm tay ba sẽ giúp con hơn."]]}],"qq":"Khi thấy sợ, điều tốt nhất là…","qo":["Giấu không cho ai biết","Nói ra với người lớn tin cậy","Giả vờ không sợ"],"qa":1,"mi":{"t":"Nói ra nỗi sợ với ba mẹ","s":"Trước giờ ngủ tối nay, con kể với ba mẹ một điều làm con sợ (sấm, bóng tối, tiếng động…) bằng câu “Con sợ… vì…”, rồi cùng ba mẹ nghĩ một cách giúp con bớt sợ.","lv":["Ba mẹ kể mẫu một nỗi sợ của ba mẹ, con kể theo.","Ba mẹ nhắc một lần, con tự nói câu “Con sợ… vì…”.","Con tự kể và tự đề xuất một cách bớt sợ (ôm gấu bông, bật đèn ngủ, hít sâu)."],"rw":"Được nghe thêm một câu chuyện trước khi ngủ"}},{"t":"Khi bị thua","sk":1,"m":"6 phút","cx":[{"k":0,"s":"Bin thi ghép hình với anh trai và anh xong trước. Bin tức quá, muốn hất tung hết các mảnh ghép.","q":"Bin nên làm gì?","o":[["Hít sâu, nói: “Em tiếc quá! Mình chơi ván nữa nhé anh”",1,"Thua thì tiếc là bình thường. Bình tĩnh lại, chơi tiếp sẽ vui hơn."],["Nói “Anh ăn gian!”",0,"Thua làm mình buồn, nhưng đổ cho anh thì anh cũng buồn. Nói thật cảm xúc của mình nhé."],["Hất tung các mảnh ghép",0,"Hất đồ không làm hết tức mà còn phải nhặt lâu. Thử hít sâu trước nhé."]]},{"k":1,"s":"Giờ thể dục, đội của Bin thua trò chạy tiếp sức. Cả đội ỉu xìu.","q":"Bin nên nói gì?","o":[["“Tại Linh chạy chậm!”",0,"Đổ lỗi làm bạn buồn và cả đội buồn thêm. Cả đội cùng thua thì cùng cố lần sau."],["Ngồi một góc không nói chuyện với ai",0,"Buồn thì được, nhưng đội đang cần nhau. Một câu động viên sẽ giúp cả đội."],["“Tiếc quá! Mình chúc mừng đội kia, lần sau cùng cố nhé”",1,"Chúc mừng đội thắng và động viên đội mình là cách thua mà vẫn vui."]]},{"k":2,"s":"Mẹ đưa Bin đến hội thi vẽ của phường. Tranh của Bin không được giải.","q":"Bin nên làm gì?","o":[["Nói “Tranh đó xấu mà vẫn được giải”",0,"Chê tranh bạn không làm con vui hơn. Mỗi bức tranh đều có cái hay riêng."],["Xé tranh của mình",0,"Tranh của con vẫn là công sức của con. Mang về treo lên nhé."],["Nói với mẹ “Con buồn”, rồi đi xem tranh các bạn để học thêm",1,"Nói ra nỗi buồn giúp con nhẹ lòng. Xem tranh bạn giúp lần sau con vẽ hay hơn nữa."]]}],"qq":"Khi thua cuộc, con có thể…","qo":["Hít sâu và chúc mừng bạn","Bỏ không chơi nữa","Nói bạn ăn gian"],"qa":0,"mi":{"t":"Thua một ván, hít sâu và chúc mừng","s":"Cả nhà chơi một trò ngắn (cờ, oẳn tù tì, ghép hình). Nếu con thua, con hít sâu ba lần và nói “Chúc mừng ba/mẹ/anh!”. Ba mẹ nghe và xác nhận.","lv":["Ba mẹ cùng con hít sâu và nói câu chúc mừng mẫu.","Ba mẹ nhắc một lần, con tự hít sâu và chúc mừng.","Con tự chúc mừng khi thua, không ném đồ, và kể lại cảm xúc của con lúc đó."],"rw":"Cùng chơi một ván cờ với ba mẹ"}},{"t":"Mỗi người một việc","sk":2,"m":"6 phút","cx":[{"k":0,"s":"Cả nhà chuẩn bị bữa tối. Ba nấu ăn, mẹ rửa rau. Bin và em gái đứng nhìn.","q":"Bin nên làm gì?","o":[["Hỏi ba mẹ: “Con xếp bát đũa, em lấy khăn nhé?”",1,"Nhận việc vừa sức và chia cho em một phần, ai cũng được góp sức."],["Đứng sát bếp xem ba nấu",0,"Đứng gần bếp nóng không an toàn. Con hỏi xem có việc nào hợp với con nhé."],["Đi xem hoạt hình, đợi ăn",0,"Cả nhà đang cùng làm. Con nhận một việc nhỏ thì bữa cơm sẽ xong sớm hơn."]]},{"k":1,"s":"Cô chia nhóm Bin, Na và Tí cùng vẽ một bức tranh cánh đồng. Cả ba bạn đều muốn vẽ ông mặt trời.","q":"Nhóm nên làm thế nào?","o":[["Chia việc: một bạn vẽ mặt trời, một bạn vẽ cây, một bạn vẽ hoa",1,"Mỗi người một việc thì tranh xong nhanh và ai cũng có phần góp sức."],["Mỗi bạn tự vẽ một ông mặt trời",0,"Ba ông mặt trời thì bức tranh lạ lắm. Chia việc khác nhau sẽ đẹp hơn."],["Giành bút vẽ trước",0,"Giành nhau thì chưa vẽ đã cãi rồi. Mình chia việc cho nhau nhé."]]},{"k":2,"s":"Ở công viên, các bạn cùng xây lâu đài cát, ba mẹ ngồi gần đó. Bạn nào cũng muốn đắp tháp.","q":"Bin nên làm gì?","o":[["Rủ chia việc: bạn đắp tháp, bạn đào hào, bạn chở cát",1,"Mỗi người một việc thì ai cũng vui và lâu đài nhanh thành hình."],["Không chơi nữa vì không được đắp tháp",0,"Việc nào cũng quan trọng với lâu đài. Thử một việc khác nhé."],["Tự đắp tháp, kệ các bạn",0,"Làm một mình thì các bạn buồn. Chia việc thì lâu đài sẽ to hơn."]]}],"qq":"Làm việc nhóm tốt khi…","qo":["Một bạn làm hết","Mỗi người nhận một phần việc","Ai nhanh thì giành trước"],"qa":1,"mi":{"t":"Mỗi người một việc khi cả nhà làm chung","s":"Cả nhà cùng làm một việc nhỏ (dọn bàn ăn, gấp quần áo, vẽ chung một bức tranh). Con giúp chia mỗi người một phần việc và làm xong phần của mình.","lv":["Ba mẹ chia việc, con nhận phần của mình và làm xong.","Ba mẹ nhắc một lần, con tự đề nghị cách chia việc.","Con tự chia việc cho mọi người, làm xong phần mình và kể lại ai đã làm gì."],"rw":"Cùng ba mẹ vẽ một bức tranh"}},{"t":"Tự mặc quần áo","sk":3,"m":"5 phút","cx":[{"k":0,"s":"Sáng nay mẹ bận cho em bé ăn. Quần áo của Bin đã để sẵn nhưng Bin vẫn ngồi chờ mẹ mặc giúp.","q":"Bin nên làm gì?","o":[["Ngồi chờ mẹ xong việc",0,"Chờ thì dễ muộn học. Con đã đủ lớn để tự làm phần lớn rồi."],["Tự mặc từng món, chỗ nào khó như cài cúc thì nhờ mẹ sau",1,"Tự làm phần mình làm được và chỉ nhờ phần thật khó. Thế là tự lập rồi."],["Mặc luôn đồ ngủ đi học",0,"Đồ ngủ để ngủ thôi con. Thử tự thay, con làm được mà."]]},{"k":1,"s":"Sau giờ thể dục, các bạn thay giày để vào lớp. Dây giày của Bin bị tuột.","q":"Bin nên làm gì?","o":[["Ngồi xuống thử tự buộc, chưa được thì nhờ cô chỉ",1,"Thử trước rồi mới nhờ giúp con học thêm được một việc mới."],["Nhờ bạn buộc hộ ngay",0,"Nhờ bạn cũng được, nhưng con thử tự buộc trước, chưa được thì mới nhờ."],["Để nguyên dây tuột mà đi",0,"Dây tuột dễ làm con vấp ngã. Thử buộc lại nhé."]]},{"k":2,"s":"Đi chơi công viên với ba, trời nắng nóng. Bin cần cởi áo khoác và cất vào ba lô.","q":"Bin nên làm gì?","o":[["Đưa áo cho ba cầm hộ",0,"Ba đã cầm nhiều đồ rồi. Con có ba lô riêng, tự cất được mà."],["Tự cởi áo, gấp gọn và cho vào ba lô",1,"Tự lo đồ của mình giúp ba đỡ vất vả và con không làm mất áo."],["Để áo trên ghế đá rồi đi chơi",0,"Để áo trên ghế dễ quên mất. Cất vào ba lô là chắc nhất."]]}],"qq":"Tự lập nghĩa là…","qo":["Đợi người khác làm hộ","Không bao giờ nhờ ai","Tự làm phần mình làm được"],"qa":2,"mi":{"t":"Tự mặc quần áo buổi sáng","s":"Tối nay con cùng ba mẹ để sẵn quần áo cho ngày mai. Sáng mai con tự mặc từ áo, quần đến tất, rồi ra cho ba mẹ xem.","lv":["Ba mẹ đứng cạnh, chỉ thứ tự mặc, con tự mặc.","Ba mẹ nhắc một lần, con tự mặc hết, chỉ nhờ phần thật khó (cúc nhỏ, khoá kéo).","Con tự nhớ, tự mặc gọn gàng và kể con làm phần nào giỏi nhất."],"rw":"Được chọn bữa sáng ngày Chủ nhật"}},{"t":"Tìm lại đồ bị thất lạc","sk":4,"m":"6 phút","cx":[{"k":0,"s":"Sắp đến giờ đi học mà Bin không tìm thấy chiếc giày bên trái.","q":"Bin nên làm gì?","o":[["Lục tung cả nhà",0,"Lục khắp nơi tốn thời gian và làm nhà bừa. Nghĩ trước rồi mới tìm nhé."],["Nhớ lại tối qua cởi giày ở đâu, tìm ở đó trước",1,"Bắt đầu từ chỗ cuối cùng mình thấy giúp tìm nhanh hơn là chạy lung tung."],["Đi một chân giày, một chân dép",0,"Đi như vậy khó chạy nhảy lắm. Con thử nhớ lại một chút nhé."]]},{"k":1,"s":"Đến giờ về, Bin tìm mãi không thấy bình nước. Bin nhớ hồi ra chơi vẫn còn cầm.","q":"Bin nên làm gì?","o":[["Khóc vì bị mất",0,"Buồn thì được, nhưng mình vẫn có thể tìm. Thử nhớ lại những chỗ đã đến nhé."],["Nhớ lại các chỗ đã đến, quay lại tìm, rồi hỏi cô",1,"Đi lại những chỗ mình đã qua là cách tìm đồ rất hay. Cô cũng có thể giúp con."],["Lấy tạm bình của bạn",0,"Bình của bạn là của bạn. Mình cùng tìm bình của con nhé."]]},{"k":2,"s":"Đi siêu thị với mẹ, Bin chợt thấy mũ của mình không còn trên đầu.","q":"Bin nên làm gì?","o":[["Thôi bỏ, không nói với ai",0,"Không nói thì không ai giúp được con. Mẹ sẽ cùng con tìm."],["Tự chạy đi tìm khắp nơi",0,"Tự chạy đi ở chỗ đông người dễ lạc mẹ. Hãy nói với mẹ trước nhé."],["Nói với mẹ, cùng mẹ quay lại các quầy vừa đi qua",1,"Có mẹ đi cùng và đi lại đường cũ, vừa an toàn vừa dễ tìm thấy."]]}],"qq":"Khi mất đồ, việc đầu tiên nên làm là…","qo":["Đòi mua cái mới","Nhớ lại lần cuối thấy nó ở đâu","Đổ lỗi cho bạn"],"qa":1,"mi":{"t":"Chơi trò “Lần cuối thấy ở đâu?”","s":"Ba mẹ giấu một món đồ quen thuộc của con trong phòng sau khi con vừa dùng. Con nhớ lại lần cuối thấy nó ở đâu và tìm theo từng chỗ con đã đi qua.","lv":["Ba mẹ hỏi gợi ý “Lúc nãy con ở đâu?”, con trả lời và tìm.","Ba mẹ nhắc một lần “Nhớ lại lần cuối nhé”, con tự tìm.","Con tự kể lại các chỗ con đã đi và tìm thấy, rồi đổi vai giấu đồ cho ba mẹ tìm."],"rw":"Cả nhà chơi trốn tìm trong nhà"}},{"t":"Nghe bạn nói, kiểm tra lại","sk":5,"m":"6 phút","cx":[{"k":0,"s":"Em gái chạy đến nói: “Mẹ bảo mình được ăn kem trước bữa tối đấy!”","q":"Bin nên làm gì?","o":[["Nói em: “Em nói dối!”",0,"Có thể em chỉ nghe nhầm thôi. Hỏi lại thì sẽ biết."],["Cùng em đi hỏi lại mẹ",1,"Hỏi người đã nói giúp cả hai biết chắc. Kiểm tra trước, làm sau."],["Mở tủ lạnh lấy kem luôn",0,"Nếu em nghe nhầm thì mẹ sẽ không vui. Hỏi mẹ trước chỉ mất một chút."]]},{"k":1,"s":"Bạn Tí nói: “Cô bảo mai cả lớp được nghỉ học đấy!” Bin chưa hề nghe cô nói vậy.","q":"Bin nên làm gì?","o":[["Đi kể cho cả lớp biết",0,"Tin chưa chắc mà lan đi thì nhiều bạn hiểu sai. Hỏi cô trước đã."],["Về khoe ngay với mẹ là mai được nghỉ",0,"Nếu tin sai, mẹ sẽ phải lo lại cả ngày mai. Kiểm tra trước nhé."],["Hỏi lại cô giáo cho chắc",1,"Tin nghe qua bạn có thể bị nhầm. Hỏi người biết rõ là cách kiểm tra tốt nhất."]]},{"k":2,"s":"Ở công viên, một bạn nói: “Hồ kia có con cá to bằng con trâu!” Ba đang ngồi gần đó.","q":"Bin nên làm gì?","o":[["Tin ngay và sợ không dám chơi nữa",0,"Chuyện nghe to tát quá có thể chỉ là đùa. Hỏi lại người lớn sẽ thấy yên tâm."],["Chạy ra sát bờ hồ để xem",0,"Chạy ra sát mép hồ một mình không an toàn. Hỏi ba và đi cùng ba nhé."],["Hỏi ba: “Có cá to vậy thật không ạ?”",1,"Nghe điều lạ thì hỏi người lớn. Con vừa an toàn vừa biết được sự thật."]]}],"qq":"Khi nghe một tin chưa chắc, con nên…","qo":["Hỏi người biết rõ","Kể lại cho mọi người","Tin ngay"],"qa":0,"mi":{"t":"Nghe một tin, hỏi người biết rõ","s":"Ba mẹ kể cho con một “tin” (thật hoặc đùa, ví dụ “Mai trời có tuyết đấy!”). Con không tin ngay mà hỏi “Ai nói vậy ạ?” và cùng ba mẹ kiểm tra với người biết rõ hoặc xem dự báo thời tiết.","lv":["Ba mẹ gợi ý câu hỏi, con hỏi lại và cùng kiểm tra.","Ba mẹ nhắc một lần, con tự hỏi “Ai nói vậy ạ?”.","Con tự hỏi, tự nghĩ ai là người biết rõ, và kể kết quả tin đó đúng hay sai."],"rw":"Cùng ba mẹ gấp máy bay giấy và thi bay"}},{"t":"Khi bị lạc ba mẹ","sk":6,"m":"6 phút","cx":[{"k":0,"s":"Ở nhà, mẹ cùng Bin tập đọc thuộc số điện thoại của mẹ.","q":"Vì sao Bin nên thuộc số điện thoại của mẹ?","o":[["Không cần, vì lúc nào mẹ cũng ở cạnh",0,"Đôi khi con và mẹ có thể bị lạc nhau. Thuộc số giúp người lớn gọi mẹ cho con."],["Để gọi cho mẹ khi buồn chán",0,"Số của mẹ quan trọng nhất lúc con cần giúp, ví dụ khi bị lạc."],["Để khi bị lạc, đọc số cho cô chú bảo vệ hoặc nhân viên gọi giúp",1,"Thuộc số điện thoại giúp người lớn tin cậy liên lạc với mẹ thật nhanh."]]},{"k":1,"s":"Lớp đi tham quan vườn thú. Bin dừng lại xem khỉ, ngẩng lên thì không thấy cô và các bạn đâu.","q":"Bin nên làm gì?","o":[["Đứng yên ở đó, nhờ cô chú bảo vệ báo cho cô giáo",1,"Đứng yên giúp cô quay lại tìm con. Bảo vệ mặc đồng phục là người có thể giúp."],["Tự đi tìm khắp vườn thú",0,"Vườn thú rất rộng, đi một mình dễ lạc xa hơn. Đứng yên là tốt nhất."],["Ngồi khóc ở một góc khuất",0,"Khóc là bình thường, nhưng ở chỗ khuất thì cô khó thấy con. Đứng chỗ dễ thấy và nhờ bảo vệ nhé."]]},{"k":2,"s":"Ở siêu thị, Bin mải xem đồ chơi, quay lại thì không thấy mẹ đâu.","q":"Bin nên làm gì?","o":[["Đi theo một người lạ nói “Để cô dẫn ra ngoài tìm”",0,"Không đi ra ngoài với người lạ. Ở lại trong cửa hàng và nhờ nhân viên nhé."],["Đứng yên, nhờ cô nhân viên mặc đồng phục hoặc cô thu ngân giúp tìm mẹ",1,"Người làm ở cửa hàng có thể gọi loa tìm mẹ. Đứng yên giúp mẹ quay lại tìm con dễ hơn."],["Chạy khắp nơi tìm mẹ",0,"Chạy lung tung thì mẹ càng khó tìm con. Đứng yên một chỗ sẽ tốt hơn."]]}],"qq":"Khi bị lạc, con nên…","qo":["Tự đi bộ về nhà","Ai rủ đi cũng đi theo","Đứng yên và nhờ người làm ở đó giúp"],"qa":2,"mi":{"t":"Tập làm gì khi bị lạc ba mẹ","s":"Ở nhà, con học thuộc tên đầy đủ và số điện thoại của ba hoặc mẹ. Lần tới đi chợ hoặc siêu thị cùng nhau, ba mẹ đứng cạnh, con chỉ ra ai là “người làm ở đây” (mặc đồng phục, đứng quầy) để nhờ khi bị lạc.","lv":["Ba mẹ đọc từng số, con nhắc lại; ba mẹ chỉ người làm ở đó cho con xem.","Ba mẹ nhắc một lần, con tự đọc số điện thoại và tự chỉ người làm ở đó.","Con tự đọc đúng số, nói được “đứng yên và nhờ người làm ở đó” và giải thích vì sao."],"rw":"Cả nhà cùng đi dạo công viên"}},{"t":"Làm bài trước, chơi sau","sk":7,"m":"6 phút","cx":[{"k":0,"s":"Đi học về, Bin có một trang bài tập. Bạn Na sang rủ Bin ra sân chơi bóng.","q":"Bin nên làm gì?","o":[["Nói với Na: “Chờ tớ 20 phút làm bài nhé”, rồi làm cho xong",1,"Làm việc cần làm trước, chơi sau thì vừa xong việc vừa chơi vui hơn."],["Đi chơi trước, tối làm bài sau",0,"Tối con sẽ mệt và buồn ngủ. Làm trước thì chơi thoải mái hơn."],["Vừa làm bài vừa nói chuyện với Na",0,"Làm hai việc một lúc dễ sai và lâu xong. Làm xong rồi mới chơi nhé."]]},{"k":1,"s":"Cô cho làm 5 bài toán, bạn nào xong được tô màu tranh. Bin rất thích tô màu.","q":"Bin nên làm gì?","o":[["Tô màu trước, toán làm sau",0,"Hết giờ có thể chưa xong toán. Làm toán trước rồi tô màu thật vui nhé."],["Làm cẩn thận 5 bài toán, xong rồi tô màu",1,"Việc chính trước, việc thích sau. Con được tô màu mà không phải lo gì."],["Làm thật nhanh, sai cũng được",0,"Làm nhanh quá dễ sai. Cẩn thận một chút vẫn còn thời gian tô màu."]]},{"k":2,"s":"Ở nhà sách với ba, ba nhờ Bin tìm vở ô li trước. Bin lại muốn chạy sang góc truyện tranh.","q":"Bin nên làm gì?","o":[["Xem truyện rồi quên luôn việc tìm vở",0,"Truyện hay dễ làm mình quên. Xong việc trước rồi đọc thì không sợ quên."],["Chạy ngay sang góc truyện",0,"Ba sẽ phải đi tìm con, việc chính lại chưa xong. Tìm vở trước nhé."],["Tìm vở trước, xong rồi xin ba xem truyện",1,"Làm xong việc được nhờ trước thì xem truyện thoải mái, ba cũng vui."]]}],"qq":"Khi có cả bài tập và giờ chơi, con nên…","qo":["Chơi trước cho đã","Làm bài trước rồi chơi","Bỏ bài tập"],"qa":1,"mi":{"t":"Làm bài tập trước, đi chơi sau","s":"Chiều nay đi học về, con làm xong bài tập (hoặc đọc sách 10 phút) trước, cho ba mẹ xem, rồi mới chơi.","lv":["Ba mẹ ngồi cạnh khi con làm bài, xong thì cùng con chơi.","Ba mẹ nhắc một lần, con tự ngồi vào bàn làm bài trước.","Con tự nhớ làm bài trước, tự cho ba mẹ xem rồi xin đi chơi."],"rw":"Cùng ba mẹ chơi bóng ở sân"}},{"t":"Giữ tiền cẩn thận","sk":8,"m":"6 phút","cx":[{"k":0,"s":"Bà cho Bin 20 nghìn. Bin để tiền trên bàn rồi đi rửa tay, em bé đang bò tới.","q":"Bin nên làm gì?","o":[["Kệ, chỉ đi một lát thôi",0,"Chỉ một lát em cũng có thể cầm lên. Cất ngay là chắc nhất."],["Nhờ em bé giữ hộ",0,"Em còn nhỏ, chưa giữ tiền được. Con tự cất nhé."],["Cầm tiền theo, rồi bỏ ngay vào ống heo",1,"Cất ngay vào chỗ của nó thì tiền không bị mất, em cũng không cho vào miệng."]]},{"k":1,"s":"Mẹ cho Bin 10 nghìn để mua bánh ở căng tin. Bin cầm tờ tiền vẫy vẫy khoe các bạn.","q":"Bin nên làm gì với tờ tiền?","o":[["Cất vào ngăn có khoá kéo trong cặp, đến giờ mới lấy ra",1,"Tiền để chỗ kín và không mang ra khoe thì khó bị rơi mất."],["Để trên bàn cho tiện",0,"Gió hoặc bạn đi qua có thể làm rơi. Cất vào túi có khoá kéo nhé."],["Kẹp vào sách giáo khoa",0,"Kẹp vào sách dễ rơi khi lật trang. Cất vào chỗ kín, cố định sẽ chắc hơn."]]},{"k":2,"s":"Ở chợ cùng ba, Bin được cầm 5 nghìn để mua bánh bao. Chợ rất đông người.","q":"Bin nên làm gì?","o":[["Cầm hờ trên tay, vừa đi vừa ngắm",0,"Chỗ đông người, tiền cầm hờ dễ rơi mà không biết. Nắm chặt hoặc cất túi nhé."],["Nắm chặt trong tay, đi sát ba, đến hàng bánh mới đưa",1,"Nắm chặt và đi cạnh ba giúp con giữ được tiền và giữ an toàn."],["Bỏ vào túi quần không có khoá rồi chạy nhảy",0,"Chạy nhảy làm tiền dễ rơi khỏi túi. Đi chậm cạnh ba nhé."]]}],"qq":"Giữ tiền cẩn thận là…","qo":["Vẫy cho mọi người thấy","Đưa bạn giữ hộ","Cất ở chỗ kín, chắc chắn"],"qa":2,"mi":{"t":"Tìm một chỗ cất đồ quý kín và chắc chắn","s":"Cùng ba mẹ, con chọn một chỗ cố định, kín đáo trong nhà (hộp có nắp, ngăn kéo) để cất ống heo hoặc đồ quý. Con tập cất vào đúng chỗ và nói vì sao không mang ra khoe.","lv":["Ba mẹ gợi ý vài chỗ, con chọn một và cùng cất vào.","Ba mẹ nhắc một lần, con tự cất đồ vào đúng chỗ đã chọn.","Con tự cất đúng chỗ trong ba ngày và giải thích “giữ cẩn thận là cất kín, chắc chắn”."],"rw":"Cùng làm thiệp tặng ông bà"}},{"t":"Nhờ giúp cho rõ ràng","sk":0,"m":"6 phút","cx":[{"k":0,"s":"Bin muốn lấy hộp màu trên nóc tủ nhưng không với tới. Ba đang đọc sách.","q":"Bin nên làm gì?","o":[["“Ba ơi, ba lấy giúp con hộp màu trên tủ với ạ”",1,"Câu nhờ rõ ràng giúp ba hiểu ngay và giúp con liền."],["Gọi “Ba ơi!” rồi không nói gì thêm",0,"Ba sẽ không biết con cần gì. Nói rõ việc cần giúp nhé."],["Nhảy lên với mãi",0,"Nhảy mãi vừa mệt vừa dễ va vào tủ. Nhờ ba sẽ nhanh và an toàn hơn."]]},{"k":1,"s":"Bin không mở được nắp hộp cơm trưa. Cô giáo đang đi quanh lớp.","q":"Bin nên làm gì?","o":[["Ngồi im, nhịn ăn",0,"Nhịn thì con sẽ đói cả buổi chiều. Nói ra thì cô sẽ giúp."],["Giơ tay: “Thưa cô, em không mở được hộp cơm, cô giúp em với ạ”",1,"Nói rõ mình cần gì và lễ phép giúp người khác hiểu ngay để giúp con."],["Đập hộp xuống bàn cho bật nắp",0,"Đập mạnh có thể làm đổ cơm. Nhờ cô là cách nhanh và an toàn."]]},{"k":2,"s":"Ở thư viện cùng mẹ, Bin không tìm thấy góc sách thiếu nhi. Mẹ đang xếp hàng mượn sách gần đó.","q":"Bin nên làm gì?","o":[["Tự đi khắp các tầng tìm",0,"Đi một mình xa mẹ dễ bị lạc. Hỏi cô thủ thư nhanh hơn nhiều."],["Nói to: “Sách thiếu nhi đâu?”",0,"Thư viện cần yên lặng. Đến gần và hỏi nhỏ nhẹ, lễ phép nhé."],["Cùng mẹ hỏi cô thủ thư: “Cô ơi, góc sách thiếu nhi ở đâu ạ?”",1,"Hỏi đúng người và nói rõ điều mình cần giúp con tìm thấy ngay."]]}],"qq":"Khi nhờ giúp, con nên nói…","qo":["Mình cần giúp việc gì, nói lễ phép","“Giúp với!” rồi chạy đi","Không nói gì, chờ người ta tự biết"],"qa":0,"mi":{"t":"Nhờ giúp rõ ràng và lễ phép","s":"Hôm nay khi gặp việc con chưa làm được (mở nắp hộp, với đồ trên cao), con đến gần người lớn và nói đủ: “Ba/mẹ ơi, con cần giúp… Ba/mẹ giúp con với ạ.”","lv":["Ba mẹ nói mẫu câu nhờ, con nói theo.","Ba mẹ nhắc một lần, con tự nói đủ việc cần giúp và lời lễ phép.","Con tự nhờ đúng cách ít nhất hai lần trong ngày và nhớ cảm ơn."],"rw":"Ba mẹ đọc truyện bằng giọng các nhân vật"}},{"t":"Khi nhóm có ý khác nhau","sk":2,"m":"6 phút","cx":[{"k":0,"s":"Cuối tuần, Bin muốn đi công viên, em gái muốn ở nhà vẽ tranh. Ba mẹ hỏi hai con muốn làm gì.","q":"Bin nên làm gì?","o":[["Rủ em: “Sáng đi công viên, chiều mình cùng vẽ nhé?”",1,"Tìm cách để cả hai cùng vui là làm việc nhóm rất hay trong gia đình."],["Khóc để được đi công viên",0,"Khóc làm mọi người buồn mà chưa tìm được cách. Mình thử bàn với em nhé."],["Nói với em: “Vẽ chán lắm!”",0,"Chê ý của em làm em buồn. Mỗi người thích một kiểu, mình tìm cách kết hợp nhé."]]},{"k":1,"s":"Nhóm Bin làm mô hình con vật bằng đất nặn. Bin muốn làm con voi, Na muốn làm con rùa.","q":"Nhóm nên làm thế nào?","o":[["Ai nói to hơn thì được chọn",0,"Nói to không làm ý mình hay hơn. Nghe nhau rồi cùng chọn mới công bằng."],["Bin làm voi, Na làm rùa, không cần làm chung",0,"Tách ra thì không còn là làm nhóm nữa. Mình cùng tìm cách chọn nhé."],["Mỗi bạn nói lý do, rồi cả nhóm giơ tay chọn",1,"Nghe lý do của nhau rồi cùng chọn, ai cũng thấy được tôn trọng."]]},{"k":2,"s":"Ở sân chơi khu phố, ba mẹ ngồi gần đó. Nhóm bạn tranh cãi nên chơi trốn tìm hay đá bóng.","q":"Bin nên làm gì?","o":[["Chia làm hai phe giận nhau",0,"Giận nhau thì mất vui. Bàn với nhau một chút sẽ tìm ra cách."],["Rủ các bạn chơi trốn tìm trước, đá bóng sau",1,"Chơi lần lượt cả hai trò thì không ai bị bỏ rơi."],["Ôm bóng về nhà",0,"Về nhà thì không ai được chơi. Thử tìm cách chơi cả hai trò nhé."]]}],"qq":"Khi nhóm có ý khác nhau, nên…","qo":["Để một bạn quyết hết","Nghe lý do của nhau rồi cùng chọn","Thôi không làm nữa"],"qa":1,"mi":{"t":"Nghe lý do của nhau rồi cùng chọn","s":"Cả nhà cần chọn một việc (món tráng miệng, trò chơi tối nay). Mỗi người nói ý mình kèm một lý do “vì…”, con nhắc lại ý người khác rồi cả nhà cùng chọn (hoặc oẳn tù tì).","lv":["Ba mẹ nói mẫu “Mẹ muốn… vì…”, con nói theo ý của con.","Ba mẹ nhắc một lần, con tự nói lý do và nhắc lại ý của một người khác.","Con tự dẫn cả nhà nói lý do và đề xuất cách chọn công bằng."],"rw":"Cả nhà cùng nhảy theo một bài hát con chọn"}},{"t":"Giúp bạn trong nhóm","sk":2,"m":"6 phút","cx":[{"k":0,"s":"Em trai Bin đang tập gấp quần áo nhưng gấp mãi không gọn. Em bắt đầu cáu.","q":"Bin nên làm gì?","o":[["Cười em vụng",0,"Bị cười làm em ngại không muốn thử nữa. Mình chỉ em nhẹ nhàng nhé."],["Gấp hết hộ em cho nhanh",0,"Gấp hộ thì em không học được. Lần sau em vẫn cần người giúp."],["Gấp mẫu một chiếc thật chậm, rồi để em gấp chiếc tiếp theo",1,"Làm mẫu rồi để em tự thử, em sẽ học được và thấy tự hào."]]},{"k":1,"s":"Nhóm Bin thi xếp chữ. Bạn Vy làm chậm và sắp khóc vì sợ cả nhóm thua.","q":"Bin nên làm gì?","o":[["Ngồi cạnh Vy, chỉ cho bạn cách tìm chữ",1,"Giúp bạn tự làm được, không làm thay, thì cả nhóm cùng tiến lên."],["Nói: “Cậu chậm quá!”",0,"Câu đó làm bạn buồn hơn và càng chậm. Một lời động viên sẽ giúp nhiều hơn."],["Giành lấy phần của Vy làm hộ",0,"Làm hộ thì nhanh nhưng Vy không học được gì và thấy buồn. Chỉ bạn cách làm nhé."]]},{"k":2,"s":"Ở sân chơi khu phố, các bạn chơi ném vòng. Bạn Bảo ném mãi không trúng, định bỏ về.","q":"Bin nên làm gì?","o":[["Ném hộ bạn",0,"Ném hộ thì bạn không thấy vui khi trúng. Chỉ cách để bạn tự làm nhé."],["Kệ bạn, mình chơi tiếp",0,"Bạn bỏ về thì nhóm thiếu một người. Một chút giúp đỡ có thể giữ bạn lại."],["Chỉ bạn đứng gần hơn một chút và cổ vũ “Cố lên!”",1,"Một mẹo nhỏ và lời cổ vũ giúp bạn tự ném trúng. Cả nhóm cùng vui."]]}],"qq":"Giúp bạn trong nhóm nghĩa là…","qo":["Chỉ cách để bạn tự làm được","Làm hết phần của bạn","Chê để bạn cố hơn"],"qa":0,"mi":{"t":"Chỉ cách cho em hoặc ba mẹ tự làm","s":"Con chọn một việc con làm giỏi (gấp áo, xếp hình, buộc dây giày đơn giản) và chỉ cho em hoặc ba mẹ từng bước, để người đó tự làm, không làm hộ.","lv":["Ba mẹ đóng vai “bạn làm chậm”, nhắc con chỉ từng bước.","Ba mẹ nhắc một lần “chỉ thôi, đừng làm hộ”, con tự chỉ cách.","Con tự chỉ cách, động viên “Cố lên, gần xong rồi!” và kể người đó đã tự làm được thế nào."],"rw":"Ba mẹ viết giấy khen dán lên tủ lạnh"}},{"t":"Tự dọn bát sau bữa ăn","sk":3,"m":"6 phút","cx":[{"k":0,"s":"Ăn cơm xong, Bin đứng dậy đi xem hoạt hình, để bát đũa lại trên bàn.","q":"Bin nên làm gì?","o":[["Để mẹ dọn vì mẹ quen rồi",0,"Mẹ cũng mệt sau một ngày dài. Con tự dọn bát của mình là giúp mẹ rồi."],["Mang bát đũa của mình vào bồn rửa rồi mới đi chơi",1,"Tự lo phần của mình sau bữa ăn là việc nhỏ mà cả nhà đều vui."],["Đẩy bát vào giữa bàn",0,"Đẩy vào giữa bàn vẫn chưa xong việc. Mang vào bồn rửa chỉ mất một chút thôi."]]},{"k":1,"s":"Ăn bán trú xong, các bạn tự mang khay về chỗ cô. Khay của Bin còn ít cơm rơi vãi.","q":"Bin nên làm gì?","o":[["Nhờ bạn mang hộ",0,"Bạn cũng có khay của bạn. Con tự làm được mà."],["Gom cơm rơi vào khay, mang khay về đúng chỗ",1,"Tự dọn chỗ ăn của mình giúp cô và các bạn trực nhật đỡ vất vả."],["Để khay lại, chạy ra chơi",0,"Khay bỏ lại thì người khác phải dọn thay. Chỉ mất một phút thôi con."]]},{"k":2,"s":"Đi ăn ở quán cùng ba mẹ, Bin ăn bánh xong, giấy gói rơi dưới ghế.","q":"Bin nên làm gì?","o":[["Kệ, cô phục vụ sẽ quét",0,"Cô phục vụ rất bận. Tự nhặt rác của mình là lịch sự nơi công cộng."],["Đá giấy vào sâu dưới bàn",0,"Giấu đi thì rác vẫn còn đó. Nhặt lên bỏ thùng rác nhé."],["Nhặt giấy lên, bỏ vào thùng rác",1,"Tự dọn phần của mình ở mọi nơi là tự lập và lịch sự."]]}],"qq":"Ăn xong, con có thể tự…","qo":["Chờ người khác dọn","Mang bát của mình đi cất","Để bát trên bàn cả tối"],"qa":1,"mi":{"t":"Tự mang bát đũa đi cất sau bữa ăn","s":"Sau bữa tối nay, con tự mang bát, đũa, thìa của mình đặt nhẹ vào bồn rửa (không mang dao, đồ nóng hoặc đồ dễ vỡ nặng), rồi lau chỗ ngồi của mình.","lv":["Ba mẹ đi cùng, chỉ chỗ đặt bát, con mang.","Ba mẹ nhắc một lần, con tự mang bát đi cất.","Con tự nhớ dọn bát sau mỗi bữa trong ba ngày và kể lại."],"rw":"Cả nhà nấu món con thích"}},{"t":"Đồ chơi bị hỏng","sk":4,"m":"6 phút","cx":[{"k":0,"s":"Bánh xe ô tô đồ chơi của Bin bị rời ra. Bin buồn và định vứt luôn chiếc xe.","q":"Bin nên làm gì?","o":[["Vứt đi, đòi mua xe mới",0,"Nhiều đồ hỏng vẫn sửa được. Thử xem trước khi bỏ nhé."],["Nhìn kỹ chỗ hỏng, thử lắp lại, khó quá thì nhờ ba",1,"Xem kỹ, thử sửa, rồi nhờ người lớn khi cần. Đó là cách giải quyết vấn đề."],["Cố ấn mạnh bánh xe vào",0,"Ấn mạnh có thể làm gãy thêm. Nhìn kỹ xem bánh xe lắp thế nào trước."]]},{"k":1,"s":"Giờ thủ công, quai chiếc giỏ giấy Bin làm bị rách ra.","q":"Bin nên làm gì?","o":[["Lấy giỏ của bạn",0,"Giỏ của bạn là công sức của bạn. Mình sửa giỏ của mình nhé."],["Vò giỏ lại, bỏ không làm nữa",0,"Bỏ thì mất hết công sức. Một chút hồ dán có thể cứu chiếc giỏ."],["Xem chỗ rách, dùng hồ dán lại hoặc hỏi cô cách sửa",1,"Thử sửa trước rồi hỏi cô khi cần. Giỏ của con vẫn có thể hoàn thành."]]},{"k":2,"s":"Ở công viên cùng mẹ, dây diều của Bin bị rối thành một cục.","q":"Bin nên làm gì?","o":[["Ngồi xuống gỡ từ từ từng chỗ, rối quá thì nhờ mẹ",1,"Gỡ từng chút một và nhờ giúp khi cần là cách giải quyết khéo léo."],["Giật thật mạnh cho bung ra",0,"Giật mạnh làm nút càng chặt. Gỡ từ từ lại nhanh hơn."],["Bỏ diều lại, chơi trò khác",0,"Diều vẫn còn tốt, chỉ dây bị rối thôi. Thử gỡ xem nhé."]]}],"qq":"Khi đồ bị hỏng, việc đầu tiên nên làm là…","qo":["Xem kỹ chỗ hỏng","Vứt ngay","Giấu đi"],"qa":0,"mi":{"t":"Xem kỹ chỗ hỏng rồi cùng sửa","s":"Con tìm một đồ chơi bị hỏng nhẹ (rời bánh xe, rách giấy, tuột mảnh ghép). Con xem kỹ và nói chỗ hỏng ở đâu, rồi cùng ba mẹ sửa (lắp lại, dán băng dính). Ba mẹ dùng dụng cụ, keo hoặc kéo.","lv":["Ba mẹ hỏi “Hỏng ở đâu?”, con chỉ, ba mẹ sửa và con giúp giữ.","Ba mẹ nhắc một lần, con tự xem kỹ và nói cách sửa con nghĩ ra.","Con tự phát hiện chỗ hỏng, tự đề xuất cách sửa và kể lại sau khi sửa xong."],"rw":"Ba mẹ cùng con xếp hình 15 phút"}},{"t":"Đừng đoán qua vẻ bề ngoài","sk":5,"m":"6 phút","cx":[{"k":0,"s":"Bà mua về một quả na vỏ sần sùi. Bin bĩu môi: “Quả này trông xấu, chắc không ngon.”","q":"Bin nên nghĩ thế nào?","o":[["Thử một miếng rồi mới nói ngon hay không",1,"Muốn biết thật thì phải thử hoặc tìm hiểu, đừng chỉ nhìn bề ngoài."],["Nói với bà: “Bà mua quả xấu quá”",0,"Câu đó làm bà buồn mà chưa chắc đúng. Thử trước rồi hãy nói nhé."],["Không ăn vì trông xấu",0,"Vỏ sần chưa chắc ruột dở. Thử một miếng mới biết được."]]},{"k":1,"s":"Cô cho chọn truyện đọc: một quyển bìa cũ, một quyển bìa mới bóng loáng. Cả lớp đều muốn quyển mới.","q":"Bin nên làm gì?","o":[["Tranh quyển mới cho bằng được",0,"Tranh nhau làm mất vui, mà chưa chắc quyển mới đã hay hơn."],["Lật xem vài trang của cả hai quyển rồi mới chọn",1,"Bìa đẹp chưa chắc truyện hay. Xem bên trong mới biết."],["Chê quyển cũ là chán",0,"Chưa đọc thì chưa biết chán hay không. Thử đọc vài trang nhé."]]},{"k":2,"s":"Ở công viên cùng ba, Bin thấy một chú chó to lông xù đi cùng chủ. Bin nghĩ: “Chó to chắc dữ lắm.”","q":"Bin nên làm gì?","o":[["Hỏi ba: “Chó to có dữ không ạ?” và chỉ lại gần khi chủ cho phép, có ba đi cùng",1,"Không đoán qua vẻ ngoài mà hỏi người biết rõ. Hỏi chủ trước giúp con an toàn."],["Hét lên và bỏ chạy",0,"Hét và chạy có thể làm chú chó giật mình. Đứng cạnh ba và bình tĩnh nhé."],["Chạy tới ôm chú chó",0,"Chó to hay nhỏ, mình đều chưa biết tính nó. Phải hỏi chủ trước và có ba đi cùng."]]}],"qq":"Muốn biết một thứ có tốt không, con nên…","qo":["Nhìn bề ngoài là đủ","Thử hoặc tìm hiểu thêm","Nghe một bạn nói"],"qa":1,"mi":{"t":"Nếm thử một món trông “không đẹp”","s":"Ba mẹ chuẩn bị một loại quả hoặc món ăn con chưa thích vẻ ngoài (na, quả sần sùi…). Con đoán trước “ngon hay không”, rồi nếm thử một miếng nhỏ và nói kết quả có giống dự đoán không.","lv":["Ba mẹ nếm trước, con nếm theo một miếng nhỏ và nói cảm nhận.","Ba mẹ nhắc một lần, con tự đoán trước rồi nếm thử.","Con tự đoán, nếm thử và nói “Không nên đoán chỉ qua vẻ ngoài vì…”."],"rw":"Được chọn loại trái cây tráng miệng"}},{"t":"Thuốc không phải là kẹo","sk":6,"m":"6 phút","cx":[{"k":0,"s":"Bin thấy trên bàn có mấy viên thuốc màu hồng, trông giống kẹo. Ba mẹ đang ở phòng bên.","q":"Bin nên làm gì?","o":[["Nếm thử một viên xem có ngọt không",0,"Thuốc trông như kẹo nhưng có thể làm con ốm. Không bao giờ tự nếm nhé."],["Không chạm vào, gọi ba mẹ đến cất",1,"Thuốc chỉ được uống khi người lớn đưa. Gọi ba mẹ để cả nhà được an toàn."],["Cầm cho em bé chơi",0,"Em bé có thể cho vào miệng. Không cầm, chỉ gọi ba mẹ thôi."]]},{"k":1,"s":"Ở lớp, bạn Nam lấy ra một lọ nhỏ trông như lọ thuốc: “Kẹo của mẹ tớ đấy, ăn thử không?”","q":"Bin nên làm gì?","o":[["Ăn thử một viên cho vui",0,"Chưa biết là gì thì không ăn. Đó có thể là thuốc của người lớn."],["Lấy một viên giấu vào cặp mình",0,"Giữ đồ lạ trong cặp không an toàn. Báo cô để cô xem giúp nhé."],["Nói “Tớ không ăn đâu”, rồi báo cô giáo",1,"Từ chối và báo cô giúp cả con và bạn Nam được an toàn."]]},{"k":2,"s":"Đi chơi công viên cùng mẹ, Bin thấy một vỉ thuốc trên ghế đá.","q":"Bin nên làm gì?","o":[["Không chạm vào, gọi mẹ đến",1,"Gặp thuốc lạ ở bất cứ đâu, con đừng chạm mà gọi người lớn ngay."],["Cầm về nhà chơi",0,"Thuốc không phải đồ chơi. Mẹ sẽ biết cách xử lý."],["Bóc một viên ra xem",0,"Thuốc lạ thì không nên chạm vào. Để nguyên và gọi mẹ nhé."]]}],"qq":"Thuốc chỉ được uống khi…","qo":["Người lớn tin cậy đưa cho","Thấy ngon","Bạn rủ"],"qa":0,"mi":{"t":"Nhắc quy tắc: thuốc chỉ uống khi người lớn đưa","s":"Ba mẹ cho con xem (không cầm, không mở) tủ thuốc đặt trên cao của gia đình. Con nói to quy tắc “Thuốc không phải kẹo, chỉ uống khi ba mẹ đưa” và tập: thấy thuốc rơi ngoài thì không chạm, gọi ngay người lớn.","lv":["Ba mẹ nói mẫu quy tắc, con nói theo.","Ba mẹ nhắc một lần, con tự nói quy tắc và việc cần làm khi thấy thuốc.","Con tự nói quy tắc, giải thích vì sao thuốc giống kẹo vẫn nguy hiểm."],"rw":"Được dán một ngôi sao lên bảng khen của gia đình"}},{"t":"Sẵn sàng đúng giờ","sk":7,"m":"6 phút","cx":[{"k":0,"s":"Mẹ báo: “10 phút nữa mình đi thăm bà nhé.” Bin vẫn đang tô màu, chưa thay đồ.","q":"Bin nên làm gì?","o":[["Cất bút, thay đồ, đi giày, còn thời gian thì tô tiếp",1,"Chuẩn bị trước giúp cả nhà đi đúng giờ. Còn dư thời gian thì con chơi tiếp."],["Tô cho xong bức tranh đã",0,"Tô xong thì cả nhà phải chờ. Bức tranh có thể đợi đến khi về."],["Chờ mẹ gọi lần nữa",0,"Chờ gọi lại thì 10 phút trôi qua rất nhanh. Bắt đầu ngay nhé."]]},{"k":1,"s":"Mai lớp đi dã ngoại, cô dặn có mặt ở trường lúc 7 giờ. Tối nay Bin chưa chuẩn bị gì.","q":"Bin nên làm gì?","o":[["Thức khuya chơi vì háo hức quá",0,"Thức khuya thì sáng khó dậy. Ngủ sớm để mai đi chơi thật khoẻ."],["Tối nay soạn sẵn ba lô, để cạnh cửa và đi ngủ sớm",1,"Chuẩn bị từ tối hôm trước giúp sáng mai không vội và đến đúng giờ."],["Sáng mai dậy rồi soạn",0,"Buổi sáng thời gian rất ngắn, dễ quên đồ. Soạn từ tối nhé."]]},{"k":2,"s":"Ở nhà văn hoá, lớp học vẽ sắp bắt đầu. Bin còn đứng ngoài sân xem các bạn chơi, ba nhắc còn 2 phút.","q":"Bin nên làm gì?","o":[["Xem thêm một chút",0,"Vào muộn thì cả lớp phải chờ hoặc con lỡ phần đầu. Vào ngay nhé."],["Chào ba, đi vào lớp và ngồi vào chỗ",1,"Vào lớp trước giờ giúp con không bỏ lỡ gì và cô không phải chờ."],["Chạy thật nhanh vào lớp, xô cả bạn",0,"Vội quá dễ va vào bạn. Đi nhanh nhưng cẩn thận là đủ."]]}],"qq":"Muốn đúng giờ, con nên…","qo":["Chờ đến phút cuối","Làm việc mình thích trước","Chuẩn bị trước khi đến giờ"],"qa":2,"mi":{"t":"Chuẩn bị xong trước giờ đi","s":"Lần tới cả nhà đi đâu (thăm ông bà, đi học), ba mẹ báo trước 10 phút. Con dừng việc đang làm, thay đồ, đi giày, cầm đồ cần mang và đứng ở cửa trước khi hết giờ.","lv":["Ba mẹ hẹn giờ và cùng con chuẩn bị từng thứ.","Ba mẹ nhắc một lần, con tự chuẩn bị và ra cửa đúng giờ.","Con tự chuẩn bị xong trước khi hết giờ và kể con đã làm những gì."],"rw":"Được chọn bài hát trên đường đi học"}},{"t":"So sánh giá trước khi mua","sk":8,"m":"7 phút","cx":[{"k":0,"s":"Mẹ và Bin xem giá ở hai cửa hàng gần nhà. Cùng một gói bánh, chỗ này 10 nghìn, chỗ kia 8 nghìn.","q":"Bin nên góp ý với mẹ thế nào?","o":[["Chỗ nào cũng được",0,"Mỗi lần chênh 2 nghìn, mua nhiều lần sẽ thành nhiều đấy. So sánh là đáng làm."],["Mua ở chỗ 8 nghìn vì cùng một loại bánh",1,"Cùng một thứ thì chọn giá tốt hơn. Tiền tiết kiệm được để dành cho việc khác."],["Mua ở chỗ trang trí đẹp hơn",0,"Cùng một gói bánh thì bánh như nhau. Nhìn giá sẽ giúp chọn đúng."]]},{"k":1,"s":"Cô cho cả lớp xem hai quyển vở giống nhau: một quyển 6 nghìn, một quyển 9 nghìn vì có thêm hình dán.","q":"Nên chọn quyển nào?","o":[["Quyển 6 nghìn, vì giấy viết như nhau",1,"So sánh thứ mình thật sự dùng, ở đây là giấy viết, giúp chọn hợp lý."],["Quyển 9 nghìn vì có hình dán",0,"Hình dán vui nhưng giấy viết như nhau. Thêm 3 nghìn chỉ để có một hình dán thôi."],["Không cần nhìn giá, cái nào cũng được",0,"Nhìn giá giúp mình giữ được tiền. Thử so sánh nhé."]]},{"k":2,"s":"Ở nhà sách cùng mẹ, Bin cần mua cục tẩy. Cục tẩy hình con thỏ giá 15 nghìn, cục tẩy thường giá 3 nghìn.","q":"Bin nên chọn thế nào?","o":[["Xem cả hai, thấy tẩy như nhau thì chọn cục 3 nghìn, còn lại để dành",1,"So giá giúp mình có thứ cần mà vẫn còn tiền để dành. Thế là tiêu tiền khôn ngoan."],["Mua cả hai cho chắc",0,"Mua thừa thì tốn tiền mà không cần. Một cục là đủ dùng rồi."],["Lấy cục con thỏ vì đẹp",0,"Đẹp thì vui, nhưng cả hai đều tẩy như nhau. Con thử nghĩ xem phần tiền thừa dùng được vào việc gì."]]}],"qq":"Trước khi mua, con nên…","qo":["So sánh giá và công dụng","Mua cái đầu tiên nhìn thấy","Chọn cái đắt nhất"],"qa":0,"mi":{"t":"Chơi “cửa hàng” so sánh giá ở nhà","s":"Ở nhà, ba mẹ bày hai món đồ dùng giống công dụng (hai cục tẩy, hai cây bút) với giá giả trên giấy. Con so sánh giá và công dụng rồi chọn món hợp lý, giải thích vì sao.","lv":["Ba mẹ hỏi “Món nào rẻ hơn? Có dùng được như nhau không?”, con trả lời.","Ba mẹ nhắc một lần, con tự so sánh và chọn.","Con tự so sánh, chọn và giải thích “Cùng công dụng thì chọn món giá hợp lý”."],"rw":"Cùng chơi một ván cờ với ba mẹ"}},{"t":"Lắng nghe khi người khác nói","sk":0,"m":"6 phút","cx":[{"k":0,"s":"Ông đang kể chuyện ngày xưa ông đi câu cá. Bin vừa nghe vừa nghịch xe đồ chơi, không nhìn ông.","q":"Bin nên làm gì để lắng nghe ông?","o":[["Nói: “Chuyện này con nghe rồi”",0,"Câu đó làm ông buồn. Con có thể hỏi thêm về một điều mới."],["Cứ chơi tiếp, tai vẫn nghe mà",0,"Tai nghe nhưng mắt không nhìn thì ông nghĩ con không thích. Cất xe một lát nhé."],["Cất xe, nhìn ông và hỏi: “Ông câu được con cá to nhất là bao nhiêu ạ?”",1,"Nhìn người nói và hỏi thêm cho người ta biết con đang thật sự lắng nghe."]]},{"k":1,"s":"Bạn Mai đang kể về chuyến về quê thăm ông bà. Bin cứ chen vào kể chuyện của mình.","q":"Bin nên làm gì?","o":[["Chờ Mai kể xong, rồi hỏi: “Ở quê cậu có gì vui nhất?”",1,"Nghe trọn câu chuyện và hỏi thêm làm bạn thấy được quan tâm. Sau đó đến lượt con kể."],["Kể chuyện của mình to hơn",0,"Nói to hơn thì bạn Mai không kể tiếp được. Chờ bạn kể xong nhé."],["Bỏ đi chỗ khác",0,"Bỏ đi giữa chừng làm bạn buồn. Ở lại nghe một chút nhé."]]},{"k":2,"s":"Ở bảo tàng cùng ba mẹ, cô hướng dẫn đang giới thiệu về loài khủng long. Bin muốn chạy ngay đến mô hình khủng long to.","q":"Bin nên làm gì?","o":[["Nói chuyện với ba trong lúc cô đang nói",0,"Nói chuyện làm mọi người khó nghe. Có câu hỏi thì chờ cô nói xong."],["Chạy trước đến mô hình",0,"Chạy trước dễ lạc ba mẹ và bỏ lỡ chuyện hay. Nghe cô một chút đã."],["Đứng cạnh ba mẹ, nhìn cô và nghe hết rồi mới đi xem",1,"Nghe hết lời giới thiệu giúp con hiểu nhiều hơn khi xem, và không bị lạc."]]}],"qq":"Lắng nghe tốt là…","qo":["Vừa nghe vừa chơi","Nhìn người nói và hỏi thêm","Ngắt lời để kể chuyện mình"],"qa":1,"mi":{"t":"Nghe ông bà hoặc ba mẹ kể và hỏi thêm","s":"Tối nay con đặt đồ chơi xuống, nhìn ông bà hoặc ba mẹ khi họ kể một chuyện ngày xưa, rồi hỏi thêm ít nhất một câu về câu chuyện.","lv":["Ba mẹ nhắc con cất đồ chơi và gợi ý một câu hỏi.","Ba mẹ nhắc một lần, con tự nhìn người kể và tự nghĩ câu hỏi.","Con tự lắng nghe, hỏi hai câu và kể lại một chi tiết con nhớ nhất."],"rw":"Cùng xem ảnh hồi con còn bé"}},{"t":"Chờ đợi không cáu kỉnh","sk":1,"m":"6 phút","cx":[{"k":0,"s":"Bánh mẹ nướng vừa ra lò, còn rất nóng. Mẹ bảo chờ 10 phút cho bánh nguội.","q":"Bin nên làm gì?","o":[["Đi rửa tay, bày đĩa, rồi chờ cùng mẹ",1,"Làm việc có ích trong lúc chờ giúp con bớt sốt ruột, mà bánh cũng vừa nguội."],["Cứ mỗi phút lại hỏi mẹ “Được chưa?”",0,"Hỏi nhiều thì thời gian cũng không nhanh hơn. Làm việc khác để quên chờ nhé."],["Lén bẻ một miếng ăn luôn",0,"Bánh nóng có thể làm bỏng miệng. Chờ một chút bánh sẽ ngon hơn."]]},{"k":1,"s":"Đến giờ uống sữa ở lớp, các bạn xếp hàng nhận sữa. Bin đứng cuối hàng và thấy sốt ruột.","q":"Bin nên làm gì?","o":[["Bỏ hàng, không lấy sữa nữa",0,"Bỏ đi thì con mất phần sữa. Chờ một chút là đến lượt thôi."],["Chen lên đứng giữa hàng",0,"Chen hàng làm các bạn buồn và không công bằng. Ai rồi cũng đến lượt."],["Hít thở chậm, nói chuyện nhỏ với bạn đứng trước",1,"Hít thở và trò chuyện nhẹ nhàng giúp thời gian chờ dễ chịu hơn."]]},{"k":2,"s":"Bin và mẹ ngồi chờ khám răng. Chờ lâu lắm mà vẫn chưa đến lượt, Bin bắt đầu cáu.","q":"Bin có thể làm
