."],"rw":"Ba mẹ cùng con giải một câu đố vui"}},{"t":"Khi bạn trong nhóm chưa làm phần việc","sk":2,"m":"10 phút","cx":[{"k":0,"s":"Cả nhà chia việc dọn nhà cuối tuần. Em của An được giao lau bàn ghế nhưng vẫn ngồi chơi xếp hình, còn An đã quét nhà xong.","q":"An nên làm gì?","o":[["Đi mách mẹ ngay",0,"Mách ngay có thể làm em giận. Thử rủ em làm cùng trước đã."],["Lau hộ luôn rồi cằn nhằn cả buổi",0,"Làm hộ rồi cằn nhằn thì con mệt mà em cũng không học được gì."],["Rủ em: “Mình thi xem ai lau xong ba cái ghế trước nhé!” và làm cùng em một lúc",1,"Biến việc thành trò chơi giúp em hào hứng. Làm cùng nhau thì việc xong nhanh hơn."]]},{"k":1,"s":"Nhóm An làm bài thuyết trình về rác thải nhựa. Ngày mai trình bày rồi mà phần tìm hình ảnh của Bảo vẫn chưa có, cả nhóm bắt đầu bực.","q":"An nên làm gì?","o":[["Hỏi riêng Bảo có gặp khó khăn gì không, rồi cùng tìm cách: chia bớt việc hoặc giúp Bảo làm cho kịp",1,"Có thể bạn đang gặp chuyện mình chưa biết. Hỏi han trước rồi cùng giải quyết giúp nhóm về đích."],["Nói trong nhóm chat: “Bảo lười quá!”",0,"Chê bạn trước mọi người làm bạn xấu hổ và càng khó hợp tác. Hỏi riêng sẽ tốt hơn."],["Tự làm hết phần của Bảo và không nói gì",0,"Ôm hết việc làm con quá tải và Bảo không có cơ hội góp sức. Nói chuyện với bạn trước nhé."]]},{"k":2,"s":"Câu lạc bộ trồng cây khu phố chia nhóm tưới cây cho vườn chung, có cô phụ trách đi cùng. Đến lượt nhóm An, một bạn trong nhóm chỉ đứng xem điện thoại.","q":"An nên làm gì?","o":[["Tưới nước vào bạn cho bạn chú ý",0,"Đùa kiểu đó dễ làm bạn giận và hỏng điện thoại. Mời bạn bằng lời sẽ hiệu quả hơn."],["Hỏi bạn có muốn cầm vòi tưới hay xách bình, để bạn chọn phần mình thích",1,"Mời bạn chọn việc giúp bạn thấy mình được cần đến. Ai cũng thích có phần của mình."],["Kệ bạn, nhóm tự làm",0,"Bỏ qua thì bạn càng đứng ngoài nhóm. Một lời mời có thể thay đổi điều đó."]]}],"qq":"Khi một bạn trong nhóm chậm việc, nên làm gì trước?","qo":["Hỏi bạn xem có khó khăn gì","Báo cô ngay để trừ điểm bạn","Không chơi với bạn nữa"],"qa":0,"mi":{"t":"Tập hỏi bạn “Cậu có vướng gì không?”","s":"Con và ba mẹ đóng vai: ba mẹ là bạn trong nhóm chưa làm phần việc. Con hỏi nhẹ nhàng bạn có khó khăn gì và đề xuất một cách giúp, không trách móc.","lv":["Ba mẹ gợi ý câu hỏi, con nói theo và cùng nghĩ cách giúp.","Ba mẹ nhắc một lần, con tự hỏi và tự đề xuất cách giúp.","Con tự đóng vai hai tình huống khác nhau và kể lại con sẽ nói gì với nhóm thật ở lớp."],"rw":"Cả nhà xem một bộ phim gia đình do con chọn"}},{"t":"Nhóm chia hai phe thì làm sao","sk":2,"m":"10 phút","cx":[{"k":0,"s":"Cả nhà chọn món cho bữa tối Chủ nhật. An và ba muốn ăn bún chả, mẹ và em muốn ăn lẩu nấm. Ai cũng không muốn nhường.","q":"An nên làm gì?","o":[["Nói mẹ quyết đi cho xong",0,"Để một người quyết thì người kia có thể không vui. Cùng tìm cách sẽ tốt hơn."],["Nhất quyết đòi món mình thích",0,"Không ai nhường thì bữa tối thành cuộc cãi nhau. Thử nghĩ cách để cả hai bên đều vui."],["Gợi ý tuần này nấu một món, tuần sau nấu món kia, và bốc thăm xem món nào trước",1,"Thay phiên và bốc thăm là cách công bằng khi hai bên ngang nhau. Ai cũng được đến lượt."]]},{"k":1,"s":"Nhóm bốn bạn của An phải chọn tên đội cho hội thi đố vui. Hai bạn muốn “Đội Cá Heo”, hai bạn muốn “Đội Tia Chớp”. Đã mười phút trôi qua mà vẫn chưa thống nhất.","q":"An nên làm gì?","o":[["Đề nghị cả nhóm thống nhất một tiêu chí, như tên dễ nhớ và hợp chủ đề, rồi chọn theo tiêu chí đó",1,"Khi bất đồng, thống nhất cách chọn trước giúp nhóm bớt tranh cãi. Ai cũng thấy quyết định công bằng."],["Ai nói to hơn thì thắng",0,"Nói to không làm ý kiến đúng hơn, chỉ làm nhóm căng thẳng. Cần một cách chọn công bằng."],["Giận dỗi không góp ý nữa",0,"Rút lui làm nhóm mất một thành viên. Ý của con vẫn quan trọng, kể cả khi không được chọn."]]},{"k":2,"s":"Đội bóng nhí của khu phố bàn về áo đấu, có huấn luyện viên ở đó. Một nửa đội muốn màu xanh, nửa kia muốn màu cam. Mọi người bắt đầu to tiếng.","q":"An nên làm gì?","o":[["Nói “Màu cam xấu lắm” cho bên kia đổi ý",0,"Chê lựa chọn của bạn làm cuộc bàn bạc thành cãi nhau. Hãy nói lý do mình thích thay vì chê."],["Đề nghị mỗi bên nói một lý do, rồi nhờ huấn luyện viên tổ chức bỏ phiếu kín",1,"Nghe lý do giúp hiểu nhau hơn. Bỏ phiếu kín giúp mọi người chọn thật lòng mà không ngại."],["Bỏ đội vì không được chọn màu mình thích",0,"Màu áo chỉ là một phần nhỏ. Niềm vui chơi bóng cùng đội quan trọng hơn nhiều."]]}],"qq":"Khi nhóm bất đồng, cách công bằng là…","qo":["Để bạn giỏi nhất quyết định","Thống nhất tiêu chí rồi cùng chọn","Bỏ qua, không làm nữa"],"qa":1,"mi":{"t":"Cùng đặt tiêu chí rồi mới chọn","s":"Lần tới cả nhà phải chọn một việc (chơi trò gì, ăn gì), con đề nghị mọi người cùng đặt 2–3 tiêu chí trước, rồi chấm từng lựa chọn theo tiêu chí. Con ghi kết quả cho ba mẹ xem.","lv":["Ba mẹ giúp nghĩ tiêu chí, con ghi và đọc kết quả.","Ba mẹ nhắc một lần, con tự dẫn cả nhà đặt tiêu chí và chấm.","Con tự đề xuất cách này khi có bất đồng thật và kể lại mọi người có thấy công bằng không."],"rw":"Cả nhà làm theo lựa chọn thắng cuộc ngay tuần này"}},{"t":"Giữ đồ của mình không thất lạc","sk":3,"m":"9 phút","cx":[{"k":0,"s":"Sáng nào An cũng mất mười phút tìm chìa khoá ngăn bàn, thẻ thư viện và đồng hồ. Ba mẹ đều phải chờ.","q":"An nên làm gì?","o":[["Nhờ mẹ giữ hộ tất cả",0,"Mẹ giữ hộ thì con chưa học cách tự quản đồ. Một chỗ cố định sẽ giúp con tự làm."],["Dậy sớm hơn để có thêm thời gian tìm",0,"Dậy sớm chỉ để tìm đồ thì tiếc giấc ngủ. Sắp xếp chỗ để đồ sẽ giải quyết tận gốc."],["Đặt một chiếc khay nhỏ trên bàn học làm “chỗ của đồ quan trọng”, tối nào cũng để vào đó",1,"Mỗi món có một chỗ cố định thì sáng ra không phải nghĩ. Đó là tự lập từ thói quen nhỏ."]]},{"k":1,"s":"An cho bạn mượn thước kẻ và gọt bút chì nhưng không nhớ đã đưa cho ai. Hộp bút giờ thiếu nhiều thứ.","q":"An nên làm gì?","o":[["Hỏi các bạn ngồi gần, rồi dán tên lên đồ và nhớ ai đang mượn",1,"Dán tên và ghi nhớ ai mượn giúp đồ quay về với con. Cho mượn vẫn tốt, chỉ cần có cách theo dõi."],["Lấy đồ của bạn khác dùng tạm",0,"Lấy đồ chưa hỏi sẽ làm bạn khác khó chịu. Hỏi lại các bạn sẽ đúng hơn."],["Thôi bỏ, coi như mất",0,"Đồ vẫn còn ở lớp, chỉ cần hỏi. Lần sau nhớ ghi lại khi cho mượn."]]},{"k":2,"s":"Cả nhà đi công viên chơi cả buổi sáng. Lúc về đến cổng, An mới nhớ không thấy chai nước và mũ đâu. Đây là lần thứ ba trong tháng.","q":"An nên làm gì?","o":[["Xin ba mẹ mua cái mới",0,"Mua mới thì tốn tiền mà thói quen quên vẫn còn. Tập kiểm tra đồ sẽ giúp lâu dài."],["Nói với ba mẹ, cùng quay lại chỗ đã ngồi tìm, rồi từ nay trước khi rời đi tự kiểm tra “đủ đồ chưa”",1,"Tìm lại cùng người lớn là an toàn. Thói quen kiểm tra trước khi đi giúp con không phải tìm nữa."],["Tự chạy quay lại tìm, không nói với ai",0,"Tự đi một mình ở nơi đông người làm ba mẹ lo và không an toàn. Luôn báo người lớn trước."]]}],"qq":"Cách hay để không bỏ quên đồ là…","qo":["Mang thật ít đồ","Nhờ người khác cầm giúp hết","Kiểm tra lại đồ trước khi rời đi"],"qa":2,"mi":{"t":"Câu thần chú kiểm tra đồ trước khi về","s":"Con viết danh sách đồ hay mang theo (chai nước, mũ, áo khoác…) và đặt một câu nhắc ngắn. Lần tới ra khỏi nhà hay rời một nơi, con tự đếm lại đồ trước khi đi. Ba mẹ quan sát.","lv":["Ba mẹ cùng viết danh sách và cùng con đếm đồ lần đầu.","Ba mẹ nhắc một lần, con tự đếm đồ trước khi rời đi.","Con tự kiểm tra mà không cần nhắc trong cả tuần và kể lại có lần nào suýt quên không."],"rw":"Con được chọn nơi cả nhà đi chơi cuối tuần (gần nhà)"}},{"t":"Đồ hỏng: thử sửa trước khi bỏ","sk":4,"m":"10 phút","cx":[{"k":0,"s":"Quai cặp sách của An bị bung chỉ một bên. An định xin mẹ mua cặp mới dù cặp vẫn còn tốt.","q":"An nên làm gì?","o":[["Dùng tạm bằng cách xách tay cả năm",0,"Xách một tay lâu ngày dễ mỏi vai. Sửa quai sẽ thoải mái hơn."],["Đòi mua cặp mới vì cặp cũ hỏng rồi",0,"Hỏng một chỗ nhỏ không có nghĩa là hỏng cả cặp. Thử tìm cách sửa trước nhé."],["Xem chỗ hỏng, nhờ ba hoặc mẹ chỉ cách khâu lại, hoặc cùng mang ra tiệm sửa gần nhà",1,"Sửa được thì tiết kiệm tiền và bớt rác. Học khâu một đường chỉ cũng là kỹ năng hữu ích cho cả bạn trai lẫn bạn gái."]]},{"k":1,"s":"Giờ thủ công, chiếc hộp đựng bút An làm bằng bìa cứng bị bung keo một góc ngay trước khi nộp.","q":"An nên làm gì?","o":[["Tìm nguyên nhân: keo chưa khô, rồi kẹp góc lại bằng kẹp giấy chờ khô và báo cô xin thêm vài phút",1,"Hiểu vì sao hỏng giúp sửa đúng cách. Xin thêm thời gian lễ phép là bình thường."],["Nộp luôn, cô sẽ không để ý",0,"Một góc bung dễ làm hộp hỏng thêm. Dành vài phút sửa sẽ tốt hơn."],["Vứt đi làm lại từ đầu",0,"Làm lại cả hộp tốn nhiều thời gian trong khi chỉ hỏng một góc. Sửa đúng chỗ là đủ."]]},{"k":2,"s":"Đạp xe cùng ba ở công viên, xích xe của An bị tuột. Ba đứng bên cạnh, An bực bội muốn bỏ xe dắt về.","q":"An nên làm gì?","o":[["Đá vào xe cho bõ tức",0,"Đá xe có thể làm hỏng thêm và đau chân. Bình tĩnh nhìn xem chỗ tuột ở đâu."],["Nhờ ba hướng dẫn, tự tay lắp xích lại vào bánh răng",1,"Tự sửa với người lớn hướng dẫn giúp con lần sau biết cách. Bẩn tay một chút cũng không sao."],["Để xe lại công viên",0,"Bỏ xe lại thì có thể mất. Xích tuột thường sửa được chỉ trong vài phút."]]}],"qq":"Khi đồ dùng bị hỏng nhẹ, nên làm gì trước?","qo":["Vứt đi mua cái mới","Xem chỗ hỏng và tìm cách sửa","Giấu đi để không ai biết"],"qa":1,"mi":{"t":"Thử sửa một món đồ hỏng nhẹ","s":"Con tìm một món đồ hỏng nhẹ của mình (sách rách bìa, hộp bút lỏng nắp, nhãn vở bong) và cùng ba mẹ sửa bằng băng dính hoặc keo dán giấy. Việc cần kim, kéo sắc hay dụng cụ thì ba mẹ làm, con phụ giúp.","lv":["Ba mẹ xem chỗ hỏng cùng con và chỉ cách sửa, con dán.","Ba mẹ nhắc một lần, con tự tìm cách sửa và hỏi ba mẹ trước khi làm.","Con tự tìm đồ cần sửa, tự lên cách làm an toàn, sửa xong khoe ba mẹ và kể vì sao không cần mua mới."],"rw":"Ba mẹ khen con trước cả nhà là “thợ sửa giỏi”"}},{"t":"Mẹo trên mạng có nên làm theo?","sk":5,"m":"10 phút","cx":[{"k":0,"s":"An xem một video hướng dẫn: “Mẹo học thuộc cả bài trong 5 phút, không cần ôn!” An định tối nay chỉ dùng mẹo này thay cho ôn bài.","q":"An nên làm gì?","o":[["Làm theo luôn vì video có nhiều lượt xem",0,"Nhiều lượt xem không chứng minh mẹo đúng. Cần xem người nói là ai và có bằng chứng gì."],["Cho rằng mọi mẹo trên mạng đều vô dụng",0,"Có những mẹo hữu ích thật. Kỹ năng là biết kiểm tra, không phải bỏ qua tất cả."],["Nghĩ xem người làm video có phải người am hiểu không, thử mẹo song song với cách ôn quen thuộc, và hỏi cô giáo",1,"Lời hứa “không cần cố gắng” thường quá tốt để là thật. Thử cẩn thận và hỏi người hiểu biết là khôn ngoan."]]},{"k":1,"s":"Bạn Tí kể ở lớp: “Trên mạng nói uống nước đá lúc nắng sẽ bị bệnh nặng ngay!” Vài bạn hoảng sợ.","q":"An nên làm gì?","o":[["Kể tiếp cho lớp khác cùng biết",0,"Chưa kiểm tra mà lan truyền dễ làm nhiều người lo lắng vô cớ."],["Nói: “Mình chưa chắc đâu, để hỏi cô giáo hoặc cô y tế trường nhé”",1,"Tin nghe ở đâu đó cần được kiểm tra với người có chuyên môn trước khi tin."],["Cười Tí vì tin linh tinh",0,"Chê bạn làm bạn ngại. Cùng bạn đi hỏi sẽ giúp cả lớp hiểu đúng."]]},{"k":2,"s":"Đi chơi với cô chú, An thấy trên mạng mẹo “cho cá ăn bánh mì ở hồ công viên thì cá lớn nhanh”. An định mua thật nhiều bánh mì.","q":"An nên làm gì?","o":[["Đọc biển nội quy của công viên và hỏi cô chú hoặc nhân viên trước",1,"Nội quy nơi công cộng và người hiểu biết là nguồn đáng tin hơn một mẹo trên mạng. Có nơi không cho cho cá ăn để giữ nước sạch."],["Mua thật nhiều bánh mì thả xuống hồ",0,"Thả nhiều đồ ăn có thể làm nước hồ bẩn và hại cá. Kiểm tra trước sẽ tốt hơn."],["Lén cho ăn khi không ai nhìn",0,"Nếu phải lén thì có lẽ việc đó không nên làm. Hỏi người lớn sẽ rõ ràng hơn."]]}],"qq":"Trước khi làm theo một lời khuyên trên mạng, nên tự hỏi…","qo":["Video có vui không?","Bạn mình đã thử chưa?","Người nói có đáng tin không, có bằng chứng không?"],"qa":2,"mi":{"t":"Kiểm tra một mẹo trước khi tin","s":"Con chọn một mẹo con từng nghe hoặc xem (về học tập, ăn uống, đồ dùng) và cùng ba mẹ hỏi: “Ai nói? Có bằng chứng không? Có an toàn không?” Con nói kết luận của mình.","lv":["Ba mẹ cùng xem lại mẹo và gợi ý từng câu hỏi, con trả lời.","Ba mẹ nhắc một lần, con tự hỏi đủ ba câu và nêu kết luận.","Con tự chọn hai mẹo, so sánh và giải thích cho ba mẹ vì sao tin mẹo này hơn mẹo kia."],"rw":"Cả nhà thử một thí nghiệm khoa học nhỏ, an toàn tại nhà"}},{"t":"Bí mật nào nên giữ, bí mật nào phải kể","sk":6,"m":"10 phút","cx":[{"k":0,"s":"Ba dặn An: “Mình giữ bí mật chuyện chuẩn bị bánh sinh nhật cho mẹ nhé!” Hôm sau mẹ hỏi An sao ba cứ thì thầm với con.","q":"An nên làm gì?","o":[["Kể hết cho mẹ vì không được giữ bí mật với ba mẹ",0,"Bí mật về bất ngờ vui sẽ được bật mí sớm thôi, nên giữ được. Bí mật không nên giữ là bí mật làm ai đó sợ hay bị đau."],["Nói dối là không có gì",0,"Không cần nói dối, chỉ cần cho mẹ biết đó là một bất ngờ vui."],["Cười và nói: “Bí mật vui, đến sinh nhật mẹ sẽ biết ạ!”",1,"Bất ngờ vui là bí mật tốt: nó làm người khác hạnh phúc và sẽ được bật mí."]]},{"k":1,"s":"Bạn Linh thì thầm với An: “Có anh lớp trên bắt mình đưa tiền ăn sáng mỗi ngày, cậu đừng nói với ai nhé.” Linh trông rất sợ.","q":"An nên làm gì?","o":[["Giữ bí mật vì đã hứa với bạn",0,"Bí mật làm bạn sợ hãi hoặc bị tổn thương thì không nên giữ. Giúp bạn quan trọng hơn lời hứa đó."],["Nói với Linh: “Chuyện này cần người lớn giúp, mình đi cùng cậu đến gặp cô chủ nhiệm nhé”",1,"Kể với người lớn tin cậy không phải là phản bội bạn mà là bảo vệ bạn. Đi cùng giúp Linh bớt sợ."],["Tự đi tìm anh lớp trên để nói chuyện",0,"Tự xử lý có thể làm con và Linh gặp nguy hiểm. Việc này cần người lớn giúp."]]},{"k":2,"s":"Ở sân chơi chung cư, một chú không quen cho An kẹo và nói: “Đừng kể với ba mẹ cháu nhé, bí mật của hai chú cháu mình.” Mẹ đang ngồi ở ghế đá gần đó.","q":"An nên làm gì?","o":[["Nói “Cháu không nhận ạ”, đi ngay đến chỗ mẹ và kể lại",1,"Ai bảo con giấu ba mẹ thì con càng phải kể ngay. Con làm đúng và không có lỗi gì cả."],["Nhận kẹo và giữ bí mật",0,"Người lớn tử tế không bao giờ bảo trẻ giữ bí mật với ba mẹ. Đó là dấu hiệu cần cảnh giác."],["Không nhận kẹo nhưng cũng không kể",0,"Từ chối là tốt, nhưng kể với mẹ giúp mẹ bảo vệ con và các bạn khác."]]}],"qq":"Bí mật nào cần kể ngay với người lớn tin cậy?","qo":["Bí mật làm ai đó sợ hãi, bị đau hoặc không an toàn","Bí mật về món quà bất ngờ cho mẹ","Bí mật về trò chơi mới của nhóm"],"qa":0,"mi":{"t":"Phân biệt “bất ngờ vui” và “bí mật không an toàn”","s":"Ba mẹ đọc 6 tình huống ngắn, con xếp vào “bất ngờ vui – có thể giữ” hay “bí mật không an toàn – phải kể ngay với người lớn tin cậy”. Con giải thích cách con phân biệt.","lv":["Ba mẹ đọc và gợi ý, con xếp và nói lý do.","Ba mẹ nhắc một lần, con tự xếp cả 6 tình huống.","Con tự xếp, tự nghĩ thêm một tình huống và nói con sẽ kể với ai, nói câu gì."],"rw":"Một cái ôm thật chặt và ba mẹ cảm ơn con đã tin tưởng"}},{"t":"Buổi sáng không vội vàng","sk":7,"m":"9 phút","cx":[{"k":0,"s":"Sáng nào An cũng dậy lúc 6 giờ 15 nhưng vẫn ra khỏi nhà muộn: vừa đánh răng vừa tìm tất, ăn sáng vội, ba phải giục mãi.","q":"An nên làm gì?","o":[["Đặt báo thức sớm hơn 30 phút",0,"Dậy sớm mà vẫn lộn xộn thì vẫn trễ, lại thiếu ngủ. Sắp xếp thứ tự việc mới là chìa khoá."],["Tối trước soạn sẵn quần áo, cặp sách; sáng làm theo thứ tự cố định: vệ sinh, thay đồ, ăn sáng, mang giày",1,"Việc làm được từ tối thì để tối làm. Một thứ tự cố định giúp buổi sáng trôi đều mà không cần nghĩ."],["Bỏ bữa sáng cho kịp giờ",0,"Bỏ bữa sáng làm con đói và mất tập trung ở lớp. Chuẩn bị từ tối sẽ có thời gian ăn."]]},{"k":1,"s":"Mỗi buổi sáng ở lớp có 15 phút truy bài trước giờ học. An thường dùng thời gian đó nói chuyện, đến lúc cô kiểm tra lại cuống lên.","q":"An nên làm gì?","o":[["Nói chuyện tiếp, vì 15 phút chẳng làm được gì",0,"Mười lăm phút đều đặn mỗi ngày cộng lại là rất nhiều. Dùng đúng việc thì con đỡ vất vả về sau."],["Mang truyện tranh ra đọc",0,"Đọc truyện vui nhưng không đúng lúc. Để dành truyện cho giờ ra chơi nhé."],["Chia 15 phút: 10 phút xem lại bài hôm qua, 5 phút chuẩn bị sách vở cho tiết đầu",1,"Chia thời gian ngắn thành việc cụ thể giúp con dùng trọn từng phút."]]},{"k":2,"s":"Chủ nhật cả nhà hẹn 7 giờ xuất phát về quê. 6 giờ 50 An vẫn đang chọn áo và chưa soạn đồ chơi mang theo.","q":"An nên làm gì?","o":[["Mặc áo đầu tiên vừa ý, lấy một món đồ chơi, ra xe đúng giờ, lần sau soạn đồ từ tối hôm trước",1,"Khi thời gian gấp, chọn nhanh thứ đủ tốt. Rồi rút kinh nghiệm để lần sau chuẩn bị sớm."],["Bắt cả nhà chờ thêm 20 phút",0,"Cả nhà chờ thì ai cũng mệt và có thể kẹt xe. Lần sau soạn từ tối hôm trước."],["Không mang gì cả, rồi kêu chán suốt đường",0,"Một món đồ chơi chỉ mất một phút để lấy. Chuẩn bị sớm giúp chuyến đi vui hơn."]]}],"qq":"Muốn buổi sáng nhẹ nhàng, nên…","qo":["Ngủ thêm năm phút","Làm nhiều việc cùng lúc","Chuẩn bị từ tối và làm theo thứ tự cố định"],"qa":2,"mi":{"t":"Chuẩn bị từ tối cho buổi sáng nhẹ nhàng","s":"Tối nay con chuẩn bị sẵn quần áo, cặp sách, tất và viết thứ tự 5 việc buổi sáng. Sáng mai con làm theo thứ tự đó và ra khỏi nhà đúng giờ. Ba mẹ xác nhận.","lv":["Ba mẹ cùng con chuẩn bị và viết thứ tự các việc.","Ba mẹ nhắc một lần buổi tối, con tự chuẩn bị và tự làm theo buổi sáng.","Con tự chuẩn bị 3 tối liền và kể lại buổi sáng nào nhẹ nhàng nhất, vì sao."],"rw":"Ba mẹ cùng con đi bộ buổi sáng cuối tuần"}},{"t":"Để dành cho một mục tiêu","sk":8,"m":"10 phút","cx":[{"k":0,"s":"An đã để dành được 60.000 đồng cho bộ màu. Hôm nay em rủ An dùng tiền đó mua kem cho cả hai.","q":"An nên làm gì?","o":[["Mua kem, tuần sau để dành lại",0,"Rút tiền để dành cho việc khác thì mục tiêu lùi xa. Có thể đãi em bằng cách khác."],["Giải thích với em mình đang để dành, và rủ em cùng làm kem chuối ở nhà với mẹ",1,"Giữ mục tiêu mà vẫn có niềm vui cùng em. Niềm vui không phải lúc nào cũng cần tiêu tiền."],["Mắng em vì đòi tiêu tiền của mình",0,"Em chỉ muốn chơi cùng con thôi. Giải thích nhẹ nhàng thì em sẽ hiểu."]]},{"k":1,"s":"Cả lớp An thống nhất dùng quỹ lớp do cô chủ nhiệm giữ để mua sách cho tủ sách lớp. Gần đủ tiền thì một số bạn muốn dùng quỹ mua bóng bay trang trí.","q":"An nên làm gì?","o":[["Đồng ý mua bóng bay cho vui",0,"Bóng bay vui một ngày, còn sách đọc được cả năm. Nhắc lại mục tiêu chung sẽ giúp lớp chọn."],["Không nói gì, để các bạn tự lo",0,"Ý kiến của con có thể giúp lớp giữ được mục tiêu. Hãy nói ra lễ phép."],["Nhắc cả lớp mục tiêu ban đầu là tủ sách và đề nghị cô chủ nhiệm cùng quyết định",1,"Mục tiêu chung cần được nhớ lại khi có cám dỗ. Có cô cùng quyết định thì minh bạch và công bằng."]]},{"k":2,"s":"Ở hiệu sách cùng mẹ, An thấy bộ màu nước 120.000 đồng rất muốn mua. Mỗi tuần An có 30.000 đồng tiền tiêu vặt và thường tiêu hết vào quà vặt.","q":"An nên làm gì?","o":[["Đặt mục tiêu: mỗi tuần để dành 20.000 đồng vào lọ có dán hình bộ màu, sau sáu tuần sẽ đủ",1,"Mục tiêu rõ ràng và lọ tiền có hình giúp con nhớ vì sao mình để dành. Mỗi tuần một chút là tới đích."],["Xin mẹ mua ngay, hứa sẽ ngoan",0,"Được mua ngay thì vui một chút, nhưng con mất cơ hội tập để dành. Tự góp tiền làm món đồ quý hơn."],["Bỏ ý định vì 120.000 đồng là quá nhiều",0,"Số tiền lớn trông khó, nhưng chia theo tuần thì làm được. Thử tính xem cần bao nhiêu tuần nhé."]]}],"qq":"Để dành hiệu quả cần…","qo":["Mục tiêu rõ ràng và số tiền để dành đều đặn","Chờ khi nào còn dư tiền","Tiêu hết rồi xin thêm"],"qa":0,"mi":{"t":"Bảng để dành cho một mục tiêu","s":"Con chọn một món đồ dùng con muốn có, cùng ba mẹ tính mỗi tuần để dành bao nhiêu từ tiền tiêu vặt và bao nhiêu tuần thì đủ. Con vẽ bảng tô màu mỗi tuần để dành và dán lên tường.","lv":["Ba mẹ cùng tính, con vẽ bảng và tô tuần đầu.","Ba mẹ nhắc một lần, con tự tính và tự vẽ bảng.","Con tự tính, tự để dành đều và mỗi tuần báo ba mẹ con đã tô thêm ô nào."],"rw":"Ba mẹ cùng con trang trí bảng để dành"}},{"t":"Góp ý cho bạn mà không làm bạn buồn","sk":0,"m":"9 phút","cx":[{"k":0,"s":"Ba lần đầu nấu canh chua, canh hơi mặn. Ba hỏi cả nhà: “Có ngon không?”","q":"An nên làm gì?","o":[["Nhăn mặt nói “Mặn quá ba ơi!”",0,"Nói thẳng mà thiếu tế nhị dễ làm ba buồn. Thử khen trước rồi góp ý nhẹ."],["Khen ngon rồi lén bỏ canh",0,"Khen mà không thật lòng thì ba không biết để chỉnh. Góp ý nhẹ nhàng sẽ giúp ba hơn."],["Nói: “Canh thơm lắm ba ạ, chua vừa. Lần sau ba bớt chút muối là tuyệt luôn!”",1,"Khen điều cụ thể rồi góp ý nhẹ nhàng giúp ba vui và biết lần sau làm gì."]]},{"k":1,"s":"Nam nhờ An đọc bài văn trước khi nộp. Bài có ý hay nhưng nhiều lỗi chính tả và đoạn cuối hơi lan man.","q":"An nên góp ý thế nào?","o":[["Nói “Hay lắm” cho bạn vui",0,"Khen cho qua thì bạn không biết sửa gì. Góp ý thật lòng mới là giúp bạn."],["Nói “Mình thích ý về chú chó của cậu. Có vài lỗi chính tả mình đánh dấu rồi, đoạn cuối cậu thử viết gọn lại xem”",1,"Góp ý tốt có ba phần: khen điều cụ thể, chỉ rõ chỗ cần sửa, gợi ý cách sửa."],["Nói “Nhiều lỗi quá, sửa hết đi”",0,"Chỉ nói cái chưa tốt làm bạn nản. Hãy bắt đầu bằng điều bạn làm tốt và chỉ cụ thể chỗ cần sửa."]]},{"k":2,"s":"Ở câu lạc bộ vẽ cuối tuần, bạn ngồi cạnh hỏi An thấy bức tranh của bạn thế nào. An thấy màu đẹp nhưng bầu trời còn trống quá.","q":"An nên làm gì?","o":[["Gợi ý: “Màu cậu chọn đẹp ghê! Thêm vài đám mây hay đàn chim lên trời chắc sẽ sinh động hơn”",1,"Khen thật lòng rồi đưa ý cụ thể giúp bạn hào hứng sửa tranh."],["Nói “Trời trống trơn, chán quá”",0,"Lời chê không có gợi ý làm bạn mất hứng. Hãy chỉ cách thêm cho đẹp."],["Nói “Mình không biết” cho khỏi phải góp ý",0,"Bạn hỏi vì muốn nghe ý con. Một góp ý tử tế là món quà cho bạn."]]}],"qq":"Một lời góp ý tốt nên…","qo":["Chỉ nêu điều chưa tốt","Khen điều cụ thể và gợi ý cách sửa","Khen chung chung"],"qa":1,"mi":{"t":"Góp ý kiểu “khen cụ thể – gợi ý sửa”","s":"Con đọc một bài viết, bức vẽ hoặc món ăn của người trong nhà và góp ý: khen một điều cụ thể, rồi gợi ý một cách làm tốt hơn bằng lời nhẹ nhàng. Người đó nói cảm nhận cho ba mẹ nghe.","lv":["Ba mẹ nói mẫu một lời góp ý, con nói theo với sản phẩm khác.","Ba mẹ nhắc một lần, con tự góp ý đủ hai phần.","Con tự góp ý cho hai người, hỏi họ thấy lời góp ý có dễ nghe không và kể lại."],"rw":"Ba mẹ viết lời khen con vào sổ tay gia đình"}},{"t":"Thua cũng phải vui vẻ","sk":1,"m":"9 phút","cx":[{"k":0,"s":"Cả nhà chơi cờ cá ngựa tối thứ Bảy. Em của An thắng ba ván liền, An tức đến muốn hất tung bàn cờ.","q":"An nên làm gì?","o":[["Hất bàn cờ cho xong",0,"Hất bàn cờ làm cả nhà mất vui và đồ chơi có thể hỏng. Thử hít thở trước đã."],["Hít thở, nói “Em chơi giỏi ghê!” và rủ chơi thêm một ván",1,"Trò chơi gia đình là để vui cùng nhau. Khen em và chơi tiếp giúp mọi người vẫn vui."],["Nói em ăn gian",0,"Buộc tội khi không có bằng chứng làm em buồn oan. Thắng thua là chuyện của may mắn và luyện tập."]]},{"k":1,"s":"Lớp An thua lớp bên cạnh trong trận kéo co hội khoẻ. Vài bạn bắt đầu trách nhau.","q":"An nên làm gì?","o":[["Nói với cả lớp: “Mình đã cố hết sức. Lần sau mình tập đứng thấp người và kéo cùng nhịp nhé!”",1,"Ghi nhận cố gắng và tìm cách tiến bộ giúp cả lớp gắn kết sau trận thua."],["Cùng các bạn chỉ ra ai làm cả lớp thua",0,"Trách nhau làm cả lớp buồn thêm. Cả đội thắng cùng nhau và thua cũng cùng nhau."],["Bỏ đi ngồi một mình",0,"Cần chút thời gian là bình thường, nhưng các bạn cũng đang buồn. Ở cùng nhau sẽ dễ chịu hơn."]]},{"k":2,"s":"An thi cờ vua ở câu lạc bộ thiếu nhi của phường và thua ván chung kết. Bạn thắng đưa tay ra bắt, nhưng An rất buồn và muốn bỏ về ngay.","q":"An nên làm gì?","o":[["Quay đi không bắt tay",0,"Buồn là bình thường, nhưng bỏ đi làm bạn kia cũng mất vui. Bắt tay là tôn trọng cả hai."],["Đổ lỗi tại phòng ồn nên mình thua",0,"Đổ lỗi giúp mình đỡ buồn một chút nhưng không giúp lần sau chơi tốt hơn."],["Bắt tay, nói “Chúc mừng cậu, ván hay lắm”, rồi nhờ thầy chỉ chỗ mình đi chưa tốt",1,"Chúc mừng người thắng là tinh thần thể thao. Học từ ván thua giúp con tiến bộ."]]}],"qq":"Khi thua một cuộc thi, điều nên làm là…","qo":["Tìm lý do để đổ lỗi","Không bao giờ thi nữa","Chúc mừng người thắng và tìm điều học được"],"qa":2,"mi":{"t":"Thua mà vẫn bắt tay chúc mừng","s":"Cả nhà chơi 3 ván cờ hoặc trò chơi. Dù thắng hay thua, con bắt tay chúc mừng người thắng và nói một điều con học được từ ván đó.","lv":["Ba mẹ nói mẫu câu chúc mừng, con nói theo sau mỗi ván.","Ba mẹ nhắc một lần, con tự chúc mừng và tự nói điều học được.","Con tự làm sau mọi ván, kể cả khi thua liền hai ván, và kể ba mẹ con đã giữ bình tĩnh thế nào."],"rw":"Con được chọn trò chơi cho ván tiếp theo cả nhà chơi"}},{"t":"Tự chăm sóc con vật nuôi của mình","sk":3,"m":"9 phút","cx":[{"k":0,"s":"An xin ba mẹ nuôi hai chú cá vàng và hứa tự chăm. Được hai tuần, An bắt đầu quên cho cá ăn, nước trong bể đã đục.","q":"An nên làm gì?","o":[["Hôm nay thay nước cùng ba, rồi dán lịch nhỏ cạnh bể: cho ăn mỗi sáng, thay nước mỗi Chủ nhật",1,"Con vật nuôi cần mình mỗi ngày. Một lịch nhắc đơn giản giúp con tự chăm chu đáo."],["Nhờ mẹ chăm hộ vì con bận",0,"Con đã nhận lời chăm cá. Giữ lời hứa là một phần của tự lập."],["Cho thật nhiều thức ăn một lần cho đủ cả tuần",0,"Cá không ăn hết sẽ làm nước bẩn nhanh hơn. Cho ăn ít mỗi ngày mới đúng."]]},{"k":1,"s":"Lớp An nuôi một chậu cây và một bể cá nhỏ ở góc lớp. Tuần này đến lượt An trực, nhưng An mải chơi nên quên mất hai ngày.","q":"An nên làm gì?","o":[["Nói với cô là bạn khác quên",0,"Đổ cho bạn làm bạn bị oan. Nhận phần của mình rồi sửa là cách tốt nhất."],["Tưới cây, cho cá ăn ngay, báo cô mình đã quên và đặt nhắc nhở cho những ngày còn lại",1,"Nhận lỗi và sửa ngay cho thấy con đáng tin. Nhắc nhở giúp không quên nữa."],["Lặng lẽ làm bù, không nói gì",0,"Làm bù là tốt, nhưng nói thật với cô giúp cô biết cây và cá có ổn không."]]},{"k":2,"s":"Cả nhà sang chơi nhà bác hàng xóm. Bác nhờ An dắt chú chó nhỏ đi một vòng sân chung cư, bác đi cùng phía sau. Chú chó cứ kéo về phía bồn hoa.","q":"An nên làm gì?","o":[["Thả dây cho chó tự chạy",0,"Thả dây thì chó có thể chạy ra đường hoặc làm người khác sợ. Giữ dây chắc tay nhé."],["Kéo mạnh dây cho chó nghe lời",0,"Kéo mạnh làm chó đau và sợ. Dẫn nhẹ nhàng mà chắc tay sẽ hiệu quả hơn."],["Giữ dây chắc tay, nhẹ nhàng dẫn chú chó đi tiếp và hỏi bác cách dắt cho đúng",1,"Được nhờ chăm con vật là được tin tưởng. Hỏi cách làm đúng giúp con chăm tốt hơn."]]}],"qq":"Nhận chăm một con vật nghĩa là…","qo":["Chăm đều đặn mỗi ngày như đã hứa","Chăm khi nào mình thích","Để ba mẹ lo phần khó"],"qa":0,"mi":{"t":"Một tuần chăm vật nuôi hoặc cây xanh","s":"Con nhận chăm một con vật nuôi hoặc một chậu cây trong nhà suốt 7 ngày (cho ăn hoặc tưới nước đúng giờ). Con đánh dấu vào bảng mỗi ngày cho ba mẹ xem. Việc thay nước bể hay dùng điện thì làm cùng ba mẹ.","lv":["Ba mẹ làm cùng con mỗi ngày và cùng đánh dấu bảng.","Ba mẹ nhắc một lần buổi sáng, con tự chăm và tự đánh dấu.","Con tự nhớ đủ 7 ngày, không cần nhắc, và kể lại con nhận thấy con vật hoặc cây thay đổi thế nào."],"rw":"Ba mẹ cùng con vẽ tranh con vật hoặc cây con đã chăm"}},{"t":"Tự chọn và theo đến cùng","sk":3,"m":"10 phút","cx":[{"k":0,"s":"An xin được tự trang trí lại góc học tập và đã chọn dán giấy màu lên tường. Làm được một nửa, An thấy chán và muốn bỏ dở.","q":"An nên làm gì?","o":[["Để nguyên một nửa, khi nào thích làm tiếp",0,"Góc học nửa dở dễ thành bừa bộn mãi. Chia phần còn lại ra vài buổi sẽ nhẹ hơn."],["Chia phần còn lại làm hai buổi, mỗi buổi 20 phút, hoàn thành trong cuối tuần",1,"Tự chọn là tự chịu trách nhiệm đến cùng. Chia nhỏ phần còn lại giúp con hoàn thành."],["Nhờ ba làm nốt",0,"Ba có thể giúp phần khó, nhưng đây là dự án con tự chọn. Làm xong con sẽ rất tự hào."]]},{"k":1,"s":"An tình nguyện làm người giữ sổ mượn sách của tủ sách lớp. Được một tháng, An thấy việc này mất giờ ra chơi.","q":"An nên làm gì?","o":[["Bỏ sổ đó không ghi nữa",0,"Bỏ dở mà không nói thì sách có thể bị thất lạc. Nếu muốn đổi, hãy nói với cô."],["Đưa sổ cho bạn khác mà không báo cô",0,"Cô giao việc cho con nên cần biết khi có thay đổi. Báo cô sẽ rõ ràng hơn."],["Nghĩ cách làm gọn hơn, như ghi vào đầu giờ, và nếu thật sự quá sức thì xin cô chọn bạn thay sau khi hết học kỳ",1,"Giữ cam kết không có nghĩa là chịu đựng mãi. Tìm cách làm tốt hơn và nói chuyện đúng lúc là trách nhiệm."]]},{"k":2,"s":"An tự chọn học lớp bóng rổ ở nhà thi đấu gần nhà, ba mẹ đã đóng học phí cả khoá ba tháng. Sau ba buổi, tập mệt quá nên An muốn nghỉ.","q":"An nên làm gì?","o":[["Nói với ba mẹ điều mình thấy khó, hỏi huấn luyện viên cách theo kịp, và thử theo hết khoá rồi mới quyết định",1,"Ban đầu thấy khó là bình thường. Tự chọn thì cũng tự giữ cam kết, rồi quyết định khi đã thử đủ lâu."],["Nghỉ luôn, buổi sau giả vờ đau bụng",0,"Giả vờ ốm là không thật thà và ba mẹ sẽ lo. Nói thật cảm giác của mình sẽ tốt hơn."],["Đi học nhưng đứng ngoài không tập",0,"Có mặt mà không tham gia thì mất thời gian của cả mình và đội. Nhờ huấn luyện viên giúp sẽ tốt hơn."]]}],"qq":"Khi việc mình tự chọn trở nên khó, nên…","qo":["Bỏ ngay để đỡ mệt","Tìm cách vượt qua và giữ cam kết đến hết","Đổ lỗi cho người khác đã chọn hộ"],"qa":1,"mi":{"t":"Giữ cam kết khi việc trở nên khó","s":"Con chọn một việc con đã tự nhận (lớp học, bài tập đàn, việc nhà) đang thấy khó. Con viết ra điều khó nhất và một cách vượt qua, rồi làm tiếp việc đó đủ 3 buổi. Ba mẹ xác nhận.","lv":["Ba mẹ cùng con tìm điều khó và cách vượt qua, đi cùng con buổi đầu.","Ba mẹ nhắc một lần, con tự viết cách vượt qua và tự giữ đủ 3 buổi.","Con tự viết, tự theo và kể lại sau 3 buổi việc đó đã dễ hơn chỗ nào."],"rw":"Ba mẹ kể một lần ba mẹ suýt bỏ cuộc nhưng đã cố đến cùng"}},{"t":"Nghĩ nhiều cách trước khi chọn","sk":4,"m":"10 phút","cx":[{"k":0,"s":"Bàn học của An chật kín sách vở, đồ dùng; mỗi lần làm bài lại phải dồn đồ sang một bên. An định xin ba mẹ mua ngay một chiếc bàn to hơn.","q":"An nên làm gì?","o":[["Xin mua bàn mới ngay hôm nay",0,"Bàn mới là một cách nhưng tốn tiền và chưa chắc cần. Thử nghĩ thêm vài cách khác trước nhé."],["Viết ra ít nhất ba cách: cất sách ít dùng vào hộp, nhờ ba gắn một kệ nhỏ trên tường, tặng sách cũ cho thư viện; rồi chọn cách hợp nhất",1,"Nghĩ nhiều cách trước khi chọn giúp mình thấy những lựa chọn hay mà lúc đầu chưa nghĩ ra."],["Chuyển sang ngồi học ở giường",0,"Ngồi học trên giường dễ mỏi lưng và buồn ngủ. Thử tìm cách làm bàn gọn hơn."]]},{"k":1,"s":"Lớp An cần trang trí góc lớp chủ đề “Mùa thu” nhưng không có tiền mua đồ. Cả nhóm chỉ nghĩ đến việc mua giấy màu.","q":"An nên làm gì?","o":[["Báo cô là không làm được",0,"Thiếu tiền không có nghĩa là hết cách. Thử nghĩ thêm vài phút xem sao."],["Mỗi bạn tự xin tiền ba mẹ",0,"Đó là một cách, nhưng chưa phải cách duy nhất. Nghĩ thêm có thể ra cách không tốn tiền."],["Cùng nhóm liệt kê mọi cách có thể: lá khô nhặt ở sân trường, giấy báo cũ, vỏ hộp; rồi chọn cách đẹp và dễ làm nhất",1,"Liệt kê nhiều cách trước giúp nhóm sáng tạo hơn và không bị kẹt ở một ý."]]},{"k":2,"s":"Cả nhà đi dã ngoại ở công viên, trời bất ngờ đổ mưa. Ba mẹ hỏi An và em: “Giờ mình làm gì nhỉ?” Em đòi về ngay.","q":"An nên làm gì?","o":[["Gợi ý vài cách: trú mưa ở nhà chờ rồi ăn tiếp, sang thư viện gần đó, hoặc về nhà trải khăn ăn trưa trong phòng khách; rồi cả nhà cùng chọn",1,"Nhiều lựa chọn giúp cả nhà tìm được cách vui nhất, ai cũng thấy được hỏi ý."],["Đồng ý về luôn cho nhanh",0,"Về nhà là một cách, nhưng thử nghĩ thêm có khi còn vui hơn."],["Phụng phịu vì hỏng buổi đi chơi",0,"Mưa thì không đổi được, nhưng mình có thể nghĩ ra cách khác để vẫn vui."]]}],"qq":"Khi gặp vấn đề, trước khi chọn cách giải quyết nên…","qo":["Chọn ngay cách đầu tiên nghĩ ra","Hỏi bạn rồi làm theo","Nghĩ ra vài cách rồi so sánh"],"qa":2,"mi":{"t":"Ba cách trước khi chọn một","s":"Con chọn một vấn đề nhỏ trong nhà (bàn học chật, hay quên tưới cây…), viết ra ít nhất 3 cách giải quyết, so sánh ưu – nhược, rồi chọn một cách và làm thử. Cho ba mẹ xem kết quả.","lv":["Ba mẹ cùng nghĩ, con viết ra và chọn cách.","Ba mẹ nhắc một lần, con tự nghĩ 3 cách và tự so sánh.","Con tự làm, chọn cách không tốn tiền, làm thử và kể lại sau 2 ngày có hiệu quả không."],"rw":"Cả nhà nghe con thuyết trình “giải pháp hay nhất”"}},{"t":"Lần sau mình sẽ làm khác thế nào?","sk":5,"m":"10 phút","cx":[{"k":0,"s":"An nướng bánh cùng mẹ, bánh bị cháy đáy. An chán nản: “Con không bao giờ làm được.”","q":"An nên làm gì?","o":[["Cùng mẹ xem lại: lò để nhiệt quá cao hay để lâu quá, rồi ghi chú cho lần sau",1,"Hỏi “vì sao” giúp tìm ra điều cần đổi. Ghi chú lại để lần sau bánh ngon hơn."],["Không bao giờ nướng bánh nữa",0,"Lần đầu chưa đẹp là chuyện bình thường. Tìm nguyên nhân rồi thử lại sẽ thấy tiến bộ."],["Nói tại công thức sai",0,"Có thể công thức chưa hợp, nhưng hãy kiểm tra những gì mình đã làm trước đã."]]},{"k":1,"s":"Nhóm An gieo hạt đậu xanh cho bài Khoa học, nhưng sau một tuần hạt vẫn không nảy mầm. An nghĩ ngay: “Tại hạt đậu xấu.”","q":"An nên làm gì?","o":[["Vứt đi và báo cô là hạt hỏng",0,"Kết luận vội thì không biết nguyên nhân thật, lần sau dễ hỏng tiếp. Cùng xem lại các bước đã làm nhé."],["Cùng nhóm xem lại từng bước, nhận ra bông bị khô vì quên tưới hai ngày, rồi lập lịch tưới và gieo lại",1,"Tìm đúng nguyên nhân thật giúp mình có cách sửa cụ thể. Đó là tư duy phản biện với chính việc mình làm."],["Tự nhủ nhóm mình kém môn Khoa học",0,"Một lần chưa thành công không nói lên nhóm kém. Nhìn vào việc cụ thể sẽ giúp hơn là tự chê."]]},{"k":2,"s":"Đội bóng nhí của An thua vì cả đội đến sân muộn, không kịp khởi động. Huấn luyện viên hỏi cả đội nghĩ sao.","q":"An nên làm gì?","o":[["Nói tại trọng tài",0,"Đổ cho người khác thì đội không biết sửa gì. Hãy nhìn vào điều đội có thể thay đổi."],["Im lặng chờ huấn luyện viên nói",0,"Ý kiến của con giúp cả đội rút kinh nghiệm. Hãy nói điều con thấy."],["Nói: “Mình đến muộn nên không khởi động. Lần sau cả đội hẹn có mặt sớm 15 phút nhé”",1,"Nêu nguyên nhân cụ thể và một cách sửa giúp cả đội tiến bộ cùng nhau."]]}],"qq":"Rút kinh nghiệm tốt là…","qo":["Tìm nguyên nhân thật và đặt một cách làm mới","Tìm người có lỗi","Tự trách mình thật nhiều"],"qa":0,"mi":{"t":"Nhìn lại một việc chưa thành","s":"Con chọn một việc gần đây chưa như ý (bài kiểm tra, trò chơi, việc nhà). Con trả lời ba câu với ba mẹ: Chuyện gì đã xảy ra? Nguyên nhân thật là gì? Lần sau con làm khác thế nào?","lv":["Ba mẹ hỏi từng câu và gợi ý, con trả lời.","Ba mẹ nhắc một lần, con tự trả lời đủ ba câu.","Con tự viết ba câu trả lời, thử cách làm mới trong tuần và kể lại kết quả."],"rw":"Ba mẹ cùng con làm lại việc đó theo cách mới"}},{"t":"Khi bị lạc người thân ở nơi đông người","sk":6,"m":"10 phút","cx":[{"k":0,"s":"Tối thứ Sáu, cả nhà chuẩn bị đi xem bắn pháo hoa ở quảng trường rất đông người. Mẹ hỏi An đã thuộc số điện thoại của ba mẹ chưa.","q":"An nên làm gì?","o":[["Nói “Chắc không cần đâu mẹ”",0,"Hy vọng là không cần, nhưng chuẩn bị trước giúp con bình tĩnh nếu có chuyện."],["Lưu số vào điện thoại của mình là đủ",0,"Điện thoại có thể hết pin hoặc rơi mất. Nhớ trong đầu là chắc chắn nhất."],["Tập đọc số điện thoại của mẹ, cùng thống nhất một điểm hẹn dễ thấy nếu bị lạc",1,"Thuộc số điện thoại và có điểm hẹn là hai “tấm vé an toàn” khi đi chỗ đông."]]},{"k":1,"s":"Lớp đi tham quan bảo tàng. An dừng lại xem mô hình khủng long quá lâu, khi quay ra thì cả lớp đã đi sang phòng khác.","q":"An nên làm gì?","o":[["Đứng gần mô hình, nhờ nhân viên bảo tàng có thẻ tên báo giúp cô giáo",1,"Nhân viên có thẻ tên là người lớn đáng tin ở nơi công cộng. Đứng yên giúp cô tìm lại con nhanh."],["Tự ra cổng chờ xe",0,"Rời khu vực mà không báo làm cô và các bạn đi tìm vất vả. Hãy nhờ người ở ngay đó."],["Đi lần lượt từng phòng để tìm lớp",0,"Đi tìm khắp nơi có thể làm con và lớp càng lệch nhau. Đứng yên và nhờ nhân viên sẽ nhanh hơn."]]},{"k":2,"s":"Đi hội chợ cùng mẹ, An mải xem một gian đồ chơi. Quay lại, An không thấy mẹ đâu giữa dòng người đông đúc.","q":"An nên làm gì?","o":[["Chạy khắp nơi để tìm mẹ",0,"Chạy đi tìm làm hai mẹ con dễ lạc xa hơn. Đứng yên giúp mẹ tìm thấy con nhanh hơn."],["Đứng yên ở gần đó, rồi nhờ nhân viên mặc đồng phục hoặc bảo vệ, nói tên mình và số điện thoại của mẹ",1,"Đứng yên và nhờ người có trách nhiệm là cách an toàn nhất. Thuộc số điện thoại ba mẹ rất quan trọng."],["Đi theo một người lạ nói sẽ dẫn đi tìm mẹ",0,"Không đi theo người lạ đến nơi khác, kể cả khi họ tỏ ra tốt bụng. Hãy nhờ nhân viên ở ngay đó."]]}],"qq":"Nếu bị lạc ở nơi đông người, điều đầu tiên nên làm là…","qo":["Tự đi về nhà","Đứng yên và nhờ nhân viên hoặc bảo vệ","Đi theo người đầu tiên gọi mình"],"qa":1,"mi":{"t":"Kế hoạch nếu bị lạc","s":"Con thuộc lòng số điện thoại của ba hoặc mẹ và đọc lại không nhìn. Cùng ba mẹ đóng vai: con “bị lạc”, đứng yên và nhờ đúng người (nhân viên mặc đồng phục, bảo vệ, quầy thông tin). Lần tới đi chỗ đông, cả nhà hẹn trước điểm gặp.","lv":["Ba mẹ đọc số cùng con nhiều lần và đóng vai nhân viên để con tập nhờ.","Ba mẹ nhắc một lần, con tự đọc số và tự nói câu nhờ giúp.","Con tự đọc số, tự nói ba bước và lần đi chơi tới con là người đề nghị hẹn điểm gặp."],"rw":"Cả nhà chơi trò tìm đồ vật trong nhà"}},{"t":"Tập trung, không để bị xao nhãng","sk":7,"m":"10 phút","cx":[{"k":0,"s":"An ngồi học bài lúc 7 giờ tối, máy tính bảng để ngay cạnh. Cứ vài phút có thông báo từ nhóm chat lớp, An lại cầm lên xem. Đến 8 giờ rưỡi, bài vẫn chưa xong.","q":"An nên làm gì?","o":[["Để máy tính bảng ở phòng khác, học 25 phút rồi nghỉ 5 phút mới xem tin nhắn",1,"Đưa thứ gây xao nhãng ra xa và chia giờ học thành từng đợt giúp con xong việc nhanh hơn nhiều."],["Học tiếp như cũ, xem tin nhắn nhanh thôi",0,"Mỗi lần xem “nhanh thôi” lại mất thêm thời gian để tập trung trở lại. Cộng lại là cả buổi tối."],["Tắt hẳn mạng cả tối, không báo ai",0,"Không cần cắt hết, chỉ cần có giờ xem rõ ràng. Nếu nhóm chat có bài tập, con vẫn cần đọc vào giờ nghỉ."]]},{"k":1,"s":"Trong giờ làm bài nhóm, hai bạn ngồi cạnh An cứ bàn về bộ phim mới. An muốn hoàn thành phần bài của mình.","q":"An nên làm gì?","o":[["Tham gia nói chuyện phim cùng các bạn",0,"Vui một chút nhưng nhóm sẽ không kịp giờ. Để dành chuyện phim cho giờ ra chơi nhé."],["Quát các bạn im lặng",0,"Quát làm không khí căng thẳng. Nói nhẹ nhàng thì các bạn dễ nghe hơn."],["Nói nhẹ: “Mình làm xong bài rồi kể chuyện phim nhé, còn 10 phút thôi!”",1,"Nhắc nhẹ nhàng giúp cả nhóm cùng tập trung mà không ai thấy bị trách."]]},{"k":2,"s":"An đến thư viện quận với ba để làm bài tìm hiểu về loài chim. Ở góc bên kia có truyện tranh mới, An cứ muốn đi xem.","q":"An nên làm gì?","o":[["Đọc truyện trước, còn giờ thì làm bài",0,"Việc vui trước thường ăn hết thời gian. Làm xong bài rồi đọc truyện sẽ thấy thảnh thơi hơn."],["Đặt mục tiêu ghi xong năm thông tin về loài chim trong 30 phút, rồi xin ba cho đọc truyện làm phần thưởng",1,"Mục tiêu nhỏ có thời hạn giúp con tập trung, và phần thưởng sau đó làm việc học vui hơn."],["Mang truyện về bàn đọc xen kẽ",0,"Đọc xen kẽ làm con khó tập trung vào cả hai việc. Làm từng việc một sẽ tốt hơn."]]}],"qq":"Cách tốt để tập trung khi học là…","qo":["Vừa học vừa trả lời tin nhắn","Học thật lâu không nghỉ","Để thứ gây xao nhãng ra xa và học theo từng đợt có nghỉ"],"qa":2,"mi":{"t":"Một đợt học 20 phút không xao nhãng","s":"Con để máy tính bảng hoặc đồ gây xao nhãng ở phòng khác, đặt hẹn giờ 20 phút học, rồi nghỉ 5 phút. Hết giờ cho ba mẹ xem phần đã làm được.","lv":["Ba mẹ cùng cất đồ xao nhãng và ngồi gần con trong 20 phút.","Ba mẹ nhắc một lần, con tự cất đồ và tự bấm giờ.","Con tự làm 2 đợt liền với giờ nghỉ, và so sánh với ba mẹ làm được nhiều hơn bình thường bao nhiêu."],"rw":"Ba mẹ cùng con chơi thể thao ngoài trời 20 phút"}},{"t":"Đồ theo phong trào: có nên mua?","sk":8,"m":"10 phút","cx":[{"k":0,"s":"Em của An khóc đòi mua con quay đồ chơi đang được nhiều bạn thích vì các bạn trong lớp em ai cũng có. Mẹ nhờ An nói chuyện với em.","q":"An nên làm gì?","o":[["Hỏi em thích điều gì ở con quay, rồi gợi ý em để dành vài tuần và rủ em chơi đồ chơi cũ cùng mình",1,"Giúp em hiểu mong muốn của mình và chờ đợi một chút là bài học tiêu tiền đầu tiên."],["Bảo em: “Ai cũng có thì mình cũng phải có”",0,"Câu này dạy em mua theo người khác. Giúp em nghĩ xem mình thích gì thật sẽ tốt hơn."],["Chê con quay là đồ trẻ con",0,"Chê làm em buồn hơn. Lắng nghe em trước rồi mới cùng nghĩ cách."]]},{"k":1,"s":"Cả lớp đang rộ lên phong trào sưu tầm thẻ hình nhân vật, mỗi gói 15.000 đồng. Bạn Bảo đã mua hai mươi gói và rủ An “sưu tầm cho đủ bộ”.","q":"An nên làm gì?","o":[["Dùng hết tiền tiêu vặt mua thẻ cho bằng bạn",0,"Phong trào thường qua nhanh, còn tiền tiêu hết thì không quay lại. Thử nghĩ kỹ trước khi mua."],["Tự hỏi: mình thích thật hay chỉ vì các bạn có? Nếu thích, đặt giới hạn như một gói mỗi tuần từ tiền tiêu vặt",1,"Biết vì sao mình muốn mua giúp con tiêu tiền khôn ngoan. Đặt giới hạn thì vẫn vui mà không cháy túi."],["Đổi đồ dùng học tập lấy thẻ của bạn",0,"Đổi đồ học lấy thẻ thì con thiếu đồ dùng và ba mẹ phải mua lại. Hãy giữ đồ cần thiết."]]},{"k":2,"s":"Ở nhà sách cùng ba, An thấy kệ bút gel thơm mà cả lớp đang dùng, giá 25.000 đồng một chiếc. Hộp bút của An đã có năm cây bút gel còn tốt.","q":"An nên làm gì?","o":[["Mua ba cây cho đủ màu",0,"Bút cũ vẫn tốt nên đây là thứ muốn, không phải thứ cần. Mua nhiều chỉ vì phong trào dễ phí tiền."],["Nài ba mua vì sợ bị các bạn chê",0,"Bạn bè quý con vì con là chính mình, không phải vì cây bút. Nếu bị trêu, hãy kể với ba mẹ."],["Dùng bút đang có, nếu vẫn thích thì ghi vào danh sách để dành và hỏi lại mình sau hai tuần",1,"Chờ hai tuần giúp mình biết là thích thật hay chỉ hứng lên nhất thời."]]}],"qq":"Trước khi mua một món đồ theo phong trào, nên tự hỏi…","qo":["Có màu mới chưa?","Mình thật sự thích hay chỉ vì bạn bè có?","Ai có nhiều nhất lớp?"],"qa":1,"mi":{"t":"Ba câu hỏi trước khi muốn mua theo bạn","s":"Con nghĩ về một món đồ đang “hot” ở lớp và trả lời với ba mẹ: Con thật sự thích hay vì bạn có? Một tháng nữa con còn thích không? Có cách nào vui mà không cần mua? Con nói quyết định của mình.","lv":["Ba mẹ hỏi từng câu, con trả lời và cùng quyết định.","Ba mẹ nhắc một lần, con tự trả lời ba câu và nêu quyết định.","Con tự trả lời, nghĩ ra một trò chơi tự làm thay thế và kể lại các bạn thấy thế nào."],"rw":"Ba mẹ cùng con tự làm một món đồ chơi từ đồ tái chế"}},{"t":"Không đồng ý mà vẫn lễ phép","sk":0,"m":"10 phút","cx":[{"k":0,"s":"Ba quyết định cuối tuần cả nhà sẽ dọn kho, nhưng An đã hẹn đi sinh nhật bạn ở nhà văn hoá phường từ trước. An thấy bực vì ba không hỏi ý mình.","q":"An nên làm gì?","o":[["Chờ lúc ba rảnh, nói: “Con đã nhận lời sinh nhật bạn chiều thứ Bảy. Con xin dọn kho sáng thứ Bảy hoặc Chủ nhật được không ạ?”",1,"Không đồng ý lễ phép là nói rõ lý do và đưa ra cách khác. Ba sẽ dễ đồng ý khi thấy con vẫn muốn giúp."],["Nói to: “Ba chẳng bao giờ nghĩ cho con!”",0,"Nói to và trách móc làm ba khó lắng nghe. Bình tĩnh nói rõ sẽ hiệu quả hơn."],["Im lặng làm theo nhưng trong lòng ấm ức",0,"Không nói ra thì ba không biết con có hẹn. Con có quyền nêu ý kiến một cách lễ phép."]]},{"k":1,"s":"Cô cho cả lớp bình chọn đi tham quan sở thú hay bảo tàng. Đa số muốn đi bảo tàng, nhưng An nghĩ sở thú hợp với bài Khoa học về động vật đang học hơn.","q":"An nên làm gì?","o":[["Nói “Bảo tàng chán lắm”",0,"Chê lựa chọn của bạn làm các bạn khó chịu. Hãy nói lý do mình thích lựa chọn của mình."],["Không nói gì nhưng về nhà kêu ca",0,"Ý kiến của con có thể giúp lớp suy nghĩ thêm. Nói ra đúng lúc là quyền của con."],["Giơ tay xin nói: “Em nghĩ sở thú giúp lớp mình hiểu thêm bài đang học, nhưng em sẽ theo ý chung ạ”",1,"Nêu ý kiến khác với lý do rõ ràng và tôn trọng kết quả chung là cách không đồng ý văn minh."]]},{"k":2,"s":"Ở câu lạc bộ bóng đá thiếu nhi, thầy xếp An làm thủ môn suốt ba buổi. An muốn được thử chơi ở vị trí tiền đạo.","q":"An nên làm gì?","o":[["Tự chạy lên hàng tiền đạo trong trận tập",0,"Tự ý đổi vị trí làm khung thành bị bỏ trống và cả đội rối. Hãy nói chuyện với thầy trước."],["Hỏi thầy sau buổi tập: “Thầy ơi, em muốn được thử chơi tiền đạo. Em cần tập thêm gì ạ?”",1,"Hỏi tiêu chí thay vì cãi giúp con biết mình cần cố gắng gì. Thầy sẽ quý thái độ đó."],["Phụng phịu tập qua loa",0,"Tập qua loa thì thầy khó thấy con cố gắng. Nói chuyện lễ phép sẽ giúp hơn."]]}],"qq":"Khi không đồng ý với người lớn, cách tốt là…","qo":["Bình tĩnh nêu lý do và đề nghị cách khác","Cãi đến khi thắng","Không bao giờ nói ra"],"qa":0,"mi":{"t":"Nói “con không đồng ý” một cách lễ phép","s":"Con chọn một chuyện nhỏ con chưa đồng ý với ba mẹ (giờ ngủ cuối tuần, việc nhà). Con bình tĩnh nói: “Con hiểu ba mẹ muốn…, nhưng con thấy… vì…, con đề nghị…” Ba mẹ nghe đến hết rồi cùng bàn.","lv":["Ba mẹ nói mẫu cấu trúc câu, con điền ý của con và nói lại.","Ba mẹ nhắc một lần, con tự nói đủ ba phần: hiểu – lý do – đề nghị.","Con tự chọn lúc phù hợp, nói lễ phép, nghe ba mẹ đáp và kể lại hai bên đã thống nhất gì."],"rw":"Ba mẹ cho con quyết định một việc nhỏ của gia đình tuần này"}},{"t":"Khi thấy ghen tị với bạn","sk":1,"m":"10 phút","cx":[{"k":0,"s":"Em của An được ông bà khen vẽ đẹp và treo tranh lên tường phòng khách. An thấy chạnh lòng vì tranh của mình thì không được treo.","q":"An nên làm gì?","o":[["Nói tranh của em xấu",0,"Chê em làm em buồn mà con cũng không vui hơn. Nói ra cảm xúc của mình sẽ tốt hơn."],["Xé tranh của mình vì không ai thích",0,"Một lần không được treo không có nghĩa là tranh của con không đẹp. Hãy nói chuyện với mẹ."],["Khen em, rồi nói nhỏ với mẹ: “Con hơi buồn vì muốn tranh mình cũng được treo”",1,"Vui cho em và vẫn nói thật cảm xúc của mình là cách xử lý trưởng thành. Mẹ sẽ hiểu con."]]},{"k":1,"s":"Bạn Huy được chọn làm lớp trưởng, An cũng muốn lắm nhưng không được chọn. Các bạn đang vây quanh chúc mừng Huy.","q":"An nên làm gì?","o":[["Quay đi chỗ khác, không chúc mừng",0,"Buồn là bình thường, nhưng một lời chúc mừng giúp tình bạn vẫn tốt đẹp."],["Chúc mừng Huy, rồi hỏi cô có việc nào khác trong lớp mình có thể đảm nhận",1,"Chúc mừng bạn và tìm cách khác để đóng góp giúp con biến nỗi buồn thành điều tích cực."],["Mong Huy làm không tốt",0,"Mong bạn thất bại không làm con vui hơn. Có nhiều cách để con đóng góp cho lớp."]]},{"k":2,"s":"Ở câu lạc bộ bơi, Mai được lên nhóm nâng cao còn An vẫn ở nhóm cũ. Cả buổi An thấy khó chịu, không muốn nói chuyện với Mai.","q":"An nên làm gì?","o":[["Thừa nhận với mình “Mình đang ghen tị”, chúc mừng Mai, rồi hỏi Mai đã luyện tập thế nào",1,"Ghen tị là cảm xúc bình thường. Gọi tên nó và biến nó thành động lực học hỏi giúp con tiến bộ."],["Nói với các bạn là Mai được thầy thiên vị",0,"Nói vậy làm Mai buồn oan và con cũng không thấy dễ chịu hơn. Có cách tốt hơn để xử lý cảm giác này."],["Tránh mặt Mai cho đến khi hết buồn",0,"Tránh bạn có thể làm tình bạn xa cách. Nói chuyện sẽ giúp cảm giác qua nhanh hơn."]]}],"qq":"Khi thấy ghen tị, cách tốt là…","qo":["Nói xấu người kia","Giả vờ không quan tâm","Gọi tên cảm xúc và tìm điều mình học được"],"qa":2,"mi":{"t":"Gọi tên cảm xúc và tìm điều học được","s":"Con nghĩ về một lần con thấy ghen tị với ai đó. Con nói với ba mẹ: “Con thấy ghen tị vì…” rồi viết ra một điều con học được từ bạn ấy và một bước nhỏ con sẽ tập tuần này.","lv":["Ba mẹ kể một lần ba mẹ ghen tị trước, rồi giúp con gọi tên cảm xúc.","Ba mẹ nhắc một lần, con tự nói câu “Con thấy… vì…” và viết bước tập.","Con tự nói, tự làm bước tập trong tuần và kể lại, có thể thêm một lời khen chân thành dành cho bạn ấy."],"rw":"Ba mẹ cùng con tập kỹ năng con muốn giỏi hơn"}},{"t":"Giúp bạn mới hoà nhập vào nhóm","sk":2,"m":"10 phút","cx":[{"k":0,"s":"Con của cô bạn mẹ đến nhà chơi cả buổi chiều. Bạn ấy nhỏ hơn An hai tuổi và có vẻ ngại khi An đang chơi xếp hình cùng em.","q":"An nên làm gì?","o":[["Chơi tiếp với em, kệ bạn",0,"Khách đến nhà mà bị bỏ rơi sẽ thấy rất buồn. Mời bạn một câu thôi là đủ."],["Bảo bạn ngồi xem cho biết cách",0,"Chỉ ngồi xem thì bạn vẫn đứng ngoài. Cùng làm sẽ vui hơn."],["Mời bạn cùng xây, hỏi bạn muốn làm phần nào của toà lâu đài",1,"Hỏi bạn muốn làm gì giúp bạn thấy mình được chào đón và có phần riêng."]]},{"k":1,"s":"Giữa học kỳ, lớp An có bạn Vy chuyển đến. Đã một tuần, giờ ra chơi Vy vẫn ngồi một mình, còn nhóm của An mải chơi đá cầu.","q":"An nên làm gì?","o":[["Để Vy tự làm quen, chắc Vy thích ngồi một mình",0,"Có thể Vy đang ngại chứ không phải thích một mình. Một lời mời có thể thay đổi cả tuần của bạn."],["Đến hỏi Vy có muốn chơi cùng không, giới thiệu Vy với cả nhóm và giải thích luật chơi",1,"Một nhóm tốt là nhóm biết mở cửa cho người mới. Giải thích luật giúp bạn tự tin tham gia."],["Rủ Vy chơi nhưng giao cho Vy việc nhặt cầu suốt",0,"Cho bạn tham gia cho có thì bạn vẫn thấy lạc lõng. Hãy để bạn chơi như mọi người."]]},{"k":2,"s":"Ở sân chơi chung cư, có một bạn mới chuyển đến, ba của bạn ngồi ở ghế đá gần đó. Nhóm của An đang chơi trốn tìm và đã đủ người.","q":"An nên làm gì?","o":[["Chào bạn, hỏi tên và mời bạn vào chơi ván tới",1,"Một lời chào và lời mời giúp bạn mới thấy khu phố thân thiện. Nhóm cũng có thêm bạn."],["Nói “Đủ người rồi” và chơi tiếp",0,"Trốn tìm có thêm một người vẫn chơi được. Từ chối dễ làm bạn mới thấy bị gạt ra ngoài."],["Bàn tán về bạn mới với nhóm",0,"Bàn tán làm bạn mới thấy ngại và buồn. Một lời chào sẽ tốt hơn nhiều."]]}],"qq":"Nhóm làm việc tốt khi…","qo":["Ai cũng được chào đón và có phần tham gia","Chỉ có những bạn thân với nhau","Bạn mới phải tự cố gắng"],"qa":0,"mi":{"t":"Mời một bạn đang ngồi một mình cùng chơi","s":"Ở trường trong tuần này, con để ý một bạn hay ngồi một mình hoặc mới đến, chào hỏi và mời bạn cùng chơi hoặc cùng nhóm trong giờ ra chơi. Về nhà con kể cho ba mẹ bạn đã phản ứng thế nào.","lv":["Ba mẹ đóng vai bạn mới, con tập câu chào và câu mời trước.","Ba mẹ nhắc một lần, con tự mời bạn trong giờ ra chơi.","Con tự mời, giới thiệu bạn với cả nhóm, giao cho bạn một phần trong trò chơi và kể lại."],"rw":"Ba mẹ kể chuyện ba mẹ làm quen người bạn thân đầu tiên"}},{"t":"Khi kế hoạch hỏng vào phút chót","sk":4,"m":"10 phút","cx":[{"k":0,"s":"An định in tấm thiệp tự thiết kế để tặng mẹ ngày sinh nhật vào sáng mai, nhưng tối nay máy in ở nhà bị hỏng. An hoảng lên và muốn bỏ ý định.","q":"An nên làm gì?","o":[["Bình tĩnh nghĩ phương án khác: tự vẽ tay tấm thiệp theo mẫu đã thiết kế, nhờ ba mua giấy màu nếu cần",1,"Khi kế hoạch hỏng, giữ mục tiêu và đổi cách làm. Thiệp vẽ tay còn có khi ý nghĩa hơn."],["Thôi không tặng thiệp nữa",0,"Một con đường bị chặn thì vẫn còn đường khác. Thử nghĩ phương án dự phòng trước khi bỏ cuộc."],["Thức khuya sửa máy in một mình",0,"Tự sửa đồ điện khi không có người lớn là không an toàn. Hãy chọn cách khác an toàn hơn."]]},{"k":1,"s":"Sáng nay nhóm An diễn kịch trước lớp, nhưng bạn đóng vai chính bị ốm phải nghỉ học. Còn 30 phút nữa là đến giờ diễn.","q":"An nên làm gì?","o":[["Xin cô hoãn mà không đề xuất gì",0,"Hoãn là một cách, nhưng hãy thử nghĩ phương án khác trước khi xin hoãn."],["Cùng nhóm bàn: một bạn thuộc lời nhận thay vai chính, cầm kịch bản nếu cần, rồi báo cô kế hoạch mới",1,"Bình tĩnh tìm phương án dự phòng giúp nhóm vẫn hoàn thành. Cô sẽ quý tinh thần đó."],["Trách bạn ốm làm hỏng việc",0,"Bạn ốm không phải lỗi của bạn ấy. Tập trung tìm cách giải quyết sẽ hiệu quả hơn."]]},{"k":2,"s":"Cả nhà định đi xe buýt đến thư viện thành phố, nhưng chuyến xe quen đã đổi lộ trình. Ba hỏi An có ý gì không.","q":"An nên làm gì?","o":[["Đề nghị về nhà cho xong",0,"Về nhà là cách nhanh nhất nhưng chưa chắc là tốt nhất. Thử nghĩ thêm vài cách."],["Cằn nhằn vì xe buýt đổi tuyến",0,"Cằn nhằn không làm xe quay lại tuyến cũ. Nghĩ cách mới sẽ giúp cả nhà hơn."],["Gợi ý xem bảng lộ trình ở trạm, hỏi nhân viên tuyến xe khác, hoặc đi một thư viện gần hơn",1,"Đưa ra vài phương án giúp cả nhà chọn được cách tốt nhất mà vẫn giữ được mục tiêu."]]}],"qq":"Khi kế hoạch bị hỏng, điều quan trọng là…","qo":["Bỏ luôn mục tiêu","Tìm người để trách","Giữ mục tiêu, tìm cách làm khác"],"qa":2,"mi":{"t":"Kế hoạch B khi mọi thứ thay đổi","s":"Ba mẹ đưa ra một tình huống “kế hoạch hỏng” (trời mưa không đi công viên, máy in hỏng). Con nói mục tiêu thật là gì và nghĩ ra 2 cách khác vẫn đạt mục tiêu, rồi cả nhà làm thử một cách.","lv":["Ba mẹ cùng con nhắc lại mục tiêu và gợi ý cách thay thế.","Ba mẹ nhắc một lần, con tự nói mục tiêu và tự nghĩ 2 cách.","Con tự làm khi gặp một thay đổi thật trong tuần và kể lại con đã giữ bình tĩnh, chọn cách nào."],"rw":"Cả nhà cùng làm theo kế hoạch B của con"}}]},{"id":"13-16","label":"12–15 tuổi","hero":"Khoa","lessons":[{"t":"Nói “không” mà không mất bạn","sk":6,"m":"12 phút","cx":[{"k":0,"s":"Anh họ rủ Khoa nói dối ba mẹ là hai anh em học nhóm, thật ra đi chơi đến khuya.","q":"Khoa nên nói gì?","o":[["“Ừ, một lần thôi mà.”",0,"Một lần nói dối trót lọt thì lần sau khó từ chối hơn nhiều."],["“Em không nói dối ba mẹ đâu. Anh muốn đi thì mình xin phép đi chơi đúng như vậy.”",1,"Từ chối việc, không từ chối người: nêu ranh giới rồi đề nghị cách làm khác."],["Nhận lời rồi phút chót nhắn là bận",0,"Nhận rồi rút làm anh họ hỏng kế hoạch, mà Khoa vẫn chưa nói được điều mình nghĩ."]]},{"k":1,"s":"Nhóm bạn rủ Khoa bỏ tiết cuối đi chơi. Khoa không muốn, nhưng sợ bị nói là nhạt và bị loại khỏi nhóm.","q":"Khoa nên phản hồi thế nào?","o":[["Đi cùng để không bị nói khác biệt",0,"Ranh giới bị đổi lấy sự chấp nhận. Lần sau nói không sẽ khó hơn lần này."],["“Tớ không đi, nhưng 5h tớ rảnh — đá bóng không?”",1,"Nói không với việc, không nói không với người. Đưa ra một lựa chọn khác giữ được cả hai."],["Nói dối là bị ba mẹ quản",0,"Xong việc hôm nay, nhưng Khoa vẫn chưa luyện được tiếng nói của chính mình."]]},{"k":2,"s":"Tối cuối tuần, một bạn mượn được xe máy của anh và rủ cả nhóm đi vòng vòng. Không ai đủ tuổi lái, và chỉ có một mũ bảo hiểm.","q":"Khoa nên phản hồi thế nào?","o":[["Đi một đoạn ngắn thôi, gần nhà mà",0,"Khoảng cách ngắn không làm việc đó an toàn hay hợp pháp hơn."],["“Tớ không đi. Ai muốn về thì tớ đi bộ cùng, hoặc tớ gọi xe.”",1,"Ở ngoài đời, từ chối mạnh nhất là kèm một phương án về nhà — để bạn nào muốn rút cũng có chỗ dựa."],["Không nói gì, đứng tách ra một bên",0,"Đứng im thì nhóm vẫn đi, và không ai biết Khoa nghĩ việc đó không ổn."]]}],"qq":"Ranh giới lành mạnh là…","qo":["Từ chối việc, giữ quan hệ","Cắt liên lạc với bạn","Đồng ý rồi hối hận"],"qa":0,"mi":{"t":"Tập nói “không” mà vẫn giữ bạn","s":"Tối nay con cùng ba mẹ đóng vai: ba mẹ rủ con làm một việc con không muốn, con từ chối bằng câu “Mình không đi, nhưng mình…” rồi đề nghị việc khác.","lv":["Ba mẹ nói mẫu một câu từ chối, con nói lại theo cách của mình.","Ba mẹ nhắc một lần, con tự nghĩ ra hai câu từ chối kèm một đề nghị khác.","Con tự kể ba mẹ nghe một lần con đã từ chối thật trong tuần và bạn phản ứng thế nào."],"rw":"Ba mẹ kể một lần hồi nhỏ ba mẹ đã dám nói “không”"}},{"t":"Kiểm chứng một tin nghe được","sk":5,"m":"12 phút","cx":[{"k":0,"s":"Trong nhà, một người bác quả quyết “ăn thứ này chữa được bệnh” và mẹ định làm theo.","q":"Khoa nên làm gì?","o":[["Nói ngay trước cả nhà: “Tin vịt đấy bác ơi.”",0,"Nói cộc lốc trước cả nhà làm bác mất mặt, mà mẹ vẫn chưa có thông tin đúng."],["Nói riêng với mẹ kèm một nguồn có tên, rồi cùng mẹ xem lại",1,"Với người thân, đưa nguồn đúng và nói riêng hiệu quả hơn bác bỏ giữa bữa cơm."],["Kệ, chuyện của người lớn",0,"Tin sai về sức khoẻ trong nhà ảnh hưởng thật, im lặng là bỏ qua rủi ro."]]},{"k":1,"s":"Bạn cùng lớp kể chắc nịch một tin đồn về thầy giáo. Cả lớp đang bàn tán.","q":"Khoa nên làm gì?","o":[["Kể lại cho lớp khác nghe",0,"Kể lại là mình trở thành một mắt xích của tin đồn, dù mình không nghĩ ra nó."],["Hỏi bạn: “Cậu nghe trực tiếp từ ai?” và dừng lại nếu không truy được nguồn",1,"Kiểm một tin bắt đầu bằng việc truy về người đầu tiên nói ra."],["Hỏi thẳng thầy giữa lớp",0,"Đưa tin chưa kiểm ra trước lớp có thể làm tổn thương người bị đồn, dù ý mình tốt."]]},{"k":2,"s":"Trước cổng trường, một người phát tờ rơi giới thiệu thực phẩm “giúp tăng 20% điểm thi”, có in ảnh bác sĩ và hàng chữ “đã được chứng minh”.","q":"Bước kiểm chứng đầu tiên là gì?","o":[["Xem ảnh bác sĩ trên tờ rơi có đáng tin không",0,"Ảnh và chữ “đã được chứng minh” có thể in bất cứ gì. Vẻ ngoài không phải bằng chứng."],["Tìm con số 20% đó ở một nguồn có tên: nghiên cứu nào, cơ quan nào, công bố năm nào",1,"Một con số chỉ đáng tin khi tìm lại được ở nơi có tên và có ngày — tờ rơi không phải nguồn."],["Hỏi mấy bạn xung quanh xem có ai dùng chưa",0,"Vài lời kể không thay được dữ liệu, và người kể cũng chỉ nghe từ tờ rơi này."]]}],"qq":"Dấu hiệu đáng ngờ nhất của một tin?","qo":["Con số lớn mà không truy được nguồn","Người kể nói rất chắc chắn","Nhiều người cũng đang nói thế"],"qa":0,"mi":{"t":"Kiểm chứng một tin đang lan truyền","s":"Con chọn một tin con nghe được gần đây (ở lớp, trên báo), cùng ba mẹ tìm nguồn gốc và kiểm tra con số trong 15 phút, rồi kết luận tin đáng tin hay không.","lv":["Con và ba mẹ cùng tìm nguồn của tin, ba mẹ chỉ cách xem ai là người đưa tin.","Ba mẹ nhắc một lần, con tự tìm ít nhất hai nguồn đáng tin và so sánh.","Con tự kiểm chứng và trình bày cho ba mẹ: nguồn, con số, dấu hiệu đáng ngờ, kết luận."],"rw":"Con được chọn chủ đề cho buổi trò chuyện bữa tối"}},{"t":"Phỏng vấn vào đội tình nguyện","sk":0,"m":"14 phút","cx":[{"k":0,"s":"Khoa muốn tham gia đội tình nguyện của trường vào sáng cuối tuần. Ba mẹ lo ảnh hưởng việc học và chưa đồng ý.","q":"Khoa nên trình bày thế nào?","o":[["“Bạn con đứa nào cũng vào đội hết rồi.”",0,"So với bạn không trả lời được nỗi lo của ba mẹ, vốn là việc học."],["“Con đi hai buổi sáng cuối tuần, vẫn giữ lịch học tối. Thử một tháng, điểm tụt thì con xin nghỉ.”",1,"Thuyết phục người lớn giống phỏng vấn: phương án cụ thể, có giới hạn và có điều kiện dừng."],["Tự đăng ký rồi báo sau",0,"Làm rồi báo sau là mất niềm tin, thứ khó xin lại hơn cả sự cho phép."]]},{"k":1,"s":"Lớp tuyển một bạn phụ trách phòng máy giờ tự học. Thầy hỏi Khoa: “Vì sao em phù hợp?”","q":"Câu trả lời nào tốt nhất?","o":[["“Em học giỏi Tin học ạ.”",0,"Giỏi môn học không nói được Khoa làm được gì cho phòng máy. Việc này cần sự đúng giờ và cẩn thận."],["“Em quản tủ sách của lớp hai năm, quen mở đúng giờ và ghi lại ai mượn gì.”",1,"Đưa bằng chứng gần nhất với việc mình xin làm, kèm một chi tiết cụ thể."],["“Em sẽ cố gắng hết sức ạ.”",0,"Ai cũng nói vậy. Câu này chỉ có sức khi đi kèm một ví dụ đã làm."]]},{"k":2,"s":"Khoa đăng ký vào đội tình nguyện của trường. Thầy phụ trách hỏi: “Em chưa tham gia đội nào, vì sao thầy nên chọn em?”","q":"Câu trả lời nào tốt nhất?","o":[["“Em muốn có thêm điểm thi đua và em sẽ làm mọi việc thầy giao.”",0,"Điều mình muốn nhận chưa phải lý do để được chọn. Đội cần biết mình đóng góp được gì."],["“Em chưa vào đội nào, nhưng em quản thư viện lớp 2 năm, quen làm đúng giờ và ghi chép cẩn thận.”",1,"Không có kinh nghiệm đúng ngành thì đưa bằng chứng gần nhất. Việc cụ thể luôn thuyết phục hơn lời hứa."],["“Em học nhanh lắm ạ.”",0,"Ai cũng nói vậy. Thêm một ví dụ cụ thể thì câu này mới có sức."]]}],"qq":"Trả lời phỏng vấn thuyết phục nhờ…","qo":["Ví dụ cụ thể đã làm được","Lời hứa cố gắng","Nói mình muốn được điểm"],"qa":0,"mi":{"t":"Luyện trả lời phỏng vấn bằng ví dụ cụ thể","s":"Ba mẹ đóng vai người phỏng vấn hỏi “Vì sao nên chọn con?”, con trả lời trong một phút bằng một ví dụ cụ thể con đã làm được.","lv":["Ba mẹ cùng con nhớ lại một việc con đã làm tốt rồi con nói thành câu trả lời.","Ba mẹ nhắc một lần, con tự chuẩn bị và trả lời hai câu hỏi phỏng vấn.","Con tự soạn ba câu hỏi, nhờ ba mẹ hỏi và trả lời đủ: việc đã làm, kết quả, điều học được."],"rw":"Ba mẹ kể về buổi phỏng vấn đầu tiên của ba mẹ"}},{"t":"Ngân sách 500.000đ một tháng","sk":8,"m":"12 phút","cx":[{"k":0,"s":"Ba mẹ cho Khoa 500.000đ/tháng tự lo ăn sáng, xe buýt và tiêu riêng. Tuần đầu Khoa đã tiêu 260.000đ.","q":"Khoa nên xử lý thế nào?","o":[["Xin thêm cho đủ tháng",0,"Xin thêm là bỏ qua bài học. Ngân sách chỉ dạy được khi mình sống với hậu quả."],["Tính lại: chi phí bắt buộc mỗi tuần là bao nhiêu, còn lại chia cho 3 tuần",1,"Tách chi phí bắt buộc khỏi chi phí muốn. Ngân sách là phép chia, làm lại giữa tháng vẫn kịp."],["Bỏ ăn sáng để dành tiền tiêu",0,"Cắt vào nhu cầu thiết yếu là ngân sách sai chỗ. Cắt phần “muốn” trước."]]},{"k":1,"s":"Tổ của Khoa được giao 300.000đ để trang trí lớp dịp 20/11. Cả tổ đề xuất mua đủ thứ, cộng lại đã hơn 500.000đ.","q":"Khoa nên làm gì?","o":[["Mỗi bạn góp thêm cho đủ",0,"Góp thêm là bỏ qua bài học, và không phải bạn nào cũng có thêm để góp."],["Viết cả danh sách ra, khoanh những món bắt buộc, cắt dần phần “muốn” cho vừa 300.000đ",1,"Ngân sách nhóm cũng là phép chia: tách bắt buộc khỏi mong muốn rồi cắt phần mong muốn trước."],["Cứ mua trước, thiếu thì tính sau",0,"Mua trước tính sau là cách nhanh nhất để cả tổ nợ nhau."]]},{"k":2,"s":"Cả nhóm rủ đi ăn cuối tuần, mỗi lần khoảng 80.000đ, và tuần nào cũng rủ.","q":"Khoa nên xử lý thế nào?","o":[["Đi hết cho khỏi lạc nhóm",0,"Một khoản nhỏ lặp lại bốn lần một tháng thành khoản lớn nhất trong ngân sách."],["Đặt hạn mức hai lần một tháng, các lần khác rủ nhóm làm việc rẻ hơn",1,"Chi phí lặp lại thì quản bằng số lần, không quản bằng ý chí từng lần."],["Đi nhưng chỉ gọi nước",0,"Cách này giữ được mặt nhưng vẫn tiêu đều, và ngồi nhìn bạn ăn thì chẳng vui."]]}],"qq":"Trong ngân sách, cắt gì trước?","qo":["Phần “muốn” trước phần “cần”","Phần “cần” trước","Cắt đều tất cả"],"qa":0,"mi":{"t":"Lập bảng ngân sách một tháng trên giấy","s":"Con cùng ba mẹ lập một bảng ngân sách tháng giả định (ví dụ 500.000đ): chia phần “cần” và “muốn”, rồi chỉ ra khoản nào cắt trước nếu thiếu.","lv":["Ba mẹ cùng con liệt kê các khoản và xếp vào cột “cần” hay “muốn”.","Ba mẹ nhắc một lần, con tự chia số tiền cho từng khoản và tính tổng cho khớp.","Con tự lập bảng, thêm một khoản dự phòng và giải thích cho ba mẹ vì sao chia như vậy."],"rw":"Cả nhà nấu món con thích vào cuối tuần"}},{"t":"Xung đột với ba mẹ về giờ về nhà","sk":1,"m":"11 phút","cx":[{"k":0,"s":"Ba mẹ yêu cầu Khoa về trước 19h. Bạn bè thường về 20h. Tối qua Khoa về muộn 40 phút và cả nhà to tiếng.","q":"Sáng nay Khoa nên mở lời thế nào?","o":[["“Ba mẹ chẳng tin con gì cả!”",0,"Câu buộc tội đóng cửa cuộc nói chuyện. Ba mẹ sẽ phòng thủ thay vì lắng nghe."],["“Con xin lỗi vì về muộn mà không báo. Con muốn xin thử 19h30 và con sẽ nhắn tin khi rời chỗ chơi.”",1,"Nhận lỗi, nêu điều mình muốn, kèm cách để ba mẹ an tâm. Đó là thương lượng, không phải cãi."],["Không nói gì, lần sau về muộn nữa",0,"Không nói thì luật không đổi, chỉ có niềm tin giảm dần."]]},{"k":1,"s":"Thầy chủ nhiệm nhắc Khoa vì đi học muộn ba buổi liên tiếp.","q":"Khoa nên đáp lại thế nào?","o":[["“Tại xe buýt trễ chứ em có muốn đâu.”",0,"Xe buýt trễ có thể đúng, nhưng ba buổi liền thì vấn đề nằm ở kế hoạch của Khoa."],["“Em xin lỗi thầy. Ba buổi này em dậy muộn, từ mai em đi chuyến sớm hơn 15 phút.”",1,"Nhận việc, nói nguyên nhân thật, đưa một thay đổi cụ thể đo được."],["Im lặng gật đầu cho qua",0,"Gật cho qua thì thầy không biết Khoa sẽ làm gì khác, và tuần sau vẫn thế."]]},{"k":2,"s":"Đang đi chơi với nhóm thì đến giờ Khoa phải về. Cả nhóm còn muốn ở thêm và nói “về sớm thế à”.","q":"Khoa nên làm gì?","o":[["Ở thêm một lúc rồi về muộn",0,"Ở thêm “một lúc” là cách giờ về nhà bị phá mỗi lần, và niềm tin ở nhà mỏng dần."],["Nói rõ trước khi đi: “7 giờ tối tớ phải về”, rồi nhắn ba mẹ lúc rời chỗ chơi",1,"Ngoài đời, ranh giới dễ giữ nhất khi mình nói trước, và giữ được niềm tin bằng một tin nhắn."],["Lặng lẽ đi về không nói với ai",0,"Đi không nói làm nhóm lo, và lần sau Khoa lại khó nói hơn."]]}],"qq":"Thương lượng với ba mẹ hiệu quả khi…","qo":["Có đề nghị cụ thể và cách làm ba mẹ an tâm","Mình to tiếng hơn","Chờ ba mẹ tự đổi ý"],"qa":0,"mi":{"t":"Thương lượng một quy định trong nhà thật bình tĩnh","s":"Con chọn một quy định trong nhà con muốn bàn lại (giờ về, giờ ngủ…), chuẩn bị một đề nghị cụ thể kèm cách giúp ba mẹ an tâm, rồi nói chuyện với ba mẹ trong 10 phút.","lv":["Ba mẹ cùng con viết đề nghị ra giấy trước, rồi con đọc lại thành lời.","Ba mẹ nhắc một lần, con tự mở lời, nêu đề nghị và lắng nghe ý ba mẹ không ngắt lời.","Con tự chọn lúc phù hợp, nói đủ “Con muốn… Con sẽ… để ba mẹ yên tâm” và cùng chốt thỏa thuận."],"rw":"Ba mẹ viết một lời khen về sự chín chắn của con dán lên bàn học"}},{"t":"Lắng nghe khi bạn tâm sự","sk":0,"m":"11 phút","cx":[{"k":0,"s":"Tối nay mẹ kể với Khoa là hôm nay ở chỗ làm có nhiều việc gấp, mẹ hơi mệt. Khoa đang cầm điện thoại xem dở một đoạn phim.","q":"Khoa nên làm gì?","o":[["Vừa xem vừa “dạ, dạ” cho mẹ yên tâm",0,"Mẹ sẽ nhận ra mình đang nghe nửa vời. Chỉ cần vài phút tập trung là đủ."],["Bảo mẹ đi nghỉ sớm cho khỏe",0,"Câu này có ý quan tâm, nhưng khép lại câu chuyện. Hỏi thêm một câu trước rồi mới gợi ý."],["Đặt điện thoại xuống, nhìn mẹ và hỏi “Việc gì làm mẹ mệt nhất ạ?”",1,"Đặt điện thoại xuống là cách nói “con đang nghe” mà không cần lời. Câu hỏi mở giúp mẹ kể tiếp."]]},{"k":1,"s":"Giờ ra chơi, Mai kể với Khoa là dạo này Mai rất mệt vì phải học thêm nhiều. Khoa đang định kể ngay chuyện mình cũng bận không kém.","q":"Khoa nên làm gì?","o":[["Kể ngay chuyện của mình để Mai thấy không chỉ Mai vất vả",0,"Ý tốt, nhưng câu chuyện đã chuyển sang mình mất rồi. Hãy để Mai nói hết trước đã."],["Hỏi thêm “Mệt nhất là lúc nào?” và nhắc lại điều Mai vừa nói",1,"Hỏi thêm và nhắc lại cho thấy mình thật sự đang nghe. Được lắng nghe, bạn thường thấy nhẹ lòng hơn."],["Đưa lời khuyên ngay: “Cậu bỏ bớt lớp đi”",0,"Lời khuyên vội làm bạn thấy mình chưa được nghe. Hỏi trước, khuyên sau — nếu bạn muốn."]]},{"k":2,"s":"Ở công viên gần nhà, Huy kể với Khoa là nhà Huy sắp chuyển sang quận khác và Huy lo không có bạn mới.","q":"Khoa nên đáp lại thế nào?","o":[["“Nghe có vẻ hồi hộp thật. Cậu lo nhất điều gì?”",1,"Gọi tên cảm xúc và hỏi thêm giúp bạn nói ra hết nỗi lo. Đó là điều một người bạn tốt làm được."],["“Lo gì, cậu dễ làm quen mà!”",0,"Trấn an vội có thể làm nỗi lo bị gạt đi. Thừa nhận cảm giác của bạn trước đã."],["Đổi chủ đề cho Huy đỡ buồn",0,"Né chuyện khó làm Huy thấy chuyện của mình không quan trọng. Ở lại với câu chuyện thêm chút nữa."]]}],"qq":"Lắng nghe chủ động là…","qo":["Chờ đến lượt mình nói","Hỏi thêm và nhắc lại ý người kia","Đưa lời khuyên thật nhanh"],"qa":1,"mi":{"t":"Lắng nghe một người thân kể chuyện trọn vẹn","s":"Trong bữa tối, con hỏi một người thân “Hôm nay có chuyện gì làm ba/mẹ mệt không?”, nghe hết không kể chuyện của mình, hỏi thêm một câu và nhắc lại ý chính.","lv":["Ba mẹ nói mẫu một câu hỏi thêm và một câu nhắc lại, con làm theo.","Ba mẹ nhắc một lần, con tự hỏi và nhắc lại ý trong bữa tối.","Con tự nhớ, lắng nghe ít nhất 3 phút, rồi kể lại ba mẹ nghe con đã hiểu người đó cảm thấy gì."],"rw":"Cả nhà cùng đi dạo buổi tối gần nhà"}},{"t":"Nhận vai trong dự án nhóm","sk":2,"m":"12 phút","cx":[{"k":0,"s":"Cả nhà chuẩn bị đón ông bà lên chơi cuối tuần. Ba nói: “Mỗi người nhận một việc nhé.” Em Bảo chỉ muốn trang trí, còn ai cũng ngại dọn phòng khách.","q":"Khoa nên góp ý thế nào?","o":[["Để ba mẹ tự chia",0,"Ba mẹ chia cũng được, nhưng con bỏ lỡ cơ hội góp ý. Con hiểu việc nhà hơn mình nghĩ đấy."],["Ghi ra các việc, mỗi người chọn một việc hợp sức, còn phòng khách thì cả nhà dọn chung 20 phút",1,"Việc ai cũng ngại sẽ nhẹ hơn khi làm chung. Em nhỏ nhận việc vừa sức, ai cũng có phần."],["Bảo em Bảo không được trang trí vì em còn nhỏ",0,"Em sẽ buồn và mất hứng. Hãy giao cho em phần trang trí vừa sức."]]},{"k":1,"s":"Nhóm Khoa có năm bạn làm bài thuyết trình Sinh học về rừng ngập mặn. Ai cũng muốn làm phần thiết kế trang chiếu, không ai muốn tìm tài liệu.","q":"Khoa nên đề xuất cách chia vai nào?","o":[["Bốc thăm cho nhanh",0,"Bốc thăm công bằng nhưng bỏ qua thế mạnh của từng người. Có thể dùng sau khi đã bàn bạc."],["Khoa nhận hết phần tìm tài liệu cho êm",0,"Gánh một mình dễ thành quá tải và bực bội về sau. Việc chung thì cùng gánh."],["Liệt kê các phần việc, mỗi bạn nói mình mạnh gì, rồi ghép người với việc; việc ít ai muốn thì chia đôi",1,"Biết rõ việc và thế mạnh thì vai trò tự hiện ra. Việc khó được chia đều nên không ai thấy thiệt."]]},{"k":2,"s":"Câu lạc bộ đọc sách ở thư viện phường tổ chức buổi giới thiệu sách cho các em nhỏ. Cô thủ thư nhờ nhóm Khoa tự phân công: dẫn chương trình, đọc truyện, xếp ghế, đón khách.","q":"Nhóm nên chia vai thế nào?","o":[["Hỏi mỗi bạn thích và giỏi việc gì, ghép vai, rồi đọc lại phân công cho cô thủ thư",1,"Ghép vai theo thế mạnh và báo lại người lớn phụ trách giúp buổi sự kiện suôn sẻ."],["Ai cũng muốn dẫn chương trình nên tranh luận đến hết giờ",0,"Tranh một vai làm chậm cả nhóm. Hỏi xem ai còn hợp với vai nào khác."],["Bạn nói to nhất nhận dẫn, còn lại tự lo",0,"Nói to chưa chắc là hợp vai. Các vai còn lại dễ bị bỏ sót."]]}],"qq":"Chia vai trong nhóm hiệu quả bắt đầu từ…","qo":["Ai nhanh tay chọn trước","Ai lớn tuổi nhất","Danh sách việc và thế mạnh từng người"],"qa":2,"mi":{"t":"Chia việc nhà theo thế mạnh từng người","s":"Con chọn một việc lớn của cả nhà (dọn nhà cuối tuần, chuẩn bị bữa cơm), viết danh sách việc nhỏ và giao vai cho từng người theo thế mạnh, rồi cả nhà làm theo.","lv":["Ba mẹ cùng con liệt kê việc, con đề nghị ai làm gì.","Ba mẹ nhắc một lần, con tự lập danh sách và hỏi ý từng người trước khi giao.","Con tự tổ chức từ đầu đến cuối, nhận cả một việc không ai thích và kể lại cả nhà làm thế nào."],"rw":"Con được chọn trò chơi cả nhà chơi cuối tuần"}},{"t":"Tự dậy đúng giờ","sk":3,"m":"10 phút","cx":[{"k":0,"s":"Sáng nào mẹ cũng phải gọi ba lần Khoa mới dậy. Khoa muốn tự dậy nhưng tối nào cũng ngủ sau 23h và tắt chuông báo thức trong lúc ngái ngủ.","q":"Khoa nên bắt đầu thay đổi từ đâu?","o":[["Ngủ sớm hơn 30 phút, đặt đồng hồ báo thức xa giường để phải đứng dậy mới tắt được",1,"Ngủ đủ thì dễ dậy; phải đứng dậy tắt chuông thì khó ngủ lại. Thay đổi nhỏ, đều đặn sẽ thành thói quen."],["Đặt năm chuông báo thức cách nhau 5 phút",0,"Nhiều chuông làm giấc ngủ cuối bị cắt vụn và dễ quen tay tắt. Gốc của vấn đề là giờ đi ngủ."],["Nhờ mẹ gọi to hơn",0,"Như vậy việc dậy vẫn là việc của mẹ. Tự lập là mình tự lo giờ dậy của mình."]]},{"k":1,"s":"Trường của Khoa có buổi tập văn nghệ lúc 6h45 sáng thứ Bảy. Lần trước Khoa đến muộn vì chờ ba nhắc.","q":"Lần này Khoa nên làm gì?","o":[["Nhờ ba gọi như lần trước",0,"Lần trước đã muộn vì chờ người nhắc. Hãy thử tự đặt giờ cho mình."],["Thức luôn đến sáng cho khỏi ngủ quên",0,"Thức trắng làm buổi tập mệt và dễ ốm. Ngủ đủ mới là cách an toàn."],["Tối thứ Sáu tự đặt báo thức, soạn sẵn đồ và tính giờ ngược từ 6h45",1,"Tính ngược từ giờ hẹn cho mình biết phải dậy lúc nào. Chuẩn bị từ tối làm buổi sáng nhẹ nhàng hơn."]]},{"k":2,"s":"Khoa hẹn chơi cầu lông cùng chú Tâm hàng xóm lúc 6h sáng Chủ nhật ở sân nhà văn hóa. Tối thứ Bảy, Khoa định xem phim đến khuya.","q":"Khoa nên làm gì?","o":[["Xem phim đến khuya, sáng mai tính sau",0,"Ngủ muộn thì dễ lỡ hẹn với chú Tâm. Giữ lời hẹn bắt đầu từ tối hôm trước."],["Để phim sang chiều Chủ nhật, ngủ trước 22h và đặt báo thức 5h30",1,"Dời việc thích sang lúc khác để giữ lời hẹn. Người khác tin mình hơn khi mình đúng giờ."],["Nhắn chú Tâm gọi mình dậy",0,"Chú sẽ phải lo thêm việc của mình. Tự đặt báo thức là phần của mình."]]}],"qq":"Muốn tự dậy đúng giờ, điều quan trọng nhất là…","qo":["Đi ngủ đúng giờ","Chuông thật to","Có người gọi"],"qa":0,"mi":{"t":"Ba ngày tự dậy đúng giờ","s":"Con tự đặt giờ đi ngủ và giờ dậy, để báo thức xa giường, và tự dậy không cần ba mẹ gọi trong ba buổi sáng; ba mẹ đánh dấu lên lịch.","lv":["Ba mẹ cùng con chọn giờ ngủ, giờ dậy và đặt báo thức; ba mẹ gọi nhẹ một lần nếu cần.","Ba mẹ nhắc giờ đi ngủ một lần, buổi sáng con tự dậy.","Con tự đi ngủ đúng giờ, tự dậy cả ba ngày và kể lại cảm giác buổi sáng khác thế nào."],"rw":"Ba mẹ làm bữa sáng con thích vào một ngày cuối tuần"}},{"t":"Khi làm mất đồ quan trọng","sk":4,"m":"12 phút","cx":[{"k":0,"s":"Sáng đi học, Khoa không tìm thấy kính đâu, còn 15 phút nữa là xe buýt đến.","q":"Khoa nên làm gì?","o":[["Nghĩ lại tối qua việc cuối cùng mình làm, tìm ở những chỗ đó, rồi nhờ mẹ tìm giúp",1,"Tìm theo dấu việc cuối cùng mình làm nhanh hơn lục khắp nhà. Nhờ giúp sớm cũng là một cách giải quyết."],["Đi học không đeo kính",0,"Không có kính thì nhìn bảng khó cả ngày. Thử tìm có hệ thống vài phút trước đã."],["Hỏi cả nhà “Ai lấy kính của con?”",0,"Câu hỏi như đổ lỗi dễ làm mọi người khó chịu. Nhờ tìm giúp thì dễ được giúp hơn."]]},{"k":1,"s":"Cuối giờ, Khoa phát hiện mất chiếc máy tính cầm tay vừa mượn của Nam. Các bạn đang chuẩn bị ra về.","q":"Khoa nên làm gì?","o":[["Im lặng, mai mua cái khác trả",0,"Có thể máy chỉ bị cầm nhầm. Nói ra sớm thì còn cơ hội tìm lại."],["Báo ngay với Nam và cô chủ nhiệm, nhờ cả lớp xem có ai cầm nhầm, rồi tìm quanh chỗ ngồi",1,"Nói ngay khi lớp còn đông giúp tìm nhanh hơn. Thành thật với Nam giữ được lòng tin."],["Đoán bạn ngồi cạnh lấy và hỏi thẳng",0,"Đoán khi chưa có bằng chứng dễ làm tổn thương bạn. Hỏi chung cả lớp nhẹ nhàng hơn."]]},{"k":2,"s":"Đi hiệu sách cùng chị gái, Khoa phát hiện túi đựng thẻ học sinh và vé xe buýt tháng không còn trong cặp. Khoa bắt đầu hoảng.","q":"Khoa nên làm gì trước?","o":[["Lục tung cặp ngay giữa cửa hàng",0,"Hoảng thì dễ bỏ sót. Dừng một chút, thở chậm rồi tìm có thứ tự."],["Coi như mất, về xin ba mẹ làm thẻ mới",0,"Có thể phải làm lại, nhưng tìm thử trước đã. Nhiều đồ bị mất được tìm thấy ngay trong mười phút đầu."],["Hít thở, nhớ lại lần cuối thấy túi ở đâu, cùng chị đi lại các chỗ vừa qua và hỏi quầy thu ngân",1,"Bình tĩnh, khoanh vùng, rồi nhờ người có trách nhiệm. Đồ đánh rơi thường được nhân viên giữ lại."]]}],"qq":"Khi mất đồ, bước đầu tiên là…","qo":["Báo ngay cho cả lớp","Bình tĩnh và nhớ lại lần cuối nhìn thấy","Mua cái mới"],"qa":1,"mi":{"t":"Lập “góc đồ quan trọng” và kế hoạch khi mất đồ","s":"Con chọn một chỗ cố định ở nhà cho thẻ học sinh, chìa khóa, vé xe…, rồi viết ra 3 bước con sẽ làm nếu mất đồ (bình tĩnh, nhớ lại lần cuối thấy, báo người lớn).","lv":["Ba mẹ cùng con chọn chỗ để đồ và viết các bước.","Ba mẹ nhắc một lần, con tự sắp xếp góc đồ và đọc lại kế hoạch cho ba mẹ nghe.","Con tự làm, giữ đồ đúng chỗ suốt một tuần và kể lại có lần nào suýt quên không."],"rw":"Ba mẹ kể một lần ba mẹ làm mất đồ và đã tìm lại thế nào"}},{"t":"Thắng thói trì hoãn bằng 10 phút","sk":7,"m":"12 phút","cx":[{"k":0,"s":"Khoa có bài luận Ngữ văn nộp thứ Năm. Ba buổi tối liền, Khoa mở vở ra rồi lại dọn bàn, xem điện thoại, ăn vặt, đến giờ ngủ vẫn chưa viết được dòng nào.","q":"Khoa nên thử cách nào?","o":[["Để điện thoại ở phòng khách, hẹn giờ 10 phút và chỉ viết dàn ý",1,"Bước đầu nhỏ đến mức khó từ chối sẽ phá được thế trì hoãn. Thường sau 10 phút mình muốn làm tiếp."],["Chờ đến khi có hứng mới viết",0,"Hứng thường đến sau khi bắt đầu, không phải trước. Chờ hứng dễ thành chờ mãi."],["Tự hứa tối nay sẽ viết xong cả bài",0,"Mục tiêu quá lớn làm mình càng ngại bắt đầu. Hãy chia nhỏ ra."]]},{"k":1,"s":"Cô giao bài tập nhóm nộp sau hai tuần. Cả nhóm Khoa đều nói “còn lâu mà”, nay đã qua một tuần vẫn chưa ai làm gì.","q":"Khoa nên đề xuất gì?","o":[["Chờ tuần cuối làm một lần cho xong",0,"Dồn đến cuối thì không còn chỗ cho sự cố. Bắt đầu sớm một phần nhỏ an toàn hơn."],["Hẹn cả nhóm 15 phút giờ ra chơi mai để chia việc, mỗi người làm phần đầu tiên ngay tối đó",1,"Một cuộc hẹn ngắn có giờ cụ thể biến “còn lâu” thành “bắt đầu”. Việc nhỏ đầu tiên kéo cả nhóm đi."],["Tự làm hết vì không tin các bạn",0,"Làm một mình thì mệt và các bạn mất phần học. Hãy cùng nhau bắt đầu bằng việc nhỏ."]]},{"k":2,"s":"Khoa đăng ký cuộc thi vẽ tranh của thư viện quận, hạn nộp là thứ Hai. Hôm nay đã thứ Sáu mà bức tranh mới chỉ có trong đầu Khoa.","q":"Khoa nên làm gì?","o":[["Rút tên vì không kịp",0,"Còn ba ngày vẫn đủ nếu bắt đầu ngay hôm nay. Thử một bước nhỏ trước khi bỏ."],["Để tối Chủ nhật vẽ một mạch",0,"Một buổi tối không đủ cho cả phác, vẽ và tô. Sáng thứ Hai lại còn mệt."],["Phác ngay ba bố cục nhỏ trong 10 phút, chọn một, rồi chia phần tô màu cho thứ Bảy và Chủ nhật",1,"Bắt đầu bằng bản phác nhỏ giúp ý tưởng ra khỏi đầu. Chia phần còn lại theo ngày là có đường về đích."]]}],"qq":"Cách hiệu quả để thắng trì hoãn là…","qo":["Chờ áp lực sát hạn","Làm nhiều việc cùng lúc","Bắt đầu bằng một bước rất nhỏ"],"qa":2,"mi":{"t":"Bắt đầu việc khó bằng 10 phút","s":"Con chọn một bài tập con đang ngại làm, hẹn giờ 10 phút, cất điện thoại ra phòng khác và làm bước nhỏ nhất; xong cho ba mẹ xem phần đã làm.","lv":["Ba mẹ ngồi cạnh và cùng con chọn bước nhỏ đầu tiên.","Ba mẹ nhắc một lần, con tự hẹn giờ và làm.","Con tự nhớ làm trong hai buổi tối và kể lại sau 10 phút con có muốn làm tiếp không."],"rw":"Con được chọn bài hát trên đường đi học"}},{"t":"Tỉnh táo trước quảng cáo “giảm giá sốc”","sk":5,"m":"12 phút","cx":[{"k":0,"s":"Em Vy xem một đoạn quảng cáo trên mạng: “Uống sữa này, chỉ hai tuần là cao vượt trội!” Vy xin mẹ mua ngay.","q":"Khoa nên nói gì với em?","o":[["“Quảng cáo nào cũng nói dối, đừng tin.”",0,"Không phải quảng cáo nào cũng sai. Dạy em cách đặt câu hỏi sẽ có ích lâu hơn."],["“Cao lên trong hai tuần là lời hứa rất lớn. Mình hỏi mẹ và tìm xem ai đã kiểm chứng điều đó nhé.”",1,"Lời hứa càng to càng cần bằng chứng rõ. Hướng em đến người lớn và nguồn tin cậy là đúng."],["“Mua thử xem sao.”",0,"Thử thì tốn tiền mà không trả lời được câu hỏi. Kiểm tra lời hứa trước đã."]]},{"k":1,"s":"Một bạn trong lớp giới thiệu khóa học “Đảm bảo 9 điểm Toán sau 1 tháng, nếu không hoàn tiền”, kèm ảnh nhiều học sinh cười tươi.","q":"Khoa nên nghĩ thế nào?","o":[["Không ai đảm bảo chắc chắn kết quả học tập được; muốn biết thêm thì hỏi thầy cô hoặc ba mẹ",1,"Chữ “đảm bảo” đi với điểm số là dấu hiệu cần cảnh giác. Người lớn hiểu mình sẽ giúp chọn đúng hơn."],["Nhiều ảnh học sinh vui thế chắc là thật",0,"Ảnh minh họa có thể lấy ở bất cứ đâu. Ảnh đẹp không chứng minh được kết quả."],["Có hoàn tiền thì cứ đăng ký, không mất gì",0,"Hoàn tiền thường kèm nhiều điều kiện khó. Và thời gian của mình cũng là thứ quý giá."]]},{"k":2,"s":"Đi siêu thị cùng ba, Khoa thấy biển “Giảm 50%! Chỉ hôm nay!” trên một chiếc tai nghe. Giá cũ ghi 800.000đ, giá mới 400.000đ, và Khoa muốn mua ngay bằng tiền tiết kiệm.","q":"Khoa nên nghĩ gì trước?","o":[["Giảm một nửa thì quá hời, mua ngay kẻo hết",0,"“Chỉ hôm nay” tạo cảm giác gấp để mình không kịp nghĩ. Giá cũ chưa chắc là giá thật."],["Hỏi nhân viên bán hàng xem có nên mua không",0,"Nhân viên có thể nhiệt tình, nhưng việc của họ là bán hàng. Câu trả lời nên đến từ thông tin mình tự kiểm tra."],["Tự hỏi: mình có cần tai nghe không, giá thường ở chỗ khác là bao nhiêu, và hỏi ý ba",1,"Câu hỏi đúng tách được nhu cầu thật khỏi cảm giác vội. So giá thì biết món hời thật hay không."]]}],"qq":"Câu “Chỉ hôm nay!” trong quảng cáo thường nhằm…","qo":["Giúp mình tiết kiệm","Báo giá chính xác","Làm mình quyết định vội"],"qa":2,"mi":{"t":"Soi một quảng cáo “chỉ hôm nay”","s":"Con tìm một quảng cáo giảm giá (tờ rơi, biển ở cửa hàng khi đi cùng ba mẹ), chỉ ra câu nào thúc mình quyết định vội và nói với ba mẹ ba câu hỏi nên đặt ra trước khi mua.","lv":["Ba mẹ cùng con đọc quảng cáo và chỉ ra những chữ “gây sốc”.","Ba mẹ nhắc một lần, con tự tìm và phân tích một quảng cáo.","Con tự phân tích hai quảng cáo và nói cho ba mẹ: mình có thật sự cần không, giá thật có rẻ không, chờ một tuần thì sao."],"rw":"Ba mẹ đọc cùng con một chương sách con chọn"}},{"t":"Giữ mật khẩu cho riêng mình","sk":6,"m":"11 phút","cx":[{"k":0,"s":"Khoa nhận được tin nhắn: “Tài khoản của bạn sắp bị khóa. Bấm vào đường dẫn và nhập mật khẩu để giữ tài khoản.” Ba mẹ đang ở phòng bên.","q":"Khoa nên làm gì?","o":[["Bấm vào xem thử, chưa nhập gì thì không sao",0,"Một số đường dẫn lạ vẫn có thể gây hại. Không bấm là an toàn nhất."],["Nhập nhanh kẻo bị khóa",0,"Tin nhắn dọa khóa tài khoản là chiêu lừa quen thuộc. Nơi thật sẽ không đòi mật khẩu qua đường dẫn."],["Không bấm, mang cho ba mẹ xem và xóa tin nhắn theo hướng dẫn của ba mẹ",1,"Tin nhắn hối thúc nhập mật khẩu là dấu hiệu lừa đảo. Hỏi người lớn tin cậy là bước đúng."]]},{"k":1,"s":"Linh, bạn thân của Khoa, xin mật khẩu tài khoản học trực tuyến của Khoa để “xem giúp bài tập”. Linh nói: “Bạn thân mà, có gì đâu.”","q":"Khoa nên trả lời thế nào?","o":[["“Tớ không chia mật khẩu với ai ngoài ba mẹ, nhưng tớ chụp đề bài gửi cậu nhé.”",1,"Giữ ranh giới mà vẫn giúp được bạn. Từ chối việc, không từ chối người."],["Đưa vì Linh là bạn thân",0,"Bạn thân vẫn có thể vô tình làm lộ. Mật khẩu chỉ nên chia với ba mẹ."],["Đưa rồi tối về đổi mật khẩu",0,"Trong lúc chưa đổi, tài khoản vẫn mở với người khác. Cách an toàn là không đưa ngay từ đầu."]]},{"k":2,"s":"Ở thư viện quận cùng chị gái, Khoa dùng máy tính chung để đăng nhập tài khoản học tập và in bài.","q":"In xong, Khoa nên làm gì?","o":[["Cứ để đó, người khác không biết đâu",0,"Người sau chỉ cần mở trình duyệt là thấy. Mất vài giây đăng xuất sẽ an toàn hơn."],["Đăng xuất, không lưu mật khẩu trên trình duyệt và đóng h
